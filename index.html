<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - App Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'bounce-slight': 'bounce 3s infinite',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useReducer, createContext, useContext } = React;

        // --- ICONOS USANDO SVG (Para que no necesites archivos externos) ---
        const MapPin = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>;
        const Navigation = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>;
        const Car = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4 10H4m16-10l-4 10M7 7h10"/></svg>;
        const Bike = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>;
        const Wallet = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>;
        const User = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>;
        const Shield = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>;
        const Settings = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>;
        const CheckCircle = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
        const X = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>;
        const Clock = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
        const Menu = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/></svg>;
        const ChevronRight = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>;
        const DollarSign = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3 1.343 3 3-1.343 3-3 3m0-12a9 9 0 110 18 9 9 0 010-18z"/></svg>;
        const AlertTriangle = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>;
        const Bell = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>;
        const Send = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>;
        const MessageSquare = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>;
        const PlusCircle = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
        const Share2 = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>;
        const Trash2 = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
        const FileText = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>;
        const LogOut = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>;
        const Activity = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-9 9-4-4-5 5"/></svg>;

        // --- DATABASE & STATE MANAGEMENT (COPIADO DE TU TXT) ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const generatePin = () => Math.floor(1000 + Math.random() * 9000).toString();

        const initialData = {
          users: [
            { id: 'admin1', role: 'admin', name: 'Super Admin', email: 'admin@app.com', password: '123', status: 'active', balance: 0 },
            { id: 'p1', role: 'passenger', name: 'Juan Pasajero', email: 'juan@app.com', password: '123', status: 'active', balance: 50 },
            { id: 'p2', role: 'passenger', name: 'Maria Morosa', email: 'maria@app.com', password: '123', status: 'active', balance: -150 }, 
            { id: 'd1', role: 'driver', name: 'Carlos Conductor', email: 'carlos@app.com', password: '123', status: 'available', balance: 200, vehicle: 'Toyota Yaris 2022' },
          ],
          services: [
            { id: 's1', name: 'Auto Básico', type: 'ride', baseRate: 20, kmRate: 10, minRate: 2, image: 'car', active: true, commission: 0.20 },
            { id: 's2', name: 'Auto VIP', type: 'ride', baseRate: 50, kmRate: 15, minRate: 3, image: 'car', active: true, commission: 0.25 },
            { id: 's3', name: 'Moto Express', type: 'ride', baseRate: 15, kmRate: 7, minRate: 1, image: 'bike', active: true, commission: 0.15 },
          ],
          trips: [],
          transactions: [],
          notifications: [
            { id: 'n1', target: 'all', title: '¡Bienvenido a Drive MX!', message: 'Gracias por formar parte de nuestra comunidad. Mantén tu app actualizada.', date: new Date() }
          ],
          supportTickets: [],
          settings: {
            walletLegend: "Recuerda mantener saldo positivo en tu cartera para poder seguir solicitando nuestros servicios.",
            whatsappLink: "https://wa.me/521234567890",
            referralActive: false
          }
        };

        const appReducer = (state, action) => {
          switch (action.type) {
            case 'LOGIN':
              const user = state.users.find(u => u.email === action.payload.email && u.password === action.payload.password);
              return { ...state, currentUser: user || null, loginError: !user };
            case 'LOGOUT': return { ...state, currentUser: null };
            case 'REGISTER':
              const newUser = { ...action.payload, id: generateId(), status: 'active', balance: 0 };
              return { ...state, users: [...state.users, newUser], currentUser: newUser };
            case 'REQUEST_TRIP':
              const newTrip = { ...action.payload, id: generateId(), status: 'searching', pin: generatePin(), createdAt: new Date() };
              return { ...state, trips: [...state.trips, newTrip] };
            case 'ACCEPT_TRIP':
              return {
                ...state,
                trips: state.trips.map(t => t.id === action.payload.tripId ? { ...t, status: 'accepted', driverId: action.payload.driverId } : t),
                users: state.users.map(u => u.id === action.payload.driverId ? { ...u, status: 'busy' } : u)
              };
            case 'START_TRIP':
              return { ...state, trips: state.trips.map(t => t.id === action.payload ? { ...t, status: 'in_progress' } : t) };
            case 'COMPLETE_TRIP':
              const trip = state.trips.find(t => t.id === action.payload.tripId);
              const service = state.services.find(s => s.id === trip.serviceId);
              const commissionAmount = trip.price * service.commission;
              const driverEarn = trip.price - commissionAmount;
              let newTransactions = [...state.transactions];
              const updatedUsers = state.users.map(u => {
                if (u.id === trip.passengerId && trip.paymentMethod === 'wallet') {
                    newTransactions.push({ id: generateId(), userId: u.id, type: 'payment', amount: -trip.price, date: new Date(), desc: `Viaje ${trip.id}` });
                    return { ...u, balance: u.balance - trip.price };
                }
                if (u.id === trip.driverId) {
                    const amt = trip.paymentMethod === 'wallet' ? driverEarn : -commissionAmount;
                    newTransactions.push({ id: generateId(), userId: u.id, type: 'earning', amount: amt, date: new Date(), desc: `Viaje ${trip.id}` });
                    return { ...u, status: 'available', balance: u.balance + amt };
                }
                return u;
              });
              return { ...state, trips: state.trips.map(t => t.id === action.payload.tripId ? { ...t, status: 'completed' } : t), users: updatedUsers, transactions: newTransactions };
            case 'CHANGE_STATUS':
              return { ...state, users: state.users.map(u => u.id === action.payload.userId ? { ...u, status: action.payload.status } : u) };
            default: return state;
          }
        };

        const AppContext = createContext();

        // --- UI COMPONENTS ---
        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false }) => {
          const variants = {
            primary: "bg-red-600 text-white hover:bg-red-700 shadow-md",
            secondary: "bg-gray-100 text-gray-800 hover:bg-gray-200",
            outline: "border-2 border-red-600 text-red-600 hover:bg-red-50",
            danger: "bg-red-100 text-red-600 hover:bg-red-200"
          };
          return <button onClick={onClick} disabled={disabled} className={`w-full py-3 rounded-xl font-bold transition-all flex items-center justify-center gap-2 ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>{children}</button>;
        };

        const Input = ({ label, type = 'text', value, onChange, placeholder, icon: IconComp }) => (
          <div className="mb-4">
            {label && <label className="block text-sm font-semibold text-gray-700 mb-1">{label}</label>}
            <div className="relative">
              {IconComp && <IconComp className="absolute left-3 top-3.5 text-gray-400 w-5 h-5" />}
              <input type={type} value={value} onChange={onChange} placeholder={placeholder} className={`w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none ${IconComp ? 'pl-10' : ''}`} />
            </div>
          </div>
        );

        // --- SCREENS ---
        const SplashScreen = ({ onFinish }) => {
          useEffect(() => { setTimeout(onFinish, 2000); }, [onFinish]);
          return (
            <div className="h-screen w-full bg-white flex flex-col items-center justify-center relative overflow-hidden">
              <div className="absolute top-0 w-full h-1/2 bg-gradient-to-b from-red-50 to-white"></div>
              <div className="z-10 flex flex-col items-center">
                <div className="w-24 h-24 bg-red-600 rounded-3xl flex items-center justify-center shadow-2xl mb-6 animate-pulse">
                  <Navigation className="text-white w-12 h-12" />
                </div>
                <h1 className="text-4xl font-black text-gray-900 tracking-tight">DRIVE <span className="text-red-600">MX</span></h1>
                <p className="text-gray-500 mt-2 font-medium">Cargando...</p>
              </div>
            </div>
          );
        };

        const WalletScreen = ({ user, transactions, onBack, isBlocked }) => (
          <div className="min-h-screen bg-gray-50 max-w-md mx-auto w-full z-40 absolute inset-0">
            <div className="bg-red-600 p-6 text-white rounded-b-3xl">
              <button onClick={onBack} className="mb-4"><X className="w-6 h-6" /></button>
              <p className="text-red-100 text-sm">Saldo Disponible</p>
              <h1 className="text-5xl font-black">${user.balance.toFixed(2)}</h1>
              {isBlocked && <div className="mt-4 bg-red-700 p-3 rounded-lg flex items-center gap-2"><AlertTriangle className="w-5 h-5 text-yellow-300" /> <span className="text-sm">Cuenta bloqueada.</span></div>}
            </div>
            <div className="p-6">
              <h3 className="font-bold mb-4">Movimientos</h3>
              {transactions.filter(t => t.userId === user.id).reverse().map(t => (
                <div key={t.id} className="bg-white p-4 rounded-xl flex justify-between items-center shadow-sm mb-3">
                  <div><p className="font-bold text-sm">{t.desc}</p><p className="text-xs text-gray-400">{new Date(t.date).toLocaleDateString()}</p></div>
                  <span className={`font-black ${t.amount < 0 ? 'text-red-600' : 'text-green-600'}`}>{t.amount > 0 ? '+' : ''}{t.amount.toFixed(2)}</span>
                </div>
              ))}
            </div>
          </div>
        );

        const PassengerApp = () => {
          const { state, dispatch } = useContext(AppContext);
          const user = state.currentUser;
          const [view, setView] = useState('home');
          const [dest, setDest] = useState('');
          const activeTrip = state.trips.find(t => t.passengerId === user.id && t.status !== 'completed');
          
          if (view === 'wallet') return <WalletScreen user={user} transactions={state.transactions} onBack={() => setView('home')} isBlocked={user.balance < 0} />;

          return (
            <div className="min-h-screen bg-white max-w-md mx-auto relative flex flex-col">
              <div className="h-64 bg-gray-200 relative"><div className="absolute inset-0 opacity-20 bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:20px_20px]"></div></div>
              <div className="p-6 flex-1">
                <div onClick={() => setView('wallet')} className="bg-red-50 p-4 rounded-2xl mb-6 flex justify-between items-center cursor-pointer">
                  <div className="flex items-center gap-3"><Wallet className="text-red-600 w-6 h-6"/><span className="font-bold">Mi Cartera</span></div>
                  <span className={`text-xl font-black ${user.balance < 0 ? 'text-red-600' : 'text-green-600'}`}>${user.balance.toFixed(2)}</span>
                </div>
                <h2 className="text-2xl font-black mb-6">¿A dónde vamos?</h2>
                <div className="space-y-4">
                  <Input icon={MapPin} placeholder="Tu ubicación" value="Mi ubicación actual" readOnly />
                  <Input icon={MapPin} placeholder="¿A dónde vas?" value={dest} onChange={e => setDest(e.target.value)} />
                  {dest && <Button onClick={() => dispatch({type:'REQUEST_TRIP', payload:{passengerId:user.id, price:45, serviceId:'s3', paymentMethod:'cash', route:['Origen', dest]}})}>Pedir Moto Express</Button>}
                </div>
                {activeTrip && (
                  <div className="absolute bottom-6 left-6 right-6 bg-white p-6 rounded-3xl shadow-2xl border border-red-100">
                    <p className="text-xs font-bold text-red-600 uppercase">Viaje Activo</p>
                    <p className="text-xl font-black mt-1">{activeTrip.status === 'searching' ? 'Buscando conductor...' : 'Conductor en camino'}</p>
                    <div className="mt-4 p-3 bg-gray-50 rounded-xl text-center"><p className="text-xs text-gray-500">PIN DE SEGURIDAD</p><p className="text-3xl font-black tracking-widest">{activeTrip.pin}</p></div>
                  </div>
                )}
              </div>
              <div className="p-4 border-t flex justify-around"><button onClick={() => dispatch({type:'LOGOUT'})} className="text-red-600 font-bold">Cerrar Sesión</button></div>
            </div>
          );
        };

        const DriverApp = () => {
          const { state, dispatch } = useContext(AppContext);
          const user = state.currentUser;
          const [view, setView] = useState('home');
          const [pinInput, setPinInput] = useState('');
          const pendingTrip = state.trips.find(t => t.status === 'searching');
          const activeTrip = state.trips.find(t => t.driverId === user.id && t.status !== 'completed');

          if (view === 'wallet') return <WalletScreen user={user} transactions={state.transactions} onBack={() => setView('home')} isBlocked={user.balance <= 0} />;

          return (
            <div className="min-h-screen bg-gray-900 text-white max-w-md mx-auto flex flex-col">
                <div className="p-4 bg-gray-800 flex justify-between items-center">
                    <button onClick={() => setView('wallet')} className="flex items-center gap-2"><Wallet className="w-5 h-5"/> ${user.balance.toFixed(2)}</button>
                    <span className={`px-4 py-1 rounded-full text-xs font-bold ${user.status === 'available' ? 'bg-red-600' : 'bg-gray-700'}`}>{user.status === 'available' ? 'CONECTADO' : 'OFFLINE'}</span>
                </div>
                <div className="flex-1 relative bg-gray-800"><div className="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:30px_30px]"></div></div>
                {pendingTrip && !activeTrip && (
                  <div className="p-6 bg-white text-gray-900 rounded-t-3xl animate-bounce-slight">
                    <h3 className="text-2xl font-black mb-1">${pendingTrip.price}</h3>
                    <p className="text-sm text-gray-500 mb-4">Nueva solicitud de viaje</p>
                    <Button onClick={() => dispatch({type:'ACCEPT_TRIP', payload:{tripId:pendingTrip.id, driverId:user.id}})}>Aceptar Viaje</Button>
                  </div>
                )}
                {activeTrip && (
                  <div className="p-6 bg-white text-gray-900 rounded-t-3xl">
                    <h3 className="text-xl font-black mb-4">Viaje en curso</h3>
                    <input type="text" placeholder="Ingresa PIN del pasajero" className="w-full p-4 bg-gray-100 rounded-xl mb-4 text-center text-2xl font-black" value={pinInput} onChange={e => setPinInput(e.target.value)} />
                    <Button onClick={() => { if(pinInput === activeTrip.pin) dispatch({type:'COMPLETE_TRIP', payload:{tripId:activeTrip.id}}); else alert('PIN Incorrecto'); }}>Finalizar Viaje</Button>
                  </div>
                )}
                <div className="p-4 text-center"><button onClick={() => dispatch({type:'LOGOUT'})} className="text-red-500 font-bold">Cerrar Sesión</button></div>
            </div>
          );
        };

        const AuthScreen = () => {
          const { state, dispatch } = useContext(AppContext);
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          return (
            <div className="min-h-screen bg-white p-6 flex flex-col justify-center max-w-md mx-auto">
              <div className="text-center mb-8"><div className="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center shadow-lg mx-auto mb-4 text-white"><Navigation className="w-8 h-8" /></div><h2 className="text-3xl font-black text-gray-900">Drive MX</h2><p className="text-gray-500 mt-2">Bienvenido de nuevo</p></div>
              {state.loginError && <div className="bg-red-100 text-red-600 p-3 rounded-lg mb-4 text-center text-sm">Credenciales incorrectas</div>}
              <Input placeholder="Correo electrónico" value={email} onChange={e => setEmail(e.target.value)} icon={User} />
              <Input placeholder="Contraseña" type="password" value={password} onChange={e => setPassword(e.target.value)} icon={Shield} />
              <Button onClick={() => dispatch({type:'LOGIN', payload:{email, password}})}>Ingresar</Button>
              <div className="mt-8 p-4 bg-gray-50 rounded-xl"><p className="text-xs font-bold text-gray-400 mb-2 uppercase">Cuentas de prueba:</p><p className="text-sm">Pasajero: juan@app.com / 123</p><p className="text-sm">Chofer: carlos@app.com / 123</p></div>
            </div>
          );
        };

        const App = () => {
          const [state, dispatch] = useReducer(appReducer, initialData);
          const [showSplash, setShowSplash] = useState(true);
          if (showSplash) return <SplashScreen onFinish={() => setShowSplash(false)} />;
          return (
            <AppContext.Provider value={{ state, dispatch }}>
              {!state.currentUser ? <AuthScreen /> : state.currentUser.role === 'driver' ? <DriverApp /> : <PassengerApp />}
            </AppContext.Provider>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
