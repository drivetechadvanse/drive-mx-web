<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Control System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; transition: all 0.6s ease; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }

        /* Acordeón Interno */
        #user-submenu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        #user-submenu.open { max-height: 200px; }
        .rotate-icon { transition: transform 0.3s; }
        .rotate-icon.active { transform: rotate(180deg); }

        .radar-pulse {
            position: absolute; width: 120px; height: 120px;
            background: rgba(239, 68, 68, 0.15); border-radius: 100%;
            animation: radar 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }
        @keyframes radar { 0% { transform: scale(0.2); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

        .view-hide { opacity: 0; pointer-events: none; transform: translateY(-30px); }
        .payment-opt.selected { border: 1.5px solid #ef4444; background: #fef2f2; color: #ef4444; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="overlay" onclick="closeModals()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3">
                <i data-lucide="cpu" id="side-icon" class="text-white w-6 h-6"></i>
            </div>
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-500 font-bold uppercase tracking-widest italic">Terminal</p>
        </div>

        <nav class="flex-1 p-4 space-y-1" id="side-nav">
            <div class="border-b border-gray-50 pb-2">
                <button onclick="toggleUserSubmenu()" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic transition-all">
                    <div class="flex items-center gap-3">
                        <i data-lucide="users-round" class="w-4 h-4 text-red-600"></i>
                        <span>Usuarios</span>
                    </div>
                    <i data-lucide="chevron-down" id="user-arrow" class="w-3 h-3 rotate-icon"></i>
                </button>
                
                <div id="user-submenu" class="bg-gray-50/50 rounded-xl ml-2">
                    <button onclick="loadAdminTool('conductores')" class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 transition-colors italic border-l border-gray-200 ml-4">Conductores</button>
                    <button onclick="loadAdminTool('pasajeros')" class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 transition-colors italic border-l border-gray-200 ml-4">Pasajeros</button>
                    <button onclick="loadAdminTool('administradores')" class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 transition-colors italic border-l border-gray-200 ml-4">Administradores</button>
                </div>
            </div>

            <button class="w-full flex items-center gap-3 p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                <i data-lucide="bar-chart-3" class="w-4 h-4 text-gray-400"></i> Métricas
            </button>
        </nav>

        <div class="p-4 border-t">
            <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic flex items-center justify-center gap-2">
                <i data-lucide="power" class="w-3.5 h-3.5"></i> Salir
            </button>
        </div>
    </div>

    <div id="splash" class="absolute inset-0 z-[200] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center shadow-2xl animate-pulse"><i data-lucide="navigation" class="text-white w-8 h-8"></i></div>
        <h1 class="text-2xl font-black mt-6 tracking-tighter italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <h2 class="text-3xl font-black italic uppercase mb-8">SISTEMA <span class="text-red-600 text-xl">DRIVE MX</span></h2>
        <div class="space-y-3">
            <input type="email" id="email" placeholder="Usuario" class="w-full p-4 bg-gray-50 border-b border-gray-100 rounded-xl outline-none focus:border-red-600 text-xs font-bold">
            <input type="password" id="pass" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border-b border-gray-100 rounded-xl outline-none focus:border-red-600 text-xs font-bold">
            <button onclick="doLogin()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">Ingresar</button>
        </div>
    </div>

    <div id="main-view" class="hidden h-screen flex flex-col">
        <header id="header" class="px-4 py-3 flex items-center justify-between border-b bg-white z-10">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center"><i data-lucide="cpu" class="w-4 h-4 text-white"></i></div>
        </header>

        <main id="content-area" class="flex-1 relative map-sim overflow-hidden">
            <div id="banners" class="absolute top-4 left-4 right-4 z-20 space-y-2">
                <div onclick="openCosts()" class="bg-white p-1 rounded-xl shadow-xl flex items-center gap-2 cursor-pointer border border-black/5">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="radar" class="hidden">
                    <div class="radar-pulse"></div>
                    <div class="radar-pulse" style="animation-delay: 0.6s"></div>
                </div>
                <div class="text-center">
                    <div class="bg-red-600 p-3 rounded-2xl shadow-2xl border-4 border-white mb-2 inline-block"><i data-lucide="navigation" class="text-white w-5 h-5"></i></div>
                    <div id="search-msg" class="hidden bg-black text-white text-[7px] font-black uppercase px-3 py-1 rounded-full italic animate-pulse">Buscando Conductor</div>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-6 space-y-4">
            <div class="w-8 h-1 bg-gray-200 rounded-full mx-auto -mt-2"></div>
            <h3 class="text-lg font-black italic uppercase">PAGO Y <span class="text-red-600">SOLICITUD</span></h3>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setPay(this)" class="payment-opt selected p-2.5 rounded-xl border flex flex-col items-center gap-1"><i data-lucide="banknote" class="w-4 h-4"></i><span class="text-[8px] font-black uppercase">Efectivo</span></button>
                <button onclick="setPay(this)" class="payment-opt p-2.5 rounded-xl border flex flex-col items-center gap-1"><i data-lucide="send" class="w-4 h-4"></i><span class="text-[8px] font-black uppercase">SPEI</span></button>
                <button onclick="setPay(this)" class="payment-opt p-2.5 rounded-xl border flex flex-col items-center gap-1"><i data-lucide="credit-card" class="w-4 h-4"></i><span class="text-[8px] font-black uppercase">Cartera</span></button>
            </div>
            <button onclick="runSearch()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[10px] uppercase italic shadow-lg">SOLICITAR AHORA</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    // Splash
    setTimeout(() => {
        document.getElementById('splash').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }, 500);
    }, 2000);

    function doLogin() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-view').classList.remove('hidden');
    }

    // CONTROL DEL SUBMENÚ "USUARIOS"
    function toggleUserSubmenu() {
        const menu = document.getElementById('user-submenu');
        const arrow = document.getElementById('user-arrow');
        menu.classList.toggle('open');
        arrow.classList.toggle('active');
    }

    function openMenu() {
        document.getElementById('sidebar').classList.add('open');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeModals() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('cost-sheet').classList.remove('active');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }

    function openCosts() {
        document.getElementById('cost-sheet').classList.add('active');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function setPay(btn) {
        document.querySelectorAll('.payment-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function runSearch() {
        closeModals();
        document.getElementById('header').classList.add('view-hide');
        document.getElementById('banners').classList.add('view-hide');
        setTimeout(() => {
            document.getElementById('radar').classList.remove('hidden');
            document.getElementById('search-msg').classList.remove('hidden');
        }, 600);
    }

    function loadAdminTool(type) {
        closeModals();
        const content = document.getElementById('content-area');
        content.innerHTML = `<div class="p-8 text-center"><h3 class="text-xs font-black uppercase italic text-gray-400">Cargando base de datos de ${type}...</h3></div>`;
        console.log("Cargando: " + type);
    }
</script>
</body>
</html>
