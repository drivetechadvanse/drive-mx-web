<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Sistema Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        /* Splash & Animations */
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }
        
        #driver-registration-modal { transition: all 0.4s ease; opacity: 0; pointer-events: none; transform: translateY(100%); }
        #driver-registration-modal.active { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-content.expanded { max-height: 300px; }
        .chevron-rotate { transition: transform 0.3s ease; }
        .chevron-rotate.active { transform: rotate(180deg); }
        
        .radar-pulse { position: absolute; width: 100px; height: 100px; background: rgba(239, 68, 68, 0.2); border-radius: 100%; animation: radar 2s infinite; }
        @keyframes radar { 0% { transform: scale(0.4); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
        .hidden-view { opacity: 0; transform: translateY(-20px); pointer-events: none; transition: all 0.4s ease; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <div id="splash" class="absolute inset-0 z-[200] bg-white flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-20 h-20 bg-red-600 rounded-[2rem] flex items-center justify-center shadow-2xl animate-bounce">
            <i data-lucide="navigation" class="text-white w-10 h-10"></i>
        </div>
        <h1 class="text-3xl font-black mt-8 tracking-tighter italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
        <div class="mt-4 flex gap-1">
            <div class="w-1.5 h-1.5 bg-red-600 rounded-full animate-pulse"></div>
            <div class="w-1.5 h-1.5 bg-red-600 rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
            <div class="w-1.5 h-1.5 bg-red-600 rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
        </div>
    </div>

    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-8 bg-gray-900 text-white">
            <div class="w-12 h-12 bg-red-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-red-600/20"><i data-lucide="cpu" class="w-6 h-6"></i></div>
            <h2 class="text-xl font-black italic uppercase italic">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-500 font-bold uppercase italic tracking-[0.2em] mt-1">SISTEMA V1.0</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <div id="nav-admin" class="hidden">
                <button onclick="toggleAccordion('admin-acc', 'admin-chev')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="shield" class="text-red-600 w-4 h-4"></i><span>Gestión</span></div>
                    <i data-lucide="chevron-down" id="admin-chev" class="w-3 h-3 chevron-rotate"></i>
                </button>
                <div id="admin-acc" class="accordion-content bg-gray-50/50 rounded-xl ml-2">
                    <button class="w-full text-left p-3 pl-9 text-[9px] font-bold text-gray-400 uppercase italic hover:text-red-600">Solicitudes</button>
                    <button class="w-full text-left p-3 pl-9 text-[9px] font-bold text-gray-400 uppercase italic hover:text-red-600">Conductores</button>
                </div>
            </div>
            <div id="nav-passenger" class="hidden">
                <button onclick="toggleAccordion('pass-acc', 'pass-chev')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="user" class="text-red-600 w-4 h-4"></i><span>Panel Usuario</span></div>
                    <i data-lucide="chevron-down" id="pass-chev" class="w-3 h-3 chevron-rotate"></i>
                </button>
                <div id="pass-acc" class="accordion-content bg-gray-50/50 rounded-xl ml-2">
                    <button class="w-full text-left p-3 pl-9 text-[9px] font-bold text-gray-500 uppercase italic">Mi Perfil</button>
                    <button onclick="openDriverRegistration()" class="w-full text-left p-3 pl-9 text-[9px] font-black text-red-600 uppercase italic border-t border-gray-100 bg-red-50/50">Quiero ser Conductor</button>
                </div>
            </div>
        </nav>
        <div class="p-6 border-t"><button onclick="location.reload()" class="w-full py-4 bg-red-50 text-red-600 rounded-2xl font-black text-[10px] uppercase italic">Cerrar Sesión</button></div>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-[150] bg-white p-10 flex flex-col justify-center">
        <h2 class="text-3xl font-black italic uppercase mb-8 leading-none tracking-tighter">BIENVENIDO A<br><span class="text-red-600">DRIVE MX</span></h2>
        <div class="space-y-4">
            <div class="relative">
                <i data-lucide="mail" class="absolute left-4 top-4 w-4 h-4 text-gray-300"></i>
                <input type="email" id="login-email" placeholder="USUARIO@DRIVE.MX" class="w-full p-4 pl-12 bg-gray-50 border-b-2 border-gray-100 rounded-2xl outline-none focus:border-red-600 text-xs font-bold uppercase transition-all">
            </div>
            <div class="relative">
                <i data-lucide="lock" class="absolute left-4 top-4 w-4 h-4 text-gray-300"></i>
                <input type="password" id="login-pass" placeholder="CONTRASEÑA" class="w-full p-4 pl-12 bg-gray-50 border-b-2 border-gray-100 rounded-2xl outline-none focus:border-red-600 text-xs font-bold transition-all">
            </div>
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-5 rounded-[1.5rem] font-black text-[11px] uppercase italic shadow-xl shadow-red-200 mt-4 active:scale-95 transition-transform">Entrar al Sistema</button>
        </div>
    </div>

    <div id="driver-registration-modal" class="absolute inset-0 z-[180] bg-white p-8 flex flex-col overflow-y-auto">
        <header class="flex items-center justify-between mb-10">
            <h2 class="text-2xl font-black italic uppercase italic leading-none">NUEVO<br><span class="text-red-600">CONDUCTOR</span></h2>
            <button onclick="closeDriverRegistration()" class="p-3 bg-gray-100 rounded-2xl"><i data-lucide="x" class="w-5 h-5"></i></button>
        </header>
        <form id="driverForm" onsubmit="saveDriver(event)" class="space-y-5">
            <div class="space-y-1"><label class="text-[8px] font-black uppercase text-gray-400 ml-3 italic">Nombre y Apellidos</label>
            <input type="text" id="d-name" required class="w-full p-4 bg-gray-50 rounded-2xl border-b-2 border-transparent focus:border-red-600 outline-none text-[12px] font-bold uppercase"></div>
            <div class="space-y-1"><label class="text-[8px] font-black uppercase text-gray-400 ml-3 italic">Teléfono de Contacto</label>
            <input type="tel" id="d-phone" required class="w-full p-4 bg-gray-50 rounded-2xl border-b-2 border-transparent focus:border-red-600 outline-none text-[12px] font-bold"></div>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1"><label class="text-[8px] font-black uppercase text-gray-400 ml-3 italic">Modelo/Año</label>
                <input type="text" id="d-car" required class="w-full p-4 bg-gray-50 rounded-2xl border-b-2 border-transparent focus:border-red-600 outline-none text-[12px] font-bold uppercase"></div>
                <div class="space-y-1"><label class="text-[8px] font-black uppercase text-gray-400 ml-3 italic">Placas</label>
                <input type="text" id="d-plate" required class="w-full p-4 bg-gray-50 rounded-2xl border-b-2 border-transparent focus:border-red-600 outline-none text-[12px] font-bold uppercase"></div>
            </div>
            <button type="submit" class="w-full bg-gray-900 text-white py-5 rounded-[1.5rem] font-black text-[11px] uppercase italic shadow-2xl mt-6">Enviar Solicitud</button>
        </form>
    </div>

    <div id="admin-view" class="hidden h-screen flex flex-col bg-gray-50">
        <header class="px-5 py-4 bg-gray-900 text-white flex justify-between items-center z-10">
            <button onclick="openMenu()"><i data-lucide="menu" class="text-red-600 w-6 h-6"></i></button>
            <h2 class="font-black italic uppercase text-base italic">CONTROL <span class="text-red-600">CENTER</span></h2>
            <div class="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center border border-white/10"><i data-lucide="shield-check" class="w-5 h-5 text-red-600"></i></div>
        </header>
        <main class="flex-1 p-6 overflow-y-auto space-y-6">
            <div class="bg-white p-6 rounded-[2rem] border border-gray-100 shadow-sm flex items-center justify-between">
                <div><p class="text-[8px] font-black text-gray-400 uppercase italic mb-1">Pendientes de Revisión</p><h4 id="pending-count" class="text-3xl font-black italic">0</h4></div>
                <div class="w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center text-red-600"><i data-lucide="clipboard-list" class="w-7 h-7"></i></div>
            </div>
            <div id="drivers-list" class="space-y-3">
                <div class="bg-white p-6 rounded-[2rem] border border-gray-100 text-[10px] text-gray-400 font-bold italic text-center uppercase tracking-widest">Sin solicitudes</div>
            </div>
        </main>
    </div>

    <div id="passenger-view" class="hidden h-screen flex flex-col relative">
        <header class="px-5 py-4 bg-white border-b flex justify-between items-center z-10">
            <button onclick="openMenu()"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <h2 class="font-black italic uppercase text-xl italic">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-10 h-10 rounded-xl bg-gray-900 flex items-center justify-center shadow-lg"><i data-lucide="user" class="w-5 h-5 text-white"></i></div>
        </header>
        <main class="flex-1 map-sim relative overflow-hidden">
            <div id="p-banners" class="absolute top-5 left-5 right-5 z-20 space-y-3">
                <div class="bg-white/95 backdrop-blur-md p-3 rounded-2xl shadow-xl border border-black/5 flex items-center gap-3">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <p class="text-[10px] font-black text-gray-800 uppercase italic">San Salvador Atenco, EdoMéx</p>
                </div>
                <div onclick="openCosts()" class="bg-white p-1 rounded-2xl shadow-2xl flex items-center gap-3 border border-black/5 cursor-pointer">
                    <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i data-lucide="map-pin" class="w-6 h-6"></i></div>
                    <span class="text-[12px] font-black text-gray-400 italic uppercase">¿Cuál es tu destino?</span>
                </div>
            </div>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="radar" class="hidden"><div class="radar-pulse"></div></div>
                <div class="bg-red-600 p-5 rounded-[2rem] border-4 border-white shadow-2xl relative z-10"><i data-lucide="navigation" class="text-white w-8 h-8"></i></div>
            </div>
            <div id="p-wallet" class="absolute bottom-5 left-5 right-5"><div class="bg-gray-900 rounded-[2rem] p-5 text-white flex justify-between items-center shadow-2xl"><div class="flex items-center gap-4"><div class="w-10 h-10 bg-red-600/20 rounded-xl flex items-center justify-center text-red-600"><i data-lucide="wallet" class="w-5 h-5"></i></div><div><p class="text-[8px] font-bold uppercase italic text-gray-500">Mi Saldo</p><p class="text-sm font-black italic">$50.00 MXN</p></div></div><i data-lucide="chevron-right" class="text-gray-600 w-4 h-4"></i></div></div>
        </main>
        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[3rem] shadow-2xl p-10 space-y-6">
            <h3 class="text-xl font-black italic uppercase italic leading-none">CONFIRMAR<br><span class="text-red-600">SOLICITUD</span></h3>
            <button onclick="startRadar()" class="w-full bg-red-600 text-white py-5 rounded-[2rem] font-black text-[12px] uppercase italic shadow-xl shadow-red-100">SOLICITAR AHORA</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    let driversDB = [];

    // --- CARGA INICIAL (RESTABLECIDA) ---
    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('login-screen').classList.remove('hidden');
            }, 700);
        }, 3000); // 3 segundos de splash
    });

    // --- LÓGICA DE REGISTRO ---
    function openDriverRegistration() { closeAll(); document.getElementById('driver-registration-modal').classList.add('active'); }
    function closeDriverRegistration() { document.getElementById('driver-registration-modal').classList.remove('active'); }

    function saveDriver(e) {
        e.preventDefault();
        driversDB.push({
            id: Date.now(),
            nombre: document.getElementById('d-name').value,
            telefono: document.getElementById('d-phone').value,
            vehiculo: document.getElementById('d-car').value,
            placas: document.getElementById('d-plate').value
        });
        updateAdminView();
        alert("¡SOLICITUD ENVIADA! Tus datos están en revisión en el Panel de Control.");
        document.getElementById('driverForm').reset();
        closeDriverRegistration();
    }

    function updateAdminView() {
        const list = document.getElementById('drivers-list');
        const count = document.getElementById('pending-count');
        count.innerText = driversDB.length;
        if (driversDB.length === 0) return;
        list.innerHTML = driversDB.map(d => `
            <div class="bg-white p-5 rounded-[2rem] border border-gray-100 shadow-sm space-y-3">
                <div class="flex justify-between items-start">
                    <div><h5 class="text-[12px] font-black italic uppercase leading-none">${d.nombre}</h5><p class="text-[9px] text-gray-400 font-bold uppercase mt-1 italic">${d.vehiculo} • ${d.placas}</p></div>
                    <span class="text-[8px] bg-red-50 text-red-600 px-3 py-1 rounded-full font-black uppercase italic">Nuevo</span>
                </div>
                <div class="flex gap-2">
                    <button class="flex-1 py-3 bg-gray-900 text-white text-[9px] font-black uppercase italic rounded-xl">Aprobar</button>
                    <button class="flex-1 py-3 bg-red-50 text-red-600 text-[9px] font-black uppercase italic rounded-xl">Rechazar</button>
                </div>
            </div>
        `).join('');
    }

    // --- NAVEGACIÓN ---
    function handleAuth() {
        const email = document.getElementById('login-email').value;
        const login = document.getElementById('login-screen');
        if (email === 'admin@drive.mx') {
            login.classList.add('hidden');
            document.getElementById('admin-view').classList.remove('hidden');
            document.getElementById('nav-admin').classList.remove('hidden');
            document.getElementById('side-role').innerText = 'ACCESO: ADMINISTRADOR';
            updateAdminView();
        } else if (email === 'user@drive.mx') {
            login.classList.add('hidden');
            document.getElementById('passenger-view').classList.remove('hidden');
            document.getElementById('nav-passenger').classList.remove('hidden');
            document.getElementById('side-role').innerText = 'ACCESO: PASAJERO';
        } else { alert("Credenciales incorrectas"); }
    }

    function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function closeAll() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('cost-sheet').classList.remove('active'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }
    function openCosts() { document.getElementById('cost-sheet').classList.add('active'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function toggleAccordion(id, chevId) { document.getElementById(id).classList.toggle('expanded'); document.getElementById(chevId).classList.toggle('active'); }
    function startRadar() { closeAll(); document.getElementById('radar').classList.remove('hidden'); }
</script>
</body>
</html>
