<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Drive MX | Global System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --app-height: 100dvh; }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: var(--app-height); }
        #app-container { height: var(--app-height); }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #submenu-usuarios { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        #submenu-usuarios.active { max-height: 300px; }
        .view-content { animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 30px 30px; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    <div id="overlay" onclick="closeAllModals()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <h2 class="text-lg font-black italic uppercase italic">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="sidebar-user-role" class="text-[8px] text-gray-500 font-bold mt-1 uppercase tracking-widest italic">Sistema Activo</p>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="sidebar-nav"></nav>
        <div class="p-6 border-t pb-12"> 
            <button onclick="location.reload()" class="w-full flex items-center justify-center gap-3 py-4 bg-red-50 text-red-600 rounded-2xl font-black text-[11px] uppercase italic">CERRAR SESIÓN</button>
        </div>
    </div>

    <div id="login-screen" class="absolute inset-0 z-40 bg-white p-10 flex flex-col justify-center">
        <h2 class="text-4xl font-black italic uppercase mb-10 leading-none text-center">DRIVE <span class="text-red-600">MX</span></h2>
        <div class="space-y-4">
            <input type="email" id="email-input" placeholder="admin@app.com" class="w-full p-4 bg-gray-50 border rounded-2xl font-bold">
            <input type="password" id="pass-input" placeholder="123" class="w-full p-4 bg-gray-50 border rounded-2xl font-bold">
            <button onclick="handleLogin()" class="w-full bg-red-600 text-white py-5 rounded-[2rem] font-black uppercase text-xs shadow-xl">Ingresar</button>
        </div>
    </div>

    <div id="admin-app" class="hidden h-full flex flex-col bg-gray-50">
        <header class="p-5 bg-gray-900 text-white flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="p-2 bg-white/10 rounded-xl"><i data-lucide="menu" class="text-red-600"></i></button>
                <h2 class="text-base font-black italic uppercase">PANEL CONTROL</h2>
            </div>
        </header>
        <main id="admin-host" class="p-4 overflow-y-auto flex-1">
            </main>
    </div>

    <div id="passenger-app" class="hidden h-full flex flex-col">
        <header class="p-4 flex items-center justify-between border-b bg-white z-10">
            <button onclick="toggleMenu()" class="p-2 bg-gray-50 rounded-xl"><i data-lucide="menu"></i></button>
            <h2 class="text-xl font-black italic uppercase flex-1 text-center italic">DRIVE <span class="text-red-600">MX</span></h2>
        </header>
        <main class="flex-1 relative map-sim overflow-hidden">
            <div id="passenger-ui-top" class="absolute top-4 left-4 right-4 z-20">
                <div class="bg-white p-4 rounded-2xl shadow-2xl border-2 border-red-500/10 flex items-center gap-4">
                    <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white"><i data-lucide="search"></i></div>
                    <span class="text-sm font-black text-gray-400 uppercase italic">¿A dónde vamos hoy?</span>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    lucide.createIcons();
    let currentRegStep = 1;
    let conductoresBD = [
        { id: 1, nombre: "Fernando Garduño", tel: "5512345678", estado: "Aprobado", calif: 4.9, foto: "https://i.pravatar.cc/150?u=fer", curp: "GARC900101HDF", nss: "1234567890", auto: "Jetta Rojo 2022", placas: "MX-99-88" }
    ];

    function handleLogin() {
        const e = document.getElementById('email-input').value;
        const p = document.getElementById('pass-input').value;
        if (e === 'admin@app.com') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-app').classList.remove('hidden');
            setupUI("ADMINISTRADOR", "shield");
            loadAdminView('Conductores');
        } else {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('passenger-app').classList.remove('hidden');
            setupUI("PASAJERO", "user");
        }
    }

    function setupUI(role, icon) {
        document.getElementById('sidebar-user-role').innerText = role;
        const nav = document.getElementById('sidebar-nav');
        if(role === "ADMINISTRADOR") {
            nav.innerHTML = `
                <button onclick="toggleSubmenu()" class="w-full flex items-center justify-between p-4 text-gray-800 font-black hover:bg-gray-50 rounded-2xl uppercase text-xs italic">
                    <div class="flex items-center gap-4"><i data-lucide="users" class="text-red-600"></i> Usuarios</div>
                    <i data-lucide="chevron-down" id="arrow-users"></i>
                </button>
                <div id="submenu-usuarios" class="pl-12 space-y-1">
                    <button onclick="loadAdminView('Pasajeros')" class="w-full text-left p-3 text-[10px] font-black text-gray-500 uppercase italic">Pasajeros</button>
                    <button onclick="loadAdminView('Conductores')" class="w-full text-left p-3 text-[10px] font-black text-gray-500 uppercase italic">Conductores</button>
                </div>`;
        } else {
            nav.innerHTML = `<button onclick="openDriverRegistration()" class="w-full flex items-center gap-4 p-4 text-red-600 font-black bg-red-50 rounded-2xl uppercase text-[10px] italic mt-4"><i data-lucide="car"></i> Quiero ser Conductor</button>`;
        }
        lucide.createIcons();
    }

    // CARGA DE LISTA DE CONDUCTORES
    function loadAdminView(tipo) {
        closeAllModals();
        const host = document.getElementById('admin-host');
        if(tipo === 'Conductores') {
            let html = `<h3 class="text-xl font-black italic uppercase mb-4">Gestión de <span class="text-red-600">Conductores</span></h3><div class="grid gap-4">`;
            conductoresBD.forEach(c => {
                const colorEstado = c.estado === 'Aprobado' ? 'bg-green-100 text-green-700' : c.estado === 'Bloqueado' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700';
                html += `
                    <div onclick="verDetalleConductor(${c.id})" class="bg-white p-4 rounded-[2rem] shadow-sm border border-gray-100 flex items-center gap-4 active:scale-95 transition-transform cursor-pointer">
                        <img src="${c.foto}" class="w-16 h-16 rounded-2xl object-cover border-2 border-red-500/10">
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h4 class="font-black text-sm uppercase italic leading-none">${c.nombre}</h4>
                                <span class="text-[8px] px-2 py-1 rounded-full font-black ${colorEstado}">${c.estado}</span>
                            </div>
                            <p class="text-[10px] font-bold text-gray-400 mt-1">${c.tel}</p>
                            <div class="flex items-center gap-1 mt-1 text-orange-500">
                                <i data-lucide="star" class="w-3 h-3 fill-current"></i><span class="text-[10px] font-black">${c.calif}</span>
                            </div>
                        </div>
                    </div>`;
            });
            html += `</div>`;
            host.innerHTML = html;
        } else {
            host.innerHTML = `<p class="text-center p-10 font-black italic text-gray-300">SIN REGISTROS</p>`;
        }
        lucide.createIcons();
    }

    // VISTA DE EXPEDIENTE COMPLETO
    function verDetalleConductor(id) {
        const c = conductoresBD.find(x => x.id === id);
        const modal = `
            <div id="detalle-modal" class="absolute inset-0 z-[140] bg-white overflow-y-auto view-content p-6">
                <button onclick="this.parentElement.remove()" class="mb-6 p-2 bg-gray-100 rounded-full"><i data-lucide="arrow-left"></i></button>
                <h2 class="text-2xl font-black italic uppercase mb-8">Expediente <span class="text-red-600">Conductor</span></h2>
                
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="bg-gray-50 p-4 rounded-3xl"><p class="text-[8px] font-black text-gray-400 uppercase italic">CURP</p><p class="text-xs font-black">${c.curp}</p></div>
                    <div class="bg-gray-50 p-4 rounded-3xl"><p class="text-[8px] font-black text-gray-400 uppercase italic">Vehículo</p><p class="text-xs font-black">${c.auto}</p></div>
                </div>

                <h3 class="font-black text-[10px] uppercase italic mb-4 text-gray-400">Documentación Fotográfica</h3>
                <div class="grid grid-cols-1 gap-6">
                    ${['INE FRONTAL', 'INE REVERSA', 'LICENCIA', 'FOTO AUTO'].map(doc => `
                        <div class="relative group">
                            <div class="absolute top-4 left-4 bg-black/50 text-white text-[8px] px-3 py-1 rounded-full font-black backdrop-blur-md">${doc}</div>
                            <button onclick="eliminarFoto(${c.id}, '${doc}')" class="absolute top-4 right-4 bg-red-600 text-white p-2 rounded-xl shadow-xl active:scale-90 transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            <img src="https://placehold.jp/24/000000/ffffff/400x250.png?text=DOC_PHOTO" class="w-full h-48 object-cover rounded-[2.5rem] border-4 border-gray-50 shadow-inner">
                        </div>
                    `).join('')}
                </div>

                <div class="mt-10 flex gap-3 pb-10">
                    <button onclick="cambiarEstado(${c.id}, 'Aprobado')" class="flex-1 bg-green-500 text-white py-5 rounded-[2rem] font-black text-[10px] uppercase shadow-lg shadow-green-100">APROBAR</button>
                    <button onclick="cambiarEstado(${c.id}, 'Bloqueado')" class="flex-1 bg-black text-white py-5 rounded-[2rem] font-black text-[10px] uppercase shadow-lg">BLOQUEAR</button>
                </div>
            </div>`;
        document.getElementById('app-container').insertAdjacentHTML('beforeend', modal);
        lucide.createIcons();
    }

    function eliminarFoto(id, doc) {
        if(confirm(`¿Deseas eliminar la foto de ${doc}? El conductor será bloqueado hasta que suba una nueva.`)) {
            const index = conductoresBD.findIndex(x => x.id === id);
            conductoresBD[index].estado = "Documentación Pendiente";
            alert("SISTEMA NOTIFICA: Foto eliminada. Conductor bloqueado hasta reposición.");
            document.getElementById('detalle-modal').remove();
            loadAdminView('Conductores');
        }
    }

    function cambiarEstado(id, nuevoEstado) {
        const index = conductoresBD.findIndex(x => x.id === id);
        conductoresBD[index].estado = nuevoEstado;
        alert(`Conductor ${nuevoEstado} con éxito.`);
        document.getElementById('detalle-modal').remove();
        loadAdminView('Conductores');
    }

    // FUNCIONES DE UI GENERAL
    function toggleSubmenu() {
        document.getElementById('submenu-usuarios').classList.toggle('active');
        document.getElementById('arrow-users').style.transform = document.getElementById('submenu-usuarios').classList.contains('active') ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('opacity-100', 'pointer-events-auto');
    }

    function closeAllModals() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }
</script>
</body>
</html>
