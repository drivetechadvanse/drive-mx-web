<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Prototipo de Flujo Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        .map-sim { 
            background-color: #e5e7eb; 
            background-image: 
                linear-gradient(#d1d5db 1px, transparent 1px),
                linear-gradient(90deg, #d1d5db 1px, transparent 1px);
            background-size: 40px 40px; 
        }

        /* Animación de la hoja de costos (Bottom Sheet) */
        #cost-sheet {
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            transform: translateY(100%);
        }
        #cost-sheet.active { transform: translateY(0); }

        .vehicle-card { transition: all 0.2s; border: 2px solid transparent; }
        .vehicle-card.selected { border-color: #ef4444; background-color: #fef2f2; }

        .btn-press:active { transform: scale(0.96); }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="main-overlay" onclick="closeCostSheet()" class="absolute inset-0 bg-black/40 z-[40] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="passenger-screen" class="h-screen flex flex-col relative">
        <header class="p-4 flex items-center justify-between bg-white border-b z-10">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-gray-900 rounded-lg text-white"><i data-lucide="menu" class="w-5 h-5"></i></div>
                <h2 class="text-xl font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            </div>
            <div class="w-10 h-10 bg-gray-100 rounded-full border-2 border-white shadow-sm overflow-hidden">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Fernando" alt="avatar">
            </div>
        </header>

        <main class="flex-1 relative map-sim">
            <div class="absolute top-6 left-6 right-6 z-20 space-y-3">
                <div class="bg-white/90 backdrop-blur p-3 rounded-2xl shadow-lg border border-gray-100 flex items-center gap-3">
                    <div class="w-2.5 h-2.5 bg-green-500 rounded-full shadow-[0_0_8px_#22c55e]"></div>
                    <p class="text-[10px] font-black text-gray-800 uppercase">Origen: <span class="text-gray-400">Tu ubicación actual</span></p>
                </div>
                
                <div onclick="openCostSheet()" class="bg-white p-1 rounded-2xl shadow-2xl flex items-center gap-3 cursor-pointer ring-2 ring-black/5 hover:ring-red-600/20 transition-all">
                    <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                        <i data-lucide="search" class="w-6 h-6"></i>
                    </div>
                    <span class="text-sm font-black text-gray-400 italic">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="relative">
                    <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-8 h-2 bg-black/20 rounded-full blur-sm"></div>
                    <div class="bg-red-600 p-4 rounded-3xl shadow-2xl border-4 border-white animate-bounce">
                        <i data-lucide="navigation" class="text-white w-6 h-6"></i>
                    </div>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[50] rounded-t-[3rem] shadow-[0_-20px_50px_rgba(0,0,0,0.15)] flex flex-col">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto my-4"></div>
            
            <div class="px-8 pb-8 space-y-6">
                <div class="flex justify-between items-end">
                    <div>
                        <h3 class="text-2xl font-black italic uppercase tracking-tighter text-gray-900">COSTOS <span class="text-red-600">ESTIMADOS</span></h3>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Selecciona tu categoría</p>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] font-black text-green-500 bg-green-50 px-2 py-1 rounded-md uppercase">Mejor Precio</span>
                    </div>
                </div>

                <div class="space-y-3">
                    <div onclick="selectVehicle(this)" class="vehicle-card selected p-4 rounded-[2rem] flex items-center justify-between cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center">
                                <i data-lucide="car" class="text-gray-900 w-8 h-8"></i>
                            </div>
                            <div>
                                <p class="font-black text-gray-900 uppercase italic">Drive <span class="text-red-600">Basic</span></p>
                                <p class="text-[10px] text-gray-400 font-bold uppercase">4 Asientos • 5 min</p>
                            </div>
                        </div>
                        <p class="text-xl font-black text-gray-900 italic">$45.50</p>
                    </div>

                    <div onclick="selectVehicle(this)" class="vehicle-card p-4 rounded-[2rem] flex items-center justify-between cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-gray-900 rounded-2xl flex items-center justify-center">
                                <i data-lucide="zap" class="text-red-600 w-8 h-8"></i>
                            </div>
                            <div>
                                <p class="font-black text-gray-900 uppercase italic">Drive <span class="text-red-600">Flash</span></p>
                                <p class="text-[10px] text-gray-400 font-bold uppercase">Moto • 2 min</p>
                            </div>
                        </div>
                        <p class="text-xl font-black text-gray-900 italic">$28.00</p>
                    </div>
                </div>

                <button onclick="requestTrip()" class="w-full bg-red-600 text-white py-5 rounded-[2.5rem] font-black shadow-2xl shadow-red-600/40 uppercase tracking-[0.2em] italic btn-press transition-all flex items-center justify-center gap-3">
                    Solicitar Viaje
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // Inicializar Iconos
    lucide.createIcons();

    function openCostSheet() {
        document.getElementById('cost-sheet').classList.add('active');
        document.getElementById('main-overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeCostSheet() {
        document.getElementById('cost-sheet').classList.remove('active');
        document.getElementById('main-overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }

    function selectVehicle(element) {
        // Quitar selección previa
        document.querySelectorAll('.vehicle-card').forEach(card => {
            card.classList.remove('selected');
        });
        // Seleccionar actual
        element.classList.add('selected');
    }

    function requestTrip() {
        const btn = event.currentTarget;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i> BUSCANDO SOCIO...`;
        lucide.createIcons();
        
        setTimeout(() => {
            alert("¡Viaje solicitado con éxito en Drive MX!");
            closeCostSheet();
            btn.innerHTML = `Solicitar Viaje <i data-lucide="chevron-right" class="w-5 h-5"></i>`;
            lucide.createIcons();
        }, 3000);
    }
</script>
</body>
</html>
