<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Drive MX | Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --app-height: 100dvh; }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: var(--app-height); }
        
        /* MAGIC SLIDE LOGIC (Solo para Expediente Conductor) */
        .m-block { transform: translateX(110%); opacity: 0; transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); position: absolute; inset: 0; pointer-events: none; }
        .m-block-active { transform: translateX(0); opacity: 1; position: relative; pointer-events: auto; }
        .m-block-prev { transform: translateX(-110%); opacity: 0; position: absolute; }

        #sidebar { transition: transform 0.4s ease; transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #submenu-usuarios { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
        #submenu-usuarios.active { max-height: 500px; }

        .pulse-ring { border: 4px solid #ef4444; border-radius: 50%; height: 100px; width: 100px; position: absolute; animation: pulsate 1.8s ease-out infinite; opacity: 0; }
        @keyframes pulsate { 0% { transform: scale(0.1); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl h-full relative flex flex-col overflow-hidden">
    <div id="overlay" onclick="closeAllModals()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <h2 class="text-lg font-black italic">DRIVE <span class="text-red-600 italic">MX</span></h2>
            <p class="text-[8px] text-gray-500 font-bold mt-1 uppercase italic italic tracking-tighter">System Administrator</p>
        </div>
        <nav class="flex-1 p-4 space-y-1" id="sidebar-nav"></nav>
    </div>

    <div id="splash" class="absolute inset-0 z-[150] bg-white flex items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-[1.5rem] flex items-center justify-center animate-pulse shadow-2xl"><i data-lucide="navigation" class="text-white"></i></div>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-10 flex flex-col justify-center italic">
        <h2 class="text-4xl font-black italic uppercase mb-10 text-center italic tracking-tighter">DRIVE <span class="text-red-600">MX</span></h2>
        <input type="email" id="email-input" placeholder="admin@app.com" class="w-full p-4 bg-gray-50 border rounded-2xl font-bold mb-4 outline-none">
        <button onclick="handleLogin()" class="w-full bg-red-600 text-white py-5 rounded-[2rem] font-black uppercase text-xs shadow-xl active:scale-95 italic italic tracking-tighter">Acceder</button>
    </div>

    <div id="admin-app" class="hidden h-full flex flex-col bg-gray-100">
        <header class="p-5 bg-gray-900 text-white flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="p-2 bg-white/10 rounded-xl"><i data-lucide="menu" class="text-red-600"></i></button>
                <h2 class="text-base font-black italic uppercase italic tracking-tighter">DRIVE <span class="text-red-600">PANEL</span></h2>
            </div>
        </header>
        <main id="admin-host" class="p-4 flex-1 overflow-y-auto"></main>
    </div>

    <div id="passenger-app" class="hidden h-full flex flex-col relative bg-gray-50">
        <header class="p-4 flex items-center justify-between bg-white border-b z-10">
            <button onclick="toggleMenu()" class="p-2 bg-gray-50 rounded-xl"><i data-lucide="menu"></i></button>
            <h1 class="text-xl font-black italic text-red-600 italic">DRIVE MX</h1>
            <div class="w-9 h-9 bg-gray-200 rounded-full flex items-center justify-center italic tracking-tighter italic"><i data-lucide="user" class="w-4 h-4"></i></div>
        </header>
        <main class="flex-1 relative overflow-hidden bg-gray-200">
            <div id="p-ui-top" class="absolute top-4 left-4 right-4 z-20 space-y-2">
                <div class="bg-white p-3 rounded-2xl shadow-lg border-l-4 border-blue-500 flex items-center gap-3 italic">
                    <i data-lucide="map-pin" class="text-blue-500 w-4 h-4 italic tracking-tighter"></i>
                    <span class="text-[10px] font-bold text-gray-800">Ubicación: San Salvador Atenco</span>
                </div>
            </div>
            <div id="searching-mode" class="hidden absolute inset-0 z-40 flex flex-col items-center justify-center">
                <div class="pulse-ring"></div>
                <div class="w-12 h-12 bg-red-600 rounded-full border-4 border-white shadow-2xl flex items-center justify-center z-10"><i data-lucide="map-pin" class="text-white"></i></div>
                <p class="mt-10 font-black uppercase text-[10px] animate-bounce bg-black text-white px-6 py-2 rounded-full italic tracking-tighter italic">Buscando...</p>
            </div>
            <button onclick="document.getElementById('searching-mode').classList.remove('hidden')" class="absolute bottom-10 left-1/2 -translate-x-1/2 bg-red-600 text-white px-10 py-5 rounded-full font-black uppercase text-xs shadow-2xl italic tracking-tighter">Pedir Viaje</button>
        </main>
    </div>
</div>

<script>
    lucide.createIcons();
    let currentMagicBlock = 1;

    function handleLogin() {
        const e = document.getElementById('email-input').value;
        document.getElementById('login-screen').classList.add('hidden');
        if (e === 'admin@app.com') {
            document.getElementById('admin-app').classList.remove('hidden');
            setupAdminSidebar();
        } else {
            document.getElementById('passenger-app').classList.remove('hidden');
            setupPassengerSidebar();
        }
    }

    function setupAdminSidebar() {
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = `
            <button onclick="toggleSubmenu()" class="w-full flex items-center justify-between p-4 text-gray-800 font-black hover:bg-gray-50 rounded-2xl uppercase text-[10px] italic">
                <div class="flex items-center gap-4"><i data-lucide="users" class="text-red-600 w-4 h-4"></i> Usuarios</div><i data-lucide="chevron-down"></i>
            </button>
            <div id="submenu-usuarios" class="pl-10 space-y-1 mt-1">
                <button onclick="loadListView('Conductores')" class="w-full text-left p-3 text-[9px] font-black text-gray-500 hover:text-red-600 uppercase italic italic tracking-tighter">Conductores</button>
                <button onclick="loadListView('Pasajeros')" class="w-full text-left p-3 text-[9px] font-black text-gray-500 uppercase italic">Pasajeros</button>
                <button onclick="loadListView('Administradores')" class="w-full text-left p-3 text-[9px] font-black text-gray-500 uppercase italic italic tracking-tighter">Administradores</button>
            </div>`;
        lucide.createIcons();
    }

    function setupPassengerSidebar() {
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = `<button onclick="openDriverReg()" class="w-full p-4 bg-red-50 text-red-600 font-black rounded-2xl uppercase text-[10px] italic italic tracking-tighter">Quiero ser Conductor</button>`;
        lucide.createIcons();
    }

    function loadListView(tipo) {
        closeAllModals();
        const host = document.getElementById('admin-host');
        if(tipo === 'Conductores') {
            host.innerHTML = `
                <div class="view-content">
                    <h3 class="text-xl font-black italic uppercase mb-4 italic tracking-tighter">Lista de <span class="text-red-600">Conductores</span></h3>
                    <div onclick="abrirExpedienteConductor()" class="bg-white p-4 rounded-3xl shadow-sm border flex items-center gap-4 cursor-pointer active:scale-95 transition-all">
                        <div class="w-12 h-12 bg-red-600 rounded-2xl flex items-center justify-center text-white font-black italic">FG</div>
                        <div><p class="font-black text-xs uppercase italic italic tracking-tighter">Fernando Garduño</p><p class="text-[8px] font-bold text-gray-400 italic">Ver Ficha con Magic Slide</p></div>
                    </div>
                </div>`;
        } else {
            host.innerHTML = `<div class="p-10 text-center text-gray-400 font-black uppercase text-[10px] italic">No hay registros en ${tipo}</div>`;
        }
        lucide.createIcons();
    }

    // EL MAGIC SLIDE - SOLO PARA DATOS DEL CONDUCTOR
    function abrirExpedienteConductor() {
        const modal = `
            <div id="magic-panel" class="absolute inset-0 z-[140] bg-white flex flex-col overflow-hidden">
                <div class="w-full bg-white border-b-4 border-red-600 p-6 flex justify-between items-center shadow-2xl relative z-[150]">
                    <div class="flex items-center gap-3">
                        <div class="flex gap-1.5"><div class="w-3 h-3 rounded-full bg-red-500"></div><div class="w-3 h-3 rounded-full bg-yellow-500"></div><div class="w-3 h-3 rounded-full bg-green-500"></div></div>
                        <h2 class="ml-4 font-black italic uppercase text-[10px] italic tracking-tighter">Expediente_Conductor_v1.0.exe</h2>
                    </div>
                    <div class="flex gap-4">
                        <button id="btn-next-magic" onclick="revealNextBlock()" class="p-3 bg-red-600 text-white rounded-xl shadow-lg active:scale-90 transition-all"><i data-lucide="arrow-right-circle"></i></button>
                        <button onclick="document.getElementById('magic-panel').remove()" class="p-3 bg-black text-white rounded-xl"><i data-lucide="x"></i></button>
                    </div>
                </div>

                <div class="flex-1 relative bg-gray-50">
                    <div id="m-block-1" class="m-block m-block-active p-8">
                        <h3 class="text-3xl font-black italic uppercase text-red-600 mb-6 italic tracking-tighter">01. Perfil</h3>
                        <div class="space-y-4">
                            ${box("NOMBRE", "Fernando Garduño García")}
                            ${box("CURP", "GARC900101HDF")}
                            ${box("ESTADO", "Revisión Pendiente")}
                        </div>
                    </div>
                    <div id="m-block-2" class="m-block p-8">
                        <h3 class="text-3xl font-black italic uppercase text-red-600 mb-6 italic tracking-tighter">02. Vehículo</h3>
                        <div class="space-y-4">
                            ${box("MODELO", "Volkswagen Jetta")}
                            ${box("COLOR", "Rojo Brillante")}
                            ${box("PLACAS", "MX-JET-26")}
                        </div>
                    </div>
                    <div id="m-block-3" class="m-block p-8">
                        <h3 class="text-3xl font-black italic uppercase text-red-600 mb-6 italic tracking-tighter">03. Docs</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="h-32 bg-white rounded-3xl border-2 border-dashed border-gray-200 flex items-center justify-center font-black text-[9px] uppercase italic italic tracking-tighter">Foto INE</div>
                            <div class="h-32 bg-white rounded-3xl border-2 border-dashed border-gray-200 flex items-center justify-center font-black text-[9px] uppercase italic italic tracking-tighter">Licencia</div>
                        </div>
                        <button onclick="alert('Conductor Activado!'); location.reload()" class="w-full mt-10 bg-green-500 text-white py-6 rounded-[2rem] font-black uppercase text-xs italic italic tracking-tighter shadow-2xl italic tracking-tighter">Aprobar Conductor</button>
                    </div>
                </div>
            </div>`;
        document.getElementById('app-container').insertAdjacentHTML('beforeend', modal);
        lucide.createIcons();
        currentMagicBlock = 1;
    }

    function revealNextBlock() {
        if(currentMagicBlock < 3) {
            document.getElementById(`m-block-${currentMagicBlock}`).classList.remove('m-block-active');
            document.getElementById(`m-block-${currentMagicBlock}`).classList.add('m-block-prev');
            currentMagicBlock++;
            document.getElementById(`m-block-${currentMagicBlock}`).classList.add('m-block-active');
            if(currentMagicBlock === 3) document.getElementById('btn-next-magic').style.opacity = '0';
        }
    }

    function box(l, v) {
        return `<div class="bg-white p-5 rounded-[2rem] border-l-8 border-red-600 shadow-sm"><p class="text-[8px] font-black text-gray-400 uppercase italic italic tracking-tighter">${l}</p><p class="text-sm font-black text-gray-800 uppercase italic italic tracking-tighter italic">${v}</p></div>`;
    }

    // REGISTRO 14 PASOS (Reloj de Arena)
    let rStep = 1;
    function openDriverReg() { 
        closeAllModals(); 
        const html = `
            <div id="reg-win" class="absolute inset-0 z-[140] bg-white p-10 flex flex-col items-center justify-center text-center">
                <div id="reg-content">
                    <div class="w-20 h-20 bg-red-600 rounded-3xl mx-auto mb-6 flex items-center justify-center text-white shadow-xl italic tracking-tighter italic"><i data-lucide="clipboard-list"></i></div>
                    <h2 class="text-2xl font-black italic italic tracking-tighter uppercase mb-2 italic">Paso ${rStep}/14</h2>
                    <p class="text-[9px] font-bold text-gray-400 uppercase mb-10 italic">Registro Nacional de Operadores</p>
                    <input type="text" placeholder="Dato requerido..." class="w-full p-5 bg-gray-50 rounded-3xl border-2 mb-6 font-bold text-center italic tracking-tighter">
                    <button onclick="nextR()" class="w-full bg-red-600 text-white py-5 rounded-[2rem] font-black uppercase text-xs italic shadow-xl">Siguiente</button>
                </div>
            </div>`;
        document.getElementById('app-container').insertAdjacentHTML('beforeend', html);
        lucide.createIcons();
    }

    function nextR() {
        if(rStep < 14) { rStep++; openDriverReg(); }
        else {
            document.getElementById('reg-content').innerHTML = `
                <div class="w-24 h-24 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6 animate-spin" style="animation-duration: 3s italic tracking-tighter"><i data-lucide="hourglass" class="text-red-600 w-12 h-12"></i></div>
                <h3 class="text-xl font-black italic italic tracking-tighter italic tracking-tighter uppercase italic tracking-tighter">¡Enviado!</h3>
                <p class="text-[10px] font-bold text-gray-500 mt-4 px-6 italic tracking-tighter">Activación en menos de 24 horas.</p>
                <button onclick="location.reload()" class="mt-10 w-full bg-black text-white py-5 rounded-full font-black uppercase text-[10px] italic tracking-tighter italic tracking-tighter">Entendido</button>`;
            lucide.createIcons();
        }
    }

    // UTILS
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('opacity-100', 'pointer-events-auto'); }
    function closeAllModals() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }
    function toggleSubmenu() { document.getElementById('submenu-usuarios').classList.toggle('active'); }

    setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(() => { document.getElementById('splash').style.display = 'none'; document.getElementById('login-screen').classList.remove('hidden'); }, 500); }, 1200);
</script>
</body>
</html>
