<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive MX | Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: 100dvh; }
        #app-container { height: 100dvh; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); padding-bottom: env(safe-area-inset-bottom, 2rem); }
        #cost-sheet.active { transform: translateY(0); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .accordion-content.expanded { max-height: 500px; }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; flex-grow: 1; }
        .animate-bounce-custom { animation: bounce-custom 0.8s infinite; }
        @keyframes bounce-custom { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .reg-input { width: 100%; padding: 1rem; background-color: #f9fafb; border-radius: 0.75rem; border: 2px solid transparent; outline: none; font-size: 0.75rem; font-weight: 700; }
        .reg-input:focus { border-color: #ef4444; background-color: #fff; }
        .reg-label { font-size: 9px; font-weight: 900; color: #9ca3af; text-transform: uppercase; margin-bottom: 0.4rem; display: block; margin-left: 0.5rem; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <div id="splash" class="absolute inset-0 z-[250] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center animate-pulse"><i data-lucide="navigation" class="text-white w-8 h-8"></i></div>
        <h1 class="text-2xl font-black mt-6 italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-400 font-bold uppercase tracking-widest italic">Panel de Control</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <div id="nav-admin" class="hidden">
                <button onclick="toggleAccordion('admin-acc')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="users" class="text-red-600 w-4 h-4"></i><span>Gestión</span></div>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div id="admin-acc" class="accordion-content bg-gray-50 rounded-xl">
                    <button onclick="renderAdminList('conductores')" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase border-b border-white">Conductores</button>
                    <button onclick="renderAdminList('pasajeros')" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase">Pasajeros</button>
                </div>
            </div>
        </nav>
        <div class="p-4 border-t mb-4">
            <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Salir</button>
        </div>
    </div>

    <div id="login-screen" class="absolute inset-0 z-[150] bg-white p-8 flex flex-col items-center justify-center text-center">
        <div class="w-12 h-12 bg-red-600 rounded-xl mb-6 animate-bounce-custom flex items-center justify-center"><i data-lucide="navigation" class="text-white w-6 h-6"></i></div>
        <h2 class="text-2xl font-black italic uppercase mb-10">ACCESO</h2>
        <div class="space-y-4 w-full">
            <input type="text" id="login-user" placeholder="Usuario o Email" class="reg-input">
            <input type="password" id="login-pass" placeholder="Contraseña" class="reg-input">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic shadow-lg">Entrar</button>
            <button onclick="openRegistration('passenger')" class="mt-4 text-[10px] font-black text-gray-400 uppercase italic">Crear Cuenta Pasajero</button>
        </div>
    </div>

    <div id="admin-view" class="hidden h-full flex flex-col bg-gray-100">
        <header class="px-4 py-3 flex items-center justify-between bg-gray-900 text-white">
            <button onclick="openMenu()" class="p-1.5 bg-white/10 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-red-600"></i></button>
            <h2 class="text-base font-black italic uppercase">PANEL <span class="text-red-600">ADMIN</span></h2>
            <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center"><i data-lucide="cpu" class="w-4 h-4 text-white"></i></div>
        </header>
        <main class="flex-1 p-5 overflow-y-auto">
            <h3 id="admin-list-title" class="text-[10px] font-black text-gray-400 uppercase italic mb-3">Solicitudes Recientes</h3>
            <div id="admin-list-container" class="space-y-3"></div>
        </main>
    </div>

    <div id="passenger-view" class="hidden h-full flex flex-col">
        <header class="px-4 py-3 flex items-center justify-between border-b bg-white">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center"><i data-lucide="user" class="text-white w-4 h-4"></i></div>
        </header>
        <main class="flex-1 map-sim relative overflow-hidden p-4">
            <div class="bg-white p-4 rounded-2xl shadow-xl border flex items-center gap-3">
                <i data-lucide="search" class="text-red-600"></i>
                <span class="text-[11px] font-black text-gray-400 uppercase">¿A dónde vas?</span>
            </div>
            <button onclick="openRegistration('driver')" class="absolute bottom-6 left-6 right-6 bg-gray-900 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Quiero ser Conductor</button>
        </main>
    </div>

    <div id="reg-view" class="hidden absolute inset-0 z-[200] bg-white flex flex-col">
        <header class="p-4 border-b flex items-center">
            <button onclick="closeReg()" class="p-2"><i data-lucide="arrow-left"></i></button>
            <h2 id="reg-title" class="ml-4 font-black italic uppercase">REGISTRO</h2>
        </header>
        <div class="p-6 space-y-6">
            <div><label class="reg-label">Nombre Completo</label><input type="text" id="reg-name" class="reg-input"></div>
            <div><label class="reg-label">Teléfono</label><input type="tel" id="reg-phone" class="reg-input"></div>
            <button onclick="saveUser()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[12px] uppercase">Finalizar Registro</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    let currentMode = '';

    // Autenticación Protegida
    function handleAuth() {
        const user = document.getElementById('login-user').value.trim();
        const pass = document.getElementById('login-pass').value.trim();

        if (!user || !pass) {
            alert("Por favor ingresa tus credenciales.");
            return;
        }

        document.getElementById('login-screen').classList.add('hidden');
        
        if (user === 'admin@drive.mx' && pass === '1234') {
            document.getElementById('admin-view').classList.remove('hidden');
            document.getElementById('nav-admin').classList.remove('hidden');
            renderAdminList('conductores');
        } else {
            document.getElementById('passenger-view').classList.remove('hidden');
        }
        lucide.createIcons();
    }

    // Registro
    function openRegistration(mode) {
        currentMode = mode;
        document.getElementById('reg-view').classList.remove('hidden');
        document.getElementById('reg-title').innerText = mode === 'passenger' ? 'NUEVO PASAJERO' : 'POSTULACIÓN CONDUCTOR';
    }

    function closeReg() { document.getElementById('reg-view').classList.add('hidden'); }

    function saveUser() {
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;
        
        if (!name || !phone) return alert("Completa los campos.");

        const storageKey = currentMode === 'passenger' ? 'drive_passengers' : 'drive_drivers';
        let list = JSON.parse(localStorage.getItem(storageKey) || '[]');
        list.push({ name, phone, date: new Date().toLocaleDateString() });
        localStorage.setItem(storageKey, JSON.stringify(list));

        alert("Registro exitoso.");
        location.reload();
    }

    // Panel de Control (Separación de Canales)
    function renderAdminList(type) {
        closeAll();
        const container = document.getElementById('admin-list-container');
        const title = document.getElementById('admin-list-title');
        const storageKey = type === 'pasajeros' ? 'drive_passengers' : 'drive_drivers';
        const data = JSON.parse(localStorage.getItem(storageKey) || '[]');

        title.innerText = type === 'pasajeros' ? "PASAJEROS REGISTRADOS" : "SOLICITUDES CONDUCTORES";
        container.innerHTML = data.length ? '' : '<p class="text-center text-[10px] font-bold text-gray-400 py-10 uppercase">No hay registros</p>';
        
        data.forEach(item => {
            container.innerHTML += `
                <div class="bg-white p-4 rounded-2xl border flex justify-between items-center">
                    <div>
                        <h4 class="text-[11px] font-black uppercase italic">${item.name}</h4>
                        <p class="text-[8px] font-bold text-gray-400">TEL: ${item.phone} | ${item.date}</p>
                    </div>
                    <span class="text-[7px] font-black px-2 py-1 ${type === 'pasajeros' ? 'bg-green-100 text-green-600' : 'bg-yellow-100 text-yellow-600'} rounded-full uppercase">
                        ${type === 'pasajeros' ? 'Activo' : 'Pendiente'}
                    </span>
                </div>`;
        });
    }

    function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function closeAll() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }
    function toggleAccordion(id) { document.getElementById(id).classList.toggle('expanded'); }

    setTimeout(() => { 
        document.getElementById('splash').style.opacity = '0'; 
        setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
    }, 1500);
</script>
</body>
</html>
