<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Drive MX | Global System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --app-height: 100dvh; }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: var(--app-height); }
        #app-container { height: var(--app-height); }
        #splash { transition: opacity 0.5s ease; }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 30px 30px; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #submenu-usuarios { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        #submenu-usuarios.active { max-height: 500px; }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(110%); padding-bottom: env(safe-area-inset-bottom, 60px); max-height: 80vh; }
        #cost-sheet.active { transform: translateY(0); }
        .pulse-ring { border: 3px solid #ef4444; border-radius: 50%; height: 80px; width: 80px; position: absolute; left: -28px; top: -28px; animation: pulsate 1.5s ease-out infinite; opacity: 0; }
        @keyframes pulsate { 0% { transform: scale(0.1, 0.1); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1.2, 1.2); opacity: 0; } }
        .view-content { animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    <div id="overlay" onclick="closeAllModals()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white z-[110] shadow-2xl flex flex-col text-gray-800">
        <div class="p-6 bg-gray-900 text-white">
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="sidebar-user-role" class="text-[8px] text-gray-500 font-bold mt-1 uppercase tracking-widest italic">Sistema Activo</p>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="sidebar-nav"></nav>
        <div class="p-6 border-t pb-12"> 
            <button onclick="location.reload()" class="w-full flex items-center justify-center gap-3 py-4 bg-red-50 text-red-600 rounded-2xl font-black text-[11px] uppercase italic">CERRAR SESIÓN</button>
        </div>
    </div>

    <div id="splash" class="absolute inset-0 z-[150] bg-white flex flex-col items-center justify-center">
        <div class="w-20 h-20 bg-red-600 rounded-[2rem] flex items-center justify-center animate-pulse"><i data-lucide="navigation" class="text-white w-10 h-10"></i></div>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-10 flex flex-col justify-center">
        <h2 class="text-4xl font-black italic uppercase mb-10 leading-none text-center">DRIVE <span class="text-red-600">MX</span></h2>
        <div class="space-y-4">
            <input type="email" id="email-input" placeholder="admin@app.com o pasajero@app.com" class="w-full p-4 bg-gray-50 border rounded-2xl font-bold">
            <input type="password" id="pass-input" placeholder="123" class="w-full p-4 bg-gray-50 border rounded-2xl font-bold">
            <button onclick="handleLogin()" class="w-full bg-red-600 text-white py-5 rounded-[2rem] font-black uppercase text-xs shadow-xl active:scale-95 transition-all">Ingresar</button>
        </div>
    </div>

    <div id="passenger-app" class="hidden h-full flex flex-col">
        <header id="passenger-header" class="p-4 flex items-center justify-between border-b bg-white z-10">
            <button onclick="toggleMenu()" class="p-2 bg-gray-50 rounded-xl"><i data-lucide="menu"></i></button>
            <h2 class="text-xl font-black italic uppercase flex-1 text-center text-red-600 tracking-tighter">DRIVE MX</h2>
            <div class="w-9 h-9 rounded-full border bg-gray-100 flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>
        </header>

        <main class="flex-1 relative map-sim overflow-hidden">
            <div id="passenger-ui-top" class="absolute top-4 left-4 right-4 z-20 space-y-3">
                <div class="bg-white p-3 rounded-2xl shadow-lg flex items-center gap-4 border-l-4 border-blue-500">
                    <div class="w-8 h-8 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600"><i data-lucide="map-pin" class="w-4 h-4"></i></div>
                    <div class="flex flex-col"><span class="text-[8px] font-black text-gray-400 uppercase italic">Recolección</span><span class="text-[10px] font-bold text-gray-800 tracking-tight text-ellipsis overflow-hidden whitespace-nowrap">Ubicación detectada...</span></div>
                </div>
                <div onclick="openCostSheet()" class="bg-white p-2 rounded-2xl shadow-2xl flex items-center gap-4 border-2 border-red-500/10 active:scale-95 transition-transform cursor-pointer">
                    <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i data-lucide="search"></i></div>
                    <span class="text-sm font-black text-gray-400 uppercase italic tracking-tighter">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div id="searching-loader" class="hidden absolute inset-0 bg-white/20 backdrop-blur-[2px] z-40 flex flex-col items-center justify-center">
                <div class="relative mb-8"><div class="pulse-ring"></div><div class="w-10 h-10 bg-red-600 rounded-full border-4 border-white shadow-2xl relative z-10"></div></div>
                <div class="bg-black text-white px-8 py-3 rounded-full shadow-2xl animate-bounce">
                    <p class="text-[10px] font-black uppercase italic tracking-[0.2em]">Buscando Conductor</p>
                </div>
            </div>

            <div id="passenger-ui-bottom" class="absolute bottom-10 left-4 right-4 z-30">
                <div class="bg-black rounded-[2.5rem] p-5 flex items-center justify-between text-white shadow-2xl border border-white/10">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-red-600/20 rounded-xl flex items-center justify-center text-red-500 border border-red-500/30"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div><p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest leading-none mb-1">Cartera</p><h3 id="display-saldo" class="text-lg font-black italic">$50.00</h3></div>
                    </div>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[3rem] shadow-[0_-20px_60px_rgba(0,0,0,0.25)] p-8">
            <div class="w-16 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-black italic uppercase mb-4">Drive <span class="text-red-600">Basic</span></h3>
            <div class="p-4 rounded-3xl border-2 border-red-600 bg-red-50 flex justify-between items-center mb-6">
                <span class="font-bold text-xs uppercase italic">Precio Fijo</span>
                <span class="font-black text-xl italic">$45.00</span>
            </div>
            <div class="grid grid-cols-3 gap-3 mb-8">
                <button id="pay-spei" onclick="selectPayment('SPEI')" class="pay-opt p-4 border-2 rounded-2xl flex flex-col items-center gap-2"><i data-lucide="landmark"></i><span class="text-[9px] font-black uppercase">SPEI</span></button>
                <button id="pay-cartera" onclick="selectPayment('Cartera')" class="pay-opt p-4 border-2 rounded-2xl flex flex-col items-center gap-2"><i data-lucide="wallet"></i><span class="text-[9px] font-black uppercase">Cartera</span></button>
                <button id="pay-efectivo" onclick="selectPayment('Efectivo')" class="pay-opt p-4 border-2 rounded-2xl flex flex-col items-center gap-2"><i data-lucide="banknote"></i><span class="text-[9px] font-black uppercase">Cash</span></button>
            </div>
            <button onclick="processOrder()" class="w-full bg-red-600 text-white py-5 rounded-[2.5rem] font-black uppercase text-xs italic shadow-xl">SOLICITAR VIAJE</button>
        </div>
    </div>

    <div id="admin-app" class="hidden h-full flex flex-col bg-gray-50 text-gray-800">
        <header class="p-5 bg-gray-900 text-white flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="p-2 bg-white/10 rounded-xl"><i data-lucide="menu" class="text-red-600"></i></button>
                <h2 class="text-base font-black italic uppercase tracking-tighter">CONTROL <span class="text-red-600">PANEL</span></h2>
            </div>
        </header>
        <main id="admin-host" class="p-4 overflow-y-auto flex-1"></main>
    </div>
</div>

<script>
    lucide.createIcons();
    let selectedMethod = null;
    let currentRegStep = 1;
    let userSaldo = 50.00;
    
    let conductoresBD = [
        { id: 1, nombre: "Fernando Garduño", tel: "5512345678", estado: "Aprobado", foto: "https://i.pravatar.cc/150?u=fer", auto: "Jetta 2022", color: "Rojo", nss: "12345678901", placa: "MX-9988" }
    ];

    const regSteps = [
        { key: "nombre", title: "Nombre Completo", type: "text", placeholder: "Ej. Juan Pérez", icon: "user" },
        { key: "foto", title: "Foto de Perfil", type: "special-photo", icon: "user-circle" },
        { key: "tel", title: "WhatsApp", type: "tel", placeholder: "10 dígitos", icon: "message-circle" },
        { key: "nss", title: "Seguridad Social (NSS)", type: "text", placeholder: "Tu número de seguro", icon: "shield-check" },
        { key: "ine_f", title: "INE Frontal", type: "file", icon: "image" },
        { key: "ine_r", title: "INE Reversa", type: "file", icon: "image" },
        { key: "licencia", title: "Licencia de Manejo", type: "file", icon: "file-text" },
        { key: "auto", title: "Marca y Modelo", type: "text", placeholder: "Ej. VW Jetta 2023", icon: "car" },
        { key: "color", title: "Color del Vehículo", type: "text", placeholder: "Ej. Gris Platino", icon: "palette" },
        { key: "circulacion", title: "Tarjeta de Circulación", type: "file", icon: "file-check" },
        { key: "seguro", title: "Póliza de Seguro", type: "file", icon: "heart-handshake" },
        { key: "placa", title: "Placa del Vehículo", type: "text", placeholder: "Ej. ABC-123-D", icon: "hash" },
        { key: "foto_carro", title: "Foto del vehículo con matrícula visible", type: "file", icon: "camera" }
    ];

    function handleLogin() {
        const e = document.getElementById('email-input').value;
        document.getElementById('login-screen').classList.add('hidden');
        if (e === 'admin@app.com') {
            document.getElementById('admin-app').classList.remove('hidden');
            setupAdminSidebar();
            loadListView('Conductores');
        } else {
            document.getElementById('passenger-app').classList.remove('hidden');
            setupPassengerSidebar();
        }
    }

    function setupAdminSidebar() {
        document.getElementById('sidebar-user-role').innerText = "ADMINISTRADOR";
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = `
            <button onclick="location.reload()" class="w-full flex items-center gap-4 p-4 text-gray-900 font-black bg-gray-50 rounded-2xl uppercase text-[10px] italic mb-4 border"><i data-lucide="home" class="text-red-600 w-4 h-4"></i> INICIO</button>
            <button onclick="toggleSubmenu()" class="w-full flex items-center justify-between p-4 text-gray-800 font-black hover:bg-gray-50 rounded-2xl uppercase text-[10px] italic">
                <div class="flex items-center gap-4"><i data-lucide="users" class="text-red-600 w-4 h-4"></i> Usuarios</div>
                <i data-lucide="chevron-down"></i>
            </button>
            <div id="submenu-usuarios" class="pl-10 space-y-1 mt-1">
                <button onclick="loadListView('Conductores')" class="w-full text-left p-3 text-[9px] font-black text-gray-500 uppercase italic">Conductores</button>
            </div>`;
        lucide.createIcons();
    }

    function setupPassengerSidebar() {
        document.getElementById('sidebar-user-role').innerText = "PASAJERO";
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = `
            <button onclick="location.reload()" class="w-full flex items-center gap-4 p-4 text-gray-900 font-black bg-gray-50 rounded-2xl uppercase text-[10px] italic mb-2 border"><i data-lucide="home" class="text-red-600 w-4 h-4"></i> INICIO</button>
            <button onclick="openDriverRegistration()" class="w-full flex items-center gap-4 p-4 text-red-600 font-black bg-red-50 rounded-2xl uppercase text-[10px] italic mt-4"><i data-lucide="car" class="w-4 h-4"></i> Quiero ser Conductor</button>`;
        lucide.createIcons();
    }

    function loadListView(tipo) {
        closeAllModals();
        const host = document.getElementById('admin-host');
        let html = `<div class="view-content"><h3 class="text-xl font-black italic uppercase mb-6 italic">Lista <span class="text-red-600">${tipo}</span></h3><div class="grid gap-4">`;
        conductoresBD.forEach(c => {
            html += `
                <div onclick="verDetalleConductor(${c.id})" class="bg-white p-4 rounded-[2rem] border flex items-center gap-4 active:scale-95 cursor-pointer">
                    <img src="${c.foto}" class="w-14 h-14 rounded-2xl object-cover bg-gray-100">
                    <div class="flex-1">
                        <h4 class="font-black text-[11px] uppercase italic">${c.nombre}</h4>
                        <p class="text-[9px] font-bold text-gray-400">${c.tel}</p>
                        <span class="text-[7px] px-2 py-0.5 rounded-full font-black bg-orange-100 text-orange-600 uppercase mt-1 inline-block">${c.estado}</span>
                    </div>
                </div>`;
        });
        host.innerHTML = html + `</div></div>`;
        lucide.createIcons();
    }

    function verDetalleConductor(id) {
        const c = conductoresBD.find(x => x.id === id);
        const modal = `
        <div id="detalle-modal" class="absolute inset-0 z-[140] bg-white overflow-y-auto p-6 view-content">
            <header class="flex items-center gap-4 mb-8">
                <button onclick="this.parentElement.parentElement.remove()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="arrow-left"></i></button>
                <h2 class="text-xl font-black italic uppercase tracking-tighter">Perfil <span class="text-red-600">Conductor</span></h2>
            </header>
            <div class="space-y-4 pb-10">
                <div onclick="toggleSeccionDocs('docs-personales')" class="bg-gray-50 p-5 rounded-[2rem] border active:scale-95 cursor-pointer">
                    <h3 class="text-[10px] font-black text-red-600 uppercase italic mb-3 tracking-widest">DATOS DE CONDUCTOR</h3>
                    <p class="text-[11px] font-bold uppercase"><span class="text-gray-400 text-[8px] mr-2">Nombre:</span> ${c.nombre}</p>
                    <p class="text-[11px] font-bold uppercase"><span class="text-gray-400 text-[8px] mr-2">WhatsApp:</span> ${c.tel}</p>
                    <p class="text-[11px] font-bold uppercase"><span class="text-gray-400 text-[8px] mr-2">NSS:</span> ${c.nss}</p>
                </div>
                <div id="docs-personales" class="hidden space-y-3 px-2">${renderDocCard(c.id, 'INE Frontal')}${renderDocCard(c.id, 'INE Reversa')}</div>

                <div onclick="toggleSeccionDocs('docs-vehiculo')" class="bg-gray-50 p-5 rounded-[2rem] border active:scale-95 cursor-pointer">
                    <h3 class="text-[10px] font-black text-red-600 uppercase italic mb-3 tracking-widest">DATOS DEL VEHÍCULO</h3>
                    <p class="text-[11px] font-bold uppercase"><span class="text-gray-400 text-[8px] mr-2">Modelo:</span> ${c.auto}</p>
                    <p class="text-[11px] font-bold uppercase"><span class="text-gray-400 text-[8px] mr-2">Color:</span> ${c.color}</p>
                </div>
                <div id="docs-vehiculo" class="hidden space-y-3 px-2">${renderDocCard(c.id, 'Licencia')}${renderDocCard(c.id, 'Tarjeta Circulación')}</div>

                <div onclick="toggleSeccionDocs('docs-matricula')" class="bg-gray-50 p-5 rounded-[2rem] border active:scale-95 cursor-pointer">
                    <h3 class="text-[10px] font-black text-red-600 uppercase italic mb-3 tracking-widest">MATRÍCULA</h3>
                    <p class="text-[11px] font-bold uppercase"><span class="text-gray-400 text-[8px] mr-2">Placa:</span> ${c.placa}</p>
                </div>
                <div id="docs-matricula" class="hidden space-y-3 px-2">${renderDocCard(c.id, 'Foto Matrícula')}${renderDocCard(c.id, 'Seguro')}</div>
            </div>
        </div>`;
        document.getElementById('app-container').insertAdjacentHTML('beforeend', modal);
        lucide.createIcons();
    }

    function renderDocCard(id, name) {
        return `<div class="relative rounded-[2rem] border-2 border-dashed bg-white h-32 flex items-center justify-center">
            <span class="text-[9px] font-black uppercase text-gray-300 italic tracking-widest">${name}</span>
            <button onclick="eliminarFoto(${id}, '${name}')" class="absolute bottom-3 right-3 bg-red-600 text-white p-2 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>`;
    }

    function toggleSeccionDocs(id) {
        const s = document.getElementById(id);
        const isH = s.classList.contains('hidden');
        ['docs-personales', 'docs-vehiculo', 'docs-matricula'].forEach(d => document.getElementById(d).classList.add('hidden'));
        if(isH) s.classList.remove('hidden');
    }

    function eliminarFoto(id, doc) {
        if(confirm(`¿Eliminar ${doc}?`)) alert(`SISTEMA: Documento ${doc} eliminado. Se notificó al conductor.`);
    }

    // PASENGER LOGIC
    function openCostSheet() { document.getElementById('cost-sheet').classList.add('active'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function selectPayment(m) { selectedMethod = m; document.querySelectorAll('.pay-opt').forEach(o => o.classList.remove('border-red-600', 'bg-red-50', 'text-red-600')); document.getElementById(`pay-${m.toLowerCase()}`).classList.add('border-red-600', 'bg-red-50', 'text-red-600'); }
    
    function processOrder() {
        if(!selectedMethod) return alert("Selecciona un método de pago.");
        if(selectedMethod === 'Cartera' && userSaldo < 45) return alert("Saldo insuficiente. Por favor recarga o selecciona otro método.");
        
        closeAllModals();
        document.getElementById('passenger-header').classList.add('hidden');
        document.getElementById('passenger-ui-top').classList.add('hidden');
        document.getElementById('passenger-ui-bottom').classList.add('hidden');
        document.getElementById('searching-loader').classList.remove('hidden');
        setTimeout(() => { alert("¡Conductor en camino!"); location.reload(); }, 4000);
    }

    // REGISTRO CONDUCTOR
    function openDriverRegistration() { closeAllModals(); currentRegStep = 1; renderRegStep(); }
    function renderRegStep() {
        const step = regSteps[currentRegStep - 1];
        let input = step.type === "special-photo" ? 
            `<button onclick="nextRegStep()" class="w-full p-6 bg-white border-2 rounded-[2rem] flex items-center justify-center gap-4 active:scale-95"><i data-lucide="camera" class="text-red-600"></i><span class="font-black text-xs uppercase italic">Tomar Foto</span></button>` : 
            `<input type="${step.type}" id="reg-input" placeholder="${step.placeholder || ''}" class="w-full p-5 bg-white border-2 rounded-[2rem] font-bold text-center text-sm outline-none focus:border-red-600 shadow-inner">`;
        
        const html = `
            <div id="driver-reg-modal" class="absolute inset-0 z-[130] bg-white p-8 flex flex-col view-content">
                <div class="flex justify-between items-center mb-8"><button onclick="this.parentElement.parentElement.remove()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x"></i></button><span class="text-[9px] font-black text-gray-400 uppercase italic">Paso ${currentRegStep}/${regSteps.length}</span></div>
                <div class="flex-1 flex flex-col items-center justify-center gap-8 text-center">
                    <div class="w-20 h-20 bg-red-600 rounded-[2.5rem] flex items-center justify-center text-white shadow-2xl animate-bounce"><i data-lucide="${step.icon}" class="w-10 h-10"></i></div>
                    <h3 class="font-black uppercase text-xs italic text-gray-400">${step.title}</h3>
                    <div class="w-full">${input}</div>
                </div>
                ${step.type !== "special-photo" ? `<button onclick="nextRegStep()" class="w-full bg-red-600 text-white py-5 rounded-[2.5rem] font-black uppercase text-xs italic mt-6 shadow-xl active:scale-95 transition-all">CONTINUAR</button>` : ""}
            </div>`;
        const ex = document.getElementById('driver-reg-modal'); if(ex) ex.remove();
        document.getElementById('app-container').insertAdjacentHTML('beforeend', html);
        lucide.createIcons();
    }

    function nextRegStep() { if(currentRegStep < regSteps.length) { currentRegStep++; renderRegStep(); } else { alert("¡Solicitud enviada exitosamente!"); location.reload(); } }

    function toggleSubmenu() { document.getElementById('submenu-usuarios').classList.toggle('active'); }
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('opacity-100', 'pointer-events-auto'); }
    function closeAllModals() { document.getElementById('sidebar').classList.remove('open'); if(document.getElementById('cost-sheet')) document.getElementById('cost-sheet').classList.remove('active'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }

    setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(() => { document.getElementById('splash').style.display = 'none'; document.getElementById('login-screen').classList.remove('hidden'); }, 500); }, 1000);
</script>
</body>
</html>
