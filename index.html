<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect, useReducer, createContext, useContext } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';

        // --- CONFIGURACIÓN Y BASE DE DATOS SIMULADA [cite: 5, 7] ---
        const initialData = {
            users: [
                { id: 'admin1', role: 'admin', name: 'Super Admin', email: 'admin@app.com', password: '123', balance: 0 },
                { id: 'p1', role: 'passenger', name: 'Juan Pasajero', email: 'juan@app.com', password: '123', balance: 50 },
                { id: 'd1', role: 'driver', name: 'Carlos Conductor', email: 'carlos@app.com', password: '123', status: 'available', balance: 200, vehicle: 'Toyota Yaris 2022' }
            ],
            services: [
                { id: 's1', name: 'Auto Básico', type: 'ride', baseRate: 20, image: 'car', active: true },
                { id: 's2', name: 'Auto VIP', type: 'ride', baseRate: 50, image: 'car', active: true }
            ],
            trips: [],
            transactions: [],
            settings: {
                walletLegend: "Mantén saldo positivo para solicitar servicios.",
                whatsappLink: "https://wa.me/521234567890"
            }
        };

        // --- COMPONENTE DE MAPA SIMULADO  ---
        const SimulatedMap = ({ children, height = 'h-64' }) => (
            <div className={`w-full ${height} bg-gray-200 relative overflow-hidden rounded-b-3xl`}>
                <div className="absolute inset-0 opacity-20" style={{ backgroundImage: 'linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>
                <svg className="absolute inset-0 w-full h-full" preserveAspectRatio="none">
                    <path d="M 50 50 Q 150 150 250 100 T 350 200" fill="transparent" stroke="#EF4444" strokeWidth="4" strokeDasharray="5,5" className="animate-pulse" />
                </svg>
                {children}
            </div>
        );

        // --- PANTALLA DE CARTERA / WALLET [cite: 34, 35] ---
        const WalletScreen = ({ user, onBack }) => (
            <div className="min-h-screen bg-white p-6">
                <div className="bg-red-600 p-6 text-white rounded-3xl mb-6">
                    <p className="text-sm opacity-80">Saldo Disponible</p>
                    <h1 className="text-4xl font-black">$ {user.balance.toFixed(2)}</h1>
                </div>
                <h3 className="font-bold mb-4 text-gray-800">Movimientos Recientes</h3>
                <div className="text-center text-gray-400 mt-10">No hay movimientos hoy.</div>
                <button onClick={onBack} class="mt-8 w-full bg-gray-100 py-3 rounded-xl font-bold">Volver</button>
            </div>
        );

        // --- APP PRINCIPAL ---
        function App() {
            const [view, setView] = useState('splash');
            const [user, setUser] = useState(null);

            useEffect(() => {
                setTimeout(() => setView('login'), 2000);
            }, []);

            if (view === 'splash') return (
                <div className="h-screen flex flex-col items-center justify-center bg-white">
                    <div className="w-20 h-20 bg-red-600 rounded-3xl flex items-center justify-center shadow-xl animate-bounce">
                        <i data-lucide="navigation" class="text-white w-10 h-10"></i>
                    </div>
                    <h1 className="text-3xl font-black mt-4">DRIVE <span className="text-red-600">MX</span></h1>
                </div>
            );

            if (view === 'login') return (
                <div className="min-h-screen flex flex-col justify-center p-8 bg-white max-w-md mx-auto">
                    <h2 className="text-3xl font-black mb-2">Bienvenido</h2>
                    <p className="text-gray-500 mb-8">Ingresa tus credenciales</p>
                    <input type="email" placeholder="Correo" class="w-full p-4 bg-gray-50 border rounded-2xl mb-4" />
                    <input type="password" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border rounded-2xl mb-6" />
                    <button onClick={() => { setUser(initialData.users[1]); setView('home'); }} class="w-full bg-red-600 text-white py-4 rounded-2xl font-bold shadow-lg">Ingresar</button>
                </div>
            );

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl">
                    {view === 'home' && (
                        <>
                            <SimulatedMap height="h-80" />
                            <div className="p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-black">¿A dónde vamos?</h2>
                                    <button onClick={() => setView('wallet')} class="bg-gray-100 p-3 rounded-full"><i data-lucide="wallet"></i></button>
                                </div>
                                <div class="space-y-4">
                                    {initialData.services.map(s => (
                                        <div key={s.id} class="border-2 border-gray-100 p-4 rounded-2xl flex items-center justify-between hover:border-red-600 cursor-pointer transition-all">
                                            <div class="flex items-center gap-4">
                                                <div class="w-12 h-12 bg-red-50 rounded-xl flex items-center justify-center"><i data-lucide="car" class="text-red-600"></i></div>
                                                <span class="font-bold">{s.name}</span>
                                            </div>
                                            <span class="font-black text-red-600">${s.baseRate}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </>
                    )}
                    {view === 'wallet' && <WalletScreen user={user} onBack={() => setView('home')} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Inicializar iconos después de cargar el componente
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
