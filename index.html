<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Professional System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }

        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .accordion-content.expanded { max-height: 300px; }
        .chevron-rotate { transition: transform 0.3s ease; }
        .chevron-rotate.active { transform: rotate(180deg); }
        
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; }
        .radar-pulse {
            position: absolute; width: 100px; height: 100px;
            background: rgba(239, 68, 68, 0.15); border-radius: 100%;
            animation: radar 2s infinite;
        }
        @keyframes radar { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .payment-opt.selected { border: 1.5px solid #ef4444; background: #fef2f2; color: #ef4444; }
        .hidden-view { opacity: 0; transform: translateY(-20px); pointer-events: none; transition: all 0.4s ease; }

        .reg-input { width: 100%; padding: 1rem; background-color: #f9fafb; border-radius: 0.75rem; border: 2px solid transparent; outline: none; font-size: 0.75rem; font-weight: 700; transition: all 0.2s; }
        .reg-input:focus { border-color: #ef4444; background-color: #fff; }
        .reg-label { font-size: 9px; font-weight: 900; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-left: 0.5rem; margin-bottom: 0.5rem; display: block; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <div id="splash" class="absolute inset-0 z-[200] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center animate-pulse shadow-xl shadow-red-600/20">
            <i data-lucide="navigation" class="text-white w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-black mt-6 italic uppercase tracking-tighter">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3"><i data-lucide="cpu" class="w-6 h-6"></i></div>
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-400 font-bold uppercase italic tracking-widest">Iniciando...</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <div id="nav-passenger" class="hidden">
                <button onclick="toggleAccordion('pass-acc', 'pass-chev')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="user" class="text-red-600 w-4 h-4"></i><span>Mi Cuenta</span></div>
                    <i data-lucide="chevron-down" id="pass-chev" class="w-3 h-3 chevron-rotate"></i>
                </button>
                <div id="pass-acc" class="accordion-content bg-gray-50/50 rounded-xl ml-2">
                    <button onclick="applyToBeDriver()" class="w-full text-left p-3 pl-9 text-[9px] font-black text-red-600 uppercase hover:bg-red-50 italic">Quiero ser Conductor</button>
                </div>
            </div>
        </nav>
        <div class="p-4 border-t"><button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button></div>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-[150] bg-white p-8 flex flex-col justify-center">
        <h2 class="text-2xl font-black italic uppercase mb-8 leading-none tracking-tighter">SISTEMA<br><span class="text-red-600">DRIVE MX</span></h2>
        <div class="space-y-4">
            <input type="email" id="login-email" placeholder="Usuario" class="reg-input">
            <input type="password" id="login-pass" placeholder="Contraseña" class="reg-input">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic">Ingresar</button>
        </div>
    </div>

    <div id="passenger-view" class="hidden h-screen flex flex-col relative">
        <header id="p-header" class="px-4 py-3 flex items-center justify-between border-b bg-white z-10">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600 text-lg">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center"><i data-lucide="user" class="text-white w-4 h-4"></i></div>
        </header>
        <main class="flex-1 map-sim relative overflow-hidden"></main>
    </div>

    <div id="driver-registration-view" class="hidden absolute inset-0 z-[160] bg-white flex flex-col">
        <header class="px-4 py-4 flex items-center border-b bg-white sticky top-0 z-10">
            <button onclick="handleDriverBack()" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i></button>
            <h2 class="ml-3 text-lg font-black italic uppercase">REGISTRO <span class="text-red-600">CONDUCTOR</span></h2>
        </header>
        
        <div class="flex-1 overflow-y-auto p-6">
            <div id="step-photo" class="w-full flex flex-col items-center">
                <div class="relative mb-8 mt-6">
                    <div id="photo-preview-container" class="w-40 h-40 rounded-full border-4 border-gray-100 bg-gray-50 flex items-center justify-center overflow-hidden">
                        <i id="placeholder-icon" data-lucide="user" class="w-12 h-12 text-gray-300"></i>
                        <img id="driver-photo-preview" class="hidden w-full h-full object-cover">
                    </div>
                    <button onclick="document.getElementById('photo-input').click()" class="absolute bottom-1 right-1 bg-red-600 p-3 rounded-full text-white border-4 border-white"><i data-lucide="camera" class="w-5 h-5"></i></button>
                    <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="processImage(this)">
                </div>
                <button id="btn-photo-next" disabled onclick="goToStepName()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-name" class="hidden w-full flex flex-col">
                <label class="reg-label">Nombre Completo</label>
                <input type="text" id="dr-full-name" class="reg-input mb-8" oninput="validateNameInput(this)">
                <button id="btn-name-next" disabled onclick="goToStepIneFront()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-ine-frontal" class="hidden w-full flex flex-col">
                <h3 class="text-[10px] font-black text-gray-400 uppercase mb-4 text-center">INE Frontal</h3>
                <div class="w-full aspect-video bg-gray-50 rounded-2xl border-4 border-dashed border-gray-200 flex items-center justify-center mb-6 overflow-hidden" onclick="document.getElementById('ine-input').click()">
                    <img id="ine-preview" class="hidden w-full h-full object-cover">
                    <i data-lucide="credit-card" class="text-gray-300 w-10 h-10"></i>
                </div>
                <input type="file" id="ine-input" accept="image/*" class="hidden" onchange="processIneFront(this)">
                <button id="btn-ine-front-next" disabled onclick="goToStepIneBack()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-ine-trasera" class="hidden w-full flex flex-col">
                <h3 class="text-[10px] font-black text-gray-400 uppercase mb-4 text-center">INE Trasera</h3>
                <div class="w-full aspect-video bg-gray-50 rounded-2xl border-4 border-dashed border-gray-200 flex items-center justify-center mb-6 overflow-hidden" onclick="document.getElementById('ine-back-input').click()">
                    <img id="ine-back-preview" class="hidden w-full h-full object-cover">
                    <i data-lucide="credit-card" class="text-gray-300 w-10 h-10"></i>
                </div>
                <input type="file" id="ine-back-input" accept="image/*" class="hidden" onchange="processIneBack(this)">
                <button id="btn-ine-back-next" disabled onclick="goToStepVehicle()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-vehicle" class="hidden w-full flex flex-col">
                <h3 class="text-[10px] font-black text-gray-400 uppercase mb-6 text-center">Datos del Vehículo</h3>
                <div class="space-y-3">
                    <input type="number" placeholder="Año" class="reg-input v-field" oninput="validateVehicleForm()">
                    <input type="text" placeholder="Color" class="reg-input v-field" oninput="validateVehicleForm()">
                    <input type="text" placeholder="Modelo" class="reg-input v-field" oninput="validateVehicleForm()">
                    <input type="text" placeholder="Marca" class="reg-input v-field" oninput="validateVehicleForm()">
                    <input type="text" placeholder="Placa" class="reg-input v-field uppercase" oninput="validateVehicleForm()">
                </div>
                <button id="btn-vehicle-next" disabled onclick="goToStepCirculacion()" class="w-full mt-8 bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-circulacion" class="hidden w-full flex flex-col">
                <h3 class="text-[10px] font-black text-gray-400 uppercase mb-4 text-center italic tracking-widest">Tarjeta de Circulación</h3>
                <p class="text-[8px] text-gray-400 text-center mb-6 uppercase font-bold">Captura legible del documento vigente</p>
                
                <div class="w-full aspect-[4/3] bg-gray-50 rounded-2xl border-4 border-dashed border-gray-200 flex flex-col items-center justify-center mb-6 overflow-hidden relative" onclick="document.getElementById('circ-input').click()">
                    <img id="circ-preview" class="hidden w-full h-full object-cover">
                    <div id="circ-placeholder" class="flex flex-col items-center gap-2">
                        <i data-lucide="file-text" class="text-gray-300 w-12 h-12"></i>
                        <span class="text-[8px] font-black text-gray-400 uppercase">Subir Documento</span>
                    </div>
                </div>
                <input type="file" id="circ-input" accept="image/*" class="hidden" onchange="processCirculacion(this)">
                
                <button id="btn-finish" disabled onclick="alert('Registro enviado para validación.')" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic transition-all">Finalizar Registro</button>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    let currentRegStep = 1;

    // Splash y Auth
    setTimeout(() => {
        document.getElementById('splash').style.opacity = '0';
        setTimeout(() => { document.getElementById('splash').style.display = 'none'; document.getElementById('login-screen').classList.remove('hidden'); }, 500);
    }, 1500);

    function handleAuth() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('passenger-view').classList.remove('hidden');
        document.getElementById('nav-passenger').classList.remove('hidden');
        document.getElementById('side-role').innerText = 'PASAJERO';
        lucide.createIcons();
    }

    // Registro Logica
    function applyToBeDriver() { closeAll(); document.getElementById('driver-registration-view').classList.remove('hidden'); currentRegStep = 1; }

    function handleDriverBack() {
        const steps = ['step-photo', 'step-name', 'step-ine-frontal', 'step-ine-trasera', 'step-vehicle', 'step-circulacion'];
        if (currentRegStep > 1) {
            document.getElementById(steps[currentRegStep-1]).classList.add('hidden');
            currentRegStep--;
            document.getElementById(steps[currentRegStep-1]).classList.remove('hidden');
        } else { document.getElementById('driver-registration-view').classList.add('hidden'); }
    }

    // Procesadores de imagen
    function processImage(input) { if (input.files[0]) { 
        document.getElementById('driver-photo-preview').src = URL.createObjectURL(input.files[0]);
        document.getElementById('driver-photo-preview').classList.remove('hidden');
        document.getElementById('placeholder-icon').classList.add('hidden');
        activateBtn('btn-photo-next'); 
    }}

    function processIneFront(input) { if (input.files[0]) {
        document.getElementById('ine-preview').src = URL.createObjectURL(input.files[0]);
        document.getElementById('ine-preview').classList.remove('hidden');
        activateBtn('btn-ine-front-next');
    }}

    function processIneBack(input) { if (input.files[0]) {
        document.getElementById('ine-back-preview').src = URL.createObjectURL(input.files[0]);
        document.getElementById('ine-back-preview').classList.remove('hidden');
        activateBtn('btn-ine-back-next');
    }}

    function processCirculacion(input) { if (input.files[0]) {
        document.getElementById('circ-preview').src = URL.createObjectURL(input.files[0]);
        document.getElementById('circ-preview').classList.remove('hidden');
        document.getElementById('circ-placeholder').classList.add('hidden');
        activateBtn('btn-finish');
    }}

    // Navegación
    function goToStepName() { switchStep('step-photo', 'step-name', 2); }
    function goToStepIneFront() { switchStep('step-name', 'step-ine-frontal', 3); }
    function goToStepIneBack() { switchStep('step-ine-frontal', 'step-ine-trasera', 4); }
    function goToStepVehicle() { switchStep('step-ine-trasera', 'step-vehicle', 5); }
    function goToStepCirculacion() { switchStep('step-vehicle', 'step-circulacion', 6); }

    function switchStep(oldId, newId, stepNum) {
        document.getElementById(oldId).classList.add('hidden');
        document.getElementById(newId).classList.remove('hidden');
        currentRegStep = stepNum;
        lucide.createIcons();
    }

    function validateNameInput(input) { if (input.value.length > 3) activateBtn('btn-name-next'); }
    
    function validateVehicleForm() {
        const fields = document.querySelectorAll('.v-field');
        let all = true;
        fields.forEach(f => { if(!f.value) all = false; });
        if(all) activateBtn('btn-vehicle-next');
    }

    function activateBtn(id) {
        const btn = document.getElementById(id);
        btn.disabled = false;
        btn.classList.replace('bg-gray-300', 'bg-red-600');
    }

    // UI Helpers
    function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function closeAll() { 
        document.getElementById('sidebar').classList.remove('open'); 
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); 
    }
    function toggleAccordion(id, chevId) { document.getElementById(id).classList.toggle('expanded'); document.getElementById(chevId).classList.toggle('active'); }
</script>
</body>
</html>
