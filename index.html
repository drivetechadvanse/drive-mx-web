<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive MX | Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: 100dvh; }
        #app-container { height: 100dvh; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); padding-bottom: env(safe-area-inset-bottom, 2rem); }
        #cost-sheet.active { transform: translateY(0); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .accordion-content.expanded { max-height: 500px; }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; flex-grow: 1; }
        .hidden-view { opacity: 0; transform: translateY(-20px); pointer-events: none; transition: all 0.4s ease; }
        .reg-input { width: 100%; padding: 1rem; background-color: #f9fafb; border-radius: 0.75rem; border: 2px solid transparent; outline: none; font-size: 0.75rem; font-weight: 700; }
        .reg-input:focus { border-color: #ef4444; background-color: #fff; }
        .reg-label { font-size: 9px; font-weight: 900; color: #9ca3af; text-transform: uppercase; margin-bottom: 0.4rem; display: block; margin-left: 0.5rem; }
        .payment-opt.selected { border-color: #ef4444; background-color: #fef2f2; color: #ef4444; }
        .card-selected { border-color: #ef4444 !important; background-color: #fef2f2 !important; ring: 2px; ring-color: #ef4444; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <!-- Splash Screen -->
    <div id="splash" class="absolute inset-0 z-[250] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center animate-pulse shadow-lg shadow-red-600/30">
            <i data-lucide="navigation" class="text-white w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-black mt-6 italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <!-- Overlay Global -->
    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <!-- Sidebar Menú -->
    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-400 font-bold uppercase italic tracking-widest mt-1">Usuario Activo</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <div id="nav-passenger" class="hidden">
                <button onclick="applyToBeDriver()" class="w-full flex items-center gap-3 p-3 text-red-600 font-black hover:bg-red-50 rounded-xl uppercase text-[10px] italic">
                    <i data-lucide="car" class="w-4 h-4"></i><span>Quiero ser Conductor</span>
                </button>
            </div>
            <div id="nav-admin" class="hidden">
                <button onclick="renderAdminRequests()" class="w-full flex items-center gap-3 p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <i data-lucide="users" class="text-red-600 w-4 h-4"></i><span>Gestión Usuarios</span>
                </button>
            </div>
        </nav>
        <div class="p-4 border-t mb-4">
            <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button>
        </div>
    </div>

    <!-- Pantalla de Login -->
    <div id="login-screen" class="absolute inset-0 z-[150] bg-white p-8 flex flex-col items-center justify-center text-center">
        <div class="w-12 h-12 bg-red-600 rounded-xl mb-6 shadow-lg flex items-center justify-center">
            <i data-lucide="navigation" class="text-white w-6 h-6"></i>
        </div>
        <h2 class="text-3xl font-black italic uppercase mb-12 leading-none">BIENVENIDO</h2>
        <div class="space-y-4 w-full">
            <input type="text" id="login-email" placeholder="Usuario o Correo" class="reg-input text-left">
            <input type="password" id="login-pass" placeholder="Contraseña" class="reg-input text-left">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic shadow-lg active:scale-95 transition-all">Ingresar</button>
            <button onclick="startPassengerRegistration()" class="mt-4 text-[10px] font-black text-gray-400 uppercase italic hover:text-red-600 transition-colors">Crear Cuenta de Pasajero</button>
        </div>
    </div>

    <!-- Vista de Pasajero (Principal) -->
    <div id="passenger-view" class="hidden h-full flex flex-col relative">
        <header class="px-4 py-3 flex items-center justify-between border-b bg-white z-10">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center"><i data-lucide="user" class="text-white w-4 h-4"></i></div>
        </header>
        <main class="flex-1 map-sim relative">
            <div class="absolute top-4 left-4 right-4 z-20">
                <div onclick="openCosts()" class="bg-white p-1 rounded-xl shadow-2xl flex items-center gap-2 border active:scale-95 transition-transform">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase">¿A dónde vamos hoy?</span>
                </div>
            </div>
            <div class="absolute bottom-6 left-4 right-4 z-30">
                <div class="bg-gray-900 rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-600/20 rounded-xl flex items-center justify-center text-red-600 border border-red-600/30"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div>
                            <p class="text-[8px] text-gray-500 font-black uppercase italic">Tu Cartera</p>
                            <h3 id="display-saldo" class="text-sm font-black italic">$0.00 MXN</h3>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <!-- Bottom Sheet de Pago -->
        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-8 pt-6 space-y-5">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-2"></div>
            <h3 class="text-lg font-black italic uppercase text-center">MÉTODO DE <span class="text-red-600">PAGO</span></h3>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="setPay(this, 'efectivo')" class="payment-opt selected p-4 rounded-2xl border flex flex-col items-center gap-2 transition-all"><i data-lucide="banknote" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">Efectivo</span></button>
                <button onclick="setPay(this, 'cartera')" class="payment-opt p-4 rounded-2xl border flex flex-col items-center gap-2 transition-all"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">Cartera</span></button>
                <button onclick="setPay(this, 'spei')" class="payment-opt p-4 rounded-2xl border flex flex-col items-center gap-2 transition-all"><i data-lucide="send" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">SPEI</span></button>
            </div>
            <button onclick="alert('Buscando conductor...')" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[12px] uppercase italic shadow-xl">CONFIRMAR SOLICITUD</button>
        </div>
    </div>

    <!-- REGISTRO UNIFICADO (Seguridad Limpia) -->
    <div id="driver-registration-view" class="hidden absolute inset-0 z-[200] bg-white flex flex-col">
        <header class="px-4 py-4 flex items-center border-b bg-white sticky top-0 shrink-0">
            <button onclick="handleRegBack()" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i></button>
            <h2 id="reg-main-title" class="ml-3 text-lg font-black italic uppercase">REGISTRO <span class="text-red-600">DRIVE MX</span></h2>
        </header>
        
        <div class="flex-1 overflow-y-auto p-6 pb-12">
            
            <!-- PASO 1: FOTO DE SEGURIDAD (Obligatorio Pasajeros y Drivers) -->
            <div id="step-photo" class="w-full flex flex-col items-center">
                <div class="relative mb-8 mt-6">
                    <div id="photo-preview-container" class="w-40 h-40 rounded-full border-4 border-gray-100 bg-gray-50 flex items-center justify-center overflow-hidden shadow-xl">
                        <i id="placeholder-icon" data-lucide="user" class="w-12 h-12 text-gray-300"></i>
                        <img id="main-photo-preview" class="hidden w-full h-full object-cover">
                    </div>
                    <button type="button" onclick="document.getElementById('photo-input').click()" class="absolute bottom-1 right-1 bg-red-600 p-3 rounded-full text-white border-4 border-white shadow-lg active:scale-95 transition-all">
                        <i data-lucide="camera" class="w-5 h-5"></i>
                    </button>
                    <input type="file" id="photo-input" accept="image/*" capture="user" class="hidden" onchange="processSafetyImage(this)">
                </div>
                <p class="text-[10px] font-black text-center text-gray-400 uppercase italic mb-6">Fotografía de perfil obligatoria para seguridad</p>
                <button id="btn-photo-next" disabled onclick="goToStep(2)" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic transition-all">Siguiente</button>
            </div>

            <!-- PASO 2: DATOS PERSONALES -->
            <div id="step-name" class="hidden w-full flex flex-col space-y-4">
                <div><label class="reg-label">Nombre Completo</label><input type="text" id="reg-name" class="reg-input" placeholder="Ej: Juan Pérez" oninput="validatePersonalFields()"></div>
                <div><label class="reg-label">Usuario</label><input type="text" id="reg-user" class="reg-input" placeholder="Crea tu usuario" oninput="validatePersonalFields()"></div>
                <div><label class="reg-label">Contraseña</label><input type="password" id="reg-pass" class="reg-input" placeholder="••••••••" oninput="validatePersonalFields()"></div>
                <div><label class="reg-label">Correo Electrónico</label><input type="email" id="reg-email" class="reg-input" placeholder="ejemplo@correo.com" oninput="validatePersonalFields()"></div>
                <button id="btn-name-next" disabled onclick="handleRegFlow()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic transition-all">Siguiente</button>
            </div>

            <!-- PASOS CONDUCTOR (INE / VEHICULO) -->
            <div id="step-extra-driver" class="hidden space-y-6">
                <h3 class="text-center font-black text-[10px] text-gray-400 uppercase italic">Documentación Conductor</h3>
                <div class="w-full aspect-video bg-gray-50 rounded-2xl border-4 border-dashed border-gray-200 flex items-center justify-center overflow-hidden" onclick="document.getElementById('ine-input').click()">
                    <img id="ine-preview" class="hidden w-full h-full object-cover">
                    <i id="ine-icon" data-lucide="image" class="text-gray-300 w-10 h-10"></i>
                </div>
                <input type="file" id="ine-input" accept="image/*" class="hidden" onchange="processIneImage(this)">
                <input type="text" id="v-plate" placeholder="PLACA DEL VEHÍCULO" class="reg-input uppercase text-center" oninput="validateDriverExtra()">
                <button id="btn-extra-next" disabled onclick="goToStep(4)" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <!-- PASO TELÉFONO -->
            <div id="step-phone" class="hidden w-full flex flex-col">
                <h3 class="text-center font-black text-[10px] text-gray-400 uppercase mb-4 italic">Verificación de Teléfono</h3>
                <input type="tel" id="reg-phone" class="reg-input text-center text-xl" placeholder="55 0000 0000" maxlength="10" oninput="validatePhoneField(this)">
                <button id="btn-phone-next" disabled onclick="goToStep(5)" class="w-full mt-6 bg-gray-300 text-white py-4 rounded-xl font-black text-[11px] uppercase italic transition-all">Finalizar Registro</button>
            </div>

            <!-- FINALIZACIÓN -->
            <div id="step-finish" class="hidden w-full flex flex-col items-center justify-center text-center py-10">
                <div class="w-24 h-24 bg-gray-900 rounded-3xl flex items-center justify-center mb-8"><i data-lucide="check-circle" class="w-12 h-12 text-red-600"></i></div>
                <h2 class="text-xl font-black italic uppercase mb-4 leading-none">REGISTRO<br><span class="text-red-600">COMPLETADO</span></h2>
                <button onclick="saveRegistration()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[12px] uppercase italic transition-all active:scale-95">CONFIRMAR Y ENTRAR</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Inicializar Iconos Lucide
    lucide.createIcons();

    let regMode = 'passenger'; // 'passenger' o 'driver'
    let currentStep = 1;

    // Splash Timer
    setTimeout(() => {
        document.getElementById('splash').style.opacity = '0';
        setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
    }, 1500);

    // --- FUNCIONES DE REGISTRO ---

    function startPassengerRegistration() {
        regMode = 'passenger';
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('driver-registration-view').classList.remove('hidden');
        document.getElementById('reg-main-title').innerHTML = 'REGISTRO <span class="text-red-600 uppercase">PASAJERO</span>';
        goToStep(1);
    }

    function applyToBeDriver() {
        regMode = 'driver';
        closeAll();
        document.getElementById('passenger-view').classList.add('hidden');
        document.getElementById('driver-registration-view').classList.remove('hidden');
        document.getElementById('reg-main-title').innerHTML = 'REGISTRO <span class="text-red-600 uppercase">DRIVER</span>';
        goToStep(1);
    }

    function goToStep(n) {
        const steps = ['step-photo', 'step-name', 'step-extra-driver', 'step-phone', 'step-finish'];
        steps.forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(steps[n-1]).classList.remove('hidden');
        currentStep = n;
        lucide.createIcons();
    }

    function processSafetyImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('main-photo-preview');
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                document.getElementById('placeholder-icon').classList.add('hidden');
                
                const btn = document.getElementById('btn-photo-next');
                btn.disabled = false;
                btn.classList.replace('bg-gray-300', 'bg-red-600');
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function validatePersonalFields() {
        const name = document.getElementById('reg-name').value;
        const user = document.getElementById('reg-user').value;
        const pass = document.getElementById('reg-pass').value;
        const email = document.getElementById('reg-email').value;
        const btn = document.getElementById('btn-name-next');

        if (name.length > 3 && user.length > 3 && pass.length > 5 && email.includes('@')) {
            btn.disabled = false;
            btn.classList.replace('bg-gray-300', 'bg-red-600');
        } else {
            btn.disabled = true;
            btn.classList.replace('bg-red-600', 'bg-gray-300');
        }
    }

    function handleRegFlow() {
        if (regMode === 'passenger') goToStep(4); // Salta a teléfono
        else goToStep(3); // Va a extras de driver
    }

    function processIneImage(input) {
        if (input.files && input.files[0]) {
            document.getElementById('ine-preview').src = URL.createObjectURL(input.files[0]);
            document.getElementById('ine-preview').classList.remove('hidden');
            document.getElementById('ine-icon').classList.add('hidden');
            validateDriverExtra();
        }
    }

    function validateDriverExtra() {
        const plate = document.getElementById('v-plate').value;
        const btn = document.getElementById('btn-extra-next');
        if (plate.length >= 4) {
            btn.disabled = false;
            btn.classList.replace('bg-gray-300', 'bg-red-600');
        }
    }

    function validatePhoneField(input) {
        const btn = document.getElementById('btn-phone-next');
        if (input.value.length === 10) {
            btn.disabled = false;
            btn.classList.replace('bg-gray-300', 'bg-red-600');
        }
    }

    function saveRegistration() {
        const data = {
            id: Date.now(),
            name: document.getElementById('reg-name').value,
            user: document.getElementById('reg-user').value.toLowerCase(),
            pass: document.getElementById('reg-pass').value,
            phone: document.getElementById('reg-phone').value,
            type: regMode,
            saldo: 0
        };

        let db = JSON.parse(localStorage.getItem('drivemx_users') || '[]');
        db.push(data);
        localStorage.setItem('drivemx_users', JSON.stringify(db));
        
        alert("¡Registro exitoso!");
        location.reload();
    }

    // --- SISTEMA DE AUTENTICACIÓN ---

    function handleAuth() {
        const userIn = document.getElementById('login-email').value.toLowerCase();
        const passIn = document.getElementById('login-pass').value;

        if (userIn === 'admin' && passIn === '1234') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('nav-admin').classList.remove('hidden');
            alert("Acceso Admin");
            return;
        }

        const db = JSON.parse(localStorage.getItem('drivemx_users') || '[]');
        const found = db.find(u => u.user === userIn && u.pass === passIn);

        if (found) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('passenger-view').classList.remove('hidden');
            document.getElementById('nav-passenger').classList.remove('hidden');
            document.getElementById('display-saldo').innerText = `$${found.saldo.toFixed(2)} MXN`;
        } else {
            alert("Usuario o contraseña incorrectos.");
        }
    }

    // --- UI HELPERS ---

    function openMenu() {
        document.getElementById('sidebar').classList.add('open');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeAll() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('cost-sheet').classList.remove('active');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }

    function openCosts() {
        document.getElementById('cost-sheet').classList.add('active');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function setPay(btn, method) {
        document.querySelectorAll('.payment-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function handleRegBack() {
        document.getElementById('driver-registration-view').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }

</script>
</body>
</html>
