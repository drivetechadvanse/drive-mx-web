<div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2rem] shadow-2xl p-6 space-y-4">
    <div class="w-10 h-1 bg-gray-200 rounded-full mx-auto -mt-2 mb-2"></div>
    <h3 class="text-lg font-black italic uppercase tracking-tighter">Tipo de <span class="text-red-600">Servicio</span></h3>
    
    <div class="space-y-2">
        <div onclick="selectVehicle(this)" class="vehicle-card selected p-3 rounded-2xl flex items-center justify-between cursor-pointer transition-all border border-gray-100">
            <div class="flex items-center gap-3">
                <i data-lucide="car" class="w-5 h-5 text-gray-700"></i>
                <span class="font-bold text-xs uppercase italic">Drive Basic</span>
            </div>
            <span class="font-black italic text-sm">$45.00</span>
        </div>
    </div>

    <button id="btn-confirm-main" onclick="showPaymentMethods()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-[0.1em] italic shadow-lg shadow-red-600/20 active:scale-95 transition-all">
        Confirmar Viaje
    </button>

    <div id="payment-methods" class="hidden space-y-3 animate-fadeIn">
        <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest text-center mb-2">Selecciona Método de Pago</p>
        <div class="grid grid-cols-3 gap-2">
            <button onclick="selectPayment(this)" class="payment-opt p-3 border border-gray-100 rounded-xl flex flex-col items-center gap-1 hover:border-red-600 transition-all">
                <i data-lucide="landmark" class="w-4 h-4 text-gray-600"></i>
                <span class="text-[8px] font-bold uppercase">SPEI</span>
            </button>
            <button onclick="selectPayment(this)" class="payment-opt p-3 border border-gray-100 rounded-xl flex flex-col items-center gap-1 hover:border-red-600 transition-all">
                <i data-lucide="wallet" class="w-4 h-4 text-gray-600"></i>
                <span class="text-[8px] font-bold uppercase">Cartera</span>
            </button>
            <button onclick="selectPayment(this)" class="payment-opt p-3 border border-gray-100 rounded-xl flex flex-col items-center gap-1 hover:border-red-600 transition-all">
                <i data-lucide="banknote" class="w-4 h-4 text-gray-600"></i>
                <span class="text-[8px] font-bold uppercase">Efectivo</span>
            </button>
        </div>
        <button onclick="finalOrder()" class="w-full bg-black text-white py-3 rounded-xl font-black text-[10px] uppercase italic tracking-widest mt-2">
            Pedir Ahora
        </button>
    </div>
</div>

<script>
    // Añade estas funciones a tu bloque de <script> existente

    function showPaymentMethods() {
        // Oculta el botón principal y muestra los pagos
        document.getElementById('btn-confirm-main').classList.add('hidden');
        const payPanel = document.getElementById('payment-methods');
        payPanel.classList.remove('hidden');
        payPanel.classList.add('view-content'); // Reutilizamos tu animación de entrada
        lucide.createIcons();
    }

    function selectPayment(el) {
        // Quita la selección de todos y se la pone al clicado
        document.querySelectorAll('.payment-opt').forEach(opt => {
            opt.classList.remove('border-red-600', 'bg-red-50');
        });
        el.classList.add('border-red-600', 'bg-red-50');
    }

    function finalOrder() {
        alert("Buscando conductor... Tu solicitud de Drive MX ha sido enviada.");
        closeAllModals();
        // Aquí podrías resetear el botón para la próxima vez
        setTimeout(() => {
            document.getElementById('btn-confirm-main').classList.remove('hidden');
            document.getElementById('payment-methods').classList.add('hidden');
        }, 1000);
    }
</script>
