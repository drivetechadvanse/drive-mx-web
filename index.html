<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        
        .map-bg { 
            background-color: #f3f4f6; 
            background-image: radial-gradient(#d1d5db 0.8px, transparent 0.8px); 
            background-size: 20px 20px; 
        }

        #sidebar { 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            transform: translateX(-100%); 
        }
        #sidebar.open { transform: translateX(0); }
        
        #overlay { 
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        #overlay.open { opacity: 1; pointer-events: auto; }

        .banner-minimal {
            background: transparent;
            border: none;
        }
        
        /* Efecto de bloqueo */
        .blocked { filter: grayscale(1); opacity: 0.5; pointer-events: none; }

        /* Tarjeta de cartera compacta */
        .wallet-card {
            background: linear-gradient(135deg, #111827 0%, #000000 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gray-900">

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="splash" class="absolute inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-24 h-24 bg-red-600 rounded-[2rem] flex items-center justify-center shadow-2xl animate-bounce">
            <i data-lucide="navigation" class="text-white w-12 h-12"></i>
        </div>
        <h1 class="text-4xl font-black mt-6 tracking-tighter italic">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <h2 class="text-4xl font-black text-gray-900 leading-none mb-10 italic">HOLA,<br><span class="text-red-600">BIENVENIDO</span></h2>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Usuario" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-red-600">
            <input type="password" id="password" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-red-600">
            <button onclick="validateLogin()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg">ENTRAR</button>
        </div>
    </div>

    <div id="overlay" class="absolute inset-0 z-[60] bg-black/40" onclick="toggleSidebar()"></div>
    <div id="sidebar" class="absolute inset-y-0 left-0 z-[70] w-72 bg-white flex flex-col">
        <div class="p-8 bg-gray-900 text-white font-black italic text-xl">DRIVE MX</div>
        <nav class="flex-1 p-6 space-y-2">
            <button class="w-full flex items-center gap-4 p-4 font-bold text-gray-700 hover:bg-red-50 rounded-xl transition-colors">
                <i data-lucide="user"></i> Perfil
            </button>
            <button onclick="logout()" class="w-full flex items-center gap-4 p-4 text-red-600 font-bold hover:bg-red-50 rounded-xl transition-colors">
                <i data-lucide="log-out"></i> Salir
            </button>
        </nav>
    </div>

    <div id="main-app" class="hidden h-screen flex flex-col">
        <header class="p-4 flex items-center justify-between border-b bg-white z-10">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-xl transition-colors">
                    <i data-lucide="menu" class="w-7 h-7 text-gray-900"></i>
                </button>
                <h2 class="text-2xl font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            </div>
            <i data-lucide="bell" class="w-6 h-6 text-gray-400"></i>
        </header>

        <main class="flex-1 flex flex-col relative overflow-hidden">
            <div class="flex-1 map-bg relative overflow-hidden">
                <div class="absolute top-6 left-6 right-6 z-20 flex flex-col gap-2">
                    <div class="banner-minimal flex items-center gap-3">
                        <div class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
                        <p class="text-[11px] font-black text-gray-800 uppercase tracking-wide">Punto de origen</p>
                    </div>
                    
                    <div id="search-container" class="banner-minimal flex items-center gap-3">
                        <div class="w-2 h-2 bg-red-600 rounded-full shadow-[0_0_8px_rgba(220,38,38,0.6)]"></div>
                        <input type="text" id="destination-input" placeholder="¿A dónde vamos?" 
                            class="bg-transparent w-full outline-none font-black text-gray-900 text-sm placeholder:text-gray-400">
                    </div>
                </div>

                <div id="debt-alert" class="hidden absolute top-24 left-6 right-6 z-30 bg-red-600 text-white p-2 rounded-lg flex items-center justify-center gap-2 shadow-lg scale-90">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                    <p class="text-[9px] font-bold uppercase tracking-widest">Liquidación pendiente obligatoria</p>
                </div>

                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div id="map-marker" class="bg-red-600 p-3 rounded-2xl shadow-2xl border-2 border-white">
                        <i data-lucide="navigation" class="text-white w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 bg-white">
                <div class="wallet-card rounded-2xl p-4 flex items-center justify-between shadow-lg">
                    <div class="flex items-center gap-4">
                        <div class="bg-red-600/10 p-2 rounded-xl border border-red-600/20">
                            <i data-lucide="wallet" class="text-red-600 w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Saldo Disponible</p>
                            <h3 class="text-xl font-black text-white italic tracking-tighter" id="user-balance">$500.00</h3>
                        </div>
                    </div>
                    
                    <div class="flex flex-col items-end">
                        <div id="balance-indicator" class="w-2 h-2 rounded-full bg-green-500 mb-1"></div>
                        <p id="balance-status" class="text-[8px] font-bold text-gray-400 uppercase tracking-tighter">Estado: OK</p>
                    </div>
                </div>
            </div>
        </main>
        
        <nav class="px-6 py-4 border-t flex justify-around bg-white">
            <i data-lucide="home" class="text-red-600 w-5 h-5"></i>
            <i data-lucide="send" class="text-gray-300 w-5 h-5"></i>
            <i data-lucide="user" class="text-gray-300 w-5 h-5"></i>
        </nav>
    </div>
</div>

<script>
    lucide.createIcons();

    setTimeout(() => {
        document.getElementById('splash').classList.add('opacity-0');
        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }, 700);
    }, 2000);

    function validateLogin() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        if (email === 'admin@app.com' && pass === '123') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            updateBalance(500); // Salto inicial de prueba
            lucide.createIcons();
        } else { alert("Acceso denegado"); }
    }

    function updateBalance(newAmount) {
        const balanceElement = document.getElementById('user-balance');
        const statusElement = document.getElementById('balance-status');
        const indicator = document.getElementById('balance-indicator');
        const searchInput = document.getElementById('destination-input');
        const searchContainer = document.getElementById('search-container');
        const debtAlert = document.getElementById('debt-alert');

        const formatted = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(newAmount);
        balanceElement.innerText = formatted;

        if (newAmount < 0) {
            balanceElement.classList.replace('text-white', 'text-red-500');
            statusElement.innerText = "Estado: Deuda";
            indicator.className = "w-2 h-2 rounded-full bg-red-600 animate-pulse";
            searchInput.disabled = true;
            searchContainer.classList.add('blocked');
            debtAlert.classList.remove('hidden');
        } else {
            balanceElement.classList.replace('text-red-500', 'text-white');
            statusElement.innerText = "Estado: OK";
            indicator.className = "w-2 h-2 rounded-full bg-green-500";
            searchInput.disabled = false;
            searchContainer.classList.remove('blocked');
            debtAlert.classList.add('hidden');
        }
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
        lucide.createIcons();
    }

    function logout() { location.reload(); }
</script>
</body>
</html>
