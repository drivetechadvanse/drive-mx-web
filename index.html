<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive MX | Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: 100dvh; }
        #app-container { height: 100dvh; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .accordion-content.expanded { max-height: 500px; }
        .reg-input { width: 100%; padding: 1rem; background-color: #f9fafb; border-radius: 0.75rem; border: 2px solid transparent; outline: none; font-size: 0.75rem; font-weight: 700; }
        .reg-input:focus { border-color: #ef4444; background-color: #fff; }
        .reg-label { font-size: 9px; font-weight: 900; color: #9ca3af; text-transform: uppercase; margin-bottom: 0.4rem; display: block; margin-left: 0.5rem; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <div id="splash" class="absolute inset-0 z-[250] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center animate-pulse"><i data-lucide="navigation" class="text-white w-8 h-8"></i></div>
        <h1 class="text-2xl font-black mt-6 italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-[150] bg-white p-8 flex flex-col items-center justify-center text-center">
        <div class="w-12 h-12 bg-red-600 rounded-xl mb-6 flex items-center justify-center shadow-lg shadow-red-600/20">
            <i data-lucide="navigation" class="text-white w-6 h-6"></i>
        </div>
        <h2 class="text-3xl font-black italic uppercase mb-12 tracking-tighter">BIENVENIDO</h2>
        <div class="space-y-4 w-full">
            <input type="email" id="login-email" placeholder="Usuario" class="reg-input text-left">
            <input type="password" id="login-pass" placeholder="Contraseña" class="reg-input text-left">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic shadow-lg">Ingresar</button>
            
            <p onclick="startPassengerRegistration()" class="mt-4 text-[10px] font-black text-gray-400 uppercase italic cursor-pointer hover:text-red-600 transition-colors">
                ¿No tienes cuenta? <span class="text-red-600 underline">Quiero crear una cuenta</span>
            </p>
        </div>
    </div>

    <div id="passenger-reg-view" class="hidden absolute inset-0 z-[200] bg-white flex flex-col">
        <header class="px-4 py-4 flex items-center border-b bg-white">
            <button onclick="closePassengerReg()" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
            <h2 class="ml-3 text-lg font-black italic uppercase tracking-tighter">REGISTRO <span class="text-red-600">PASAJERO</span></h2>
        </header>
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="flex flex-col items-center">
                <div class="relative">
                    <div class="w-32 h-32 rounded-full border-4 border-gray-100 bg-gray-50 flex items-center justify-center overflow-hidden">
                        <i id="p-photo-icon" data-lucide="user" class="w-10 h-10 text-gray-300"></i>
                        <img id="p-photo-preview" class="hidden w-full h-full object-cover">
                    </div>
                    <button onclick="document.getElementById('p-photo-input').click()" class="absolute bottom-0 right-0 bg-red-600 p-2.5 rounded-full text-white border-4 border-white shadow-lg">
                        <i data-lucide="camera" class="w-4 h-4"></i>
                    </button>
                    <input type="file" id="p-photo-input" accept="image/*" class="hidden" onchange="previewPassengerPhoto(this)">
                </div>
                <p class="text-[9px] font-black text-gray-400 uppercase mt-3">Foto de Perfil</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="reg-label">Nombre Completo</label>
                    <input type="text" id="p-reg-name" class="reg-input" placeholder="Nombre">
                </div>
                <div>
                    <label class="reg-label">Correo Electrónico</label>
                    <input type="email" id="p-reg-email" class="reg-input" placeholder="correo@ejemplo.com">
                </div>
            </div>
            <button onclick="savePassengerRequest()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic shadow-xl">Confirmar Registro</button>
        </div>
    </div>

    <div id="admin-view" class="hidden h-full flex flex-col bg-gray-100">
        <header class="px-4 py-3 flex items-center justify-between bg-gray-900 text-white shrink-0">
            <h2 class="text-base font-black italic uppercase">PANEL <span class="text-red-600">ADMIN</span></h2>
            <button onclick="location.reload()" class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center"><i data-lucide="log-out" class="w-4 h-4 text-white"></i></button>
        </header>

        <main class="flex-1 p-5 space-y-6 overflow-y-auto">
            <div>
                <h3 class="text-[10px] font-black text-gray-400 uppercase italic mb-3">Pasajeros Registrados</h3>
                <div id="admin-passengers-container" class="space-y-3">
                    </div>
            </div>

            <div>
                <h3 class="text-[10px] font-black text-gray-400 uppercase italic mb-3">Solicitudes de Conductor</h3>
                <div id="admin-requests-container" class="space-y-3">
                    </div>
            </div>
        </main>
    </div>

</div>

<script>
    lucide.createIcons();

    // Estado independiente para Pasajeros
    let passengerState = {
        requests: JSON.parse(localStorage.getItem('passenger_requests') || '[]')
    };

    // Splash Logic
    setTimeout(() => {
        document.getElementById('splash').style.opacity = '0';
        setTimeout(() => { 
            document.getElementById('splash').style.display = 'none'; 
            document.getElementById('login-screen').classList.remove('hidden'); 
        }, 500);
    }, 1500);

    // Navegación Registro Pasajero
    function startPassengerRegistration() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('passenger-reg-view').classList.remove('hidden');
    }

    function closePassengerReg() {
        document.getElementById('passenger-reg-view').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }

    // Previsualización de Foto
    function previewPassengerPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('p-photo-preview').src = e.target.result;
                document.getElementById('p-photo-preview').classList.remove('hidden');
                document.getElementById('p-photo-icon').classList.add('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Función de Guardado Independiente para Pasajeros
    function savePassengerRequest() {
        const name = document.getElementById('p-reg-name').value;
        const email = document.getElementById('p-reg-email').value;

        if(!name || !email) return alert("Completa todos los campos");

        const newPassenger = {
            id: Date.now(),
            name: name,
            email: email,
            photo: document.getElementById('p-photo-preview').src,
            status: 'activo',
            date: new Date().toLocaleDateString()
        };

        passengerState.requests.push(newPassenger);
        localStorage.setItem('passenger_requests', JSON.stringify(passengerState.requests));
        
        alert("¡Cuenta de pasajero creada con éxito!");
        location.reload();
    }

    // Renderizado en Panel de Control (Sección Pasajeros)
    function renderAdminData() {
        const pContainer = document.getElementById('admin-passengers-container');
        const passengers = JSON.parse(localStorage.getItem('passenger_requests') || '[]');
        
        if(passengers.length === 0) {
            pContainer.innerHTML = '<p class="text-[9px] text-gray-400 text-center uppercase font-bold py-4">No hay pasajeros registrados</p>';
        } else {
            pContainer.innerHTML = passengers.map(p => `
                <div class="bg-white p-3 rounded-2xl border border-gray-200 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img src="${p.photo}" class="w-10 h-10 rounded-full object-cover border border-gray-100">
                        <div>
                            <h4 class="text-[10px] font-black uppercase italic">${p.name}</h4>
                            <p class="text-[8px] font-bold text-gray-400 uppercase">${p.email}</p>
                        </div>
                    </div>
                    <span class="text-[7px] font-black px-2 py-1 bg-green-100 text-green-600 rounded-full uppercase">Activo</span>
                </div>
            `).join('');
        }
    }

    function handleAuth() {
        const mail = document.getElementById('login-email').value.toLowerCase();
        document.getElementById('login-screen').classList.add('hidden');
        
        if(mail.includes('admin')){
            document.getElementById('admin-view').classList.remove('hidden');
            renderAdminData();
        } else {
            // Aquí iría la vista de pasajero normal
            alert("Sesión iniciada como usuario");
            location.reload();
        }
    }
</script>
</body>
</html>
