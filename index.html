<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Flujo Conectado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }
        
        #driver-registration-modal { transition: all 0.4s ease; opacity: 0; pointer-events: none; transform: translateY(20px); }
        #driver-registration-modal.active { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-content.expanded { max-height: 300px; }
        .chevron-rotate { transition: transform 0.3s ease; }
        .chevron-rotate.active { transform: rotate(180deg); }
        
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; }
        .radar-pulse { position: absolute; width: 80px; height: 80px; background: rgba(239, 68, 68, 0.2); border-radius: 100%; animation: radar 2s infinite; }
        @keyframes radar { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3"><i data-lucide="navigation" class="w-6 h-6 text-white"></i></div>
            <h2 class="text-lg font-black italic uppercase italic leading-tight">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="side-role" class="text-[7px] text-gray-500 font-bold uppercase italic tracking-widest">Sistema de Gestión</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <div id="nav-admin" class="hidden">
                <button onclick="toggleAccordion('admin-acc', 'admin-chev')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="shield" class="text-red-600 w-4 h-4"></i><span>Gestión</span></div>
                    <i data-lucide="chevron-down" id="admin-chev" class="w-3 h-3 chevron-rotate"></i>
                </button>
                <div id="admin-acc" class="accordion-content bg-gray-50/50 rounded-xl ml-2">
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-400 uppercase italic hover:text-red-600 transition-colors">Solicitudes Conductor</button>
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-400 uppercase italic hover:text-red-600 transition-colors">Conductores Activos</button>
                </div>
            </div>
            <div id="nav-passenger" class="hidden">
                <button onclick="toggleAccordion('pass-acc', 'pass-chev')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="user" class="text-red-600 w-4 h-4"></i><span>Pasajeros</span></div>
                    <i data-lucide="chevron-down" id="pass-chev" class="w-3 h-3 chevron-rotate"></i>
                </button>
                <div id="pass-acc" class="accordion-content bg-gray-50/50 rounded-xl ml-2">
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 italic">Mi Perfil</button>
                    <button onclick="openDriverRegistration()" class="w-full text-left p-2.5 pl-9 text-[9px] font-black text-red-600 uppercase hover:bg-red-50 italic border-t border-gray-100 mt-1">Quiero ser Conductor</button>
                </div>
            </div>
        </nav>
        <div class="p-4 border-t"><button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Salir</button></div>
    </div>

    <div id="login-screen" class="absolute inset-0 z-[150] bg-white p-8 flex flex-col justify-center">
        <h2 class="text-2xl font-black italic uppercase mb-6 leading-none">ACCESO<br><span class="text-red-600">DRIVE MX</span></h2>
        <div class="space-y-3">
            <input type="email" id="login-email" placeholder="Usuario" class="w-full p-4 bg-gray-50 border-b border-gray-100 rounded-xl outline-none focus:border-red-600 text-xs font-bold">
            <input type="password" id="login-pass" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border-b border-gray-100 rounded-xl outline-none focus:border-red-600 text-xs font-bold">
            <p class="text-[8px] text-gray-400 italic font-bold">Prueba con: admin@drive.mx o user@drive.mx</p>
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Ingresar</button>
        </div>
    </div>

    <div id="driver-registration-modal" class="absolute inset-0 z-[180] bg-white p-6 flex flex-col overflow-y-auto">
        <header class="flex items-center justify-between mb-8">
            <h2 class="text-xl font-black italic uppercase italic">REGISTRO <span class="text-red-600">CONDUCTOR</span></h2>
            <button onclick="closeDriverRegistration()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
        </header>
        <form id="driverForm" onsubmit="saveDriver(event)" class="space-y-4">
            <div class="space-y-1"><label class="text-[7px] font-black uppercase text-gray-400 ml-2 italic">Nombre Completo</label>
            <input type="text" id="d-name" required class="w-full p-3 bg-gray-50 rounded-xl border-b border-transparent focus:border-red-600 outline-none text-[10px] font-bold uppercase"></div>
            
            <div class="space-y-1"><label class="text-[7px] font-black uppercase text-gray-400 ml-2 italic">Teléfono</label>
            <input type="tel" id="d-phone" required class="w-full p-3 bg-gray-50 rounded-xl border-b border-transparent focus:border-red-600 outline-none text-[10px] font-bold"></div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1"><label class="text-[7px] font-black uppercase text-gray-400 ml-2 italic">Modelo Auto</label>
                <input type="text" id="d-car" required class="w-full p-3 bg-gray-50 rounded-xl border-b border-transparent focus:border-red-600 outline-none text-[10px] font-bold uppercase"></div>
                <div class="space-y-1"><label class="text-[7px] font-black uppercase text-gray-400 ml-2 italic">Placas</label>
                <input type="text" id="d-plate" required class="w-full p-3 bg-gray-50 rounded-xl border-b border-transparent focus:border-red-600 outline-none text-[10px] font-bold uppercase"></div>
            </div>
            
            <button type="submit" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[10px] uppercase italic shadow-xl shadow-red-100 mt-6 transition-transform active:scale-95">Enviar para Revisión</button>
        </form>
    </div>

    <div id="admin-view" class="hidden h-screen flex flex-col bg-gray-50">
        <header class="px-4 py-3 bg-gray-900 text-white flex justify-between items-center z-10 shadow-lg">
            <button onclick="openMenu()"><i data-lucide="menu" class="text-red-600 w-5 h-5"></i></button>
            <h2 class="font-black italic uppercase text-sm">PANEL <span class="text-red-600">ADMIN</span></h2>
            <div class="w-5 h-5 bg-red-600 rounded flex items-center justify-center"><i data-lucide="shield" class="w-3 h-3 text-white"></i></div>
        </header>
        <main class="flex-1 p-5 overflow-y-auto space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div><p class="text-[7px] font-bold text-gray-400 uppercase italic">Solicitudes Pendientes</p><h4 id="pending-count" class="text-xl font-black italic">0</h4></div>
                <div class="p-2 bg-red-50 rounded-lg text-red-600"><i data-lucide="file-text" class="w-5 h-5"></i></div>
            </div>

            <div class="space-y-2">
                <p class="text-[8px] font-black uppercase text-gray-400 ml-1 italic">Lista de espera</p>
                <div id="drivers-list" class="space-y-2">
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 text-[10px] text-gray-400 italic text-center">No hay solicitudes pendientes</div>
                </div>
            </div>
        </main>
    </div>

    <div id="passenger-view" class="hidden h-screen flex flex-col relative">
        <header class="px-4 py-3 bg-white border-b flex justify-between items-center z-10">
            <button onclick="openMenu()"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="font-black italic uppercase text-lg">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center border"><i data-lucide="user" class="w-4 h-4 text-gray-400"></i></div>
        </header>
        <main class="flex-1 map-sim relative overflow-hidden">
            <div id="p-banners" class="absolute top-4 left-4 right-4 z-20 space-y-2">
                <div class="bg-white/90 backdrop-blur p-2 rounded-xl shadow border flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_5px_#22c55e]"></div>
                    <p class="text-[8px] font-black text-gray-800 uppercase italic">Mapa: <span class="text-gray-400 italic">Zona Atenco Activa</span></p>
                </div>
                <div onclick="openCosts()" class="bg-white p-1 rounded-xl shadow-xl flex items-center gap-2 border border-black/5 hover:border-red-100 transition-all cursor-pointer">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="map-pin" class="w-5 h-5"></i></div>
                    <span class="text-[10px] font-black text-gray-400 italic uppercase">¿A dónde te llevamos?</span>
                </div>
            </div>

            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="radar" class="hidden"><div class="radar-pulse"></div></div>
                <div class="bg-red-600 p-4 rounded-2xl border-4 border-white shadow-2xl relative z-10"><i data-lucide="navigation" class="text-white w-6 h-6"></i></div>
            </div>

            <div id="p-wallet" class="absolute bottom-4 left-4 right-4"><div class="bg-gray-900 rounded-2xl p-4 text-white flex justify-between items-center shadow-2xl"><div class="flex items-center gap-2"><div class="w-8 h-8 bg-red-600/20 rounded flex items-center justify-center"><i data-lucide="wallet" class="w-4 h-4 text-red-600"></i></div><div><p class="text-[6px] font-bold uppercase italic text-gray-500">Cartera</p><p class="text-xs font-black italic">$50.00 MXN</p></div></div></div></div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-8 space-y-4">
            <h3 class="text-lg font-black italic uppercase italic">Confirmar <span class="text-red-600">Viaje</span></h3>
            <button onclick="startRadar()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[10px] uppercase italic tracking-widest shadow-lg shadow-red-100">SOLICITAR AHORA</button>
        </div>
    </div>

</div>

<script>
    lucide.createIcons();
    
    // --- ESTADO GLOBAL (SOLICITUDES COMPARTIDAS) ---
    let driversDB = [];

    // --- LÓGICA DE REGISTRO (PASAJERO) ---
    function openDriverRegistration() {
        closeAll();
        document.getElementById('driver-registration-modal').classList.add('active');
    }

    function closeDriverRegistration() {
        document.getElementById('driver-registration-modal').classList.remove('active');
    }

    function saveDriver(e) {
        e.preventDefault();
        const request = {
            id: Date.now(),
            nombre: document.getElementById('d-name').value,
            telefono: document.getElementById('d-phone').value,
            vehiculo: document.getElementById('d-car').value,
            placas: document.getElementById('d-plate').value,
            fecha: new Date().toLocaleDateString()
        };
        
        driversDB.push(request);
        updateAdminView(); // Conectamos los datos con la vista admin
        
        alert("SOLICITUD ENVIADA EXITOSAMENTE. Un administrador revisará tus datos en el Panel de Control.");
        document.getElementById('driverForm').reset();
        closeDriverRegistration();
    }

    // --- LÓGICA DE PANEL (ADMIN) ---
    function updateAdminView() {
        const list = document.getElementById('drivers-list');
        const count = document.getElementById('pending-count');
        
        count.innerText = driversDB.length;
        
        if (driversDB.length === 0) {
            list.innerHTML = `<div class="bg-white p-4 rounded-2xl border border-gray-100 text-[10px] text-gray-400 italic text-center">No hay solicitudes pendientes</div>`;
            return;
        }

        list.innerHTML = driversDB.map(driver => `
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-2 relative">
                <div class="flex justify-between items-start">
                    <div>
                        <h5 class="text-[11px] font-black italic uppercase">${driver.nombre}</h5>
                        <p class="text-[8px] text-gray-400 font-bold uppercase italic">${driver.vehiculo} • ${driver.placas}</p>
                    </div>
                    <span class="text-[7px] bg-red-50 text-red-600 px-2 py-1 rounded-full font-black uppercase">Pendiente</span>
                </div>
                <div class="flex gap-2 mt-2">
                    <button class="flex-1 py-2 bg-gray-900 text-white text-[8px] font-black uppercase italic rounded-lg">Aprobar</button>
                    <button class="flex-1 py-2 bg-red-50 text-red-600 text-[8px] font-black uppercase italic rounded-lg">Rechazar</button>
                </div>
            </div>
        `).join('');
    }

    // --- SISTEMA BASE ---
    function handleAuth() {
        const email = document.getElementById('login-email').value;
        const login = document.getElementById('login-screen');
        if (email === 'admin@drive.mx') {
            login.style.display = 'none';
            document.getElementById('admin-view').classList.remove('hidden');
            document.getElementById('nav-admin').classList.remove('hidden');
            document.getElementById('side-role').innerText = 'ACCESO: ADMINISTRADOR';
            updateAdminView();
        } else if (email === 'user@drive.mx') {
            login.style.display = 'none';
            document.getElementById('passenger-view').classList.remove('hidden');
            document.getElementById('nav-passenger').classList.remove('hidden');
            document.getElementById('side-role').innerText = 'ACCESO: PASAJERO';
        }
    }

    function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function closeAll() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('cost-sheet').classList.remove('active'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }
    function openCosts() { document.getElementById('cost-sheet').classList.add('active'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function toggleAccordion(id, chevId) { document.getElementById(id).classList.toggle('expanded'); document.getElementById(chevId).classList.toggle('active'); }
    function startRadar() { closeAll(); document.getElementById('radar').classList.remove('hidden'); }
</script>
</body>
</html>
