<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Drive MX | Global System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --app-height: 100dvh; }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: var(--app-height); }
        #app-container { height: var(--app-height); }
        #splash { transition: opacity 0.5s ease; }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 30px 30px; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #submenu-usuarios { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        #submenu-usuarios.active { max-height: 500px; }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(110%); padding-bottom: env(safe-area-inset-bottom, 60px); max-height: 80vh; }
        #cost-sheet.active { transform: translateY(0); }
        
        .pulse-ring { border: 4px solid #ef4444; border-radius: 50%; height: 100px; width: 100px; position: absolute; animation: pulsate 1.8s ease-out infinite; opacity: 0; }
        @keyframes pulsate { 0% { transform: scale(0.1); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        
        .view-content { animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Scroll suave para los bloques del panel */
        .admin-scroll-section { scroll-behavior: smooth; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .expediente-block { scroll-snap-align: start; min-height: 100%; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    <div id="overlay" onclick="closeAllModals()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white z-[110] shadow-2xl flex flex-col text-gray-800">
        <div class="p-6 bg-gray-900 text-white">
            <h2 class="text-lg font-black italic uppercase italic">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="sidebar-user-role" class="text-[8px] text-gray-500 font-bold mt-1 uppercase tracking-widest">Panel de Control</p>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="sidebar-nav"></nav>
        <div class="p-6 border-t pb-12"> 
            <button onclick="location.reload()" class="w-full py-4 bg-red-50 text-red-600 rounded-2xl font-black text-[11px] uppercase italic">CERRAR SESIÓN</button>
        </div>
    </div>

    <div id="splash" class="absolute inset-0 z-[150] bg-white flex flex-col items-center justify-center">
        <div class="w-20 h-20 bg-red-600 rounded-[2rem] flex items-center justify-center animate-pulse"><i data-lucide="navigation" class="text-white w-10 h-10"></i></div>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-10 flex flex-col justify-center text-center">
        <h2 class="text-4xl font-black italic uppercase mb-10 italic">DRIVE <span class="text-red-600">MX</span></h2>
        <div class="space-y-4">
            <input type="email" id="email-input" placeholder="admin@app.com o usuario@app.com" class="w-full p-4 bg-gray-50 border rounded-2xl font-bold">
            <input type="password" id="pass-input" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border rounded-2xl font-bold">
            <button onclick="handleLogin()" class="w-full bg-red-600 text-white py-5 rounded-[2rem] font-black uppercase text-xs shadow-xl active:scale-95 transition-all italic">Ingresar</button>
        </div>
    </div>

    <div id="passenger-app" class="hidden h-full flex flex-col relative">
        <header id="p-header" class="p-4 flex items-center justify-between border-b bg-white z-10">
            <button onclick="toggleMenu()" class="p-2 bg-gray-50 rounded-xl"><i data-lucide="menu"></i></button>
            <h2 class="text-xl font-black italic uppercase text-red-600 tracking-tighter italic">DRIVE MX</h2>
            <div class="w-9 h-9 rounded-full border bg-gray-100 flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>
        </header>

        <main class="flex-1 relative map-sim overflow-hidden">
            <div id="p-ui-top" class="absolute top-4 left-4 right-4 z-20 space-y-3">
                <div class="bg-white p-3 rounded-2xl shadow-lg flex items-center gap-4 border-l-4 border-blue-500">
                    <div class="w-8 h-8 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600"><i data-lucide="map-pin" class="w-4 h-4"></i></div>
                    <div class="flex flex-col"><span class="text-[8px] font-black text-gray-400 uppercase italic">Recolección</span><span class="text-[10px] font-bold text-gray-800 tracking-tight">Tu ubicación actual...</span></div>
                </div>
                <div onclick="openCostSheet()" class="bg-white p-2 rounded-2xl shadow-2xl flex items-center gap-4 border-2 border-red-500/10 active:scale-95 cursor-pointer">
                    <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i data-lucide="search"></i></div>
                    <span class="text-sm font-black text-gray-400 uppercase italic tracking-tighter">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div id="searching-mode" class="hidden absolute inset-0 z-40 flex flex-col items-center justify-center pointer-events-none">
                <div class="relative flex items-center justify-center">
                    <div class="pulse-ring"></div>
                    <div class="w-12 h-12 bg-red-600 rounded-full border-4 border-white shadow-2xl flex items-center justify-center relative z-10">
                        <i data-lucide="map-pin" class="text-white w-6 h-6"></i>
                    </div>
                </div>
                <div class="mt-12 bg-black text-white px-8 py-3 rounded-full shadow-2xl animate-bounce">
                    <p class="text-[10px] font-black uppercase italic tracking-[0.2em]">Buscando Conductor</p>
                </div>
            </div>

            <div id="p-ui-bottom" class="absolute bottom-10 left-4 right-4 z-30">
                <div class="bg-black rounded-[2.5rem] p-5 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-red-600/20 rounded-xl flex items-center justify-center text-red-500"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div><p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mb-1 leading-none">Cartera</p><h3 class="text-lg font-black italic">$50.00</h3></div>
                    </div>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[3rem] shadow-[0_-20px_60px_rgba(0,0,0,0.25)] p-8">
            <div class="w-16 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-black italic uppercase mb-4 text-center">Drive <span class="text-red-600 italic">Basic</span></h3>
            <div class="p-4 rounded-3xl border-2 border-red-600 bg-red-50 flex justify-between items-center mb-6">
                <span class="font-bold text-xs uppercase italic">Precio Fijo</span>
                <span class="font-black text-xl italic">$45.00</span>
            </div>
            <div class="grid grid-cols-3 gap-3 mb-8">
                <button id="pay-spei" onclick="selectPayment('SPEI')" class="pay-opt p-4 border-2 rounded-2xl flex flex-col items-center gap-2 transition-all italic font-black text-[9px]"><i data-lucide="landmark"></i>SPEI</button>
                <button id="pay-cartera" onclick="selectPayment('Cartera')" class="pay-opt p-4 border-2 rounded-2xl flex flex-col items-center gap-2 transition-all italic font-black text-[9px]"><i data-lucide="wallet"></i>CARTERA</button>
                <button id="pay-efectivo" onclick="selectPayment('Efectivo')" class="pay-opt p-4 border-2 rounded-2xl flex flex-col items-center gap-2 transition-all italic font-black text-[9px]"><i data-lucide="banknote"></i>CASH</button>
            </div>
            <button onclick="processOrder()" class="w-full bg-red-600 text-white py-5 rounded-[2.5rem] font-black uppercase text-xs italic shadow-xl">SOLICITAR VIAJE</button>
        </div>
    </div>

    <div id="admin-app" class="hidden h-full flex flex-col bg-gray-50 text-gray-800">
        <header class="p-5 bg-gray-900 text-white flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="p-2 bg-white/10 rounded-xl"><i data-lucide="menu" class="text-red-600"></i></button>
                <h2 class="text-base font-black italic uppercase tracking-tighter">CONTROL <span class="text-red-600">PANEL</span></h2>
            </div>
        </header>
        <main id="admin-host" class="p-4 overflow-y-auto flex-1">
            <div class="h-full flex flex-col items-center justify-center opacity-30 text-gray-400">
                <i data-lucide="layout-dashboard" class="w-16 h-16 mb-4"></i>
                <p class="font-black uppercase italic text-[10px]">Gestión de Operaciones</p>
            </div>
        </main>
    </div>
</div>

<script>
    lucide.createIcons();
    let selectedMethod = null;
    let currentRegStep = 1;

    let conductoresBD = JSON.parse(localStorage.getItem('driveMX_conductores')) || [
        { 
            id: 1, nombre: "Fernando Garduño", tel: "5512345678", estado: "Aprobado", 
            foto: "https://i.pravatar.cc/150?u=fer", 
            datos: {
                "1. Foto Perfil": "OK", "2. CURP": "GARC900101HDF", "3. WhatsApp": "5512345678",
                "4. INE Frontal": "OK", "5. INE Reversa": "OK", "6. NSS": "1234567890",
                "7. Licencia": "OK", "8. Marca Auto": "Volkswagen", "9. Modelo": "Jetta 2022",
                "10. Color": "Rojo", "11. Tarjeta Circulación": "OK", "12. Póliza": "OK",
                "13. Placa": "MX-777", "14. Foto Matrícula": "OK"
            }
        }
    ];

    function updateStorage() { localStorage.setItem('driveMX_conductores', JSON.stringify(conductoresBD)); }

    function handleLogin() {
        const e = document.getElementById('email-input').value;
        document.getElementById('login-screen').classList.add('hidden');
        if (e === 'admin@app.com') {
            document.getElementById('admin-app').classList.remove('hidden');
            setupAdminSidebar();
        } else {
            document.getElementById('passenger-app').classList.remove('hidden');
            setupPassengerSidebar();
        }
    }

    function setupAdminSidebar() {
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = `
            <button onclick="location.reload()" class="w-full flex items-center gap-4 p-4 text-gray-900 font-black bg-gray-50 rounded-2xl uppercase text-[10px] italic mb-4 border"><i data-lucide="home" class="text-red-600 w-4 h-4"></i> INICIO</button>
            <button onclick="toggleSubmenu()" class="w-full flex items-center justify-between p-4 text-gray-800 font-black hover:bg-gray-50 rounded-2xl uppercase text-[10px] italic">
                <div class="flex items-center gap-4"><i data-lucide="users" class="text-red-600 w-4 h-4"></i> Usuarios</div>
                <i data-lucide="chevron-down" id="arrow-users"></i>
            </button>
            <div id="submenu-usuarios" class="pl-10 space-y-1 mt-1">
                <button onclick="loadListView('Conductores')" class="w-full text-left p-3 text-[9px] font-black text-gray-500 hover:text-red-600 uppercase italic">Conductores</button>
                <button onclick="loadListView('Pasajeros')" class="w-full text-left p-3 text-[9px] font-black text-gray-500 uppercase italic">Pasajeros</button>
                <button onclick="loadListView('Administradores')" class="w-full text-left p-3 text-[9px] font-black text-gray-500 hover:text-red-600 uppercase italic">Administradores</button>
            </div>`;
        lucide.createIcons();
    }

    function setupPassengerSidebar() {
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = `
            <button onclick="location.reload()" class="w-full flex items-center gap-4 p-4 text-gray-900 font-black bg-gray-50 rounded-2xl uppercase text-[10px] italic mb-2 border"><i data-lucide="home" class="text-red-600 w-4 h-4"></i> INICIO</button>
            <button onclick="openDriverRegistration()" class="w-full flex items-center gap-4 p-4 text-red-600 font-black bg-red-50 rounded-2xl uppercase text-[10px] italic mt-4"><i data-lucide="car" class="w-4 h-4"></i> Quiero ser Conductor</button>`;
        lucide.createIcons();
    }

    function loadListView(tipo) {
        closeAllModals();
        const host = document.getElementById('admin-host');
        let html = `<div class="view-content"><h3 class="text-xl font-black italic uppercase mb-6 italic">Sección <span class="text-red-600">${tipo}</span></h3><div class="grid gap-4">`;
        if(tipo === 'Conductores') {
            conductoresBD.forEach(c => {
                html += `
                    <div onclick="verExpediente(${c.id})" class="bg-white p-4 rounded-[2rem] shadow-sm border flex items-center gap-4 active:scale-95 transition-all cursor-pointer">
                        <img src="${c.foto}" class="w-14 h-14 rounded-2xl object-cover">
                        <div class="flex-1">
                            <div class="flex justify-between items-center"><h4 class="font-black text-[11px] uppercase italic">${c.nombre}</h4><span class="text-[7px] px-2 py-1 rounded-full font-black bg-orange-100 text-orange-700">${c.estado}</span></div>
                            <p class="text-[9px] font-bold text-gray-400 mt-1 uppercase italic italic tracking-tighter italic">Ver expediente de 3 bloques</p>
                        </div>
                    </div>`;
            });
        } else {
            html += `<div class="bg-white p-10 rounded-[2.5rem] border-2 border-dashed flex flex-col items-center justify-center text-gray-300 italic"><i data-lucide="folder-open"></i><p class="text-[9px] font-black uppercase">Sin registros</p></div>`;
        }
        host.innerHTML = html + `</div></div>`;
        lucide.createIcons();
    }

    // PANEL DE REGISTRO COMPLETO DIVIDIDO EN 3 BLOQUES
    function verExpediente(id) {
        const c = conductoresBD.find(x => x.id === id);
        const modal = `
            <div id="detalle-modal" class="absolute inset-0 z-[140] bg-white admin-scroll-section h-full">
                <div id="block-1" class="expediente-block h-full p-6 flex flex-col relative bg-gray-50">
                    <div class="absolute top-6 left-6 right-6 flex justify-between items-center z-20">
                        <button onclick="this.parentElement.parentElement.parentElement.remove()" class="p-2 bg-white rounded-full shadow-lg"><i data-lucide="x"></i></button>
                        <button onclick="document.getElementById('block-2').scrollIntoView({behavior:'smooth'})" class="p-4 bg-red-600/10 text-red-600 rounded-2xl shadow-xl flex items-center gap-2 font-black italic text-[9px] uppercase">
                            Bloque Siguiente <i data-lucide="arrow-down-circle"></i>
                        </button>
                    </div>
                    <div class="mt-20">
                        <h2 class="text-3xl font-black italic uppercase mb-2">Bloque <span class="text-red-600 italic">01</span></h2>
                        <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest italic mb-10 italic">Información Personal</p>
                        <div class="space-y-4">
                            ${renderItem(c, "1. Foto Perfil")}
                            ${renderItem(c, "2. CURP")}
                            ${renderItem(c, "3. WhatsApp")}
                            ${renderItem(c, "6. NSS")}
                        </div>
                    </div>
                </div>

                <div id="block-2" class="expediente-block h-full p-6 flex flex-col relative bg-white">
                    <div class="absolute top-6 right-6 z-20">
                        <button onclick="document.getElementById('block-3').scrollIntoView({behavior:'smooth'})" class="p-4 bg-red-600/10 text-red-600 rounded-2xl shadow-xl flex items-center gap-2 font-black italic text-[9px] uppercase">
                            Bloque Siguiente <i data-lucide="arrow-down-circle"></i>
                        </button>
                    </div>
                    <div class="mt-20">
                        <h2 class="text-3xl font-black italic uppercase mb-2 italic">Bloque <span class="text-red-600">02</span></h2>
                        <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-10 italic">Detalles del Vehículo</p>
                        <div class="space-y-4">
                            ${renderItem(c, "8. Marca Auto")}
                            ${renderItem(c, "9. Modelo")}
                            ${renderItem(c, "10. Color")}
                            ${renderItem(c, "13. Placa")}
                        </div>
                    </div>
                </div>

                <div id="block-3" class="expediente-block h-full p-6 flex flex-col relative bg-gray-50">
                    <div class="mt-20">
                        <h2 class="text-3xl font-black italic uppercase mb-2 italic tracking-tighter">Bloque <span class="text-red-600 italic">03</span></h2>
                        <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-10 italic italic tracking-tighter">Fotos y Archivos</p>
                        <div class="space-y-4">
                            ${renderItem(c, "4. INE Frontal")}
                            ${renderItem(c, "5. INE Reversa")}
                            ${renderItem(c, "7. Licencia")}
                            ${renderItem(c, "11. Tarjeta Circulación")}
                            ${renderItem(c, "12. Póliza")}
                            ${renderItem(c, "14. Foto Matrícula")}
                        </div>
                        <div class="mt-10 pb-12 flex gap-3">
                            <button onclick="cambiarEstado(${c.id}, 'Aprobado')" class="flex-1 bg-green-500 text-white py-5 rounded-[2rem] font-black text-[11px] uppercase shadow-xl italic italic tracking-tighter">Activar Conductor</button>
                        </div>
                    </div>
                </div>
            </div>`;
        document.getElementById('app-container').insertAdjacentHTML('beforeend', modal);
        lucide.createIcons();
    }

    function renderItem(c, key) {
        const value = c.datos[key];
        const isPhoto = key.includes("Foto") || key.includes("INE") || key.includes("Licencia") || key.includes("Tarjeta") || key.includes("Póliza");
        return `
            <div class="bg-white p-5 rounded-[2rem] shadow-sm border-2 border-gray-100 relative group overflow-hidden">
                <p class="text-[8px] font-black text-gray-300 uppercase italic mb-1 italic tracking-tighter">${key}</p>
                ${isPhoto ? 
                    `<div class="h-24 bg-gray-50 rounded-2xl flex items-center justify-center border-2 border-dashed border-gray-200">
                        <span class="text-[10px] font-black text-red-600 uppercase italic">Ver Documento Cargado</span>
                    </div>` : 
                    `<p class="text-sm font-black text-gray-800 uppercase italic italic tracking-tighter italic">${value}</p>`}
                <button onclick="eliminarDato(${c.id}, '${key}')" class="absolute top-4 right-4 bg-red-100 text-red-600 p-2 rounded-xl"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
            </div>`;
    }

    // ELIMINAR Y CAMBIAR ESTADO
    function eliminarDato(id, key) {
        if(confirm(`¿Eliminar ${key}?`)) {
            const idx = conductoresBD.findIndex(x => x.id === id);
            conductoresBD[idx].datos[key] = "PENDIENTE";
            updateStorage();
            alert("Información marcada como faltante.");
        }
    }

    function cambiarEstado(id, st) {
        const idx = conductoresBD.findIndex(x => x.id === id);
        conductoresBD[idx].estado = st;
        updateStorage();
        alert("¡Conductor activado globalmente!");
        document.getElementById('detalle-modal').remove();
        loadListView('Conductores');
    }

    // FUNCIONES PASAJERO
    function processOrder() {
        if(!selectedMethod) return alert("Selecciona método de pago");
        closeAllModals();
        document.getElementById('p-header').style.display = 'none';
        document.getElementById('p-ui-top').style.display = 'none';
        document.getElementById('p-ui-bottom').style.display = 'none';
        document.getElementById('searching-mode').classList.remove('hidden');
        setTimeout(() => { alert("¡Unidad en camino!"); location.reload(); }, 4000);
    }

    // REGISTRO DE 14 PASOS (Reloj de arena final)
    const regSteps = [
        { title: "Foto de Perfil", type: "special-photo", icon: "user-circle" },
        { title: "CURP", type: "text", placeholder: "Ingresa CURP", icon: "search" },
        { title: "WhatsApp", type: "tel", placeholder: "10 dígitos", icon: "message-circle" },
        { title: "INE Frontal", type: "file", icon: "image" },
        { title: "INE Reversa", type: "file", icon: "image" },
        { title: "Seguridad Social (NSS)", type: "text", icon: "shield-check" },
        { title: "Licencia de Manejo", type: "file", icon: "file-text" },
        { title: "Marca del Vehículo", type: "text", icon: "car" },
        { title: "Año y Modelo", type: "text", icon: "calendar" },
        { title: "Color del Vehículo", type: "text", icon: "palette" },
        { title: "Tarjeta de Circulación", type: "file", icon: "file-check" },
        { title: "Póliza de Seguro", type: "file", icon: "heart-handshake" },
        { title: "Placa del Vehículo", type: "text", icon: "hash" },
        { title: "Foto Matrícula", type: "file", icon: "camera" }
    ];

    function openDriverRegistration() { closeAllModals(); currentRegStep = 1; renderRegStep(); }
    function renderRegStep() {
        const step = regSteps[currentRegStep - 1];
        let inputField = step.type === "special-photo" ? 
            `<div class="grid grid-cols-1 gap-3 w-full px-4">
                <button onclick="nextRegStep()" class="flex items-center gap-4 p-5 bg-white border-2 rounded-3xl"><i data-lucide="camera" class="text-red-600"></i><span class="font-black text-xs uppercase italic">Cámara</span></button>
                <button onclick="nextRegStep()" class="flex items-center gap-4 p-5 bg-white border-2 rounded-3xl"><i data-lucide="image" class="text-gray-600"></i><span class="font-black text-xs uppercase italic">Galería</span></button>
            </div>` : 
            `<div class="px-4 w-full"><input type="${step.type}" class="w-full p-5 bg-white border-2 rounded-[2rem] font-bold text-center outline-none focus:border-red-600 italic"></div>`;

        const html = `
            <div id="driver-reg-modal" class="absolute inset-0 z-[130] bg-white p-8 flex flex-col view-content">
                <div class="flex justify-between items-center mb-10"><button onclick="this.parentElement.parentElement.remove()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x"></i></button><span class="text-[10px] font-black text-gray-400 uppercase italic">Paso ${currentRegStep}/14</span></div>
                <h2 class="text-3xl font-black italic uppercase mb-10 text-center italic italic tracking-tighter italic tracking-widest italic tracking-tight">Drive <span class="text-red-600">Conductor</span></h2>
                <div class="flex-1 flex flex-col items-center justify-center gap-6">
                    <div class="w-20 h-20 bg-red-600 rounded-3xl flex items-center justify-center text-white shadow-xl rotate-3"><i data-lucide="${step.icon}" class="w-8 h-8"></i></div>
                    <label class="font-black uppercase text-xs italic text-center tracking-widest leading-relaxed">${step.title}</label>
                    ${inputField}
                </div>
                ${step.type !== "special-photo" ? `<button onclick="nextRegStep()" class="w-full bg-red-600 text-white py-5 rounded-[2.5rem] font-black uppercase text-xs italic mt-6 shadow-xl active:scale-95 transition-all italic italic tracking-tighter">CONTINUAR</button>` : ""}
            </div>`;
        const ex = document.getElementById('driver-reg-modal'); if(ex) ex.remove();
        document.getElementById('app-container').insertAdjacentHTML('beforeend', html);
        lucide.createIcons();
    }

    function nextRegStep() {
        if(currentRegStep < regSteps.length) { currentRegStep++; renderRegStep(); } 
        else { showFinalWait(); }
    }

    function showFinalWait() {
        const finalHtml = `
            <div id="driver-reg-modal" class="absolute inset-0 z-[140] bg-white p-10 flex flex-col items-center justify-center text-center view-content">
                <div class="w-32 h-32 bg-red-50 rounded-full flex items-center justify-center mb-8 animate-bounce">
                    <i data-lucide="hourglass" class="w-16 h-16 text-red-600 animate-spin" style="animation-duration: 3s"></i>
                </div>
                <h3 class="text-2xl font-black italic uppercase mb-4 italic tracking-tighter">¡Registro <span class="text-red-600 text-3xl italic">Enviado!</span></h3>
                <p class="text-[10px] font-bold text-gray-500 uppercase leading-relaxed italic tracking-tighter">Te activaremos en <span class="text-red-600">menos de 24 horas</span> si todo sale bien. ¡Pronto serás parte de Drive MX!</p>
                <button onclick="location.reload()" class="mt-12 w-full bg-black text-white py-5 rounded-[2rem] font-black uppercase text-[10px] italic shadow-2xl">ENTENDIDO</button>
            </div>`;
        document.getElementById('driver-reg-modal').remove();
        document.getElementById('app-container').insertAdjacentHTML('beforeend', finalHtml);
        lucide.createIcons();
    }

    // UTILS
    function openCostSheet() { document.getElementById('cost-sheet').classList.add('active'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function selectPayment(m) { selectedMethod = m; document.querySelectorAll('.pay-opt').forEach(o => o.classList.remove('border-red-600', 'bg-red-50', 'text-red-600')); document.getElementById(`pay-${m.toLowerCase()}`).classList.add('border-red-600', 'bg-red-50', 'text-red-600'); }
    function toggleSubmenu() { document.getElementById('submenu-usuarios').classList.toggle('active'); }
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('opacity-100', 'pointer-events-auto'); }
    function closeAllModals() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('cost-sheet').classList.remove('active'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }

    setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(() => { document.getElementById('splash').style.display = 'none'; document.getElementById('login-screen').classList.remove('hidden'); }, 500); }, 1000);
</script>
</body>
</html>
