<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive México | Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: 100dvh; }
        #app-container { height: 100dvh; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); padding-bottom: env(safe-area-inset-bottom, 2rem); }
        #cost-sheet.active { transform: translateY(0); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .accordion-content.expanded { max-height: 500px; }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; flex-grow: 1; }
        .radar-pulse { position: absolute; width: 100px; height: 100px; background: rgba(239, 68, 68, 0.15); border-radius: 100%; animation: radar 2s infinite; }
        @keyframes radar { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .hidden-view { opacity: 0; transform: translateY(-20px); pointer-events: none; transition: all 0.4s ease; }
        @keyframes bounce-custom { 0%, 100% { transform: translateY(0) scaleY(1); } 40% { transform: translateY(-30px) scaleY(1.1); } 90% { transform: translateY(0) scaleY(0.9); } }
        .animate-bounce-custom { animation: bounce-custom 0.8s infinite; }
        .reg-input { width: 100%; padding: 1rem; background-color: #f9fafb; border-radius: 0.75rem; border: 2px solid transparent; outline: none; font-size: 0.75rem; font-weight: 700; }
        .reg-input:focus { border-color: #ef4444; background-color: #fff; }
        .reg-label { font-size: 9px; font-weight: 900; color: #9ca3af; text-transform: uppercase; margin-bottom: 0.4rem; display: block; margin-left: 0.5rem; }
        .payment-opt.selected { border-color: #ef4444; background-color: #fef2f2; color: #ef4444; }
        .card-selected { border-color: #ef4444 !important; background-color: #fef2f2 !important; ring: 2px; ring-color: #ef4444; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    <div id="splash" class="absolute inset-0 z-[250] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center animate-pulse"><i data-lucide="navigation" class="text-white w-8 h-8"></i></div>
        <h1 class="text-2xl font-black mt-6 italic uppercase">DRIVE <span class="text-red-600">MÉXICO</span></h1>
    </div>

    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3"><i data-lucide="cpu" class="w-6 h-6"></i></div>
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600 text-lg">MÉXICO</span></h2>
            <p id="side-role" class="text-[8px] text-gray-400 font-bold uppercase tracking-widest italic">Sesión activa</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <div id="nav-admin" class="hidden">
                <button onclick="toggleAccordion('admin-acc')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="users" class="text-red-600 w-4 h-4"></i><span>Gestión</span></div>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div id="admin-acc" class="accordion-content bg-gray-50/50 rounded-xl">
                    <button onclick="renderAdminDrivers()" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase border-b border-white">Conductores Activos</button>
                    <button onclick="renderAdminRequests()" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase border-b border-white">Solicitudes Nuevas</button>
                    <button onclick="renderAdminPassengers()" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase">Pasajeros</button>
                </div>
            </div>
            <div id="nav-passenger" class="hidden">
                <button onclick="applyToBeDriver()" class="w-full flex items-center gap-3 p-3 text-red-600 font-black hover:bg-red-50 rounded-xl uppercase text-[10px] italic">
                    <i data-lucide="car" class="w-4 h-4"></i><span>Quiero ser Conductor</span>
                </button>
            </div>
        </nav>
        <div class="p-4 border-t mb-4">
            <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button>
        </div>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-[150] bg-white p-8 flex flex-col items-center justify-center text-center">
        <div class="w-12 h-12 bg-red-600 rounded-xl mb-6 animate-bounce-custom shadow-lg shadow-red-600/20 flex items-center justify-center">
            <i data-lucide="navigation" class="text-white w-6 h-6"></i>
        </div>
        <h2 class="text-3xl font-black italic uppercase mb-12 leading-none tracking-tighter">BIENVENIDO</h2>
        <div class="space-y-4 w-full">
            <input type="text" id="login-email" placeholder="Usuario o Correo" class="reg-input text-left">
            <input type="password" id="login-pass" placeholder="Contraseña" class="reg-input text-left">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic shadow-lg active:scale-95 transition-all">Ingresar</button>
            <button onclick="startPassengerRegistration()" class="mt-4 text-[10px] font-black text-gray-400 uppercase italic">Quiero crear una cuenta</button>
        </div>
    </div>

    <div id="admin-view" class="hidden h-full flex flex-col bg-gray-100">
        <header class="px-4 py-3 flex items-center justify-between bg-gray-900 text-white shrink-0">
            <button onclick="openMenu()" class="p-1.5 bg-white/10 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-red-600"></i></button>
            <h2 class="text-base font-black italic uppercase">PANEL <span class="text-red-600">ADMIN</span></h2>
            <button onclick="location.reload()" class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center"><i data-lucide="log-out" class="w-4 h-4 text-white"></i></button>
        </header>
        <div class="w-full h-12 bg-gray-400 flex items-center px-4 shrink-0">
            <button onclick="eliminarSeleccionados()" class="bg-red-600 text-white px-3 py-1.5 rounded font-black text-[10px] uppercase italic flex items-center gap-2">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Eliminar Selección
            </button>
        </div>
        <main class="flex-1 p-5 overflow-y-auto">
            <h3 id="admin-list-title" class="text-[10px] font-black text-gray-400 uppercase italic mb-3 ml-1">Solicitudes</h3>
            <div id="admin-requests-container" class="space-y-3 pb-10"></div>
        </main>
    </div>

    <div id="passenger-view" class="hidden h-full flex flex-col relative">
        <header id="p-header" class="px-4 py-3 flex items-center justify-between border-b bg-white z-10 shrink-0">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center"><i data-lucide="user" class="text-white w-4 h-4"></i></div>
        </header>
        <main class="flex-1 map-sim relative overflow-hidden">
            <div id="p-banners" class="absolute top-4 left-4 right-4 z-20 space-y-3">
                <div onclick="openCosts()" class="bg-white p-3 rounded-xl shadow-2xl flex items-center gap-2 cursor-pointer border border-black/5">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-red-600/30"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase">¿A dónde vamos hoy?</span>
                </div>
            </div>
            <div id="radar" class="hidden absolute inset-0 flex items-center justify-center"><div class="radar-pulse"></div></div>
            <div id="p-wallet" class="absolute bottom-6 left-4 right-4 z-30">
                <div class="bg-gray-900 rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-600/20 rounded-xl flex items-center justify-center text-red-600"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div>
                            <p class="text-[8px] text-gray-500 font-black uppercase italic">Tu Cartera</p>
                            <h3 id="display-saldo" class="text-sm font-black italic">$0.00 MXN</h3>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-8 pt-6 space-y-5">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-2"></div>
            <button onclick="handleRequest()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[12px] uppercase italic">CONFIRMAR SOLICITUD</button>
        </div>
    </div>

    <div id="driver-selection-view" class="hidden absolute inset-0 z-[160] bg-gray-50 p-4 overflow-y-auto">
        <h2 class="text-center font-black italic uppercase text-sm mb-4">Conductores <span class="text-red-600">Disponibles</span></h2>
        <div id="driver-cards-container" class="space-y-4 pb-10"></div>
    </div>

    <div id="driver-registration-view" class="hidden absolute inset-0 z-[200] bg-white flex flex-col">
        <header class="px-4 py-4 flex items-center border-b sticky top-0 bg-white z-10">
            <button onclick="handleDriverBack()" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i></button>
            <h2 id="reg-main-title" class="ml-3 text-lg font-black italic uppercase">REGISTRO</h2>
        </header>
        <div class="flex-1 overflow-y-auto p-6 pb-12">
            <div id="step-photo" class="w-full flex flex-col items-center">
                <div class="relative mb-8 mt-6">
                    <div id="photo-preview-container" class="w-40 h-40 rounded-full border-4 border-gray-100 bg-gray-50 flex items-center justify-center overflow-hidden"><i id="placeholder-icon" data-lucide="user" class="w-12 h-12 text-gray-300"></i><img id="driver-photo-preview" class="hidden w-full h-full object-cover"></div>
                    <button onclick="document.getElementById('photo-input').click()" class="absolute bottom-1 right-1 bg-red-600 p-3 rounded-full text-white shadow-lg"><i data-lucide="camera" class="w-5 h-5"></i></button>
                    <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="processImage(this)">
                </div>
                <button id="btn-photo-next" disabled onclick="goToStep(2)" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-name" class="hidden w-full flex flex-col space-y-4">
                <label class="reg-label">Nombre Completo</label>
                <input type="text" id="dr-name" class="reg-input" placeholder="Ej: Juan Pérez" oninput="checkName(this)">
                <div id="fields-account">
                    <label class="reg-label">Usuario</label>
                    <input type="text" id="reg-user" class="reg-input mb-4" placeholder="Crea tu usuario">
                    <label class="reg-label">Contraseña</label>
                    <input type="password" id="reg-pass" class="reg-input mb-4" placeholder="••••••••">
                    <label class="reg-label">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="reg-input mb-4" placeholder="ejemplo@correo.com">
                </div>
                <button id="btn-name-next" disabled onclick="handleStepNameNext()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-ine-front" class="hidden w-full flex flex-col">
                <h3 class="text-center font-black text-[10px] text-gray-400 uppercase mb-4">INE Frontal</h3>
                <div class="w-full aspect-video bg-gray-50 rounded-2xl border-4 border-dashed flex items-center justify-center mb-6" onclick="document.getElementById('ine-f-input').click()"><img id="ine-f-preview" class="hidden w-full h-full object-cover"><i data-lucide="image" class="text-gray-300"></i></div>
                <input type="file" id="ine-f-input" accept="image/*" class="hidden" onchange="processFile(this, 'ine-f-preview', 'btn-ine-f-next')">
                <button id="btn-ine-f-next" disabled onclick="goToStep(4)" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-vehicle" class="hidden w-full flex flex-col space-y-3">
                <h3 class="text-center font-black text-[10px] text-gray-400 uppercase mb-4 italic">Datos del Vehículo</h3>
                <input type="text" id="v-brand" placeholder="Marca" class="reg-input">
                <input type="text" id="v-model" placeholder="Modelo" class="reg-input">
                <input type="text" id="v-plate" placeholder="Placa" class="reg-input uppercase" oninput="checkVehicle()">
                <button id="btn-v-next" disabled onclick="goToStep(8)" class="w-full mt-4 bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-phone" class="hidden w-full flex flex-col">
                <label class="reg-label">Número Telefónico</label>
                <input type="tel" id="dr-phone" class="reg-input mb-8" placeholder="55 0000 0000" oninput="checkPhone(this)">
                <button id="btn-phone-next" disabled onclick="handleStepPhoneNext()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[11px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-finish" class="hidden w-full flex flex-col items-center justify-center text-center py-10">
                <h2 class="text-xl font-black italic uppercase leading-none mb-4">REVISIÓN EN<br><span class="text-red-600">PROGRESO</span></h2>
                <button id="btn-final-save" onclick="saveFinalData()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[12px] uppercase italic shadow-xl">CONFIRMAR</button>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    let currentStep = 1;
    let registrationMode = 'passenger';
    let selectedIds = [];
    let currentUser = null;
    let currentAdminView = '';

    // --- Persistencia y Splash ---
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('login-screen').classList.remove('hidden');
            }, 500);
        }, 1000);
    };

    // --- Lógica de Registro (Tus Pasos) ---
    function goToStep(n) {
        const steps = ['step-photo', 'step-name', 'step-ine-front', 'step-vehicle', 'step-phone', 'step-finish'];
        steps.forEach(s => { if(document.getElementById(s)) document.getElementById(s).classList.add('hidden') });
        const targetStep = (n === 8) ? 'step-phone' : (n === 9) ? 'step-finish' : steps[n-1];
        document.getElementById(targetStep).classList.remove('hidden');
        currentStep = n;
        lucide.createIcons();
    }

    function saveFinalData() {
        const userId = "ID-" + Date.now();
        const commonData = {
            id: userId,
            name: document.getElementById('dr-name').value,
            usuario: document.getElementById('reg-user').value.toLowerCase(),
            pass: document.getElementById('reg-pass').value,
            correo: document.getElementById('reg-email').value.toLowerCase(),
            phone: document.getElementById('dr-phone').value,
            photo: document.getElementById('driver-photo-preview').src,
            date: new Date().toLocaleDateString()
        };

        if (registrationMode === 'passenger') {
            let db = JSON.parse(localStorage.getItem('db_usuarios_permanente') || '[]');
            db.push(commonData);
            localStorage.setItem('db_usuarios_permanente', JSON.stringify(db));
            alert('Cuenta de Pasajero guardada con éxito.');
        } else {
            commonData.vehicle = {
                brand: document.getElementById('v-brand').value,
                model: document.getElementById('v-model').value,
                plate: document.getElementById('v-plate').value
            };
            commonData.status = 'pendiente';
            let reqs = JSON.parse(localStorage.getItem('driver_requests') || '[]');
            reqs.push(commonData);
            localStorage.setItem('driver_requests', JSON.stringify(reqs));
            alert('Solicitud de Conductor enviada correctamente.');
        }
        location.reload();
    }

    // --- Admin y Gestión de Datos Permanentes ---
    function renderAdminDrivers() {
        currentAdminView = 'drivers';
        const data = JSON.parse(localStorage.getItem('db_conductores_activos') || '[]');
        document.getElementById('admin-list-title').innerText = "Conductores Activos";
        drawAdminList(data, 'bg-green-100 text-green-600', 'Activo');
    }

    function renderAdminRequests() {
        currentAdminView = 'requests';
        const data = JSON.parse(localStorage.getItem('driver_requests') || '[]');
        document.getElementById('admin-list-title').innerText = "Solicitudes Nuevas";
        drawAdminList(data, 'bg-yellow-100 text-yellow-600', 'Pendiente');
    }

    function renderAdminPassengers() {
        currentAdminView = 'passengers';
        const data = JSON.parse(localStorage.getItem('db_usuarios_permanente') || '[]');
        document.getElementById('admin-list-title').innerText = "Pasajeros Registrados";
        drawAdminList(data, 'bg-blue-100 text-blue-600', 'Usuario');
    }

    function drawAdminList(data, badgeClass, text) {
        const container = document.getElementById('admin-requests-container');
        container.innerHTML = data.length === 0 ? '<p class="text-center py-10 uppercase text-[10px]">Sin datos</p>' : '';
        data.forEach(item => {
            container.innerHTML += `
                <div id="card-${item.id}" onclick="toggleSelect('${item.id}')" class="bg-white p-4 rounded-2xl border flex justify-between items-center cursor-pointer transition-all">
                    <div>
                        <h4 class="text-[11px] font-black uppercase italic">${item.name}</h4>
                        <p class="text-[8px] text-gray-400 font-bold">${item.usuario} | ${item.phone}</p>
                    </div>
                    <div class="flex gap-2">
                        ${currentAdminView === 'requests' ? `<button onclick="activarConductor('${item.id}')" class="bg-red-600 text-white text-[8px] px-2 py-1 rounded-lg">Aceptar</button>` : ''}
                        <span class="text-[7px] font-black px-2 py-1 ${badgeClass} rounded-full uppercase">${text}</span>
                    </div>
                </div>`;
        });
    }

    function activarConductor(id) {
        let reqs = JSON.parse(localStorage.getItem('driver_requests') || '[]');
        let activos = JSON.parse(localStorage.getItem('db_conductores_activos') || '[]');
        const idx = reqs.findIndex(r => r.id === id);
        if (idx > -1) {
            let dr = reqs[idx];
            activos.push(dr);
            reqs.splice(idx, 1);
            localStorage.setItem('driver_requests', JSON.stringify(reqs));
            localStorage.setItem('db_conductores_activos', JSON.stringify(activos));
            alert('Conductor activado permanentemente.');
            renderAdminRequests();
        }
    }

    function eliminarSeleccionados() {
        if (selectedIds.length === 0) return;
        const key = (currentAdminView === 'drivers') ? 'db_conductores_activos' : 
                    (currentAdminView === 'requests') ? 'driver_requests' : 'db_usuarios_permanente';
        let db = JSON.parse(localStorage.getItem(key) || '[]');
        db = db.filter(i => !selectedIds.includes(i.id));
        localStorage.setItem(key, JSON.stringify(db));
        location.reload();
    }

    function toggleSelect(id) {
        const idx = selectedIds.indexOf(id);
        if (idx > -1) { 
            selectedIds.splice(idx, 1); 
            document.getElementById(`card-${id}`).classList.remove('card-selected');
        } else { 
            selectedIds.push(id); 
            document.getElementById(`card-${id}`).classList.add('card-selected');
        }
    }

    // --- Funciones Originales de UI y Validación ---
    function handleAuth() {
        const u = document.getElementById('login-email').value.trim().toLowerCase();
        const p = document.getElementById('login-pass').value.trim();
        if (u === 'admin' && p === 'admin123') {
            showView('admin-view');
            document.getElementById('nav-admin').classList.remove('hidden');
            renderAdminRequests();
        } else {
            const users = JSON.parse(localStorage.getItem('db_usuarios_permanente') || '[]');
            const found = users.find(x => (x.usuario === u || x.correo === u) && x.pass === p);
            if (found) {
                currentUser = found;
                showView('passenger-view');
                document.getElementById('nav-passenger').classList.remove('hidden');
            } else { alert('Acceso denegado'); }
        }
    }

    function showView(id) {
        ['login-screen', 'admin-view', 'passenger-view', 'driver-registration-view', 'driver-selection-view'].forEach(v => document.getElementById(v).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        closeAll();
        lucide.createIcons();
    }

    function processImage(i) { if (i.files[0]) { document.getElementById('driver-photo-preview').src = URL.createObjectURL(i.files[0]); document.getElementById('driver-photo-preview').classList.remove('hidden'); document.getElementById('placeholder-icon').classList.add('hidden'); document.getElementById('btn-photo-next').disabled = false; document.getElementById('btn-photo-next').classList.replace('bg-gray-300', 'bg-red-600'); } }
    function processFile(i, p, b) { if (i.files[0]) { document.getElementById(p).src = URL.createObjectURL(i.files[0]); document.getElementById(p).classList.remove('hidden'); document.getElementById(b).disabled = false; document.getElementById(b).classList.replace('bg-gray-300', 'bg-red-600'); } }
    function checkName(i) { const b = document.getElementById('btn-name-next'); if(i.value.length > 3) { b.disabled = false; b.classList.replace('bg-gray-300', 'bg-red-600'); } }
    function checkVehicle() { document.getElementById('btn-v-next').disabled = false; document.getElementById('btn-v-next').classList.replace('bg-gray-300', 'bg-red-600'); }
    function checkPhone(i) { const b = document.getElementById('btn-phone-next'); if(i.value.length >= 10) { b.disabled = false; b.classList.replace('bg-gray-300', 'bg-red-600'); } }
    function startPassengerRegistration() { registrationMode = 'passenger'; showView('driver-registration-view'); document.getElementById('reg-main-title').innerText = "REGISTRO USER"; goToStep(1); }
    function applyToBeDriver() { registrationMode = 'driver'; showView('driver-registration-view'); document.getElementById('reg-main-title').innerText = "REGISTRO DRIVER"; goToStep(1); }
    function handleStepNameNext() { if (registrationMode === 'passenger') goToStep(8); else goToStep(3); }
    function handleStepPhoneNext() { goToStep(9); }
    function handleDriverBack() { showView('login-screen'); }
    function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function closeAll() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('cost-sheet').classList.remove('active'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }
    function toggleAccordion(id) { document.getElementById(id).classList.toggle('expanded'); }
    function openCosts() { document.getElementById('cost-sheet').classList.add('active'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    
    function handleRequest() {
        document.getElementById('radar').classList.remove('hidden');
        setTimeout(() => {
            showView('driver-selection-view');
            renderAvailableDrivers();
        }, 2500);
    }

    function renderAvailableDrivers() {
        const container = document.getElementById('driver-cards-container');
        const drivers = JSON.parse(localStorage.getItem('db_conductores_activos') || '[]');
        container.innerHTML = drivers.length === 0 ? '<p class="text-center text-[10px] mt-20 uppercase font-bold">Buscando conductores...</p>' : '';
        drivers.forEach(dr => {
            container.innerHTML += `
                <div class="bg-white p-5 rounded-[2rem] border shadow-lg space-y-4">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-white font-black overflow-hidden"><img src="${dr.photo}" class="w-full h-full object-cover"></div>
                        <div class="flex-1">
                            <h4 class="font-black italic uppercase text-xs">${dr.name}</h4>
                            <p class="text-[9px] font-bold text-gray-400 uppercase">${dr.vehicle.brand} ${dr.vehicle.model}</p>
                        </div>
                    </div>
                    <button onclick="alert('Viaje Aceptado'); location.reload()" class="w-full bg-red-600 text-white py-3 rounded-2xl text-[10px] font-black uppercase">Aceptar Viaje</button>
                </div>`;
        });
    }
</script>
</body>
</html>
