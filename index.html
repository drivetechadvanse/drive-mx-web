<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive MX | Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; 
            background-color: #000; 
            height: 100dvh;
        }
        #app-container { height: 100dvh; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { 
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            transform: translateY(100%); 
            padding-bottom: env(safe-area-inset-bottom, 2rem);
        }
        #cost-sheet.active { transform: translateY(0); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .accordion-content.expanded { max-height: 500px; }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; flex-grow: 1; }
        .radar-pulse {
            position: absolute;
            width: 100px; height: 100px;
            background: rgba(239, 68, 68, 0.15); border-radius: 100%;
            animation: radar 2s infinite;
        }
        @keyframes radar { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .hidden-view { opacity: 0; transform: translateY(-20px); pointer-events: none; transition: all 0.4s ease; }
        @keyframes bounce-custom {
            0%, 100% { transform: translateY(0) scaleY(1); }
            40% { transform: translateY(-30px) scaleY(1.1); }
            90% { transform: translateY(0) scaleY(0.9); }
        }
        .animate-bounce-custom { animation: bounce-custom 0.8s infinite; }
        .reg-input { width: 100%; padding: 1rem; background-color: #f9fafb; border-radius: 0.75rem; border: 2px solid transparent; outline: none; font-size: 0.75rem; font-weight: 700; }
        .reg-input:focus { border-color: #ef4444; background-color: #fff; }
        .reg-label { font-size: 9px; font-weight: 900; color: #9ca3af; text-transform: uppercase; margin-bottom: 0.4rem; display: block; margin-left: 0.5rem; }
        .payment-opt.selected { border-color: #ef4444; background-color: #fef2f2; color: #ef4444; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <div id="splash" class="absolute inset-0 z-[250] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center animate-pulse"><i data-lucide="navigation" class="text-white w-8 h-8"></i></div>
        <h1 class="text-2xl font-black mt-6 italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3"><i data-lucide="cpu" class="w-6 h-6"></i></div>
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600 text-lg">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-400 font-bold uppercase tracking-widest italic">Sesión activa</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <div id="nav-admin" class="hidden">
                <button onclick="toggleAccordion('admin-acc')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="users" class="text-red-600 w-4 h-4"></i><span>Gestión de Usuarios</span></div>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div id="admin-acc" class="accordion-content bg-gray-50/50 rounded-xl">
                    <button onclick="renderAdminRequests()" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase border-b border-white">Conductores</button>
                    <button onclick="renderAdminPassengers()" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase border-b border-white">Pasajeros</button>
                </div>
                <button onclick="openAdminWallet()" class="w-full flex items-center gap-3 p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic mt-1">
                    <i data-lucide="wallet" class="text-red-600 w-4 h-4"></i><span>Cartera</span>
                </button>
            </div>
            </nav>
        <div class="p-4 border-t mb-4">
            <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button>
        </div>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-[150] bg-white p-8 flex flex-col items-center justify-center text-center">
        <div class="w-12 h-12 bg-red-600 rounded-xl mb-6 animate-bounce-custom flex items-center justify-center shadow-lg shadow-red-600/20">
            <i data-lucide="navigation" class="text-white w-6 h-6"></i>
        </div>
        <h2 class="text-3xl font-black italic uppercase mb-12 leading-none tracking-tighter">BIENVENIDO</h2>
        <div class="space-y-4 w-full">
            <input type="email" id="login-email" placeholder="Usuario" class="reg-input text-left">
            <input type="password" id="login-pass" placeholder="Contraseña" class="reg-input text-left">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic shadow-lg active:scale-95 transition-all">Ingresar</button>
            
            <button onclick="startPassengerRegistration()" class="mt-4 text-[10px] font-black text-gray-400 uppercase italic hover:text-red-600 transition-colors">
                Quiero crear una cuenta
            </button>
        </div>
    </div>

    <div id="admin-view" class="hidden h-full flex flex-col bg-gray-100">
        <header class="px-4 py-3 flex items-center justify-between bg-gray-900 text-white shrink-0">
            <button onclick="openMenu()" class="p-1.5 bg-white/10 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-red-600"></i></button>
            <h2 class="text-base font-black italic uppercase">PANEL <span class="text-red-600">ADMIN</span></h2>
            <button onclick="location.reload()" class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center"><i data-lucide="log-out" class="w-4 h-4 text-white"></i></button>
        </header>
        <main id="admin-content" class="flex-1 p-5 overflow-y-auto">
            <div id="admin-dashboard">
                <div class="bg-white p-6 rounded-2xl border border-gray-200 mb-4">
                    <p class="text-[8px] font-black text-gray-400 uppercase italic">Estado</p>
                    <h4 class="text-xl font-black italic text-gray-800 uppercase">Sistema Operativo</h4>
                </div>
                <h3 id="admin-list-title" class="text-[10px] font-black text-gray-400 uppercase italic mb-3 ml-1">Solicitudes</h3>
                <div id="admin-requests-container" class="space-y-3 pb-10"></div>
            </div>
            <div id="admin-wallet-section" class="hidden">
                <div class="bg-white p-5 rounded-2xl border border-gray-200 space-y-4">
                    <h2 id="admin-view-saldo" class="text-2xl font-black italic text-center">$0.00 MXN</h2>
                    <input type="number" id="admin-monto-input" class="reg-input" placeholder="Monto">
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="adminModificarSaldo('sumar')" class="bg-green-600 text-white py-3 rounded-xl font-black text-[10px] uppercase italic">Agregar</button>
                        <button onclick="adminModificarSaldo('restar')" class="bg-red-600 text-white py-3 rounded-xl font-black text-[10px] uppercase italic">Descontar</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="passenger-view" class="hidden h-full flex flex-col relative">
        <header class="px-4 py-3 flex items-center justify-between border-b bg-white shrink-0">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center"><i data-lucide="user" class="text-white w-4 h-4"></i></div>
        </header>
        <main class="flex-1 map-sim relative overflow-hidden flex flex-col">
            <div id="p-banners" class="absolute top-4 left-4 right-4 z-20">
                <div onclick="openCosts()" class="bg-white p-1 rounded-xl shadow-2xl flex items-center gap-2 cursor-pointer border border-black/5">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase">¿A dónde vamos hoy?</span>
                </div>
            </div>
            <div id="p-wallet" class="absolute bottom-6 left-4 right-4 z-30">
                <div class="bg-gray-900 rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-600/20 rounded-xl flex items-center justify-center text-red-600"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div>
                            <p class="text-[8px] text-gray-500 font-black uppercase italic">Tu Cartera</p>
                            <h3 id="display-saldo" class="text-sm font-black italic">$350.00 MXN</h3>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-8 pt-6">
            <h3 class="text-lg font-black italic uppercase text-center mb-5 tracking-tighter">FORMA DE <span class="text-red-600">PAGO</span></h3>
            <div class="grid grid-cols-3 gap-3 mb-6">
                <button onclick="setPay(this, 'efectivo')" class="payment-opt selected p-4 rounded-2xl border flex flex-col items-center gap-2">
                    <i data-lucide="banknote" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase">Efectivo</span>
                </button>
                <button onclick="setPay(this, 'cartera')" class="payment-opt p-4 rounded-2xl border flex flex-col items-center gap-2">
                    <i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase">Cartera</span>
                </button>
            </div>
            <button id="btn-confirmar" onclick="handleRequest()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[12px] uppercase italic">CONFIRMAR SOLICITUD</button>
        </div>
    </div>

    <div id="driver-registration-view" class="hidden absolute inset-0 z-[200] bg-white flex flex-col">
        <header class="px-4 py-4 flex items-center border-b bg-white sticky top-0">
            <button onclick="handleDriverBack()" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i></button>
            <h2 id="reg-main-title" class="ml-3 text-lg font-black italic uppercase">REGISTRO</h2>
        </header>
        <div class="flex-1 overflow-y-auto p-6 pb-12">
            <div id="step-photo" class="w-full flex flex-col items-center">
                <div class="relative mb-8">
                    <div class="w-40 h-40 rounded-full border-4 border-gray-100 bg-gray-50 flex items-center justify-center overflow-hidden">
                        <img id="driver-photo-preview" class="hidden w-full h-full object-cover">
                        <i id="placeholder-icon" data-lucide="user" class="w-12 h-12 text-gray-300"></i>
                    </div>
                    <button onclick="document.getElementById('photo-input').click()" class="absolute bottom-1 right-1 bg-red-600 p-3 rounded-full text-white border-4 border-white"><i data-lucide="camera" class="w-5 h-5"></i></button>
                    <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="processImage(this)">
                </div>
                <button id="btn-photo-next" disabled onclick="goToStep(2)" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-name" class="hidden flex flex-col">
                <label class="reg-label">Nombre Completo</label>
                <input type="text" id="dr-name" class="reg-input mb-8" placeholder="Ej: Juan Pérez" oninput="checkName(this)">
                <button id="btn-name-next" disabled onclick="handleStepNameNext()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-ine-front" class="hidden flex flex-col">
                <h3 class="text-center font-black text-[10px] text-gray-400 uppercase mb-4 italic">INE Frontal</h3>
                <div class="w-full aspect-video bg-gray-50 rounded-2xl border-4 border-dashed border-gray-200 flex items-center justify-center mb-6 overflow-hidden" onclick="document.getElementById('ine-f-input').click()">
                    <img id="ine-f-preview" class="hidden w-full h-full object-cover">
                    <i data-lucide="image" class="text-gray-300 w-10 h-10"></i>
                </div>
                <input type="file" id="ine-f-input" accept="image/*" class="hidden" onchange="processFile(this, 'ine-f-preview', 'btn-ine-f-next')">
                <button id="btn-ine-f-next" disabled onclick="goToStep(4)" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-phone" class="hidden flex flex-col">
                <h3 class="text-center font-black text-[10px] text-gray-400 uppercase mb-4 italic">Número Telefónico</h3>
                <input type="tel" id="dr-phone" class="reg-input mb-8" placeholder="55 0000 0000" oninput="checkPhone(this)">
                <button id="btn-phone-next" disabled onclick="handleStepPhoneNext()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[11px] uppercase italic">Siguiente</button>
            </div>

            <div id="step-finish" class="hidden flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-gray-900 rounded-3xl flex items-center justify-center mb-6 shadow-xl"><i data-lucide="check" class="text-red-600 w-10 h-10"></i></div>
                <h2 id="finish-title" class="text-xl font-black italic uppercase leading-none mb-4">REVISIÓN EN PROGRESO</h2>
                <button id="btn-final-save" onclick="saveDriverRequest()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[12px] uppercase italic">CONFIRMAR</button>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    let currentStep = 1;
    let registrationMode = 'driver'; 
    let appState = { selectedPayment: 'efectivo', saldoUsuario: 350.00, precioViaje: 120.00 };

    // --- REGISTRO ---
    function startPassengerRegistration() {
        registrationMode = 'passenger';
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('driver-registration-view').classList.remove('hidden');
        document.getElementById('reg-main-title').innerHTML = 'REGISTRO <span class="text-red-600">USER</span>';
        goToStep(1);
    }

    function handleStepNameNext() {
        registrationMode === 'passenger' ? goToStep(4) : goToStep(3);
    }

    function handleStepPhoneNext() {
        const btn = document.getElementById('btn-final-save');
        if (registrationMode === 'passenger') {
            document.getElementById('finish-title').innerHTML = 'CUENTA<br><span class="text-red-600">LISTA</span>';
            btn.setAttribute('onclick', 'savePassengerRequest()');
        } else {
            document.getElementById('finish-title').innerHTML = 'REVISIÓN EN<br><span class="text-red-600">PROGRESO</span>';
            btn.setAttribute('onclick', 'saveDriverRequest()');
        }
        goToStep(5);
    }

    function savePassengerRequest() {
        const newReq = { id: Date.now(), name: document.getElementById('dr-name').value, phone: document.getElementById('dr-phone').value, status: 'activo', date: new Date().toLocaleDateString() };
        let reqs = JSON.parse(localStorage.getItem('passenger_requests') || '[]');
        reqs.push(newReq);
        localStorage.setItem('passenger_requests', JSON.stringify(reqs));
        alert('Cuenta de pasajero creada.'); location.reload();
    }

    function saveDriverRequest() {
        const newReq = { id: Date.now(), name: document.getElementById('dr-name').value, phone: document.getElementById('dr-phone').value, status: 'pendiente', date: new Date().toLocaleDateString() };
        let reqs = JSON.parse(localStorage.getItem('driver_requests') || '[]');
        reqs.push(newReq);
        localStorage.setItem('driver_requests', JSON.stringify(reqs));
        alert('Solicitud enviada a revisión.'); location.reload();
    }

    // --- ADMIN ---
    function renderAdminPassengers() {
        const container = document.getElementById('admin-requests-container');
        const reqs = JSON.parse(localStorage.getItem('passenger_requests') || '[]');
        document.getElementById('admin-list-title').innerText = "Pasajeros Registrados";
        container.innerHTML = reqs.length ? '' : '<div class="text-center py-10 uppercase text-[10px] font-bold text-gray-400">Sin Pasajeros</div>';
        reqs.forEach(r => container.innerHTML += `<div class="bg-white p-4 rounded-2xl border flex justify-between"><div><h4 class="text-[11px] font-black uppercase italic">${r.name}</h4><p class="text-[8px] font-bold text-gray-400">TEL: ${r.phone}</p></div><span class="text-[7px] font-black px-2 py-1 bg-green-100 text-green-600 rounded-full h-fit uppercase">Activo</span></div>`);
    }

    function renderAdminRequests() {
        const container = document.getElementById('admin-requests-container');
        const reqs = JSON.parse(localStorage.getItem('driver_requests') || '[]');
        document.getElementById('admin-list-title').innerText = "Solicitudes de Conductor";
        container.innerHTML = reqs.length ? '' : '<div class="text-center py-10 uppercase text-[10px] font-bold text-gray-400">Sin Solicitudes</div>';
        reqs.forEach(r => container.innerHTML += `<div class="bg-white p-4 rounded-2xl border flex justify-between"><div><h4 class="text-[11px] font-black uppercase italic">${r.name}</h4><p class="text-[8px] font-bold text-gray-400">TEL: ${r.phone}</p></div><span class="text-[7px] font-black px-2 py-1 bg-yellow-100 text-yellow-600 rounded-full h-fit uppercase">Pendiente</span></div>`);
    }

    // --- LOGICA GENERAL ---
    function handleAuth() {
        const mail = document.getElementById('login-email').value.toLowerCase();
        document.getElementById('login-screen').classList.add('hidden');
        if(mail.includes('admin')) {
            document.getElementById('admin-view').classList.remove('hidden');
            document.getElementById('nav-admin').classList.remove('hidden');
            renderAdminRequests();
        } else {
            document.getElementById('passenger-view').classList.remove('hidden');
        }
        lucide.createIcons();
    }

    function goToStep(n) {
        const steps = ['step-photo', 'step-name', 'step-ine-front', 'step-phone', 'step-finish'];
        steps.forEach(s => document.getElementById(s).classList.add('hidden'));
        document.getElementById(steps[n-1]).classList.remove('hidden');
        currentStep = n; lucide.createIcons();
    }

    function handleDriverBack() {
        if(currentStep > 1) { 
            (currentStep === 4 && registrationMode === 'passenger') ? goToStep(2) : goToStep(currentStep - 1); 
        } else { 
            document.getElementById('driver-registration-view').classList.add('hidden'); 
            document.getElementById('login-screen').classList.remove('hidden'); 
        }
    }

    function processImage(input) { if(input.files[0]) { document.getElementById('driver-photo-preview').src = URL.createObjectURL(input.files[0]); document.getElementById('driver-photo-preview').classList.remove('hidden'); document.getElementById('placeholder-icon').classList.add('hidden'); const b = document.getElementById('btn-photo-next'); b.disabled = false; b.classList.replace('bg-gray-300', 'bg-red-600'); } }
    function processFile(i, p, b) { if(i.files[0]) { document.getElementById(p).src = URL.createObjectURL(i.files[0]); document.getElementById(p).classList.remove('hidden'); const btn = document.getElementById(b); btn.disabled = false; btn.classList.replace('bg-gray-300', 'bg-red-600'); } }
    function checkName(i) { const b = document.getElementById('btn-name-next'); b.disabled = i.value.length < 3; b.classList.toggle('bg-red-600', i.value.length >= 3); b.classList.toggle('bg-gray-300', i.value.length < 3); }
    function checkPhone(i) { const b = document.getElementById('btn-phone-next'); b.disabled = i.value.length < 10; b.classList.toggle('bg-red-600', i.value.length >= 10); b.classList.toggle('bg-gray-300', i.value.length < 10); }

    function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function closeAll() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('cost-sheet').classList.remove('active'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }
    function toggleAccordion(id) { document.getElementById(id).classList.toggle('expanded'); }
    function openCosts() { document.getElementById('cost-sheet').classList.add('active'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function setPay(b, m) { document.querySelectorAll('.payment-opt').forEach(x => x.classList.remove('selected')); b.classList.add('selected'); appState.selectedPayment = m; }
    
    function openAdminWallet() { closeAll(); document.getElementById('admin-dashboard').classList.add('hidden'); document.getElementById('admin-wallet-section').classList.remove('hidden'); document.getElementById('admin-view-saldo').innerText = `$${appState.saldoUsuario.toFixed(2)} MXN`; }
    function adminModificarSaldo(t) { const v = parseFloat(document.getElementById('admin-monto-input').value); if(!isNaN(v)) { t === 'sumar' ? appState.saldoUsuario += v : appState.saldoUsuario -= v; document.getElementById('admin-view-saldo').innerText = `$${appState.saldoUsuario.toFixed(2)} MXN`; document.getElementById('display-saldo').innerText = `$${appState.saldoUsuario.toFixed(2)} MXN`; document.getElementById('admin-monto-input').value = ''; } }

    setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(() => { document.getElementById('splash').style.display = 'none'; document.getElementById('login-screen').classList.remove('hidden'); }, 500); }, 1200);
</script>
</body>
</html>
