<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Global Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; transition: all 0.5s ease; }
        
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }

        /* Animación de Ondas (Radar) */
        .ping-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 100%;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.3); opacity: 0.8; }
            80%, 100% { transform: scale(2.5); opacity: 0; }
        }

        .payment-card.selected { border: 1.5px solid #ef4444; background: #fef2f2; color: #ef4444; }
        .hidden-view { opacity: 0; pointer-events: none; transform: translateY(-20px); transition: all 0.4s ease; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="overlay" onclick="closeAllModals()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="passenger-app" class="h-screen flex flex-col relative">
        <header id="p-header" class="px-4 py-3 flex items-center justify-between border-b bg-white z-10 transition-all duration-500">
            <button onclick="toggleMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600 text-lg">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-100 border flex items-center justify-center"><i data-lucide="user" class="w-4 h-4 text-gray-400"></i></div>
        </header>

        <main class="flex-1 relative map-sim overflow-hidden">
            <div id="p-banners" class="absolute top-4 left-4 right-4 z-20 space-y-2 transition-all duration-500">
                <div class="bg-white/90 backdrop-blur p-2 rounded-xl shadow border flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_5px_#22c55e]"></div>
                    <p class="text-[9px] font-black text-gray-800 uppercase italic">Origen: <span class="text-gray-400">Ubicación detectada</span></p>
                </div>
                <div onclick="openCostSheet()" class="bg-white p-1 rounded-xl shadow-xl flex items-center gap-2 cursor-pointer border border-black/5">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="radar-container" class="hidden">
                    <div class="ping-ring"></div>
                    <div class="ping-ring" style="animation-delay: 0.5s"></div>
                </div>
                <div class="relative z-10">
                    <div class="bg-red-600 p-3 rounded-2xl shadow-2xl border-4 border-white">
                        <i data-lucide="navigation" class="text-white w-5 h-5"></i>
                    </div>
                    <div id="search-text" class="hidden absolute top-12 left-1/2 -translate-x-1/2 whitespace-nowrap">
                        <p class="bg-black text-white text-[9px] font-black uppercase tracking-[0.2em] px-3 py-1 rounded-full italic animate-pulse">Buscando Conductor</p>
                    </div>
                </div>
            </div>

            <div id="p-wallet" class="absolute bottom-4 left-4 right-4 transition-all duration-500">
                <div class="bg-black rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-600/10 rounded-lg flex items-center justify-center border border-red-600/30 text-red-600"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div><p class="text-[7px] text-gray-500 font-black uppercase italic">Saldo</p><h3 class="text-sm font-black italic">$50.00</h3></div>
                    </div>
                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-6 space-y-5">
            <div class="w-8 h-1 bg-gray-200 rounded-full mx-auto -mt-2 mb-2"></div>
            
            <h3 class="text-lg font-black italic uppercase tracking-tighter">COTIZACIÓN <span class="text-red-600 text-base">RÁPIDA</span></h3>
            
            <div class="space-y-2">
                <p class="text-[8px] font-black text-gray-400 uppercase tracking-widest italic">Método de Pago</p>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="selectPayment(this)" class="payment-card selected p-2 rounded-xl border flex flex-col items-center gap-1 transition-all">
                        <i data-lucide="banknote" class="w-4 h-4"></i>
                        <span class="text-[8px] font-black uppercase">Efectivo</span>
                    </button>
                    <button onclick="selectPayment(this)" class="payment-card p-2 rounded-xl border flex flex-col items-center gap-1 transition-all">
                        <i data-lucide="send" class="w-4 h-4"></i>
                        <span class="text-[8px] font-black uppercase">SPEI</span>
                    </button>
                    <button onclick="selectPayment(this)" class="payment-card p-2 rounded-xl border flex flex-col items-center gap-1 transition-all">
                        <i data-lucide="credit-card" class="w-4 h-4"></i>
                        <span class="text-[8px] font-black uppercase">Cartera</span>
                    </button>
                </div>
            </div>

            <div class="pt-2">
                <button onclick="startSearch()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[11px] shadow-lg shadow-red-600/20 uppercase tracking-widest italic flex items-center justify-center gap-2 active:scale-95 transition-all">
                    SOLICITAR AHORA
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    function openCostSheet() {
        document.getElementById('cost-sheet').classList.add('active');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeAllModals() {
        document.getElementById('cost-sheet').classList.remove('active');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }

    function selectPayment(btn) {
        document.querySelectorAll('.payment-card').forEach(c => c.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function startSearch() {
        // 1. Desaparecer elementos de la interfaz
        document.getElementById('cost-sheet').classList.remove('active');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
        
        document.getElementById('p-header').classList.add('hidden-view');
        document.getElementById('p-banners').classList.add('hidden-view');
        document.getElementById('p-wallet').classList.add('hidden-view');

        // 2. Activar Radar y Texto
        setTimeout(() => {
            document.getElementById('radar-container').classList.remove('hidden');
            document.getElementById('search-text').classList.remove('hidden');
        }, 500);

        // Simulación de respuesta (Opcional: Volver después de 5 seg)
        setTimeout(() => {
            // Aquí iría la lógica de "Conductor Encontrado"
        }, 5000);
    }
</script>
</body>
</html>
