<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Professional System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }

        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-content.expanded { max-height: 250px; }
        .chevron-rotate { transition: transform 0.3s ease; }
        .chevron-rotate.active { transform: rotate(180deg); }
        
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; }
        .radar-pulse {
            position: absolute; width: 100px; height: 100px;
            background: rgba(239, 68, 68, 0.15); border-radius: 100%;
            animation: radar 2s infinite;
        }
        @keyframes radar { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .payment-opt.selected { border: 1.5px solid #ef4444; background: #fef2f2; color: #ef4444; }
        .hidden-view { opacity: 0; transform: translateY(-20px); pointer-events: none; transition: all 0.4s ease; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <div id="splash" class="absolute inset-0 z-[200] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center shadow-2xl animate-pulse">
            <i data-lucide="navigation" class="text-white w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-black mt-6 tracking-tighter italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3"><i data-lucide="cpu" class="w-6 h-6"></i></div>
            <h2 class="text-lg font-black italic uppercase italic">DRIVE <span class="text-red-600 text-lg">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-500 font-bold uppercase italic tracking-widest">Iniciando...</p>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <div id="nav-admin" class="hidden">
                <button onclick="toggleAccordion('admin-acc', 'admin-chev')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="shield" class="text-red-600 w-4 h-4"></i><span>Usuarios</span></div>
                    <i data-lucide="chevron-down" id="admin-chev" class="w-3 h-3 chevron-rotate"></i>
                </button>
                <div id="admin-acc" class="accordion-content bg-gray-50/50 rounded-xl ml-2">
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 italic">Conductores</button>
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 italic">Pasajeros</button>
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 italic">Administradores</button>
                </div>
            </div>

            <div id="nav-passenger" class="hidden">
                <button onclick="toggleAccordion('pass-acc', 'pass-chev')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="user" class="text-red-600 w-4 h-4"></i><span>Pasajeros</span></div>
                    <i data-lucide="chevron-down" id="pass-chev" class="w-3 h-3 chevron-rotate"></i>
                </button>
                <div id="pass-acc" class="accordion-content bg-gray-50/50 rounded-xl ml-2">
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 italic">Mi Perfil</button>
                    <button onclick="applyToBeDriver()" class="w-full text-left p-2.5 pl-9 text-[9px] font-black text-red-600 uppercase hover:bg-red-50 transition-all italic border-t border-gray-100 mt-1">Quiero ser Conductor</button>
                </div>
            </div>
        </nav>

        <div class="p-4 border-t"><button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button></div>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-[150] bg-white p-8 flex flex-col justify-center">
        <h2 class="text-2xl font-black italic uppercase mb-6 leading-none tracking-tighter">ACCESO<br><span class="text-red-600">SISTEMA DRIVE MX</span></h2>
        <div class="space-y-3">
            <input type="email" id="login-email" placeholder="Usuario" class="w-full p-4 bg-gray-50 border-b border-gray-100 rounded-xl outline-none focus:border-red-600 text-xs font-bold">
            <input type="password" id="login-pass" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border-b border-gray-100 rounded-xl outline-none focus:border-red-600 text-xs font-bold">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[10px] uppercase italic shadow-lg shadow-red-600/20 active:scale-95 transition-all">Ingresar</button>
        </div>
    </div>

    <div id="admin-view" class="hidden h-screen flex flex-col bg-gray-50">
        <header class="px-4 py-3 flex items-center justify-between bg-gray-900 text-white z-10">
            <button onclick="openMenu()" class="p-1.5 bg-white/10 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-red-600"></i></button>
            <h2 class="text-base font-black italic uppercase italic">CONTROL <span class="text-red-600">CENTER</span></h2>
            <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center shadow-lg shadow-red-600/30"><i data-lucide="shield-check" class="w-4 h-4 text-white"></i></div>
        </header>
        <main class="flex-1 p-5 overflow-y-auto">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm"><p class="text-[7px] font-bold text-gray-400 uppercase mb-1 tracking-widest">Ingresos</p><h4 class="text-lg font-black italic">$0.00</h4></div>
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm"><p class="text-[7px] font-bold text-gray-400 uppercase mb-1 tracking-widest">Activos</p><h4 id="admin-active-count" class="text-lg font-black italic">0</h4></div>
            </div>
        </main>
    </div>

    <div id="passenger-view" class="hidden h-screen flex flex-col relative">
        <header id="p-header" class="px-4 py-3 flex items-center justify-between border-b bg-white z-10 transition-all">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase italic">DRIVE <span class="text-red-600 text-lg">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center shadow-lg"><i data-lucide="user" class="text-white w-4 h-4"></i></div>
        </header>
        
        <main class="flex-1 relative map-sim overflow-hidden">
            <div id="p-banners" class="absolute top-4 left-4 right-4 z-20 space-y-2 transition-all">
                <div class="bg-white/90 backdrop-blur p-2 rounded-xl shadow border flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_5px_#22c55e]"></div>
                    <p class="text-[9px] font-black text-gray-800 uppercase italic">Tu Ubicación: <span class="text-gray-400 tracking-tight">Estado de México</span></p>
                </div>
                <div onclick="openCosts()" class="bg-white p-1 rounded-xl shadow-xl flex items-center gap-2 cursor-pointer border border-black/5 hover:border-red-100 transition-all">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white shadow-lg"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase tracking-tighter">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="radar" class="hidden"><div class="radar-pulse"></div></div>
                <div class="text-center relative z-10">
                    <div class="bg-red-600 p-4 rounded-2xl shadow-2xl border-4 border-white mb-2 inline-block"><i data-lucide="navigation" class="text-white w-6 h-6"></i></div>
                    <div id="search-msg" class="hidden bg-black text-white text-[7px] font-black uppercase px-3 py-1.5 rounded-full italic animate-pulse tracking-widest">Buscando Conductor</div>
                </div>
            </div>

            <div id="p-wallet" class="absolute bottom-4 left-4 right-4 transition-all">
                <div class="bg-gray-900 rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-red-600/20 rounded-lg flex items-center justify-center text-red-600"><i data-lucide="wallet" class="w-4 h-4"></i></div>
                        <div><p class="text-[7px] text-gray-500 font-black uppercase tracking-tighter">Saldo Disponible</p><h3 class="text-sm font-black italic">$50.00</h3></div>
                    </div>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-6 space-y-4">
            <h3 class="text-lg font-black italic uppercase italic">FORMA DE <span class="text-red-600">PAGO</span></h3>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setPay(this)" class="payment-opt selected p-3 rounded-xl border flex flex-col items-center gap-1 transition-all"><i data-lucide="banknote" class="w-4 h-4"></i><span class="text-[8px] font-black uppercase italic">Efectivo</span></button>
                <button onclick="setPay(this)" class="payment-opt p-3 rounded-xl border flex flex-col items-center gap-1 transition-all"><i data-lucide="send" class="w-4 h-4"></i><span class="text-[8px] font-black uppercase italic">SPEI</span></button>
                <button onclick="setPay(this)" class="payment-opt p-3 rounded-xl border flex flex-col items-center gap-1 transition-all"><i data-lucide="credit-card" class="w-4 h-4"></i><span class="text-[8px] font-black uppercase italic">Cartera</span></button>
            </div>
            <button onclick="startRadar()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[10px] uppercase italic shadow-lg shadow-red-600/20">SOLICITAR AHORA</button>
        </div>
    </div>

    <div id="driver-form-view" class="hidden absolute inset-0 z-[160] bg-white flex flex-col">
        <header class="px-4 py-4 flex items-center border-b bg-white sticky top-0 z-10">
            <button onclick="closeDriverForm()" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                <i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i>
            </button>
            <h2 class="ml-3 text-lg font-black italic uppercase">Registro <span class="text-red-600">Conductor</span></h2>
        </header>
        
        <div class="flex-1 overflow-y-auto p-6 flex flex-col items-center">
            <div class="relative mb-8">
                <div id="photo-preview-container" class="w-32 h-32 rounded-full border-4 border-gray-100 bg-gray-50 flex items-center justify-center overflow-hidden shadow-inner">
                    <i id="placeholder-icon" data-lucide="user" class="w-12 h-12 text-gray-300"></i>
                    <img id="driver-photo-preview" class="hidden w-full h-full object-cover" src="">
                </div>
                <button onclick="document.getElementById('photo-input').click()" class="absolute bottom-0 right-0 bg-red-600 p-2.5 rounded-full text-white shadow-lg border-2 border-white active:scale-90 transition-transform">
                    <i data-lucide="camera" class="w-4 h-4"></i>
                </button>
                <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="processImage(this)">
            </div>

            <div id="photo-error" class="hidden text-[10px] font-bold text-red-600 uppercase mb-4 animate-bounce">La foto de perfil es obligatoria</div>

            <div class="w-full space-y-4">
                <div>
                    <label class="text-[9px] font-black uppercase text-gray-400 tracking-widest">Información Personal</label>
                    <input type="text" id="dr-name" placeholder="Nombre Completo" class="w-full mt-2 p-4 bg-gray-50 rounded-xl outline-none border-2 border-transparent focus:border-red-600 text-xs font-bold">
                    <input type="tel" id="dr-phone" placeholder="Teléfono de Contacto" class="w-full mt-2 p-4 bg-gray-50 rounded-xl outline-none border-2 border-transparent focus:border-red-600 text-xs font-bold">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase text-gray-400 tracking-widest">Datos del Vehículo</label>
                    <input type="text" id="dr-vehicle" placeholder="Modelo (Ej: Jetta / Dominar 400)" class="w-full mt-2 p-4 bg-gray-50 rounded-xl outline-none border-2 border-transparent focus:border-red-600 text-xs font-bold">
                    <input type="text" id="dr-plate" placeholder="Placas / Matrícula" class="w-full mt-2 p-4 bg-gray-50 rounded-xl outline-none border-2 border-transparent focus:border-red-600 text-xs font-bold">
                </div>
            </div>
            
            <button id="btn-submit-driver" disabled onclick="submitDriverRegistration()" class="w-full mt-8 bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic transition-all cursor-not-allowed">Finalizar Registro</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    
    let driveMxFleet = []; 
    let tempDriverData = { photo: null };

    // 1. Splash Screen
    setTimeout(() => {
        const splash = document.getElementById('splash');
        splash.style.opacity = '0';
        setTimeout(() => {
            splash.style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }, 500);
    }, 2000);

    // 2. Registro de Conductor Logic
    function applyToBeDriver() {
        closeAll();
        document.getElementById('driver-form-view').classList.remove('hidden');
    }

    function closeDriverForm() {
        document.getElementById('driver-form-view').classList.add('hidden');
    }

    function processImage(input) {
        const file = input.files[0];
        const errorMsg = document.getElementById('photo-error');
        const preview = document.getElementById('driver-photo-preview');
        const placeholder = document.getElementById('placeholder-icon');
        const submitBtn = document.getElementById('btn-submit-driver');

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                tempDriverData.photo = e.target.result;
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                errorMsg.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('bg-gray-300', 'cursor-not-allowed');
                submitBtn.classList.add('bg-red-600', 'shadow-lg', 'shadow-red-600/20');
            };
            reader.readAsDataURL(file);
        }
    }

    function submitDriverRegistration() {
        const name = document.getElementById('dr-name').value;
        const phone = document.getElementById('dr-phone').value;
        const vehicle = document.getElementById('dr-vehicle').value;
        const plate = document.getElementById('dr-plate').value;

        if (!tempDriverData.photo) {
            document.getElementById('photo-error').classList.remove('hidden');
            return;
        }

        if (name && vehicle && phone && plate) {
            const newDriver = {
                id: Date.now(),
                nombre: name,
                telefono: phone,
                vehiculo: vehicle,
                placas: plate,
                foto: tempDriverData.photo,
                estatus: 'Pendiente'
            };
            driveMxFleet.push(newDriver);
            updateAdminFleetUI();
            alert("¡Registro Exitoso! Tu perfil está en revisión.");
            resetDriverForm();
            closeDriverForm();
        } else {
            alert("Por favor completa todos los campos.");
        }
    }

    function resetDriverForm() {
        tempDriverData.photo = null;
        document.getElementById('dr-name').value = '';
        document.getElementById('dr-phone').value = '';
        document.getElementById('dr-vehicle').value = '';
        document.getElementById('dr-plate').value = '';
        const preview = document.getElementById('driver-photo-preview');
        const placeholder = document.getElementById('placeholder-icon');
        preview.classList.add('hidden');
        preview.src = '';
        placeholder.classList.remove('hidden');
        const submitBtn = document.getElementById('btn-submit-driver');
        submitBtn.disabled = true;
        submitBtn.classList.add('bg-gray-300', 'cursor-not-allowed');
        submitBtn.classList.remove('bg-red-600');
    }

    function updateAdminFleetUI() {
        const counter = document.getElementById('admin-active-count');
        if (counter) counter.innerText = driveMxFleet.length;
    }

    // 3. Autenticación
    function handleAuth() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;

        if (email === 'admin@drive.mx' && pass === '123') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-view').classList.remove('hidden');
            document.getElementById('side-role').innerText = 'ADMINISTRADOR';
            document.getElementById('nav-admin').classList.remove('hidden');
            document.getElementById('nav-passenger').classList.add('hidden');
        } else if (email === 'user@drive.mx' && pass === '123') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('passenger-view').classList.remove('hidden');
            document.getElementById('side-role').innerText = 'PASAJERO';
            document.getElementById('nav-passenger').classList.remove('hidden');
            document.getElementById('nav-admin').classList.add('hidden');
        } else {
            alert("Acceso denegado.");
        }
    }

    // 4. Navegación & UI
    function openMenu() {
        document.getElementById('sidebar').classList.add('open');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeAll() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('cost-sheet').classList.remove('active');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }

    function toggleAccordion(id, chevId) {
        document.getElementById(id).classList.toggle('expanded');
        document.getElementById(chevId).classList.toggle('active');
    }

    function openCosts() {
        document.getElementById('cost-sheet').classList.add('active');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function setPay(btn) {
        document.querySelectorAll('.payment-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function startRadar() {
        closeAll();
        document.getElementById('p-header').classList.add('hidden-view');
        document.getElementById('p-banners').classList.add('hidden-view');
        document.getElementById('p-wallet').classList.add('hidden-view');
        setTimeout(() => {
            document.getElementById('radar').classList.remove('hidden');
            document.getElementById('search-msg').classList.remove('hidden');
        }, 400);
    }
</script>
</body>
</html>
