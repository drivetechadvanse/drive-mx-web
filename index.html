<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .map-bg { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 0.8px, transparent 0.8px); background-size: 20px 20px; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-900">

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="splash" class="absolute inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-24 h-24 bg-red-600 rounded-[2rem] flex items-center justify-center shadow-2xl animate-bounce">
            <i data-lucide="navigation" class="text-white w-12 h-12"></i>
        </div>
        <h1 class="text-4xl font-black mt-6 tracking-tighter">DRIVE <span class="text-red-600">MX</span></h1>
        <div class="mt-4 flex flex-col items-center gap-2">
            <div class="w-12 h-1 bg-gray-100 rounded-full overflow-hidden">
                <div class="w-full h-full bg-red-600 origin-left animate-[shimmer_2s_infinite]"></div>
            </div>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em]">Cargando Sistema</p>
        </div>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <div class="mb-10 text-center">
            <h2 class="text-3xl font-black text-gray-900">Bienvenido</h2>
            <p class="text-gray-500 mt-2">Ingresa tus credenciales para continuar</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase ml-1">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@drivemx.com" 
                    class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-red-600 transition-all">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase ml-1">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" 
                    class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-red-600 transition-all">
            </div>
            
            <p id="login-error" class="hidden text-red-500 text-xs font-bold text-center italic">Credenciales incorrectas. Intenta de nuevo.</p>
            
            <button onclick="validateLogin()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-red-200 hover:bg-red-700 active:scale-95 transition-all">
                INGRESAR
            </button>
        </div>
        
        <p class="text-center text-gray-400 text-sm mt-8">¿No tienes cuenta? <span class="text-red-600 font-bold">Regístrate</span></p>
    </div>

    <div id="main-app" class="hidden h-screen flex flex-col">
        <header class="p-4 flex justify-between items-center border-b">
            <h2 class="text-xl font-black">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="flex gap-2">
                <button class="p-2 bg-gray-100 rounded-full"><i data-lucide="bell" class="w-5 h-5"></i></button>
                <button onclick="logout()" class="p-2 bg-red-50 text-red-600 rounded-full"><i data-lucide="log-out" class="w-5 h-5"></i></button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto">
            <div class="h-48 map-bg relative border-b">
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="bg-red-600 p-2 rounded-full shadow-xl animate-pulse">
                        <i data-lucide="navigation" class="text-white w-4 h-4"></i>
                    </div>
                </div>
            </div>

            <div class="p-6">
                <div class="bg-gray-900 rounded-[2rem] p-6 text-white mb-6 relative overflow-hidden">
                    <p class="text-xs opacity-60 uppercase font-bold">Saldo Cartera</p>
                    <h3 class="text-3xl font-black mt-1">$1,250.00 MXN</h3>
                    <i data-lucide="wallet" class="absolute right-[-10px] bottom-[-10px] w-24 h-24 opacity-10"></i>
                </div>

                <h4 class="font-black text-gray-400 text-xs uppercase mb-4">Servicios Rápidos</h4>
                <div class="grid grid-cols-2 gap-4">
                    <div class="border-2 border-red-600 bg-red-50 p-4 rounded-3xl">
                        <i data-lucide="car" class="text-red-600 mb-2"></i>
                        <p class="font-bold text-sm">Viaje Express</p>
                    </div>
                    <div class="border border-gray-100 p-4 rounded-3xl">
                        <i data-lucide="package" class="text-gray-400 mb-2"></i>
                        <p class="font-bold text-sm">Envío Drive</p>
                    </div>
                </div>
            </div>
        </main>

        <nav class="p-4 border-t flex justify-around bg-white">
            <i data-lucide="home" class="text-red-600"></i>
            <i data-lucide="map" class="text-gray-300"></i>
            <i data-lucide="user" class="text-gray-300"></i>
        </nav>
    </div>
</div>

<script>
    // Inicializar iconos
    lucide.createIcons();

    // 1. Manejo del Splash (Portada)
    setTimeout(() => {
        const splash = document.getElementById('splash');
        splash.classList.add('opacity-0');
        setTimeout(() => {
            splash.style.display = 'none';
            // Al terminar splash, mostramos el LOGIN
            document.getElementById('login-screen').classList.remove('hidden');
        }, 500);
    }, 3000);

    // 2. Validación de Filtro (Login)
    function validateLogin() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const errorMsg = document.getElementById('login-error');

        // Basado en tu código: admin@app.com / 123
        if (email === 'admin@app.com' && pass === '123') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            lucide.createIcons();
        } else {
            errorMsg.classList.remove('hidden');
            // Vibración visual de error
            document.getElementById('login-screen').classList.add('animate-shake');
            setTimeout(() => document.getElementById('login-screen').classList.remove('animate-shake'), 500);
        }
    }

    function logout() {
        location.reload(); // Reinicia la app al estado inicial
    }
</script>

<style>
    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }
    .animate-shake {
        animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }
</style>

</body>
</html>
