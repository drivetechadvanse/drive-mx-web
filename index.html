<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Sistema Integral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #f8f9fa; }
        
        #splash { transition: opacity 0.5s ease; }
        .view-content { animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 0.5px, transparent 0.5px); background-size: 20px 20px; }
        
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }

        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }

        .vehicle-card.selected { border: 1.5px solid #ef4444; background: #fff1f2; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="overlay" onclick="closeAllModals()" class="absolute inset-0 bg-black/40 z-[100] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3">
                <i data-lucide="cpu" id="sidebar-icon" class="text-white w-5 h-5"></i>
            </div>
            <h2 class="text-lg font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="sidebar-user-role" class="text-[8px] text-gray-500 font-bold mt-1 uppercase tracking-[0.2em] italic">Sistema Activo</p>
        </div>
        <nav class="flex-1 p-4 space-y-1" id="sidebar-nav"></nav>
        <div class="p-4 border-t">
            <button onclick="location.reload()" class="w-full flex items-center justify-center gap-2 py-3 bg-gray-50 text-gray-400 rounded-xl font-bold text-[10px] uppercase italic hover:text-red-600 transition-colors">
                <i data-lucide="power" class="w-3.5 h-3.5"></i> Cerrar Sesión
            </button>
        </div>
    </div>

    <div id="splash" class="absolute inset-0 z-[150] bg-white flex flex-col items-center justify-center">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center shadow-xl animate-pulse">
            <i data-lucide="navigation" class="text-white w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-black mt-4 tracking-tighter italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
        <p class="text-[7px] font-bold text-gray-400 tracking-[0.4em] mt-2 uppercase">Global Mobility System</p>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <h2 class="text-3xl font-black text-gray-900 italic tracking-tighter uppercase mb-8">LOGIN<br><span class="text-red-600 text-4xl">SISTEMA</span></h2>
        <div class="space-y-3">
            <input type="email" id="email-input" placeholder="Usuario" class="w-full p-3.5 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:border-red-600 font-medium text-sm">
            <input type="password" id="pass-input" placeholder="Contraseña" class="w-full p-3.5 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:border-red-600 font-medium text-sm">
            <button onclick="handleLogin()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-red-600/20 active:scale-95 transition-all mt-4">Entrar al Sistema</button>
        </div>
    </div>

    <div id="passenger-app" class="hidden h-screen flex flex-col">
        <header class="p-3 flex items-center justify-between border-b bg-white z-10">
            <button onclick="toggleMenu()" class="p-2 hover:bg-gray-50 rounded-lg transition-colors"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-lg font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 rounded-full border border-gray-100 bg-gray-50 overflow-hidden"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"></div>
        </header>

        <main class="flex-1 relative map-sim">
            <div class="absolute top-4 left-4 right-4 z-20 space-y-2">
                <div class="bg-white/80 backdrop-blur-md p-2.5 rounded-xl shadow-sm border border-white/20 flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                    <p class="text-[9px] font-bold text-gray-600 uppercase italic">Ubicación: <span class="text-gray-400 font-medium">Detectando...</span></p>
                </div>
                <div onclick="openCostSheet()" class="bg-white p-1 rounded-xl shadow-xl flex items-center gap-3 cursor-pointer border border-gray-100 hover:border-red-600/30 transition-all">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-xs font-bold text-gray-400 italic">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div class="absolute bottom-4 left-4 right-4">
                <div class="bg-gray-900 rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-white/5 rounded-lg flex items-center justify-center border border-white/10 text-red-500"><i data-lucide="wallet" class="w-4 h-4"></i></div>
                        <div><p class="text-[7px] text-gray-500 font-black uppercase tracking-tighter">Mi Saldo</p><h3 id="p-balance" class="text-base font-black italic">$0.00</h3></div>
                    </div>
                    <div id="p-status" class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_#22c55e]"></div>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2rem] shadow-2xl p-6 space-y-4">
            <div class="w-10 h-1 bg-gray-200 rounded-full mx-auto -mt-2 mb-2"></div>
            <h3 class="text-lg font-black italic uppercase tracking-tighter">Tipo de <span class="text-red-600">Servicio</span></h3>
            <div class="space-y-2">
                <div onclick="selectVehicle(this)" class="vehicle-card selected p-3 rounded-2xl flex items-center justify-between cursor-pointer transition-all">
                    <div class="flex items-center gap-3"><i data-lucide="car" class="w-5 h-5 text-gray-700"></i><span class="font-bold text-xs uppercase italic">Drive Basic</span></div>
                    <span class="font-black italic text-sm">$45.00</span>
                </div>
            </div>
            <button class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-[0.1em] italic shadow-lg shadow-red-600/20 active:scale-95 transition-all">Confirmar Viaje</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    // (Mantenemos la misma lógica de JavaScript del archivo original para no romper la funcionalidad)
    setTimeout(() => {
        const s = document.getElementById('splash');
        s.style.opacity = '0';
        setTimeout(() => {
            s.style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }, 500);
    }, 2500);

    function toggleMenu() {
        const side = document.getElementById('sidebar');
        const over = document.getElementById('overlay');
        side.classList.toggle('open');
        over.classList.toggle('opacity-100');
        over.classList.toggle('pointer-events-auto');
    }

    function closeAllModals() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('cost-sheet').classList.remove('active');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }

    function openCostSheet() {
        document.getElementById('cost-sheet').classList.add('active');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function handleLogin() {
        const e = document.getElementById('email-input').value;
        const p = document.getElementById('pass-input').value;
        if (e === 'admin@app.com' && p === '123') {
            setupUI("ADMINISTRADOR", "shield-check");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-app').classList.remove('hidden');
        } else if (e === 'juan@app.com' && p === '123') {
            setupUI("JUAN PASAJERO", "user");
            initPassenger(50);
        } else {
            alert("Credenciales incorrectas");
        }
    }

    function setupUI(role, icon) {
        document.getElementById('sidebar-user-role').innerText = role;
        document.getElementById('sidebar-icon').setAttribute('data-lucide', icon);
        const nav = document.getElementById('sidebar-nav');
        if(role === "ADMINISTRADOR") {
            nav.innerHTML = `<button class="w-full flex items-center gap-3 p-3 text-gray-700 font-bold hover:bg-gray-50 rounded-xl uppercase text-[10px] italic"><i data-lucide="users" class="text-red-600 w-4 h-4"></i> Usuarios</button>`;
        } else {
            nav.innerHTML = `<button class="w-full flex items-center gap-3 p-3 text-gray-700 font-bold hover:bg-gray-50 rounded-xl uppercase text-[10px] italic"><i data-lucide="history" class="w-4 h-4"></i> Historial</button>`;
        }
        lucide.createIcons();
    }

    function initPassenger(bal) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('passenger-app').classList.remove('hidden');
        document.getElementById('p-balance').innerText = `$${bal.toFixed(2)}`;
    }

    function selectVehicle(el) {
        document.querySelectorAll('.vehicle-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
    }
</script>
</body>
</html>
