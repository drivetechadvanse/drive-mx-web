<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Unified System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        /* Estilos Existentes Preservados */
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; transition: all 0.6s ease; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }

        /* NUEVOS ESTILOS PARA EL ACORDEÓN (AGREGADOS) */
        #user-accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        #user-accordion-content.expanded { max-height: 200px; }
        .chevron-rotate { transition: transform 0.3s ease; }
        .chevron-rotate.active { transform: rotate(180deg); }
        
        /* Radar (Sin cambios) */
        .radar-pulse {
            position: absolute; width: 100px; height: 100px;
            background: rgba(239, 68, 68, 0.15); border-radius: 100%;
            animation: radar 2s infinite;
        }
        @keyframes radar { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .payment-opt.selected { border: 1.5px solid #ef4444; background: #fef2f2; color: #ef4444; }
        .hidden-view { opacity: 0; transform: translateY(-20px); pointer-events: none; transition: all 0.4s ease; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3"><i data-lucide="cpu" class="w-6 h-6"></i></div>
            <h2 class="text-lg font-black italic uppercase italic">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-500 font-bold uppercase italic">Acceso Autorizado</p>
        </div>
        
        <nav class="flex-1 p-4 space-y-1">
            <div class="mb-2">
                <button onclick="toggleUserAccordion()" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic transition-all">
                    <div class="flex items-center gap-3">
                        <i data-lucide="users" class="w-4 h-4 text-red-600"></i>
                        <span>Usuarios</span>
                    </div>
                    <i data-lucide="chevron-down" id="user-chevron" class="w-3 h-3 chevron-rotate"></i>
                </button>
                
                <div id="user-accordion-content" class="bg-gray-50/50 rounded-xl ml-2">
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 transition-colors italic border-l border-gray-200 ml-4">Conductores</button>
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 transition-colors italic border-l border-gray-200 ml-4">Pasajeros</button>
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 transition-colors italic border-l border-gray-200 ml-4">Administradores</button>
                </div>
            </div>

            <button class="w-full flex items-center gap-3 p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                <i data-lucide="layout-dashboard" class="w-4 h-4 text-gray-400"></i>
                <span>Panel Principal</span>
            </button>
        </nav>

        <div class="p-4 border-t">
            <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Salir</button>
        </div>
    </div>

    <div id="login-screen" class="absolute inset-0 z-[150] bg-white p-8 flex flex-col justify-center">
        <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center mb-6 shadow-xl shadow-red-600/20"><i data-lucide="shield-check" class="text-white"></i></div>
        <h2 class="text-2xl font-black italic uppercase mb-6 leading-none">ACCESO AL SISTEMA<br><span class="text-red-600 text-lg">DRIVE MX</span></h2>
        <div class="space-y-3">
            <input type="email" id="login-email" placeholder="Usuario" class="w-full p-4 bg-gray-50 border-b border-gray-100 rounded-xl outline-none focus:border-red-600 text-[10px] font-bold uppercase tracking-widest">
            <input type="password" id="login-pass" placeholder="Password" class="w-full p-4 bg-gray-50 border-b border-gray-100 rounded-xl outline-none focus:border-red-600 text-[10px] font-bold tracking-widest">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[10px] uppercase italic shadow-lg active:scale-95 transition-all">Ingresar</button>
        </div>
    </div>

    <div id="admin-view" class="hidden h-screen flex flex-col bg-gray-50">
        <header class="px-4 py-3 flex items-center justify-between bg-gray-900 text-white z-10">
            <button onclick="openMenu()" class="p-1.5 bg-white/10 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-red-600"></i></button>
            <h2 class="text-base font-black italic uppercase italic">CONTROL <span class="text-red-600">CENTER</span></h2>
            <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center"><i data-lucide="shield" class="w-4 h-4"></i></div>
        </header>
        <main class="flex-1 p-5 overflow-y-auto">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-white p-4 rounded-2xl border border-gray-100"><p class="text-[7px] font-bold text-gray-400 uppercase mb-1">Ingresos</p><h4 class="text-lg font-black italic">$0.00</h4></div>
                <div class="bg-white p-4 rounded-2xl border border-gray-100"><p class="text-[7px] font-bold text-gray-400 uppercase mb-1">Activos</p><h4 class="text-lg font-black italic">0</h4></div>
            </div>
        </main>
    </div>

    <div id="passenger-view" class="hidden h-screen flex flex-col relative">
        <header id="p-header" class="px-4 py-3 flex items-center justify-between border-b bg-white z-10">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase italic">DRIVE <span class="text-red-600 text-lg">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-100 border"></div>
        </header>
        <main class="flex-1 relative map-sim overflow-hidden">
            <div id="p-banners" class="absolute top-4 left-4 right-4 z-20 space-y-2">
                <div class="bg-white/90 backdrop-blur p-2 rounded-xl shadow border flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                    <p class="text-[9px] font-black text-gray-800 uppercase italic">Tu Ubicación: <span class="text-gray-400">Estado de México</span></p>
                </div>
            </div>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="radar" class="hidden"><div class="radar-pulse"></div></div>
                <div class="text-center relative z-10">
                    <div class="bg-red-600 p-3 rounded-2xl shadow-2xl border-4 border-white mb-2 inline-block"><i data-lucide="navigation" class="text-white w-5 h-5"></i></div>
                    <div id="search-msg" class="hidden bg-black text-white text-[7px] font-black uppercase px-3 py-1.5 rounded-full italic animate-pulse">Buscando Conductor</div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    lucide.createIcons();

    // NUEVA FUNCIÓN: LÓGICA DEL ACORDEÓN (AGREGADA)
    function toggleUserAccordion() {
        const content = document.getElementById('user-accordion-content');
        const chevron = document.getElementById('user-chevron');
        content.classList.toggle('expanded');
        chevron.classList.toggle('active');
    }

    // Lógica de Autenticación (Preservada)
    function handleAuth() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;

        if (email === 'admin@drive.mx' && pass === '123') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-view').classList.remove('hidden');
            document.getElementById('side-role').innerText = 'ADMINISTRADOR';
        } else if (email === 'user@drive.mx' && pass === '123') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('passenger-view').classList.remove('hidden');
            document.getElementById('side-role').innerText = 'PASAJERO';
        } else {
            alert("Credenciales incorrectas");
        }
    }

    // Funciones Preservadas
    function openMenu() {
        document.getElementById('sidebar').classList.add('open');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeAll() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }
</script>
</body>
</html>
