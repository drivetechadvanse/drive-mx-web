<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Control Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        
        .map-bg { 
            background-color: #f3f4f6; 
            background-image: radial-gradient(#d1d5db 0.8px, transparent 0.8px); 
            background-size: 20px 20px; 
        }

        #sidebar { 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            transform: translateX(-100%); 
        }
        #sidebar.open { transform: translateX(0); }
        
        #overlay { transition: opacity 0.3s ease; opacity: 0; pointer-events: none; }
        #overlay.open { opacity: 1; pointer-events: auto; }

        .banner-minimal { background: transparent; border: none; }
        .wallet-card {
            background: linear-gradient(135deg, #111827 0%, #000000 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Estilo para el Panel de Admin Flotante */
        .admin-modal {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gray-900">

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="splash" class="absolute inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-24 h-24 bg-red-600 rounded-[2rem] flex items-center justify-center shadow-2xl animate-bounce">
            <i data-lucide="navigation" class="text-white w-12 h-12"></i>
        </div>
        <h1 class="text-4xl font-black mt-6 tracking-tighter italic">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <h2 class="text-4xl font-black text-gray-900 leading-none mb-10 italic">INICIAR<br><span class="text-red-600">SESIÓN</span></h2>
        <div class="space-y-4">
            <input type="email" id="login-email" placeholder="Correo" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-red-600">
            <input type="password" id="login-pass" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-red-600">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg">ENTRAR</button>
            <p class="text-center text-[10px] text-gray-400 font-bold uppercase tracking-widest">Drive MX Business & Passenger</p>
        </div>
    </div>

    <div id="main-app" class="hidden h-screen flex flex-col">
        <header class="p-4 flex items-center justify-between border-b bg-white z-10">
            <div class="flex items-center gap-4">
                <div class="p-2 bg-gray-100 rounded-xl"><i data-lucide="menu" class="w-6 h-6"></i></div>
                <h2 class="text-2xl font-black italic tracking-tighter">DRIVE <span class="text-red-600">MX</span></h2>
            </div>
            <div id="admin-badge" class="hidden bg-red-600 text-white text-[8px] px-2 py-1 rounded-full font-black uppercase tracking-tighter">Admin Mode</div>
        </header>

        <main class="flex-1 flex flex-col relative overflow-hidden">
            <div class="flex-1 map-bg relative">
                <div class="absolute top-6 left-6 right-6 z-20 flex flex-col gap-2">
                    <div class="banner-minimal flex items-center gap-3">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <p class="text-[11px] font-black text-gray-800 uppercase">Mi ubicación</p>
                    </div>
                    <div class="banner-minimal flex items-center gap-3">
                        <div class="w-2 h-2 bg-red-600 rounded-full"></div>
                        <input type="text" id="dest-input" placeholder="¿A dónde vamos?" class="bg-transparent w-full outline-none font-black text-gray-900 text-sm">
                    </div>
                </div>

                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div id="map-pin" class="bg-red-600 p-3 rounded-2xl shadow-2xl border-2 border-white"><i data-lucide="navigation" class="text-white w-5 h-5"></i></div>
                </div>
            </div>

            <div class="px-6 py-4 bg-white">
                <div class="wallet-card rounded-2xl p-4 flex items-center justify-between shadow-lg" id="wallet-container">
                    <div class="flex items-center gap-4">
                        <div class="bg-red-600/10 p-2 rounded-xl"><i data-lucide="wallet" class="text-red-600 w-5 h-5"></i></div>
                        <div>
                            <p class="text-[9px] text-gray-500 font-bold uppercase">Saldo Disponible</p>
                            <h3 class="text-xl font-black text-white italic" id="current-balance">$500.00</h3>
                        </div>
                    </div>
                    <button onclick="openAdminTools()" id="btn-admin-tools" class="hidden bg-white/10 p-2 rounded-lg text-white"><i data-lucide="settings" class="w-4 h-4"></i></button>
                </div>
            </div>
        </main>

        <div id="admin-panel" class="hidden absolute inset-0 z-[60] admin-modal p-6 flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black italic">PANEL <span class="text-red-600">MX</span></h2>
                <button onclick="closeAdminTools()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <div class="space-y-4 flex-1 overflow-y-auto">
                <p class="text-xs font-black text-gray-400 uppercase">Gestión de Usuarios</p>
                <div class="p-4 border rounded-3xl flex justify-between items-center bg-white">
                    <div>
                        <p class="font-black text-sm">Juan Pasajero</p>
                        <p class="text-[10px] text-gray-400">ID: #8821</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" id="new-val" class="w-16 border rounded-lg p-1 text-xs font-bold" placeholder="$">
                        <button onclick="updateBalanceFromPanel()" class="bg-red-600 text-white p-2 rounded-lg"><i data-lucide="check" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <nav class="px-6 py-4 border-t flex justify-around bg-white">
            <i data-lucide="home" class="text-red-600 w-5 h-5"></i>
            <i data-lucide="send" class="text-gray-300 w-5 h-5"></i>
            <i data-lucide="user" class="text-gray-300 w-5 h-5"></i>
        </nav>
    </div>
</div>

<script>
    lucide.createIcons();

    setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('login-screen').classList.remove('hidden');
    }, 2000);

    function handleAuth() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;

        if (email === 'admin@app.com' && pass === '123') {
            // ENTRA COMO ADMIN
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('admin-badge').classList.remove('hidden');
            document.getElementById('btn-admin-tools').classList.remove('hidden');
        } else if (email === 'user@app.com' && pass === '123') {
            // ENTRA COMO PASAJERO
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
        } else {
            alert("Usuario no reconocido");
        }
        lucide.createIcons();
    }

    function openAdminTools() { document.getElementById('admin-panel').classList.remove('hidden'); lucide.createIcons(); }
    function closeAdminTools() { document.getElementById('admin-panel').classList.add('hidden'); }

    function updateBalanceFromPanel() {
        const val = document.getElementById('new-val').value;
        const balanceDisplay = document.getElementById('current-balance');
        const input = document.getElementById('dest-input');
        
        balanceDisplay.innerText = "$" + val + ".00";
        
        if(val < 0) {
            balanceDisplay.style.color = "#ef4444";
            input.disabled = true;
            input.placeholder = "SALDO DEUDOR - BLOQUEADO";
        } else {
            balanceDisplay.style.color = "white";
            input.disabled = false;
            input.placeholder = "¿A dónde vamos?";
        }
        closeAdminTools();
    }
</script>
</body>
</html>
