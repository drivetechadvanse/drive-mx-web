<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useReducer, createContext, useContext } = React;
        
        // Importación manual de iconos Lucide para este entorno
        const Icon = ({ name, className }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // --- LÓGICA DEL SISTEMA (Basada en tu código) [cite: 5, 8, 30] ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const generatePin = () => Math.floor(1000 + Math.random() * 9000).toString();

        const initialData = {
            users: [
                { id: 'admin1', role: 'admin', name: 'Super Admin', email: 'admin@app.com', password: '123', status: 'active', balance: 0 },
                { id: 'p1', role: 'passenger', name: 'Juan Pasajero', email: 'juan@app.com', password: '123', status: 'active', balance: 50 },
                { id: 'd1', role: 'driver', name: 'Carlos Conductor', email: 'carlos@app.com', password: '123', status: 'available', balance: 200, vehicle: 'Toyota Yaris 2022' },
            ],
            services: [
                { id: 's1', name: 'Auto Básico', type: 'ride', baseRate: 20, kmRate: 10, minRate: 2, image: 'car', active: true, commission: 0.20 },
                { id: 's2', name: 'Auto VIP', type: 'ride', baseRate: 50, kmRate: 15, minRate: 3, image: 'car', active: true, commission: 0.25 },
            ],
            trips: [],
            transactions: [],
            notifications: [{ id: 'n1', target: 'all', title: '¡Bienvenido a Drive MX!', message: 'Gracias por formar parte de nuestra comunidad.', date: new Date() }],
            supportTickets: [],
            settings: {
                walletLegend: "Recuerda mantener saldo positivo en tu cartera para poder solicitar servicios.",
                whatsappLink: "https://wa.me/521234567890",
                referralActive: true
            }
        };

        const appReducer = (state, action) => {
            switch (action.type) {
                case 'LOGIN':
                    const user = state.users.find(u => u.email === action.payload.email && u.password === action.payload.password);
                    return { ...state, currentUser: user || null, loginError: !user };
                case 'LOGOUT':
                    return { ...state, currentUser: null };
                case 'REQUEST_TRIP':
                    const newTrip = { ...action.payload, id: generateId(), status: 'searching', pin: generatePin(), createdAt: new Date() };
                    return { ...state, trips: [...state.trips, newTrip] };
                // ... el resto de tus casos del reducer se mantienen igual [cite: 12-29]
                default: return state;
            }
        };

        const AppContext = createContext();

        // --- COMPONENTES UI [cite: 30-33] ---
        const Button = ({ children, onClick, variant = 'primary', className = '' }) => {
            const variants = {
                primary: "bg-red-600 text-white hover:bg-red-700 shadow-md",
                secondary: "bg-gray-100 text-gray-800 hover:bg-gray-200",
                outline: "border-2 border-red-600 text-red-600 hover:bg-red-50"
            };
            return (
                <button onClick={onClick} className={`w-full py-3 rounded-xl font-bold transition-all flex items-center justify-center gap-2 ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        // --- APP PRINCIPAL ---
        const App = () => {
            const [state, dispatch] = useReducer(appReducer, initialData);
            const [showSplash, setShowSplash] = useState(true);

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 2500);
                return () => clearTimeout(timer);
            }, []);

            if (showSplash) {
                return (
                    <div className="h-screen w-full bg-white flex flex-col items-center justify-center">
                        <div className="w-24 h-24 bg-red-600 rounded-3xl flex items-center justify-center shadow-2xl mb-6 animate-bounce">
                            <Icon name="navigation" className="text-white w-12 h-12" />
                        </div>
                        <h1 className="text-4xl font-black text-gray-900">DRIVE <span className="text-red-600">MX</span></h1>
                    </div>
                );
            }

            return (
                <AppContext.Provider value={{ state, dispatch }}>
                    <div className="max-w-md mx-auto min-h-screen bg-white shadow-xl overflow-hidden relative">
                        {!state.currentUser ? <AuthScreen /> : <MainView />}
                    </div>
                </AppContext.Provider>
            );
        };

        const AuthScreen = () => {
            const { state, dispatch } = useContext(AppContext);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            return (
                <div className="p-6 flex flex-col justify-center h-screen">
                    <div className="text-center mb-10">
                        <h2 className="text-3xl font-black text-gray-900">Bienvenido</h2>
                        <p className="text-gray-500 mt-2">Ingresa a Drive MX para comenzar</p>
                    </div>
                    {state.loginError && <p className="text-red-600 text-sm mb-4 text-center bg-red-50 p-2 rounded">Correo o contraseña incorrectos</p>}
                    <input type="email" placeholder="Email (admin@app.com)" className="w-full p-4 bg-gray-50 border rounded-xl mb-4 outline-none focus:ring-2 focus:ring-red-500" value={email} onChange={e => setEmail(e.target.value)} />
                    <input type="password" placeholder="Contraseña (123)" className="w-full p-4 bg-gray-50 border rounded-xl mb-6 outline-none focus:ring-2 focus:ring-red-500" value={password} onChange={e => setPassword(e.target.value)} />
                    <Button onClick={() => dispatch({ type: 'LOGIN', payload: { email, password } })}>Ingresar</Button>
                </div>
            );
        };

        const MainView = () => {
            const { state, dispatch } = useContext(AppContext);
            return (
                <div className="p-6">
                    <div className="flex justify-between items-center mb-8">
                        <h2 className="text-2xl font-black">Hola, {state.currentUser.name}</h2>
                        <button onClick={() => dispatch({type: 'LOGOUT'})} className="text-red-600"><Icon name="log-out" /></button>
                    </div>
                    <div className="bg-red-600 text-white p-6 rounded-3xl shadow-lg mb-8">
                        <p className="text-red-100 text-sm">Saldo en Cartera</p>
                        <h3 className="text-4xl font-black mt-1">${state.currentUser.balance.toFixed(2)}</h3>
                    </div>
                    <h4 className="font-bold mb-4">Servicios Disponibles</h4>
                    <div className="grid gap-4">
                        {state.services.map(s => (
                            <div key={s.id} className="border p-4 rounded-2xl flex justify-between items-center hover:border-red-600 cursor-pointer transition-all">
                                <div>
                                    <p className="font-black text-lg">{s.name}</p>
                                    <p className="text-sm text-gray-500">Tarifa base: ${s.baseRate}</p>
                                </div>
                                <Icon name="chevron-right" className="text-gray-400" />
                            </div>
                        ))}
                    </div>
                    <div className="mt-8">
                        <Button variant="outline">Ver Historial de Viajes</Button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
