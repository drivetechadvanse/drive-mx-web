<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Plataforma Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Animación personalizada de tu desarrollo */
        @keyframes bounce-slight {
            0%, 100% { transform: translateY(-5%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
        .animate-bounce-slight { animation: bounce-slight 3s infinite; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        // Importamos los iconos de Lucide para que funcionen en el navegador
        const { 
            MapPin, Navigation, Car, Bike, Wallet, User, Shield, 
            Settings, CheckCircle, XCircle, Clock, Menu, X, 
            ChevronRight, DollarSign, AlertTriangle, Play,
            Plus, Search, LogOut, Activity, Bell, Send,
            MessageSquare, PlusCircle, Check, Share2, Trash2, FileText 
        } = lucide;

        const { useState, useEffect, useReducer, createContext, useContext } = React;

        // --- TU CÓDIGO ORIGINAL (BASE DE DATOS Y LÓGICA) --- [cite: 3-7]
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const generatePin = () => Math.floor(1000 + Math.random() * 9000).toString(); [cite: 4]

        const initialData = {
          users: [
            { id: 'admin1', role: 'admin', name: 'Super Admin', email: 'admin@app.com', password: '123', status: 'active', balance: 0 },
            { id: 'p1', role: 'passenger', name: 'Juan Pasajero', email: 'juan@app.com', password: '123', status: 'active', balance: 50 },
            { id: 'p2', role: 'passenger', name: 'Maria Morosa', email: 'maria@app.com', password: '123', status: 'active', balance: -150 }, 
            { id: 'd1', role: 'driver', name: 'Carlos Conductor', email: 'carlos@app.com', password: '123', status: 'available', balance: 200, vehicle: 'Toyota Yaris 2022' },
          ], [cite: 5]
          services: [
            { id: 's1', name: 'Auto Básico', type: 'ride', baseRate: 20, kmRate: 10, minRate: 2, image: 'car', active: true, commission: 0.20 }, [cite: 6]
            { id: 's2', name: 'Auto VIP', type: 'ride', baseRate: 50, kmRate: 15, minRate: 3, image: 'car', active: true, commission: 0.25 },
            { id: 's3', name: 'Moto Express', type: 'ride', baseRate: 15, kmRate: 7, minRate: 1, image: 'bike', active: true, commission: 0.15 },
          ],
          trips: [],
          transactions: [],
          notifications: [
            { id: 'n1', target: 'all', title: '¡Bienvenido a Drive MX!', message: 'Gracias por formar parte de nuestra comunidad.', date: new Date() } [cite: 7]
          ],
          supportTickets: [],
          settings: {
            walletLegend: "Recuerda mantener saldo positivo en tu cartera para poder seguir solicitando nuestros servicios.",
            whatsappLink: "https://wa.me/521234567890",
            referralActive: false
          }
        };

        // --- TU REDUCER (Manejo de Viajes y Billetera) --- [cite: 8-34]
        const appReducer = (state, action) => {
          switch (action.type) {
            case 'LOGIN':
              const user = state.users.find(u => u.email === action.payload.email && u.password === action.payload.password);
              return { ...state, currentUser: user || null, loginError: !user }; [cite: 9]
            case 'LOGOUT': return { ...state, currentUser: null }; [cite: 10]
            case 'REGISTER':
              const newUser = { ...action.payload, id: generateId(), status: 'active', balance: 0 };
              return { ...state, users: [...state.users, newUser], currentUser: newUser }; [cite: 12]
            case 'REQUEST_TRIP':
              const newTrip = { ...action.payload, id: generateId(), status: 'searching', pin: generatePin(), createdAt: new Date() };
              return { ...state, trips: [...state.trips, newTrip] }; [cite: 13]
            case 'ACCEPT_TRIP':
              return {
                ...state,
                trips: state.trips.map(t => t.id === action.payload.tripId ? { ...t, status: 'accepted', driverId: action.payload.driverId } : t),
                users: state.users.map(u => u.id === action.payload.driverId ? { ...u, status: 'busy' } : u)
              };
            case 'START_TRIP':
              return { ...state, trips: state.trips.map(t => t.id === action.payload ? { ...t, status: 'in_progress' } : t) }; [cite: 14]
            case 'COMPLETE_TRIP':
              const trip = state.trips.find(t => t.id === action.payload.tripId); [cite: 15]
              const service = state.services.find(s => s.id === trip.serviceId); [cite: 16]
              const commissionAmount = trip.price * service.commission;
              const driverEarn = trip.price - commissionAmount;
              let newTransactions = [...state.transactions]; [cite: 17]
              const updatedUsers = state.users.map(u => {
                if (u.id === trip.passengerId && trip.paymentMethod === 'wallet') {
                    newTransactions.push({ id: generateId(), userId: u.id, type: 'payment', amount: -trip.price, date: new Date(), desc: `Viaje ${trip.id}` });
                    return { ...u, balance: u.balance - trip.price };
                }
                if (u.id === trip.driverId) {
                    const amt = trip.paymentMethod === 'wallet' ? driverEarn : -commissionAmount; [cite: 20]
                    newTransactions.push({ id: generateId(), userId: u.id, type: 'earning', amount: amt, date: new Date(), desc: `Viaje ${trip.id}` });
                    return { ...u, status: 'available', balance: u.balance + amt }; [cite: 21]
                }
                return u;
              });
              return { ...state, trips: state.trips.map(t => t.id === action.payload.tripId ? { ...t, status: 'completed' } : t), users: updatedUsers, transactions: newTransactions }; [cite: 23]
            case 'UPDATE_BALANCE':
              return { ...state, users: state.users.map(u => u.id === action.payload.userId ? { ...u, balance: u.balance + action.payload.amount } : u), transactions: [...state.transactions, { id: generateId(), userId: action.payload.userId, type: 'manual', amount: action.payload.amount, date: new Date(), desc: 'Ajuste Admin' }] }; [cite: 24]
            case 'CHANGE_STATUS':
              return { ...state, users: state.users.map(u => u.id === action.payload.userId ? { ...u, status: action.payload.status } : u) }; [cite: 25]
            case 'UPDATE_SETTINGS':
              return { ...state, settings: { ...state.settings, ...action.payload } }; [cite: 26]
            case 'ADD_TICKET_MESSAGE':
              return { ...state, supportTickets: state.supportTickets.map(t => t.id === action.payload.ticketId ? { ...t, messages: [...t.messages, { senderId: action.payload.senderId, text: action.payload.text, date: new Date() }] } : t) }; [cite: 29]
            default: return state;
          }
        };

        const AppContext = createContext();

        // --- COMPONENTES UI ORIGINALES --- [cite: 35-39]
        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false }) => {
          const variants = {
            primary: "bg-red-600 text-white hover:bg-red-700 shadow-md", [cite: 36]
            secondary: "bg-gray-100 text-gray-800 hover:bg-gray-200",
            outline: "border-2 border-red-600 text-red-600 hover:bg-red-50",
            danger: "bg-red-100 text-red-600 hover:bg-red-200"
          };
          return (
            <button onClick={onClick} disabled={disabled} className={`w-full py-3 rounded-xl font-bold transition-all flex items-center justify-center gap-2 ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>
              {children}
            </button> [cite: 37]
          );
        };

        const Input = ({ label, type = 'text', value, onChange, placeholder, icon: Icon }) => (
          <div className="mb-4">
            {label && <label className="block text-sm font-semibold text-gray-700 mb-1">{label}</label>} [cite: 38]
            <div className="relative">
              {Icon && <Icon className="absolute left-3 top-3.5 text-gray-400 w-5 h-5" />}
              <input type={type} value={value} onChange={onChange} placeholder={placeholder} className={`w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 transition-all ${Icon ? [cite_start]'pl-10' : ''}`} /> [cite: 39]
            </div>
          </div>
        );

        // --- PANTALLAS COMPARTIDAS (BILLETERA, SOPORTE, MENÚ) --- [cite: 40-98]
        const WalletScreen = ({ user, transactions, onBack, isBlocked }) => (
          <div className="min-h-screen bg-gray-50 max-w-md mx-auto w-full z-40 absolute inset-0">
            <div className="bg-red-600 p-6 text-white rounded-b-3xl">
              <div className="flex justify-between items-center mb-6">
                <button onClick={onBack}><X className="w-6 h-6" /></button>
                <h2 className="font-bold">Billetera</h2>
                <div className="w-6"></div>
              </div>
              <p className="text-red-100 text-sm font-medium">Saldo Disponible</p>
              <h1 className="text-5xl font-black mt-1">${user.balance.toFixed(2)}</h1> [cite: 40-41]
              {isBlocked && <div className="mt-4 bg-red-700 p-3 rounded-lg flex items-center gap-2"><AlertTriangle className="w-5 h-5 text-yellow-300" /> <span className="text-sm">Cuenta bloqueada por saldo negativo.</span></div>}
            </div>
            <div className="p-6">
              <h3 className="font-bold text-gray-900 mb-4">Movimientos</h3> [cite: 42]
              <div className="space-y-3">
                {transactions.filter(t => t.userId === user.id).reverse().map(t => (
                  <div key={t.id} className="bg-white p-4 rounded-xl flex justify-between items-center shadow-sm">
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-full flex items-center justify-center ${t.amount < 0 ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}`}><DollarSign className="w-5 h-5" /></div>
                      <div><p className="font-bold text-sm">{t.desc}</p><p className="text-xs text-gray-400">{new Date(t.date).toLocaleDateString()}</p></div>
                    </div>
                    <span className={`font-black ${t.amount < 0 ? 'text-red-600' : 'text-green-600'}`}>{t.amount > 0 ? '+' : ''}{t.amount.toFixed(2)}</span>
                  </div> [cite: 43-46]
                ))}
              </div>
            </div>
          </div>
        );

        const SharedMenu = ({ user, isMenuOpen, setIsMenuOpen, setView, dispatch }) => {
          if (!isMenuOpen) return null; [cite: 87]
          return (
            <div className="absolute inset-0 bg-black/60 z-50 flex transition-opacity">
              <div className="w-3/4 bg-white h-full shadow-2xl flex flex-col">
                <div className="p-6 bg-red-600 text-white">
                  <div className="flex justify-between items-center mb-6">
                    <div className="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center"><User className="w-6 h-6" /></div> [cite: 88]
                    <button onClick={() => setIsMenuOpen(false)} className="bg-red-700 p-2 rounded-full"><X className="w-5 h-5" /></button>
                  </div>
                  <h3 className="font-black text-2xl truncate">{user.name}</h3> [cite: 89]
                  <p className="text-sm text-red-100 font-medium truncate">{user.email}</p>
                </div>
                <div className="flex-1 py-2">
                  <button onClick={() => { setView('home'); setIsMenuOpen(false); }} className="w-full text-left px-6 py-4 hover:bg-gray-50 flex items-center gap-4 font-bold text-gray-700">
                    {user.role === 'passenger' ? <MapPin className="w-5 h-5 text-gray-400" /> : <Navigation className="w-5 h-5 text-gray-400" />} {user.role === 'passenger' ? 'Solicitar Viaje' : 'Inicio'}
                  </button> [cite: 91-92]
                  <button onClick={() => { setView('wallet'); setIsMenuOpen(false); }} className="w-full text-left px-6 py-4 hover:bg-gray-50 flex items-center gap-4 font-bold text-gray-700"><Wallet className="w-5 h-5 text-gray-400" /> Mi Billetera</button> [cite: 93]
                </div>
                <div className="p-6 border-t border-gray-100 bg-gray-50">
                  <button onClick={() => dispatch({type:'LOGOUT'})} className="w-full text-left py-2 text-red-600 font-black flex items-center gap-3"><LogOut className="w-5 h-5" /> Cerrar Sesión</button>
                </div> [cite: 97]
              </div>
              <div className="flex-1" onClick={() => setIsMenuOpen(false)}></div> [cite: 98]
            </div>
          );
        };

        const SplashScreen = ({ onFinish }) => {
          useEffect(() => { const timer = setTimeout(onFinish, 2000); return () => clearTimeout(timer); }, [onFinish]); [cite: 99]
          return (
            <div className="h-screen w-full bg-white flex flex-col items-center justify-center relative overflow-hidden">
              <div className="z-10 flex flex-col items-center">
                <div className="w-24 h-24 bg-red-600 rounded-3xl flex items-center justify-center shadow-2xl mb-6 animate-pulse"><Navigation className="text-white w-12 h-12" /></div> [cite: 100]
                <h1 className="text-4xl font-black text-gray-900 tracking-tight">DRIVE <span className="text-red-600">MX</span></h1> [cite: 101]
              </div>
            </div>
          );
        };

        const AuthScreen = () => {
          const { state, dispatch } = useContext(AppContext); [cite: 102]
          const [isLogin, setIsLogin] = useState(true);
          const [email, setEmail] = useState(''); [cite: 103]
          const [password, setPassword] = useState('');
          const handleSubmit = () => { if (isLogin) dispatch({ type: 'LOGIN', payload: { email, password } }); }; [cite: 104]
          return (
            <div className="min-h-screen bg-white p-6 flex flex-col justify-center max-w-md mx-auto">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center shadow-lg mx-auto mb-4"><Navigation className="text-white w-8 h-8" /></div> [cite: 106]
                <h2 className="text-3xl font-black text-gray-900">{isLogin ? 'Bienvenido' : 'Crear Cuenta'}</h2>
              </div>
              {state.loginError && <div className="bg-red-100 text-red-600 p-3 rounded-lg mb-4 text-sm font-medium text-center">Credenciales incorrectas</div>} [cite: 107]
              <Input icon={User} type="email" placeholder="Correo electrónico" value={email} onChange={e => setEmail(e.target.value)} />
              <Input icon={Shield} type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} /> [cite: 107]
              <Button onClick={handleSubmit}>{isLogin ? 'Ingresar' : 'Registrarse'}</Button> [cite: 108]
            </div>
          );
        };

        const SimulatedMap = ({ children, height = 'h-64' }) => (
          <div className={`w-full ${height} bg-gray-200 relative overflow-hidden rounded-b-3xl`}>
            <div className="absolute inset-0 opacity-20" style={{ backgroundImage: 'linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>
            <svg className="absolute inset-0 w-full h-full"><path d="M 50 50 Q 150 150 250 100 T 350 200" fill="transparent" stroke="#EF4444" strokeWidth="4" strokeDasharray="5,5" className="animate-pulse" /></svg> [cite: 110]
            {children}
          </div>
        );

        // --- MÓDULOS DE USUARIO (PASAJERO, CONDUCTOR, ADMIN) --- [cite: 111-281]
        const PassengerApp = () => {
          const { state, dispatch } = useContext(AppContext); [cite: 111]
          const user = state.currentUser; [cite: 112]
          const [view, setView] = useState('home'); 
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const activeTrip = state.trips.find(t => t.passengerId === user.id && t.status !== 'completed'); [cite: 115]
          if (activeTrip) {
            return (
              <div className="min-h-screen bg-gray-50 flex flex-col max-w-md mx-auto">
                <SimulatedMap height="h-1/2" />
                <div className="flex-1 bg-white rounded-t-3xl p-6 shadow-2xl z-10 -mt-6">
                  <h2 className="text-xl font-black mb-4">Viaje en curso</h2> [cite: 122]
                  <div className="bg-red-50 p-6 rounded-2xl border border-red-100 text-center">
                    <p className="text-sm font-bold text-red-600">CÓDIGO DE SEGURIDAD</p> [cite: 126]
                    <p className="text-5xl font-black">{activeTrip.pin}</p>
                  </div>
                </div>
              </div>
            );
          }
          if (view === 'wallet') return <WalletScreen user={user} transactions={state.transactions} onBack={() => setView('home')} isBlocked={user.balance < 0} />; [cite: 127]
          return (
            <div className="min-h-screen bg-white flex flex-col max-w-md mx-auto relative">
              <SharedMenu user={user} isMenuOpen={isMenuOpen} setIsMenuOpen={setIsMenuOpen} setView={setView} dispatch={dispatch} /> [cite: 132]
              <div className="p-4 absolute top-0 w-full z-10"><button className="w-10 h-10 bg-white shadow-sm rounded-full flex items-center justify-center" onClick={() => setIsMenuOpen(true)}><Menu className="w-5 h-5" /></button></div> [cite: 136]
              <SimulatedMap height="h-64" />
              <div className="p-6">
                <h2 className="text-2xl font-black mb-6">¿A dónde vamos?</h2> [cite: 138]
                <Input icon={MapPin} placeholder="¿A dónde vas?" value={''} onChange={() => {}} /> [cite: 140]
              </div>
            </div>
          );
        };

        const DriverApp = () => {
          const { state, dispatch } = useContext(AppContext); [cite: 159]
          const user = state.currentUser; [cite: 160]
          const [view, setView] = useState('home');
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const activeTrip = state.trips.find(t => t.driverId === user.id && t.status !== 'completed'); [cite: 162]
          if (view === 'wallet') return <WalletScreen user={user} transactions={state.transactions} onBack={() => setView('home')} isBlocked={user.balance <= 0} />; [cite: 168]
          return (
            <div className="min-h-screen bg-gray-900 text-white flex flex-col max-w-md mx-auto relative">
              <SharedMenu user={user} isMenuOpen={isMenuOpen} setIsMenuOpen={setIsMenuOpen} setView={setView} dispatch={dispatch} /> [cite: 173]
              <div className="p-4 flex justify-between items-center bg-gray-800"><button onClick={() => setIsMenuOpen(true)}><Menu className="w-5 h-5" /></button>
                <button className={`px-4 py-2 rounded-full font-bold text-xs ${user.status === 'available' ? 'bg-red-600' : 'bg-gray-700'}`}>{user.status === 'available' ? 'Conectado' : 'Desconectado'}</button> [cite: 176-178]
              </div>
              <SimulatedMap height="h-full" />
              {activeTrip && (
                <div className="absolute bottom-0 w-full p-4 z-20">
                  <div className="bg-white text-gray-900 rounded-3xl p-6 shadow-2xl">
                    <h3 className="text-xl font-black mb-4">Viaje Activo</h3> [cite: 192]
                    <Button onClick={() => dispatch({type:'COMPLETE_TRIP', payload:{tripId:activeTrip.id}})}>Finalizar Viaje</Button> [cite: 194]
                  </div>
                </div>
              )}
            </div>
          );
        };

        const AdminApp = () => {
          const { state, dispatch } = useContext(AppContext); [cite: 199]
          const stats = { totalUsers: state.users.length, activeTrips: state.trips.filter(t => t.status !== 'completed').length, revenue: state.transactions.filter(t => t.type === 'earning').reduce((acc, t) => acc + (t.amount * 0.20), 0) }; [cite: 203]
          return (
            <div className="min-h-screen bg-gray-50 flex">
              <div className="w-64 bg-gray-900 text-white p-6"><h1 className="text-2xl font-black">DRIVE MX ADMIN</h1> [cite: 212]
                <button onClick={() => dispatch({type:'LOGOUT'})} className="mt-8 flex items-center gap-2 text-gray-400 hover:text-white"><LogOut className="w-5 h-5" /> Salir</button> [cite: 216]
              </div>
              <div className="flex-1 p-8">
                <div className="grid grid-cols-3 gap-6">
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><p className="text-gray-500">Usuarios</p><h3 className="text-4xl font-black">{stats.totalUsers}</h3></div> [cite: 218]
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><p className="text-gray-500">Viajes</p><h3 className="text-4xl font-black">{stats.activeTrips}</h3></div> [cite: 219]
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><p className="text-gray-500">Ingresos</p><h3 className="text-4xl font-black">${stats.revenue.toFixed(2)}</h3></div> [cite: 220]
                </div>
              </div>
            </div>
          );
        };

        // --- CONTENEDOR PRINCIPAL --- [cite: 282-285]
        function App() {
          const [state, dispatch] = useReducer(appReducer, initialData); [cite: 282]
          const [showSplash, setShowSplash] = useState(true); [cite: 283]
          if (showSplash) return <SplashScreen onFinish={() => setShowSplash(false)} />; [cite: 283]
          return (
            <AppContext.Provider value={{ state, dispatch }}>
              {!state.currentUser ? <AuthScreen /> : state.currentUser.role === 'admin' ? <AdminApp /> : state.currentUser.role === 'driver' ? <DriverApp /> : <PassengerApp />}
            </AppContext.Provider> [cite: 284]
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
