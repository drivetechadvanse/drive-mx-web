<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drive MX | Pro System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
body{font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;background:#000;height:100dvh}
#app-container{height:100dvh}
#sidebar{transition:transform .4s cubic-bezier(.4,0,.2,1);transform:translateX(-100%)}
#sidebar.open{transform:translateX(0)}
#driver-sidebar{transition:transform .3s ease}
#cost-sheet{transition:transform .5s cubic-bezier(.32,.72,0,1);transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom,2rem)}
#cost-sheet.active{transform:translateY(0)}
.hidden-view{opacity:0;transform:translateY(-20px);pointer-events:none;transition:all .4s ease}
.reg-input{width:100%;padding:1rem;background:#f9fafb;border-radius:.75rem;border:2px solid transparent;outline:none;font-size:.75rem;font-weight:700}
.reg-input:focus{border-color:#ef4444;background:#fff}
.reg-label{font-size:9px;font-weight:900;color:#9ca3af;text-transform:uppercase;margin-bottom:.4rem;display:block;margin-left:.5rem}
.payment-opt.selected{border-color:#ef4444;background:#fef2f2;color:#ef4444}
.map-sim{background:#f3f4f6;background-image:radial-gradient(#d1d5db 1px,transparent 1px);background-size:25px 25px;flex-grow:1}
.card-selected{border-color:#ef4444!important;background:#fef2f2!important}
</style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">

<div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

<div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
<div id="user-profile-header" class="hidden p-6 bg-gray-900 text-white flex flex-col items-center text-center">
<img id="side-user-photo" src="" class="w-20 h-20 rounded-full object-cover border-4 border-red-600 bg-gray-800">
<h3 id="side-user-name" class="text-sm font-black uppercase italic mt-3">Usuario</h3>
</div>

<div id="side-header-admin" class="hidden p-6 bg-gray-900 text-white">
<h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
</div>

<nav class="flex-1 p-4 space-y-2 overflow-y-auto">
<div id="nav-admin" class="hidden">
<button onclick="renderAdminRequests()" class="w-full p-3 bg-gray-100 rounded-xl text-left text-[10px] font-black uppercase italic">Conductores</button>
<button onclick="renderAdminPassengers()" class="w-full p-3 bg-gray-100 rounded-xl text-left text-[10px] font-black uppercase italic mt-2">Pasajeros</button>
</div>

<div id="nav-passenger" class="hidden">
<button onclick="applyToBeDriver()" class="w-full p-3 bg-red-50 text-red-600 rounded-xl text-left text-[10px] font-black uppercase italic">Quiero ser conductor</button>
</div>
</nav>

<div class="p-4 border-t">
<button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[10px] uppercase italic">Cerrar sesión</button>
</div>
</div>

<div id="login-screen" class="absolute inset-0 bg-white z-[150] flex flex-col items-center justify-center p-8">
<h1 class="text-3xl font-black italic uppercase mb-10">DRIVE <span class="text-red-600">MX</span></h1>
<div class="space-y-4 w-full">
<input id="login-email" type="text" placeholder="Usuario" class="reg-input">
<input id="login-pass" type="password" placeholder="Contraseña" class="reg-input">
<button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase text-[11px] italic">Ingresar</button>
<button onclick="startPassengerRegistration()" class="w-full py-4 bg-gray-100 rounded-xl font-black uppercase text-[10px] italic">Crear cuenta</button>
</div>
</div>

<div id="passenger-view" class="hidden h-full flex flex-col relative">
<header class="px-4 py-3 flex items-center justify-between border-b bg-white">
<button onclick="openMenu()" class="p-2 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
<h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
<div class="w-8 h-8 bg-gray-900 rounded-lg"></div>
</header>

<main class="flex-1 map-sim relative">
<div class="absolute top-4 left-4 right-4 space-y-3">
<div onclick="openCosts()" class="bg-white p-3 rounded-2xl shadow-xl flex items-center gap-3 cursor-pointer">
<div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white">
<i data-lucide="search"></i>
</div>
<span class="text-[11px] font-black uppercase italic text-gray-400">¿A dónde vamos?</span>
</div>
</div>
</main>

<div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] p-8 space-y-5 shadow-2xl">
<h3 class="text-center text-lg font-black italic uppercase">Forma de pago</h3>
<div class="grid grid-cols-3 gap-3">
<button onclick="setPay(this,'efectivo')" class="payment-opt selected p-4 rounded-2xl border font-black text-[9px] uppercase">Efectivo</button>
<button onclick="setPay(this,'spei')" class="payment-opt p-4 rounded-2xl border font-black text-[9px] uppercase">SPEI</button>
<button onclick="setPay(this,'cartera')" class="payment-opt p-4 rounded-2xl border font-black text-[9px] uppercase">Cartera</button>
</div>
<button class="w-full bg-red-600 text-white py-4 rounded-2xl font-black uppercase italic">Confirmar solicitud</button>
</div>
</div>

<div id="driver-view-active" class="hidden h-full flex flex-col bg-gray-50 relative">

<div id="driver-sidebar" class="absolute top-0 left-0 h-full w-64 bg-white z-[220] shadow-2xl -translate-x-full flex flex-col">
<div class="p-5 border-b bg-gray-900 text-white">
<h2 class="text-sm font-black italic uppercase">PANEL <span class="text-red-600">DRIVER</span></h2>
<p class="text-[8px] uppercase text-gray-400 font-bold mt-1">Menú conductor</p>
</div>
<div class="flex-1 p-4"></div>
</div>

<div id="driver-sidebar-overlay" onclick="closeDriverSidebar()" class="absolute inset-0 bg-black/50 z-[210] hidden"></div>

<header class="px-4 py-3 flex items-center justify-between bg-gray-900 text-white z-20">
<div class="flex items-center gap-3">
<button onclick="openDriverSidebar()" class="p-2 rounded-lg bg-white/10">
<i data-lucide="menu" class="w-5 h-5 text-red-600"></i>
</button>
<div class="w-8 h-8 rounded-full border-2 border-red-600 overflow-hidden bg-gray-800">
<img id="active-driver-photo" src="" class="w-full h-full object-cover">
</div>
<h2 class="text-xs font-black italic uppercase">Panel <span class="text-red-600">Driver</span></h2>
</div>

<button onclick="toggleDriverAvailability()" id="status-badge" class="flex items-center gap-2 bg-red-600/20 px-3 py-2 rounded-full border border-red-600/30">
<div id="status-dot" class="w-2 h-2 rounded-full bg-red-600"></div>
<span id="status-text" class="text-[9px] font-black uppercase italic text-red-600">No Disponible</span>
</button>
</header>

<main class="flex-1 flex items-center justify-center">
<div class="text-center">
<div id="driver-offline-icon" class="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center mx-auto mb-6">
<i data-lucide="power" class="w-10 h-10 text-gray-400"></i>
</div>

<div id="driver-online-icon" class="hidden w-24 h-24 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-6 animate-pulse">
<i data-lucide="radio" class="w-10 h-10 text-green-600"></i>
</div>

<h3 id="driver-main-msg" class="text-lg font-black italic uppercase text-gray-900">Modo Desconectado</h3>
<p id="driver-sub-msg" class="text-[10px] font-bold text-gray-400 uppercase mt-2">Activa disponibilidad para comenzar</p>
</div>
</main>
</div>

<div id="admin-view" class="hidden h-full flex flex-col bg-gray-100">
<header class="bg-gray-900 text-white px-4 py-3 flex justify-between items-center">
<button onclick="openMenu()" class="p-2 bg-white/10 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-red-600"></i></button>
<h2 class="text-base font-black italic uppercase">Panel Admin</h2>
<div class="w-8"></div>
</header>
<main id="admin-requests-container" class="flex-1 p-5 overflow-y-auto"></main>
</div>

<div id="driver-registration-view" class="hidden absolute inset-0 z-[200] bg-white flex flex-col">
<header class="px-4 py-4 flex items-center border-b bg-white">
<button onclick="handleDriverBack()" class="p-2"><i data-lucide="arrow-left"></i></button>
<h2 id="reg-main-title" class="ml-3 text-lg font-black italic uppercase">REGISTRO <span class="text-red-600">USER</span></h2>
</header>

<div class="flex-1 overflow-y-auto p-6 pb-12">
<div id="step-photo" class="w-full flex flex-col items-center">
<div class="relative mb-8 mt-2">
<div class="w-40 h-40 rounded-full border-4 border-gray-100 bg-gray-50 flex items-center justify-center overflow-hidden">
<img id="driver-photo-preview" class="hidden w-full h-full object-cover">
<i id="placeholder-icon" data-lucide="user" class="w-12 h-12 text-gray-300"></i>
</div>
<button onclick="document.getElementById('photo-input').click()" class="absolute bottom-1 right-1 bg-red-600 p-3 rounded-full text-white">
<i data-lucide="camera"></i>
</button>
<input type="file" id="photo-input" accept="image/*" class="hidden" onchange="processImage(this)">
</div>
<button id="btn-photo-next" onclick="goToStep(2)" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase italic">Siguiente</button>
</div>

<div id="step-name" class="hidden space-y-4">
<input type="text" id="dr-name" class="reg-input" placeholder="Nombre completo">
<div id="fields-account" class="space-y-4">
<input type="text" id="reg-user" class="reg-input" placeholder="Usuario">
<input type="password" id="reg-pass" class="reg-input" placeholder="Contraseña">
<input type="email" id="reg-email" class="reg-input" placeholder="Correo">
</div>
<button onclick="handleStepNameNext()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase italic">Siguiente</button>
</div>

<div id="step-phone" class="hidden">
<input type="tel" id="dr-phone" class="reg-input" placeholder="Teléfono">
<button onclick="handleStepPhoneNext()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase italic mt-4">Finalizar</button>
</div>

<div id="step-finish-passenger" class="hidden text-center py-10">
<h2 class="text-2xl font-black italic uppercase mb-6">Cuenta creada</h2>
<button onclick="savePassengerRequest()" class="w-full bg-green-600 text-white py-4 rounded-xl font-black uppercase italic">Continuar</button>
</div>

<div id="step-finish-driver" class="hidden text-center py-10">
<h2 class="text-2xl font-black italic uppercase mb-6">Driver activado</h2>
<button onclick="saveDriverRequest()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase italic">Continuar</button>
</div>
</div>
</div>

</div>

<script>
lucide.createIcons();
let currentUser=null;
let registrationMode='passenger';
let isAvailable=false;
let tempBase64Photo='';

function openMenu(){
document.getElementById('sidebar').classList.add('open');
document.getElementById('overlay').classList.add('opacity-100','pointer-events-auto');
}

function closeAll(){
document.getElementById('sidebar').classList.remove('open');
document.getElementById('overlay').classList.remove('opacity-100','pointer-events-auto');
document.getElementById('cost-sheet').classList.remove('active');
}

function openDriverSidebar(){
document.getElementById('driver-sidebar').classList.remove('-translate-x-full');
document.getElementById('driver-sidebar-overlay').classList.remove('hidden');
}

function closeDriverSidebar(){
document.getElementById('driver-sidebar').classList.add('-translate-x-full');
document.getElementById('driver-sidebar-overlay').classList.add('hidden');
}

function openCosts(){
document.getElementById('cost-sheet').classList.add('active');
}

function setPay(btn){
document.querySelectorAll('.payment-opt').forEach(b=>b.classList.remove('selected'));
btn.classList.add('selected');
}

function processImage(input){
if(input.files[0]){
const reader=new FileReader();
reader.onload=function(e){
tempBase64Photo=e.target.result;
document.getElementById('driver-photo-preview').src=tempBase64Photo;
document.getElementById('driver-photo-preview').classList.remove('hidden');
document.getElementById('placeholder-icon').classList.add('hidden');
};
reader.readAsDataURL(input.files[0]);
}
}

function goToStep(n){
document.getElementById('step-photo').classList.add('hidden');
document.getElementById('step-name').classList.add('hidden');
document.getElementById('step-phone').classList.add('hidden');
if(n===1)document.getElementById('step-photo').classList.remove('hidden');
if(n===2)document.getElementById('step-name').classList.remove('hidden');
if(n===3)document.getElementById('step-phone').classList.remove('hidden');
}

function startPassengerRegistration(){
registrationMode='passenger';
document.getElementById('login-screen').classList.add('hidden');
document.getElementById('driver-registration-view').classList.remove('hidden');
document.getElementById('reg-main-title').innerHTML='REGISTRO <span class="text-red-600">USER</span>';
document.getElementById('fields-account').classList.remove('hidden');
goToStep(1);
}

function applyToBeDriver(){
registrationMode='driver';
closeAll();
document.getElementById('passenger-view').classList.add('hidden');
document.getElementById('driver-registration-view').classList.remove('hidden');
document.getElementById('reg-main-title').innerHTML='REGISTRO <span class="text-red-600">DRIVER</span>';
document.getElementById('fields-account').classList.add('hidden');
goToStep(1);
}

function handleStepNameNext(){
goToStep(3);
}

function handleStepPhoneNext(){
document.getElementById('step-photo').classList.add('hidden');
document.getElementById('step-name').classList.add('hidden');
document.getElementById('step-phone').classList.add('hidden');
if(registrationMode==='driver'){
document.getElementById('step-finish-driver').classList.remove('hidden');
}else{
document.getElementById('step-finish-passenger').classList.remove('hidden');
}
}

function savePassengerRequest(){
const db=JSON.parse(localStorage.getItem('db_usuarios_permanente')||'[]');
const user={
id:Date.now(),
role:'pasajero',
name:document.getElementById('dr-name').value,
usuario:document.getElementById('reg-user').value,
correo:document.getElementById('reg-email').value,
pass:document.getElementById('reg-pass').value,
phone:document.getElementById('dr-phone').value,
foto:tempBase64Photo
};
db.push(user);
localStorage.setItem('db_usuarios_permanente',JSON.stringify(db));
location.reload();
}

function saveDriverRequest(){
const db=JSON.parse(localStorage.getItem('db_usuarios_permanente')||'[]');
const user={
id:'DRV_'+Date.now(),
role:'conductor',
name:document.getElementById('dr-name').value,
usuario:'driver_'+Date.now(),
correo:'',
pass:'1234',
phone:document.getElementById('dr-phone').value,
foto:tempBase64Photo
};
db.push(user);
localStorage.setItem('db_usuarios_permanente',JSON.stringify(db));
currentUser=user;
document.getElementById('driver-registration-view').classList.add('hidden');
document.getElementById('driver-view-active').classList.remove('hidden');
document.getElementById('active-driver-photo').src=tempBase64Photo;
lucide.createIcons();
}

function handleAuth(){
const userIn=document.getElementById('login-email').value.trim();
const passIn=document.getElementById('login-pass').value.trim();

if(userIn==='admincentral'&&passIn==='9271@'){
document.getElementById('login-screen').classList.add('hidden');
document.getElementById('admin-view').classList.remove('hidden');
document.getElementById('nav-admin').classList.remove('hidden');
document.getElementById('side-header-admin').classList.remove('hidden');
renderAdminRequests();
return;
}

const db=JSON.parse(localStorage.getItem('db_usuarios_permanente')||'[]');
const user=db.find(u=>(u.usuario===userIn||u.correo===userIn)&&u.pass===passIn);

if(user){
currentUser=user;

document.getElementById('login-screen').classList.add('hidden');
document.getElementById('passenger-view').classList.add('hidden');
document.getElementById('driver-view-active').classList.add('hidden');

document.getElementById('nav-passenger').classList.add('hidden');
document.getElementById('user-profile-header').classList.add('hidden');

if(user.role==='conductor'){
document.getElementById('driver-view-active').classList.remove('hidden');
if(user.foto){
document.getElementById('active-driver-photo').src=user.foto;
}
}else{
document.getElementById('passenger-view').classList.remove('hidden');
document.getElementById('nav-passenger').classList.remove('hidden');
document.getElementById('user-profile-header').classList.remove('hidden');
if(user.foto){
document.getElementById('side-user-photo').src=user.foto;
}
document.getElementById('side-user-name').innerText=user.name;
}
}else{
alert('Usuario o contraseña incorrectos');
}

lucide.createIcons();
}

function toggleDriverAvailability(){
isAvailable=!isAvailable;
const badge=document.getElementById('status-badge');
const dot=document.getElementById('status-dot');
const text=document.getElementById('status-text');
const offline=document.getElementById('driver-offline-icon');
const online=document.getElementById('driver-online-icon');
const main=document.getElementById('driver-main-msg');
const sub=document.getElementById('driver-sub-msg');

if(isAvailable){
badge.classList.remove('bg-red-600/20','border-red-600/30');
badge.classList.add('bg-green-600/20','border-green-600/30');
dot.classList.remove('bg-red-600');
dot.classList.add('bg-green-500');
text.classList.remove('text-red-600');
text.classList.add('text-green-600');
text.innerText='Disponible';
offline.classList.add('hidden');
online.classList.remove('hidden');
main.innerText='Modo Conectado';
sub.innerText='Buscando solicitudes';
}else{
badge.classList.remove('bg-green-600/20','border-green-600/30');
badge.classList.add('bg-red-600/20','border-red-600/30');
dot.classList.remove('bg-green-500');
dot.classList.add('bg-red-600');
text.classList.remove('text-green-600');
text.classList.add('text-red-600');
text.innerText='No Disponible';
offline.classList.remove('hidden');
online.classList.add('hidden');
main.innerText='Modo Desconectado';
sub.innerText='Activa disponibilidad para comenzar';
}
}

function renderAdminRequests(){
document.getElementById('admin-requests-container').innerHTML='<div class="bg-white p-5 rounded-2xl font-black uppercase italic">Panel administrador activo</div>';
}

function renderAdminPassengers(){
const users=JSON.parse(localStorage.getItem('db_usuarios_permanente')||'[]');
let html='';
users.forEach(u=>{
if(u.role==='pasajero'){
html+=`<div class="bg-white p-4 rounded-2xl mb-3"><h3 class="font-black uppercase italic">${u.name}</h3></div>`;
}
});
document.getElementById('admin-requests-container').innerHTML=html;
}

function handleDriverBack(){
document.getElementById('driver-registration-view').classList.add('hidden');
document.getElementById('login-screen').classList.remove('hidden');
}

lucide.createIcons();
</script>

</body>
</html>
