<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive MX | Sistema Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: 100dvh; }
        #app-container { height: 100dvh; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); padding-bottom: env(safe-area-inset-bottom, 2rem); }
        #cost-sheet.active { transform: translateY(0); }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; flex-grow: 1; }
        .radar-pulse { position: absolute; width: 100px; height: 100px; background: rgba(239, 68, 68, 0.15); border-radius: 100%; animation: radar 2s infinite; }
        @keyframes radar { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .reg-input { width: 100%; padding: 1rem; background-color: #f9fafb; border-radius: 0.75rem; border: 2px solid transparent; outline: none; font-size: 0.8rem; font-weight: 700; }
        .reg-input:focus { border-color: #ef4444; background-color: #fff; }
        .reg-label { font-size: 9px; font-weight: 900; color: #9ca3af; text-transform: uppercase; margin-bottom: 0.4rem; display: block; margin-left: 0.5rem; }
        .payment-opt.selected { border-color: #ef4444; background-color: #fef2f2; color: #ef4444; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .accordion-content.expanded { max-height: 500px; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <!-- Pantalla de Carga (Splash) -->
    <div id="splash" class="absolute inset-0 z-[250] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center animate-pulse shadow-xl shadow-red-600/20">
            <i data-lucide="navigation" class="text-white w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-black mt-6 italic uppercase tracking-tighter">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <!-- Overlay Global -->
    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <!-- Sidebar Navegación -->
    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3"><i data-lucide="cpu" class="w-6 h-6"></i></div>
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-400 font-bold uppercase tracking-widest italic">Panel de Control</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <!-- Menú Admin -->
            <div id="nav-admin" class="hidden">
                <button onclick="toggleAccordion('admin-acc')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="users" class="text-red-600 w-4 h-4"></i><span>Gestión Usuarios</span></div>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div id="admin-acc" class="accordion-content bg-gray-50/50 rounded-xl">
                    <button onclick="renderAdminRequests('drivers')" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase border-b border-white">Conductores</button>
                    <button onclick="renderAdminRequests('passengers')" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase">Pasajeros</button>
                </div>
            </div>
            <!-- Menú Pasajero -->
            <div id="nav-passenger" class="hidden">
                <button onclick="openCosts()" class="w-full flex items-center gap-3 p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <i data-lucide="map-pin" class="text-red-600 w-4 h-4"></i><span>Pedir Viaje</span>
                </button>
            </div>
        </nav>
        <div class="p-4 border-t mb-4">
            <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button>
        </div>
    </div>

    <!-- Login -->
    <div id="login-screen" class="hidden absolute inset-0 z-[150] bg-white p-8 flex flex-col items-center justify-center text-center">
        <div class="w-12 h-12 bg-red-600 rounded-xl mb-6 shadow-lg shadow-red-600/20 flex items-center justify-center">
            <i data-lucide="navigation" class="text-white w-6 h-6"></i>
        </div>
        <h2 class="text-3xl font-black italic uppercase mb-8 leading-none tracking-tighter">ACCESO</h2>
        <div class="space-y-4 w-full">
            <input type="text" id="login-email" placeholder="Usuario / Correo" class="reg-input">
            <input type="password" id="login-pass" placeholder="Contraseña" class="reg-input">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic shadow-lg active:scale-95 transition-all">Entrar</button>
            <div class="flex flex-col gap-2 pt-4">
                <button onclick="startRegistration('passenger')" class="text-[9px] font-black text-gray-400 uppercase italic hover:text-red-600 transition-colors">Crear cuenta Pasajero</button>
                <button onclick="startRegistration('driver')" class="text-[9px] font-black text-red-600 uppercase italic">Registro para Conductores</button>
            </div>
        </div>
    </div>

    <!-- Vista Pasajero -->
    <div id="passenger-view" class="hidden h-full flex flex-col">
        <header class="px-4 py-3 flex items-center justify-between border-b bg-white z-10 shrink-0">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <div id="p-avatar" class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center text-white text-[10px] font-bold italic">MX</div>
        </header>
        <main class="flex-1 map-sim relative overflow-hidden">
            <div class="absolute top-4 left-4 right-4 z-20">
                <div onclick="openCosts()" class="bg-white p-2 rounded-xl shadow-2xl flex items-center gap-3 border border-black/5">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase">¿A dónde vas ahora?</span>
                </div>
            </div>
            <div id="p-wallet" class="absolute bottom-6 left-4 right-4 z-30">
                <div class="bg-gray-900 rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-600/20 rounded-xl flex items-center justify-center text-red-600 border border-red-600/30"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div><p class="text-[8px] text-gray-500 font-black uppercase italic">Saldo Cartera</p><h3 id="display-saldo" class="text-sm font-black italic">$0.00 MXN</h3></div>
                    </div>
                </div>
            </div>
        </main>
        <!-- Bottom Sheet Pagos -->
        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-8 pt-6 space-y-5">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-2"></div>
            <h3 class="text-lg font-black italic uppercase text-center">FORMA DE <span class="text-red-600">PAGO</span></h3>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="setPay(this, 'efectivo')" class="payment-opt selected p-4 rounded-2xl border flex flex-col items-center gap-2 transition-all"><i data-lucide="banknote" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">Efectivo</span></button>
                <button onclick="setPay(this, 'spei')" class="payment-opt p-4 rounded-2xl border flex flex-col items-center gap-2 transition-all"><i data-lucide="send" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">SPEI</span></button>
                <button onclick="setPay(this, 'cartera')" class="payment-opt p-4 rounded-2xl border flex flex-col items-center gap-2 transition-all"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">Cartera</span></button>
            </div>
            <button onclick="confirmRequest()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[12px] uppercase italic shadow-xl">CONFIRMAR SOLICITUD</button>
        </div>
    </div>

    <!-- Registro Dinámico (Flujo Unificado) -->
    <div id="registration-view" class="hidden absolute inset-0 z-[200] bg-white flex flex-col">
        <header class="px-4 py-4 flex items-center border-b bg-white sticky top-0 z-10 shrink-0">
            <button onclick="location.reload()" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i></button>
            <h2 id="reg-title" class="ml-3 text-lg font-black italic uppercase">REGISTRO <span class="text-red-600">DRIVE MX</span></h2>
        </header>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Paso 1: Datos Básicos (Común) -->
            <div id="reg-step-1" class="space-y-4">
                <div><label class="reg-label">Nombre Completo</label><input type="text" id="reg-name" class="reg-input" placeholder="Juan Pérez"></div>
                <div><label class="reg-label">Teléfono</label><input type="tel" id="reg-phone" class="reg-input" placeholder="55 1234 5678"></div>
                <div><label class="reg-label">Usuario</label><input type="text" id="reg-user" class="reg-input" placeholder="Crea un nombre de usuario"></div>
                <div><label class="reg-label">Contraseña</label><input type="password" id="reg-pass-new" class="reg-input" placeholder="••••••••"></div>
            </div>

            <!-- Sección exclusiva para conductores -->
            <div id="driver-fields" class="hidden space-y-6 border-t pt-6">
                <p class="text-[10px] font-black text-red-600 uppercase italic">Documentación Vehicular</p>
                <div><label class="reg-label">Marca y Modelo</label><input type="text" id="v-info" class="reg-input" placeholder="Ej: VW Vento 2022"></div>
                <div><label class="reg-label">Placas</label><input type="text" id="v-plate" class="reg-input uppercase" placeholder="ABC-123-D"></div>
            </div>

            <!-- Paso Final: El cambio solicitado -->
            <div id="reg-step-finish" class="hidden flex flex-col items-center text-center py-6">
                <div id="finish-icon" class="w-20 h-20 rounded-3xl bg-gray-900 flex items-center justify-center mb-6">
                    <i data-lucide="check" class="text-red-600 w-10 h-10"></i>
                </div>
                <h3 id="finish-header" class="text-xl font-black italic uppercase mb-2">MENSAJE</h3>
                <p id="finish-text" class="text-[11px] font-bold text-gray-500 uppercase italic px-4"></p>
            </div>

            <button id="btn-next-reg" onclick="processRegistration()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic shadow-xl">SIGUIENTE</button>
            <button id="btn-final-reg" onclick="location.reload()" class="hidden w-full bg-gray-900 text-white py-4 rounded-xl font-black text-[11px] uppercase italic">FINALIZAR</button>
        </div>
    </div>

</div>

<script>
    lucide.createIcons();
    let currentRegMode = 'passenger';

    // Splash Timer
    setTimeout(() => { 
        document.getElementById('splash').style.opacity = '0'; 
        setTimeout(() => { 
            document.getElementById('splash').style.display = 'none'; 
            document.getElementById('login-screen').classList.remove('hidden'); 
        }, 500); 
    }, 1500);

    // Navegación Básica
    function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function closeAll() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('cost-sheet').classList.remove('active'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }
    function openCosts() { document.getElementById('cost-sheet').classList.add('active'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function toggleAccordion(id) { document.getElementById(id).classList.toggle('expanded'); }

    // Sistema de Registro
    function startRegistration(mode) {
        currentRegMode = mode;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('registration-view').classList.remove('hidden');
        
        if(mode === 'driver') {
            document.getElementById('reg-title').innerHTML = 'REGISTRO <span class="text-red-600">DRIVER</span>';
            document.getElementById('driver-fields').classList.remove('hidden');
        } else {
            document.getElementById('reg-title').innerHTML = 'REGISTRO <span class="text-red-600">USER</span>';
            document.getElementById('driver-fields').classList.add('hidden');
        }
    }

    function processRegistration() {
        const name = document.getElementById('reg-name').value;
        if(!name) { alert("Completa los datos"); return; }

        // Ocultar formularios
        document.getElementById('reg-step-1').classList.add('hidden');
        document.getElementById('driver-fields').classList.add('hidden');
        document.getElementById('btn-next-reg').classList.add('hidden');
        
        // Mostrar Paso Final con texto dinámico
        const finishSection = document.getElementById('reg-step-finish');
        const header = document.getElementById('finish-header');
        const text = document.getElementById('finish-text');
        const iconContainer = document.getElementById('finish-icon');
        
        finishSection.classList.remove('hidden');
        document.getElementById('btn-final-reg').classList.remove('hidden');

        if(currentRegMode === 'passenger') {
            // Lógica para PASAJERO
            header.innerHTML = '¡REGISTRO <span class="text-red-600">EXITOSO!</span>';
            text.innerHTML = 'Tu cuenta ha sido activada.<br>Ya puedes solicitar tu primer viaje con la tarifa más justa.';
            iconContainer.innerHTML = '<i data-lucide="party-popper" class="text-red-600 w-10 h-10"></i>';
            
            // Guardar en DB local (Simulado)
            saveUser(name, 'activo');
        } else {
            // Lógica para CONDUCTOR
            header.innerHTML = 'REVISIÓN EN <span class="text-red-600">PROGRESO</span>';
            text.innerHTML = 'Estamos validando tus documentos.<br>Recibirás una notificación en menos de 24 horas.';
            iconContainer.innerHTML = '<i data-lucide="hourglass" class="text-red-600 w-10 h-10 animate-spin"></i>';
            
            saveUser(name, 'pendiente');
        }
        lucide.createIcons();
    }

    function saveUser(name, status) {
        const db = JSON.parse(localStorage.getItem('db_usuarios_permanente') || '[]');
        db.push({
            id: Date.now(),
            name: name,
            user: document.getElementById('reg-user').value,
            pass: document.getElementById('reg-pass-new').value,
            phone: document.getElementById('reg-phone').value,
            role: currentRegMode,
            status: status
        });
        localStorage.setItem('db_usuarios_permanente', JSON.stringify(db));
    }

    function handleAuth() {
        const user = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;

        if(user === 'admincentral' && pass === '9271@') {
            alert("Acceso Admin concedido");
            // Aquí iría la lógica de redirección al panel de administración
        } else {
            const db = JSON.parse(localStorage.getItem('db_usuarios_permanente') || '[]');
            const found = db.find(u => u.user === user && u.pass === pass);
            if(found) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('passenger-view').classList.remove('hidden');
                document.getElementById('nav-passenger').classList.remove('hidden');
                document.getElementById('side-role').innerText = `Pasajero: ${found.name}`;
            } else {
                alert("Credenciales inválidas");
            }
        }
        lucide.createIcons();
    }
</script>
</body>
</html>
