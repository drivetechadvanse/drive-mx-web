<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Panel Dinámico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        
        .map-bg { 
            background-color: #f3f4f6; 
            background-image: radial-gradient(#d1d5db 0.8px, transparent 0.8px); 
            background-size: 20px 20px; 
        }

        .wallet-card {
            background: linear-gradient(135deg, #111827 0%, #000000 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
        }
        #sidebar.open { transform: translateX(0); }
        
        #overlay {
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        #overlay.show { opacity: 1; pointer-events: auto; }

        /* Animación para el cambio de contenido */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-900">

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="overlay" onclick="toggleMenu()" class="absolute inset-0 bg-black/40 z-[100]"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-8 bg-gray-900 text-white">
            <div class="w-12 h-12 bg-red-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg">
                <i data-lucide="shield-check" id="sidebar-icon" class="text-white w-6 h-6"></i>
            </div>
            <p class="font-black text-xl italic uppercase tracking-tighter">Drive <span class="text-red-600">MX</span></p>
            <p id="sidebar-user-role" class="text-[10px] text-gray-400 font-bold mt-1 uppercase tracking-widest">Cargando...</p>
        </div>
        
        <nav class="flex-1 p-6 space-y-2" id="sidebar-options">
            </nav>

        <div class="p-6 border-t border-gray-100">
            <button onclick="location.reload()" class="w-full flex items-center gap-4 p-4 text-red-600 font-black hover:bg-red-50 rounded-2xl transition-colors uppercase text-xs italic">
                <i data-lucide="power" class="w-5 h-5"></i> Cerrar Sesión
            </button>
        </div>
    </div>

    <div id="splash" class="absolute inset-0 z-[120] bg-white flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-24 h-24 bg-red-600 rounded-[2.5rem] flex items-center justify-center animate-bounce">
            <i data-lucide="navigation" class="text-white w-12 h-12"></i>
        </div>
        <h1 class="text-4xl font-black mt-6 tracking-tighter italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <h2 class="text-4xl font-black text-gray-900 leading-none mb-10 italic uppercase tracking-tighter">ACCESO<br><span class="text-red-600">DRIVE MX</span></h2>
        <div class="space-y-4">
            <input type="email" id="email-input" placeholder="Usuario" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-red-600 font-medium">
            <input type="password" id="pass-input" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-red-600 font-medium">
            <button onclick="attemptLogin()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg uppercase tracking-widest">Entrar</button>
        </div>
    </div>

    <div id="passenger-app" class="hidden h-screen flex flex-col">
        <header class="p-4 flex items-center justify-between border-b bg-white z-10">
            <button onclick="toggleMenu()" class="p-2 bg-gray-50 rounded-xl"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <h2 class="text-2xl font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 bg-gray-200 rounded-full"></div>
        </header>
        <main class="flex-1 map-bg relative">
            <div class="absolute inset-0 flex items-center justify-center"><div class="bg-red-600 p-3 rounded-2xl shadow-xl"><i data-lucide="navigation" class="text-white w-5 h-5"></i></div></div>
        </main>
        <div class="p-4 bg-white shadow-xl">
            <div class="wallet-card rounded-[2rem] p-5 text-white flex justify-between items-center">
                <p class="text-xs font-bold uppercase">Saldo:</p>
                <h3 id="p-balance" class="text-xl font-black italic">$0.00</h3>
            </div>
        </div>
    </div>

    <div id="admin-app" class="hidden h-screen flex flex-col bg-gray-50">
        <header class="p-4 flex items-center justify-between border-b bg-gray-900 text-white z-10">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="p-2 bg-white/10 rounded-xl hover:bg-white/20"><i data-lucide="menu" class="w-6 h-6"></i></button>
                <h2 class="text-xl font-black italic uppercase text-red-600 tracking-tighter">SISTEMA <span class="text-white">MAESTRO</span></h2>
            </div>
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        </header>

        <main id="admin-content" class="flex-1 p-6 overflow-y-auto fade-in">
            </main>
    </div>

</div>

<script>
    lucide.createIcons();

    setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('login-screen').classList.remove('hidden');
    }, 2000);

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }

    function attemptLogin() {
        const email = document.getElementById('email-input').value;
        const pass = document.getElementById('pass-input').value;

        if (email === 'admin@app.com' && pass === '123') {
            setupSidebar("ADMINISTRADOR", "shield-check");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-app').classList.remove('hidden');
            switchAdminView('dashboard'); // Vista por defecto
        } else if (email === 'juan@app.com' && pass === '123') {
            setupSidebar("JUAN PASAJERO", "user");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('passenger-app').classList.remove('hidden');
            document.getElementById('p-balance').innerText = "$50.00";
        } else {
            alert("Acceso denegado");
        }
        lucide.createIcons();
    }

    function setupSidebar(role, icon) {
        document.getElementById('sidebar-user-role').innerText = role;
        document.getElementById('sidebar-icon').setAttribute('data-lucide', icon);
        
        const options = document.getElementById('sidebar-options');
        if(role === "ADMINISTRADOR") {
            options.innerHTML = `
                <button onclick="switchAdminView('dashboard')" class="w-full flex items-center gap-4 p-4 text-gray-700 font-bold hover:bg-gray-50 rounded-2xl"><i data-lucide="layout-dashboard"></i> Resumen</button>
                <button onclick="switchAdminView('users')" class="w-full flex items-center gap-4 p-4 text-gray-700 font-bold hover:bg-gray-50 rounded-2xl"><i data-lucide="users"></i> Pasajeros</button>
                <button onclick="switchAdminView('stats')" class="w-full flex items-center gap-4 p-4 text-gray-700 font-bold hover:bg-gray-50 rounded-2xl"><i data-lucide="bar-chart"></i> Métricas</button>
            `;
        } else {
            options.innerHTML = `
                <button class="w-full flex items-center gap-4 p-4 text-gray-700 font-bold hover:bg-gray-50 rounded-2xl"><i data-lucide="history"></i> Mis Viajes</button>
            `;
        }
        lucide.createIcons();
    }

    // FUNCIÓN PARA CAMBIAR EL CONTENIDO DEL PANEL DE CONTROL
    function switchAdminView(view) {
        const container = document.getElementById('admin-content');
        container.innerHTML = ""; // Limpiar pantalla
        toggleMenu(); // Cerrar sidebar al seleccionar

        if(view === 'dashboard') {
            container.innerHTML = `
                <div class="space-y-6">
                    <h3 class="text-2xl font-black italic tracking-tighter uppercase">RESUMEN <span class="text-red-600">GENERAL</span></h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                            <p class="text-[10px] font-black text-gray-400 uppercase mb-1">Viajes Hoy</p>
                            <p class="text-2xl font-black">42</p>
                        </div>
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                            <p class="text-[10px] font-black text-gray-400 uppercase mb-1">Ganancia</p>
                            <p class="text-2xl font-black text-green-500">$2,450</p>
                        </div>
                    </div>
                </div>
            `;
        } else if(view === 'users') {
            container.innerHTML = `
                <div class="space-y-6">
                    <h3 class="text-2xl font-black italic tracking-tighter uppercase">GESTIÓN DE <span class="text-red-600">PASAJEROS</span></h3>
                    <div class="bg-white p-4 rounded-[2rem] shadow-sm border border-gray-100 flex items-center justify-between">
                        <p class="font-black text-sm">Juan Pasajero</p>
                        <div class="flex gap-2">
                            <input type="number" placeholder="$" class="w-12 bg-gray-50 border rounded-lg text-xs p-1 text-center">
                            <button class="bg-red-600 text-white p-2 rounded-xl"><i data-lucide="check" class="w-3 h-3"></i></button>
                        </div>
                    </div>
                </div>
            `;
        } else if(view === 'stats') {
            container.innerHTML = `
                <div class="space-y-6">
                    <h3 class="text-2xl font-black italic tracking-tighter uppercase text-center mt-20">MÉTRICAS <span class="text-red-600">PRÓXIMAMENTE</span></h3>
                    <p class="text-center text-gray-400 text-sm">Estamos procesando los datos de la flota.</p>
                </div>
            `;
        }
        lucide.createIcons();
    }
</script>
</body>
</html>
