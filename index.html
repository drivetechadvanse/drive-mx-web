<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        
        .map-bg { 
            background-color: #f3f4f6; 
            background-image: radial-gradient(#d1d5db 0.8px, transparent 0.8px); 
            background-size: 20px 20px; 
        }

        #sidebar { 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            transform: translateX(-100%); 
        }
        #sidebar.open { transform: translateX(0); }
        
        #overlay { 
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        #overlay.open { 
            opacity: 1;
            pointer-events: auto;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body class="bg-gray-900">

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="splash" class="absolute inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-24 h-24 bg-red-600 rounded-[2rem] flex items-center justify-center shadow-2xl animate-bounce">
            <i data-lucide="navigation" class="text-white w-12 h-12"></i>
        </div>
        <h1 class="text-4xl font-black mt-6 tracking-tighter italic">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <h2 class="text-4xl font-black text-gray-900 leading-none mb-10">HOLA,<br><span class="text-red-600">BIENVENIDO</span></h2>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Correo (admin@app.com)" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-red-600">
            <input type="password" id="password" placeholder="Contraseña (123)" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-red-600">
            <button onclick="validateLogin()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-red-200">ENTRAR</button>
        </div>
    </div>

    <div id="overlay" class="absolute inset-0 z-[60] bg-black/40" onclick="toggleSidebar()"></div>
    <div id="sidebar" class="absolute inset-y-0 left-0 z-[70] w-72 bg-white shadow-2xl flex flex-col">
        <div class="p-8 bg-gray-900 text-white">
            <h3 class="font-black text-xl italic">DRIVE <span class="text-red-600">MX</span></h3>
        </div>
        <nav class="flex-1 p-6 space-y-2">
            <button class="w-full flex items-center gap-4 p-4 rounded-xl font-bold text-gray-700"><i data-lucide="user"></i> Perfil</button>
            <button class="w-full flex items-center gap-4 p-4 rounded-xl font-bold text-gray-700"><i data-lucide="wallet"></i> Billetera</button>
            <hr>
            <button onclick="logout()" class="w-full flex items-center gap-4 p-4 rounded-xl text-red-600 font-bold"><i data-lucide="log-out"></i> Salir</button>
        </nav>
    </div>

    <div id="main-app" class="hidden h-screen flex flex-col">
        <header class="p-4 flex items-center justify-between border-b bg-white z-10">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-xl transition-colors">
                    <i data-lucide="menu" class="w-7 h-7 text-gray-900"></i>
                </button>
                <h2 class="text-2xl font-black italic tracking-tighter">DRIVE <span class="text-red-600">MX</span></h2>
            </div>
            <i data-lucide="bell" class="w-6 h-6 text-gray-400"></i>
        </header>

        <main class="flex-1 overflow-y-auto relative">
            <div class="h-80 map-bg relative border-b border-gray-200 overflow-hidden">
                
                <div class="absolute top-4 left-4 right-4 z-10">
                    <div class="glass-card p-3 rounded-2xl shadow-xl flex items-center gap-3">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <div class="flex-1">
                            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Recoger en:</p>
                            <p class="text-xs font-black text-gray-800 truncate">Mi ubicación actual (Cargando GPS...)</p>
                        </div>
                    </div>
                </div>

                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div class="bg-red-600 p-3 rounded-2xl shadow-2xl shadow-red-200 border-4 border-white">
                        <i data-lucide="navigation" class="text-white w-6 h-6"></i>
                    </div>
                </div>

                <div class="absolute bottom-4 left-4 right-4 z-10">
                    <div class="glass-card p-4 rounded-2xl shadow-2xl border-2 border-red-100">
                        <div class="flex items-center gap-4">
                            <div class="bg-red-600 w-8 h-8 rounded-lg flex items-center justify-center shadow-lg">
                                <i data-lucide="search" class="text-white w-4 h-4"></i>
                            </div>
                            <input type="text" placeholder="¿A dónde vamos?" class="bg-transparent w-full outline-none font-black text-gray-900 text-lg placeholder:text-gray-300">
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-6">
                <div class="bg-gray-900 rounded-[2.5rem] p-6 text-white mb-8">
                    <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-1">Saldo</p>
                    <h3 class="text-4xl font-black italic">$1,250.00</h3>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="border-2 border-red-600 bg-red-50 p-5 rounded-[2rem]">
                        <i data-lucide="car" class="text-red-600 w-8 h-8 mb-2"></i>
                        <p class="font-black">Auto MX</p>
                    </div>
                    <div class="border border-gray-100 p-5 rounded-[2rem]">
                        <i data-lucide="bike" class="text-gray-400 w-8 h-8 mb-2"></i>
                        <p class="font-black">Moto MX</p>
                    </div>
                </div>
            </div>
        </main>
        
        <nav class="p-6 border-t flex justify-around bg-white">
            <i data-lucide="home" class="text-red-600 w-6 h-6"></i>
            <i data-lucide="send" class="text-gray-300 w-6 h-6"></i>
            <i data-lucide="user" class="text-gray-300 w-6 h-6"></i>
        </nav>
    </div>
</div>

<script>
    lucide.createIcons();

    setTimeout(() => {
        const splash = document.getElementById('splash');
        splash.classList.add('opacity-0');
        setTimeout(() => {
            splash.style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }, 700);
    }, 2000);

    function validateLogin() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        if (email === 'admin@app.com' && pass === '123') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            lucide.createIcons();
        } else {
            alert("Acceso Denegado");
        }
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
        lucide.createIcons();
    }

    function logout() { location.reload(); }
</script>
</body>
</html>
