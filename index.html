<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Global Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; transition: all 0.6s ease; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }

        /* Acordeón Usuarios */
        #user-submenu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        #user-submenu.open { max-height: 150px; }
        
        /* Animación de Radar */
        .radar-pulse {
            position: absolute; width: 100px; height: 100px;
            background: rgba(239, 68, 68, 0.15); border-radius: 100%;
            animation: radar 2s infinite;
        }
        @keyframes radar { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .payment-opt.selected { border: 1.5px solid #ef4444; background: #fef2f2; color: #ef4444; }
        .hidden-view { opacity: 0; transform: translateY(-20px); pointer-events: none; transition: all 0.4s ease; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3"><i data-lucide="cpu" class="w-6 h-6"></i></div>
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-500 font-bold uppercase italic">Console v1.0</p>
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <div class="border-b border-gray-50 pb-2">
                <button onclick="toggleUserSubmenu()" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="users" class="w-4 h-4 text-red-600"></i><span>Usuarios</span></div>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div id="user-submenu">
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 italic">Conductores</button>
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 italic">Pasajeros</button>
                    <button class="w-full text-left p-2.5 pl-9 text-[9px] font-bold text-gray-500 uppercase hover:text-red-600 italic">Administradores</button>
                </div>
            </div>
        </nav>
        <div class="p-4 border-t"><button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button></div>
    </div>

    <div id="passenger-view" class="h-screen flex flex-col relative">
        <header id="p-header" class="px-4 py-3 flex items-center justify-between border-b bg-white z-10">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600 text-lg">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-100 border"></div>
        </header>

        <main class="flex-1 relative map-sim overflow-hidden">
            <div id="p-banners" class="absolute top-4 left-4 right-4 z-20 space-y-2">
                <div class="bg-white/90 backdrop-blur p-2 rounded-xl shadow border flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_5px_#22c55e]"></div>
                    <p class="text-[9px] font-black text-gray-800 uppercase italic">Tu Ubicación: <span class="text-gray-400">Punto detectado</span></p>
                </div>
                <div onclick="openCosts()" class="bg-white p-1 rounded-xl shadow-xl flex items-center gap-2 cursor-pointer border border-black/5 hover:border-red-600/30">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="radar" class="hidden">
                    <div class="radar-pulse"></div>
                    <div class="radar-pulse" style="animation-delay: 0.5s"></div>
                </div>
                <div class="text-center relative z-10">
                    <div class="bg-red-600 p-3 rounded-2xl shadow-2xl border-4 border-white mb-2 inline-block"><i data-lucide="navigation" class="text-white w-5 h-5"></i></div>
                    <div id="search-msg" class="hidden bg-black text-white text-[7px] font-black uppercase px-3 py-1.5 rounded-full italic animate-pulse">Buscando Conductor</div>
                </div>
            </div>

            <div id="p-wallet" class="absolute bottom-4 left-4 right-4">
                <div class="bg-black rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-red-600/10 rounded-lg flex items-center justify-center border border-red-600/30 text-red-600"><i data-lucide="wallet" class="w-4 h-4"></i></div>
                        <div><p class="text-[7px] text-gray-500 font-black uppercase italic">Saldo</p><h3 class="text-sm font-black italic">$50.00</h3></div>
                    </div>
                    <div class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_#22c55e]"></div>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-6 space-y-4">
            <div class="w-8 h-1 bg-gray-200 rounded-full mx-auto -mt-2"></div>
            <h3 class="text-lg font-black italic uppercase">FORMA DE <span class="text-red-600 text-base">PAGO</span></h3>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setPay(this)" class="payment-opt selected p-2.5 rounded-xl border flex flex-col items-center gap-1"><i data-lucide="banknote" class="w-4 h-4"></i><span class="text-[8px] font-black uppercase italic">Efectivo</span></button>
                <button onclick="setPay(this)" class="payment-opt p-2.5 rounded-xl border flex flex-col items-center gap-1"><i data-lucide="send" class="w-4 h-4"></i><span class="text-[8px] font-black uppercase italic">SPEI</span></button>
                <button onclick="setPay(this)" class="payment-opt p-2.5 rounded-xl border flex flex-col items-center gap-1"><i data-lucide="credit-card" class="w-4 h-4"></i><span class="text-[8px] font-black uppercase italic">Cartera</span></button>
            </div>
            <button onclick="startRadar()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[10px] uppercase italic shadow-lg active:scale-95 transition-all">SOLICITAR AHORA</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    function openMenu() {
        document.getElementById('sidebar').classList.add('open');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeAll() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('cost-sheet').classList.remove('active');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }

    function openCosts() {
        document.getElementById('cost-sheet').classList.add('active');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    function toggleUserSubmenu() {
        document.getElementById('user-submenu').classList.toggle('open');
    }

    function setPay(btn) {
        document.querySelectorAll('.payment-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function startRadar() {
        closeAll();
        document.getElementById('p-header').classList.add('hidden-view');
        document.getElementById('p-banners').classList.add('hidden-view');
        document.getElementById('p-wallet').classList.add('hidden-view');
        
        setTimeout(() => {
            document.getElementById('radar').classList.remove('hidden');
            document.getElementById('search-msg').classList.remove('hidden');
        }, 600);
    }
</script>
</body>
</html>
