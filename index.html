<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive MX | Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: 100dvh; }
        #app-container { height: 100dvh; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); padding-bottom: env(safe-area-inset-bottom, 2rem); }
        #cost-sheet.active { transform: translateY(0); }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; flex-grow: 1; }
        .reg-input { width: 100%; padding: 1rem; background-color: #f9fafb; border-radius: 0.75rem; border: 2px solid transparent; outline: none; font-size: 0.75rem; font-weight: 700; }
        .reg-input:focus { border-color: #ef4444; background-color: #fff; }
        .reg-label { font-size: 9px; font-weight: 900; color: #9ca3af; text-transform: uppercase; margin-bottom: 0.4rem; display: block; margin-left: 0.5rem; }
        .payment-opt.selected { border-color: #ef4444; background-color: #fef2f2; color: #ef4444; }
        .ping-slow { animation: ping 3s cubic-bezier(0, 0, 0.2, 1) infinite; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <!-- Splash Screen -->
    <div id="splash" class="absolute inset-0 z-[250] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center animate-pulse"><i data-lucide="navigation" class="text-white w-8 h-8"></i></div>
        <h1 class="text-2xl font-black mt-6 italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <!-- Menú Lateral General (Pasajero/Admin) -->
    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div id="user-profile-header" class="hidden p-6 bg-gray-900 text-white flex flex-col items-center text-center">
            <div class="relative mb-3">
                <img id="side-user-photo" src="" class="w-20 h-20 rounded-full object-cover border-4 border-red-600 shadow-xl bg-gray-800">
            </div>
            <h3 id="side-user-name" class="text-sm font-black uppercase italic">Usuario</h3>
            <p id="side-user-trips-info" class="text-[10px] text-gray-400 font-bold uppercase mt-1">Viajes: <span id="side-user-trips" class="text-white">0</span></p>
        </div>

        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <div id="nav-passenger" class="hidden">
                <button onclick="applyToBeDriver()" class="w-full flex items-center gap-3 p-3 text-red-600 font-black hover:bg-red-50 rounded-xl uppercase text-[10px] italic">
                    <i data-lucide="car" class="w-4 h-4"></i><span>Quiero ser Conductor</span>
                </button>
                <button class="w-full flex items-center gap-3 p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <i data-lucide="history" class="w-4 h-4"></i><span>Mis Viajes</span>
                </button>
            </div>
        </nav>
        <div class="p-4 border-t mb-4">
            <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="hidden absolute inset-0 z-[150] bg-white p-8 flex flex-col items-center justify-center text-center">
        <div class="w-12 h-12 bg-red-600 rounded-xl mb-6 shadow-lg flex items-center justify-center">
            <i data-lucide="navigation" class="text-white w-6 h-6"></i>
        </div>
        <h2 class="text-3xl font-black italic uppercase mb-12 leading-none">BIENVENIDO</h2>
        <div class="space-y-4 w-full">
            <input type="text" id="login-email" placeholder="Usuario o Correo" class="reg-input">
            <input type="password" id="login-pass" placeholder="Contraseña" class="reg-input">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic">Ingresar</button>
        </div>
    </div>

    <!-- Vista Pasajero -->
    <div id="passenger-view" class="hidden h-full flex flex-col relative">
        <header id="p-header" class="px-4 py-3 flex items-center justify-between border-b bg-white z-10 shrink-0">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center">
                <i data-lucide="user" class="text-white w-4 h-4"></i>
            </div>
        </header>
        <main class="flex-1 map-sim relative overflow-hidden flex flex-col">
            <div id="p-banners" class="absolute top-4 left-4 right-4 z-20">
                <div onclick="openCosts()" class="bg-white p-1 rounded-xl shadow-2xl flex items-center gap-2 cursor-pointer border border-black/5">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase">¿A dónde vamos hoy?</span>
                </div>
            </div>
            <div id="p-wallet" class="absolute bottom-6 left-4 right-4 z-30">
                <div class="bg-gray-900 rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-600/20 rounded-xl flex items-center justify-center text-red-600"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div>
                            <p class="text-[8px] text-gray-500 font-black uppercase italic">Tu Cartera</p>
                            <h3 id="display-saldo" class="text-sm font-black italic">$0.00 MXN</h3>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Bottom Sheet Pagos -->
        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-8 pt-6 space-y-5">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-2"></div>
            <h3 class="text-lg font-black italic uppercase text-center">FORMA DE PAGO</h3>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="setPay(this, 'efectivo')" class="payment-opt selected p-4 rounded-2xl border flex flex-col items-center gap-2"><i data-lucide="banknote" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">Efectivo</span></button>
                <button onclick="setPay(this, 'spei')" class="payment-opt p-4 rounded-2xl border flex flex-col items-center gap-2"><i data-lucide="send" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">SPEI</span></button>
                <button onclick="setPay(this, 'cartera')" class="payment-opt p-4 rounded-2xl border flex flex-col items-center gap-2"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">Cartera</span></button>
            </div>
            <button onclick="alert('Buscando Conductor...'); closeAll();" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[12px] uppercase italic">CONFIRMAR SOLICITUD</button>
        </div>
    </div>

    <!-- Panel Operativo Conductor -->
    <div id="driver-view-active" class="hidden h-full flex flex-col bg-gray-50 relative">
        
        <!-- Sidebar Específico del Conductor -->
        <div id="driver-sidebar" class="absolute inset-y-0 left-0 w-72 bg-white shadow-2xl z-[200] transform -translate-x-full transition-transform duration-300">
            <div class="p-5 border-b flex items-center justify-between">
                <h3 class="text-xs font-black italic uppercase text-gray-800">Menú Driver</h3>
                <button onclick="closeDriverSidebar()" class="p-2 rounded-lg bg-gray-100"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-4">
                <!-- Botón solicitado: Redirección limpia a Pasajero sin mezclar estados -->
                <button onclick="openPassengerFromDriver()" class="w-full flex items-center gap-3 bg-gray-100 hover:bg-gray-200 transition-all rounded-2xl px-4 py-4 text-left">
                    <i data-lucide="users" class="w-5 h-5 text-red-600"></i>
                    <span class="text-[11px] font-black uppercase italic text-gray-800">Pasajero</span>
                </button>
            </div>
            <div class="p-4 border-t mt-auto">
                <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button>
            </div>
        </div>

        <div id="driver-sidebar-overlay" onclick="closeDriverSidebar()" class="hidden absolute inset-0 bg-black/40 z-[190]"></div>

        <header class="px-4 py-3 flex items-center justify-between border-b bg-gray-900 text-white z-10 shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="openDriverSidebar()" class="p-2 rounded-lg bg-white/10"><i data-lucide="menu" class="w-5 h-5"></i></button>
                <div class="w-8 h-8 rounded-full border-2 border-red-600 overflow-hidden bg-gray-800">
                    <img id="active-driver-photo" src="" class="w-full h-full object-cover">
                </div>
                <h2 class="text-xs font-black italic uppercase">Panel <span class="text-red-600">Driver</span></h2>
            </div>
            <button onclick="toggleDriverAvailability()" id="status-badge" class="flex items-center gap-2 bg-red-600/20 px-3 py-1 rounded-full border border-red-600/30">
                <div id="status-dot" class="w-2 h-2 rounded-full bg-red-600"></div>
                <span id="status-text" class="text-[9px] font-black uppercase italic text-red-600">No Disponible</span>
            </button>
        </header>

        <main class="flex-1 flex flex-col p-6 space-y-6 overflow-y-auto">
            <div class="flex flex-col items-center justify-center py-6">
                <div id="search-pulse-driver" class="hidden w-16 h-16 bg-red-600 rounded-full flex items-center justify-center text-white mb-4 ping-slow">
                    <i data-lucide="radar" class="w-8 h-8"></i>
                </div>
                <h3 id="driver-main-msg" class="text-sm font-black italic uppercase text-gray-900 text-center">Buscando viajes cercanos</h3>
            </div>
        </main>
    </div>

    <!-- Registro Unificado Driver -->
    <div id="driver-registration-view" class="hidden absolute inset-0 z-[200] bg-white flex flex-col">
        <header class="px-4 py-4 flex items-center border-b bg-white">
            <button onclick="handleDriverBack()" class="p-2"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
            <h2 class="ml-3 text-lg font-black italic uppercase">REGISTRO <span class="text-red-600">DRIVER</span></h2>
        </header>
        <div class="flex-1 overflow-y-auto p-6 space-y-4">
            <div><label class="reg-label">Nombre Completo</label><input type="text" id="dr-name" class="reg-input"></div>
            <div><label class="reg-label">Usuario</label><input type="text" id="reg-user" class="reg-input"></div>
            <div><label class="reg-label">Contraseña</label><input type="password" id="reg-pass" class="reg-input"></div>
            <button onclick="saveDriverRequest()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase italic shadow-lg mt-4">Confirmar y Activar</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    let currentUser = null;
    let isAvailable = false;

    // Splash Screen Logic
    setTimeout(() => { 
        document.getElementById('splash').style.opacity = '0'; 
        setTimeout(() => { 
            document.getElementById('splash').style.display = 'none'; 
            document.getElementById('login-screen').classList.remove('hidden'); 
        }, 500); 
    }, 1500);

    // Wallet Mock
    function getWallet(id) { return JSON.parse(localStorage.getItem(`wallet_${id}`)) || { saldo: 0, trips: 0 }; }

    // FUNCIONALIDAD CORE: Redirección Limpia de Driver a Pasajero
    function openPassengerFromDriver() {
        // 1. Cerrar sidebars y estados visuales del conductor
        closeDriverSidebar();
        closeAll();
        isAvailable = false; 
        updateDriverStatusUI();

        // 2. Ocultar estrictamente todos los paneles de conductores sin dejar rastro
        const driverPanels = ['driver-view-active', 'driver-registration-view'];
        driverPanels.forEach(id => document.getElementById(id).classList.add('hidden'));

        // 3. Mostrar estrictamente los paneles de pasajeros
        document.getElementById('passenger-view').classList.remove('hidden');
        document.getElementById('nav-passenger').classList.remove('hidden');
        document.getElementById('user-profile-header').classList.remove('hidden');

        // 4. Cambiar rol en el objeto de sesión (evita mezclas lógicas)
        if(currentUser) currentUser.role = 'pasajero';

        // 5. Refrescar interfaz y iconos
        updateProfileUI();
        lucide.createIcons();
    }

    function updateDriverStatusUI() {
        const badge = document.getElementById('status-badge');
        const dot = document.getElementById('status-dot');
        const txt = document.getElementById('status-text');
        const pulse = document.getElementById('search-pulse-driver');

        if(isAvailable) {
            badge.className = "flex items-center gap-2 bg-green-600/20 px-3 py-1 rounded-full border border-green-600/30";
            dot.className = "w-2 h-2 rounded-full bg-green-500";
            txt.innerText = "Disponible";
            txt.className = "text-[9px] font-black uppercase italic text-green-500";
            pulse.classList.remove('hidden');
        } else {
            badge.className = "flex items-center gap-2 bg-red-600/20 px-3 py-1 rounded-full border border-red-600/30";
            dot.className = "w-2 h-2 rounded-full bg-red-600";
            txt.innerText = "No Disponible";
            txt.className = "text-[9px] font-black uppercase italic text-red-600";
            pulse.classList.add('hidden');
        }
    }

    function toggleDriverAvailability() {
        isAvailable = !isAvailable;
        updateDriverStatusUI();
    }

    // Auth Logic
    function handleAuth() {
        const u = document.getElementById('login-email').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        const db = JSON.parse(localStorage.getItem('db_usuarios_permanente') || '[]');
        const user = db.find(x => x.usuario === u && x.pass === p);

        if(user) {
            currentUser = user;
            document.getElementById('login-screen').classList.add('hidden');
            if(user.role === 'conductor') {
                document.getElementById('driver-view-active').classList.remove('hidden');
                document.getElementById('active-driver-photo').src = user.foto || '';
            } else {
                document.getElementById('passenger-view').classList.remove('hidden');
                document.getElementById('nav-passenger').classList.remove('hidden');
                document.getElementById('user-profile-header').classList.remove('hidden');
                updateProfileUI();
            }
        } else { alert('Usuario no encontrado'); }
        lucide.createIcons();
    }

    function updateProfileUI() {
        if(!currentUser) return;
        document.getElementById('side-user-name').innerText = currentUser.name;
        const w = getWallet(currentUser.id);
        document.getElementById('display-saldo').innerText = `$${w.saldo.toFixed(2)} MXN`;
        document.getElementById('side-user-trips').innerText = w.trips;
    }

    // Sidebar & Menus
    function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function openDriverSidebar() { document.getElementById('driver-sidebar').classList.remove('-translate-x-full'); document.getElementById('driver-sidebar-overlay').classList.remove('hidden'); }
    function closeDriverSidebar() { document.getElementById('driver-sidebar').classList.add('-translate-x-full'); document.getElementById('driver-sidebar-overlay').classList.add('hidden'); }
    function closeAll() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('cost-sheet').classList.remove('active'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }
    function openCosts() { document.getElementById('cost-sheet').classList.add('active'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function setPay(btn, method) { document.querySelectorAll('.payment-opt').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); }

    // Registro Driver Corregido
    function saveDriverRequest() {
        const id = "DRV_" + Date.now();
        const newUser = {
            id: id,
            name: document.getElementById('dr-name').value,
            usuario: document.getElementById('reg-user').value,
            pass: document.getElementById('reg-pass').value,
            role: 'conductor',
            foto: ''
        };
        let db = JSON.parse(localStorage.getItem('db_usuarios_permanente') || '[]');
        db.push(newUser);
        localStorage.setItem('db_usuarios_permanente', JSON.stringify(db));
        alert('Driver registrado con éxito. Ya puedes ingresar.');
        location.reload();
    }

    function applyToBeDriver() {
        closeAll();
        document.getElementById('passenger-view').classList.add('hidden');
        document.getElementById('driver-registration-view').classList.remove('hidden');
    }

    function handleDriverBack() { document.getElementById('driver-registration-view').classList.add('hidden'); document.getElementById('login-screen').classList.remove('hidden'); }
</script>

</body>
</html>
