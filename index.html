<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive MX | Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: 100dvh; }
        #app-container { height: 100dvh; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); padding-bottom: env(safe-area-inset-bottom, 2rem); }
        #cost-sheet.active { transform: translateY(0); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .accordion-content.expanded { max-height: 800px; }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; flex-grow: 1; }
        .hidden-view { opacity: 0; transform: translateY(-20px); pointer-events: none; transition: all 0.4s ease; }
        .payment-opt.selected { border-color: #ef4444; background-color: #fef2f2; color: #ef4444; }
        .reg-input { width: 100%; padding: 1rem; background-color: #f9fafb; border-radius: 0.75rem; border: 2px solid transparent; outline: none; font-size: 0.75rem; font-weight: 700; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    
    <div id="splash" class="absolute inset-0 z-[250] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center animate-pulse"><i data-lucide="navigation" class="text-white w-8 h-8"></i></div>
        <h1 class="text-2xl font-black mt-6 italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3"><i data-lucide="cpu" class="w-6 h-6"></i></div>
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600 text-lg">MX</span></h2>
            <p id="side-role" class="text-[8px] text-gray-400 font-bold uppercase tracking-widest italic">Sesión activa</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <div id="nav-admin" class="hidden">
                <button onclick="toggleAccordion('admin-acc')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="users" class="text-red-600 w-4 h-4"></i><span>Gestión de Usuarios</span></div>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div id="admin-acc" class="accordion-content bg-gray-50/50 rounded-xl">
                    <button class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase border-b border-white">Conductores</button>
                    <button class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase border-b border-white">Pasajeros</button>
                </div>

                <button onclick="toggleAccordion('wallet-admin-acc')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic mt-2">
                    <div class="flex items-center gap-3"><i data-lucide="wallet" class="text-red-600 w-4 h-4"></i><span>Cartera</span></div>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div id="wallet-admin-acc" class="accordion-content bg-gray-50/50 rounded-xl p-4 space-y-4">
                    <div>
                        <label class="text-[8px] font-black uppercase text-gray-400">Buscar Usuario</label>
                        <input type="text" value="Fernando Garduño" readonly class="reg-input text-[10px] bg-white border-gray-200 mt-1">
                    </div>
                    <div class="bg-white p-3 rounded-xl border border-gray-200">
                        <p class="text-[8px] font-black text-gray-400 uppercase italic">Saldo Actual</p>
                        <h4 id="admin-wallet-display" class="text-lg font-black italic text-gray-800">$0.00</h4>
                    </div>
                    <div class="space-y-2">
                        <input type="number" id="admin-amount" placeholder="Monto $0.00" class="reg-input text-center text-lg">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="adjustBalance('add')" class="bg-green-600 text-white py-2 rounded-lg font-black text-[9px] uppercase italic">Abonar</button>
                            <button onclick="adjustBalance('sub')" class="bg-red-600 text-white py-2 rounded-lg font-black text-[9px] uppercase italic">Descontar</button>
                        </div>
                    </div>
                    <div class="pt-2">
                        <p class="text-[8px] font-black text-gray-400 uppercase italic mb-2">Historial Reciente</p>
                        <div id="admin-history" class="space-y-2 max-h-40 overflow-y-auto"></div>
                    </div>
                </div>
            </div>
            <div id="nav-passenger" class="hidden">
                <button onclick="applyToBeDriver()" class="w-full flex items-center gap-3 p-3 text-red-600 font-black hover:bg-red-50 rounded-xl uppercase text-[10px] italic">
                    <i data-lucide="car" class="w-4 h-4"></i><span>Quiero ser Conductor</span>
                </button>
            </div>
        </nav>
        <div class="p-4 border-t mb-4">
            <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button>
        </div>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-[150] bg-white p-8 flex flex-col items-center justify-center text-center">
        <div class="w-12 h-12 bg-red-600 rounded-xl mb-6 flex items-center justify-center"><i data-lucide="navigation" class="text-white w-6 h-6"></i></div>
        <h2 class="text-3xl font-black italic uppercase mb-12 tracking-tighter">BIENVENIDO</h2>
        <div class="space-y-4 w-full">
            <input type="email" id="login-email" placeholder="Usuario (admin para panel)" class="reg-input text-left">
            <input type="password" id="login-pass" placeholder="Contraseña" class="reg-input text-left">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic shadow-lg active:scale-95 transition-all">Ingresar</button>
        </div>
    </div>

    <div id="admin-view" class="hidden h-full flex flex-col bg-gray-100">
        <header class="px-4 py-3 flex items-center justify-between bg-gray-900 text-white z-10 shrink-0">
            <button onclick="openMenu()" class="p-1.5 bg-white/10 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-red-600"></i></button>
            <h2 class="text-base font-black italic uppercase">PANEL <span class="text-red-600 text-lg">ADMIN</span></h2>
            <button onclick="location.reload()" class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center"><i data-lucide="log-out" class="w-4 h-4 text-white"></i></button>
        </header>
        <main class="flex-1 p-5 space-y-4 overflow-y-auto">
             <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <p class="text-[8px] font-black text-gray-400 uppercase italic mb-1">Estado General</p>
                <h4 class="text-xl font-black italic text-gray-800 uppercase">Monitor Activo</h4>
            </div>
            <p class="text-center text-[10px] font-bold text-gray-400 uppercase italic">Usa el menú lateral para gestionar la cartera</p>
        </main>
    </div>

    <div id="passenger-view" class="hidden h-full flex flex-col relative">
        <header id="p-header" class="px-4 py-3 flex items-center justify-between border-b bg-white z-10 shrink-0">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center"><i data-lucide="user" class="text-white w-4 h-4"></i></div>
        </header>
        
        <main class="flex-1 map-sim relative overflow-hidden flex flex-col">
            <div id="p-banners" class="absolute top-4 left-4 right-4 z-20 space-y-3">
                <div onclick="openCosts()" class="bg-gray-900 text-white p-3 rounded-2xl shadow-xl flex items-center justify-between border border-white/10 active:scale-95 transition-all">
                    <div class="flex items-center gap-3">
                        <div id="wallet-icon-bg" class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center"><i data-lucide="wallet" class="w-4 h-4"></i></div>
                        <div>
                            <p class="text-[7px] text-gray-400 font-black uppercase">Saldo Disponible</p>
                            <h3 id="user-wallet-banner" class="text-xs font-black italic">$0.00 MXN</h3>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
                </div>
            </div>

            <div id="p-wallet" class="absolute bottom-6 left-4 right-4 z-30">
                <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-2xl border border-gray-100">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-50 text-red-600 rounded-xl flex items-center justify-center border border-red-100"><i data-lucide="search" class="w-5 h-5"></i></div>
                        <div><p class="text-[8px] text-gray-400 font-black uppercase italic">¿A dónde vamos?</p><h3 class="text-sm font-black italic text-gray-800">Solicitar Viaje</h3></div>
                    </div>
                    <button onclick="openCosts()" class="bg-red-600 text-white px-4 py-2 rounded-lg font-black text-[10px] uppercase italic">Iniciar</button>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.15)] p-8 pt-6 space-y-5">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-2"></div>
            <div class="text-center">
                <h3 class="text-lg font-black italic uppercase tracking-tighter leading-none">TOTAL A PAGAR</h3>
                <h2 class="text-3xl font-black italic text-red-600 mt-1">$150.00</h2>
            </div>
            
            <div class="grid grid-cols-3 gap-3">
                <button onclick="seleccionarMetodoPago(this, 'Efectivo')" class="payment-opt p-4 rounded-2xl border flex flex-col items-center gap-2 transition-all"><i data-lucide="banknote" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">Efectivo</span></button>
                <button onclick="seleccionarMetodoPago(this, 'SPEI')" class="payment-opt p-4 rounded-2xl border flex flex-col items-center gap-2 transition-all"><i data-lucide="send" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">SPEI</span></button>
                <button id="btn-method-wallet" onclick="seleccionarMetodoPago(this, 'Cartera')" class="payment-opt selected p-4 rounded-2xl border flex flex-col items-center gap-2 transition-all"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[9px] font-black uppercase italic">Cartera</span></button>
            </div>
            
            <button onclick="handleConfirmarSolicitud()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[12px] uppercase italic shadow-xl active:scale-95 transition-all mb-4">CONFIRMAR SOLICITUD</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    // 1. LÓGICA DE DATOS (Simulación de DB)
    let userProfile = {
        id: "USR-001",
        nombre: "Fernando Garduño",
        saldo: 350.00
    };

    let transactions = [
        { id: 1, tipo: 'Recarga', monto: 350.00, fecha: '2026-04-28' }
    ];

    let metodoSeleccionado = "Cartera";
    const COSTO_VIAJE = 150.00;

    // 2. FUNCIONES DE CARTERA
    function updateUI() {
        // Actualizar UI Pasajero
        const banner = document.getElementById('user-wallet-banner');
        const iconBg = document.getElementById('wallet-icon-bg');
        banner.innerText = `$${userProfile.saldo.toFixed(2)} MXN`;
        
        // Estado visual (rojo si es negativo)
        if (userProfile.saldo < 0) {
            iconBg.classList.replace('bg-red-600', 'bg-red-800');
            banner.classList.add('text-red-500');
        } else {
            iconBg.classList.replace('bg-red-800', 'bg-red-600');
            banner.classList.remove('text-red-500');
        }

        // Actualizar UI Admin
        document.getElementById('admin-wallet-display').innerText = `$${userProfile.saldo.toFixed(2)}`;
        renderAdminHistory();
        lucide.createIcons();
    }

    function registrarTransaccion(tipo, monto) {
        const t = {
            id: Date.now(),
            tipo: tipo,
            monto: monto,
            fecha: new Date().toLocaleTimeString()
        };
        transactions.unshift(t);
        updateUI();
    }

    function adjustBalance(action) {
        const amountInput = document.getElementById('admin-amount');
        const val = parseFloat(amountInput.value);
        if (!val || val <= 0) return alert("Ingresa un monto válido");

        if (action === 'add') {
            userProfile.saldo += val;
            registrarTransaccion('Abono Admin', val);
        } else {
            userProfile.saldo -= val;
            registrarTransaccion('Ajuste Admin', -val);
        }
        amountInput.value = '';
    }

    function renderAdminHistory() {
        const container = document.getElementById('admin-history');
        container.innerHTML = transactions.map(t => `
            <div class="flex justify-between items-center bg-white p-2 rounded-lg border-b border-gray-100">
                <div>
                    <p class="text-[8px] font-black uppercase">${t.tipo}</p>
                    <p class="text-[7px] text-gray-400 font-bold">${t.fecha}</p>
                </div>
                <p class="text-[9px] font-black ${t.monto > 0 ? 'text-green-600' : 'text-red-600'}">
                    ${t.monto > 0 ? '+' : ''}${t.monto.toFixed(2)}
                </p>
            </div>
        `).join('');
    }

    // 3. INTEGRACIÓN CON VIAJES
    function seleccionarMetodoPago(btn, metodo) {
        document.querySelectorAll('.payment-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        metodoSeleccionado = metodo;
    }

    function handleConfirmarSolicitud() {
        if (metodoSeleccionado === "Cartera") {
            if (userProfile.saldo < COSTO_VIAJE) {
                alert("⚠️ SALDO INSUFICIENTE. Por favor recarga o usa otro método.");
                return;
            }
            // Procesar Pago
            userProfile.saldo -= COSTO_VIAJE;
            registrarTransaccion('Pago Viaje', -COSTO_VIAJE);
            alert("✅ Pago procesado con Cartera exitosamente.");
        } else {
            alert(`✅ Solicitud confirmada con pago en: ${metodoSeleccionado}`);
        }
        closeAll();
    }

    // Lógica de navegación preexistente
    setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('login-screen').classList.remove('hidden');
    }, 1000);

    function handleAuth() {
        const mail = document.getElementById('login-email').value.toLowerCase();
        document.getElementById('login-screen').classList.add('hidden');
        if(mail.includes('admin')){
            document.getElementById('admin-view').classList.remove('hidden');
            document.getElementById('nav-admin').classList.remove('hidden');
            document.getElementById('side-role').innerText = 'ADMINISTRADOR';
        } else {
            document.getElementById('passenger-view').classList.remove('hidden');
            document.getElementById('nav-passenger').classList.remove('hidden');
            document.getElementById('side-role').innerText = 'PASAJERO';
        }
        updateUI();
    }

    function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function closeAll() { 
        document.getElementById('sidebar').classList.remove('open'); 
        document.getElementById('cost-sheet').classList.remove('active'); 
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); 
    }
    function toggleAccordion(id) { document.getElementById(id).classList.toggle('expanded'); }
    function openCosts() { document.getElementById('cost-sheet').classList.add('active'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function applyToBeDriver() { closeAll(); alert("Módulo de registro abierto"); }
</script>
</body>
</html>
