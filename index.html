<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Drive MX | Sistema de Flota Dinámica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        :root { --app-height: 100dvh; }
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            overflow: hidden; 
            background-color: #000; 
            height: var(--app-height);
        }
        
        #app-container { height: var(--app-height); }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 30px 30px; }
        
        /* Efecto 3D para Vehículos */
        .vehicle-3d {
            filter: drop-shadow(0 8px 4px rgba(0,0,0,0.2));
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-5px) rotate(5deg); }
        }

        /* Ondas de Búsqueda */
        .search-wave {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid rgba(239, 68, 68, 0.4);
            border-radius: 50%;
            animation: wave-expand 2s infinite;
        }
        @keyframes wave-expand {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        
        #cost-sheet { 
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); 
            transform: translateY(110%);
            padding-bottom: env(safe-area-inset-bottom, 60px);
        }
        #cost-sheet.active { transform: translateY(0); }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    <div id="overlay" onclick="closeAllModals()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3 shadow-lg">
                <i data-lucide="cpu" class="text-white w-5 h-5"></i>
            </div>
            <h2 class="text-lg font-black italic uppercase tracking-tighter text-white">DRIVE <span class="text-red-600">MX</span></h2>
            <p class="text-[8px] text-gray-500 font-bold mt-1 uppercase tracking-widest italic">Operación Global</p>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="sidebar-nav"></nav>
        <div class="p-6 border-t bg-white pb-12"> 
            <button onclick="location.reload()" class="w-full flex items-center justify-center gap-3 py-4 bg-red-50 text-red-600 rounded-2xl font-black text-[11px] uppercase italic border border-red-100">
                <i data-lucide="log-out" class="w-4 h-4"></i> CERRAR SESIÓN
            </button>
        </div>
    </div>

    <div id="passenger-app" class="h-full flex flex-col">
        <header id="passenger-header" class="p-4 flex items-center justify-between border-b bg-white z-10">
            <button onclick="toggleMenu()" class="p-2 bg-gray-50 rounded-xl"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <h2 class="text-xl font-black italic uppercase flex-1 text-center">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-9 h-9 rounded-full border bg-gray-100"></div>
        </header>

        <main class="flex-1 relative map-sim overflow-hidden">
            <div id="passenger-ui-top" class="absolute top-4 left-4 right-4 z-20 space-y-2">
                <div class="bg-white/90 backdrop-blur-md p-3 rounded-2xl shadow-sm border flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_#22c55e]"></div>
                    <span class="text-[10px] font-black uppercase italic tracking-tighter">Ubicación Actual</span>
                </div>
                <div onclick="openCostSheet()" class="bg-white p-2 rounded-2xl shadow-2xl flex items-center gap-4 border-2 border-red-500/10 active:scale-95 transition-transform cursor-pointer">
                    <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-white"><i data-lucide="search" class="w-6 h-6"></i></div>
                    <span class="text-sm font-black text-gray-400 uppercase italic tracking-tighter">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div id="fleet-container" class="absolute inset-0 pointer-events-none"></div>

            <div id="searching-pin" class="hidden absolute inset-0 flex items-center justify-center z-40 pointer-events-none">
                <div class="relative flex items-center justify-center">
                    <div class="search-wave" style="animation-delay: 0s;"></div>
                    <div class="search-wave" style="animation-delay: 1s;"></div>
                    <div class="relative flex flex-col items-center">
                        <div class="w-8 h-8 bg-red-600 rounded-full border-4 border-white shadow-2xl z-50"></div>
                        <div class="w-1.5 h-10 bg-red-600 -mt-1 rounded-full shadow-xl"></div>
                    </div>
                </div>
                <div class="absolute bottom-24 left-1/2 -translate-x-1/2 w-full text-center px-6">
                    <div class="bg-black/90 text-white py-4 px-8 rounded-full border border-white/20 shadow-2xl inline-block animate-pulse">
                        <span class="text-[10px] font-black uppercase italic tracking-[0.3em]">BUSCANDO CONDUCTOR AHORA...</span>
                    </div>
                </div>
            </div>

            <div id="passenger-ui-bottom" class="absolute bottom-32 left-4 right-4 z-30">
                <div class="bg-black rounded-[2.5rem] p-5 flex items-center justify-between text-white shadow-2xl border border-white/10">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-red-600/20 rounded-xl flex items-center justify-center text-red-500 border border-red-500/30"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div>
                            <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Saldo Cartera</p>
                            <h3 id="p-balance" class="text-lg font-black italic">$50.00</h3>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[3rem] shadow-[0_-20px_60px_rgba(0,0,0,0.25)] p-8">
            <div class="w-16 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-black italic uppercase mb-4">Drive <span class="text-red-600">Basic</span></h3>
            <div class="p-4 rounded-3xl border-2 border-red-600 bg-red-50 flex justify-between items-center mb-6">
                <div class="flex items-center gap-3"><i data-lucide="car" class="text-red-600"></i><span class="font-bold text-xs uppercase italic tracking-tighter">Servicio Disponible</span></div>
                <span class="font-black text-xl italic">$45.00</span>
            </div>
            <div class="grid grid-cols-3 gap-3 mb-8">
                <button id="pay-spei" onclick="selectPayment('SPEI')" class="pay-opt p-4 border-2 rounded-2xl flex flex-col items-center gap-2"><i data-lucide="landmark"></i><span class="text-[9px] font-black uppercase">SPEI</span></button>
                <button id="pay-cartera" onclick="selectPayment('Cartera')" class="pay-opt p-4 border-2 rounded-2xl flex flex-col items-center gap-2"><i data-lucide="wallet"></i><span class="text-[9px] font-black uppercase">Cartera</span></button>
                <button id="pay-efectivo" onclick="selectPayment('Efectivo')" class="pay-opt p-4 border-2 rounded-2xl flex flex-col items-center gap-2"><i data-lucide="banknote"></i><span class="text-[9px] font-black uppercase">Cash</span></button>
            </div>
            <button onclick="processOrder()" class="w-full bg-red-600 text-white py-5 rounded-[2.5rem] font-black uppercase text-xs italic shadow-xl active:scale-95 mb-4">
                PEDIR CONDUCTOR AHORA
            </button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    let currentBalance = 50.00;
    let selectedMethod = null;
    const tripCost = 45.00;

    const setHeight = () => document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    window.addEventListener('resize', setHeight);
    setHeight();

    function setupUI() {
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = `<button class="w-full flex items-center gap-4 p-4 text-gray-900 font-black bg-gray-50 rounded-2xl uppercase text-xs italic mb-4 border shadow-sm"><i data-lucide="home" class="text-red-600"></i> INICIO</button>
                         <button class="w-full flex items-center gap-4 p-4 text-gray-800 font-black hover:bg-gray-50 rounded-2xl uppercase text-xs italic"><i data-lucide="history"></i> MIS VIAJES</button>`;
        lucide.createIcons();
    }
    setupUI();

    function selectPayment(method) {
        selectedMethod = method;
        document.querySelectorAll('.pay-opt').forEach(o => o.classList.remove('border-red-600', 'bg-red-50', 'text-red-600'));
        document.getElementById(`pay-${method.toLowerCase()}`).classList.add('border-red-600', 'bg-red-50', 'text-red-600');
    }

    function renderFleet() {
        const container = document.getElementById('fleet-container');
        container.innerHTML = '';
        
        // Simulación de base de datos de conductores cercanos
        const drivers = [
            { type: 'car', top: '25%', left: '15%', name: 'Carlos' },
            { type: 'motorcycle', top: '40%', left: '75%', name: 'Ramiro' },
            { type: 'car', top: '65%', left: '30%', name: 'Luis' },
            { type: 'motorcycle', top: '15%', left: '60%', name: 'Ana' }
        ];

        drivers.forEach(d => {
            const el = document.createElement('div');
            el.className = 'absolute vehicle-3d flex flex-col items-center';
            el.style.top = d.top;
            el.style.left = d.left;
            
            const icon = d.type === 'car' ? 'car' : 'bike';
            const color = d.type === 'car' ? 'text-gray-900' : 'text-red-600';
            
            el.innerHTML = `
                <div class="bg-white px-2 py-0.5 rounded-full shadow-md mb-1 border border-gray-100">
                    <p class="text-[6px] font-black uppercase tracking-tighter">${d.name}</p>
                </div>
                <i data-lucide="${icon}" class="${color} w-8 h-8"></i>
            `;
            container.appendChild(el);
        });
        lucide.createIcons();
    }

    function processOrder() {
        if(!selectedMethod) return alert("Selecciona un método de pago.");
        
        if(selectedMethod === 'Cartera') {
            if(currentBalance < tripCost) return alert("Saldo insuficiente.");
            currentBalance -= tripCost;
            document.getElementById('p-balance').innerText = `$${currentBalance.toFixed(2)}`;
        }

        closeAllModals();
        
        // ACTIVAR MODO BÚSQUEDA PROFESIONAL
        document.getElementById('passenger-header').classList.add('hidden');
        document.getElementById('passenger-ui-top').classList.add('hidden');
        document.getElementById('passenger-ui-bottom').classList.add('hidden');
        document.getElementById('searching-pin').classList.remove('hidden');

        // Aparece la flota detectada
        renderFleet();

        setTimeout(() => {
            alert("¡OPERADOR ENCONTRADO! Drive MX está en camino.");
            location.reload(); 
        }, 7000);
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('opacity-100', 'pointer-events-auto');
    }

    function closeAllModals() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('cost-sheet').classList.remove('active');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }

    function openCostSheet() {
        document.getElementById('cost-sheet').classList.add('active');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }
</script>
</body>
</html>
