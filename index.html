<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .admin-gradient { background: linear-gradient(135deg, #111827 0%, #000000 100%); }
    </style>
</head>
<body class="bg-gray-100">

<div id="admin-panel" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col">
    
    <header class="admin-gradient p-6 text-white">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-black italic">PANEL <span class="text-red-600">CONTROL</span></h1>
            <button onclick="location.reload()" class="p-2 bg-white/10 rounded-lg"><i data-lucide="log-out" class="w-5 h-5"></i></button>
        </div>
        <div class="bg-white/10 p-4 rounded-2xl border border-white/10">
            <p class="text-[10px] uppercase font-bold text-gray-400">Estado del Sistema</p>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <p class="text-sm font-bold text-white">Servidor Drive MX Activo</p>
            </div>
        </div>
    </header>

    <div class="p-4">
        <div class="relative">
            <i data-lucide="search" class="absolute left-4 top-3.5 text-gray-400 w-5 h-5"></i>
            <input type="text" placeholder="Buscar pasajero por nombre..." class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-red-600 font-medium">
        </div>
    </div>

    <div class="flex-1 p-4 space-y-4 overflow-y-auto">
        <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest px-2">Gestión de Saldo</h2>

        <div class="bg-white border border-gray-100 p-4 rounded-[2rem] shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gray-100 rounded-2xl flex items-center justify-center font-black text-gray-400">JP</div>
                <div>
                    <p class="font-black text-gray-900">Juan Pasajero</p>
                    <p class="text-[10px] text-green-600 font-bold uppercase tracking-tighter">Acceso Permitido</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-lg font-black text-gray-900 italic">$500.00</p>
                <button class="text-[10px] font-black text-red-600 uppercase">Ajustar</button>
            </div>
        </div>

        <div class="bg-red-50 border border-red-100 p-4 rounded-[2rem] shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-red-200 rounded-2xl flex items-center justify-center font-black text-red-600 text-xl italic">!</div>
                <div>
                    <p class="font-black text-gray-900">Maria Morosa</p>
                    <p class="text-[10px] text-red-600 font-bold uppercase tracking-tighter">Pasajero Bloqueado</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-lg font-black text-red-600 italic">-$150.00</p>
                <button class="text-[10px] font-black bg-red-600 text-white px-2 py-1 rounded-lg">Liquidar</button>
            </div>
        </div>
    </div>

    <div class="p-6 border-t bg-gray-50 grid grid-cols-2 gap-4">
        <button class="bg-gray-900 text-white p-4 rounded-2xl font-black text-xs flex items-center justify-center gap-2 uppercase tracking-widest">
            <i data-lucide="plus-circle" class="w-4 h-4 text-red-600"></i> Nuevo Saldo
        </button>
        <button class="bg-white border border-gray-200 text-gray-900 p-4 rounded-2xl font-black text-xs flex items-center justify-center gap-2 uppercase tracking-widest shadow-sm">
            <i data-lucide="file-text" class="w-4 h-4 text-gray-400"></i> Reportes
        </button>
    </div>
</div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
