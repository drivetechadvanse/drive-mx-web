<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Global Compact System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        /* Escala reducida y animaciones */
        #splash { transition: opacity 0.5s ease; }
        .view-content { animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; }
        
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }

        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }

        .vehicle-card.selected { border: 1.5px solid #ef4444; background: #fef2f2; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="overlay" onclick="closeAllModals()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3 shadow-lg">
                <i data-lucide="cpu" id="sidebar-icon" class="text-white w-6 h-6"></i>
            </div>
            <h2 class="text-lg font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="sidebar-user-role" class="text-[8px] text-gray-500 font-bold uppercase tracking-widest italic">Sistema de Control</p>
        </div>
        <nav class="flex-1 p-4 space-y-1" id="sidebar-nav"></nav>
        <div class="p-4 border-t">
            <button onclick="location.reload()" class="w-full flex items-center justify-center gap-2 py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">
                <i data-lucide="power" class="w-3.5 h-3.5"></i> Salir
            </button>
        </div>
    </div>

    <div id="splash" class="absolute inset-0 z-[150] bg-white flex flex-col items-center justify-center">
        <div class="w-16 h-16 bg-red-600 rounded-[1.5rem] flex items-center justify-center shadow-2xl animate-pulse">
            <i data-lucide="navigation" class="text-white w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-black mt-6 tracking-tighter italic uppercase text-gray-900">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <h2 class="text-3xl font-black text-gray-900 italic leading-none tracking-tighter uppercase mb-8">LOGIN<br><span class="text-red-600 text-xl">DRIVE MX</span></h2>
        <div class="space-y-3">
            <input type="email" id="email-input" placeholder="Usuario" class="w-full p-3.5 bg-gray-50 border-b border-gray-100 rounded-xl outline-none focus:border-red-600 text-xs font-bold">
            <input type="password" id="pass-input" placeholder="Contraseña" class="w-full p-3.5 bg-gray-50 border-b border-gray-100 rounded-xl outline-none focus:border-red-600 text-xs font-bold">
            <button onclick="handleLogin()" class="w-full bg-red-600 text-white py-3.5 rounded-xl font-black text-xs shadow-lg shadow-red-600/20 uppercase tracking-widest active:scale-95 transition-all">Ingresar</button>
        </div>
    </div>

    <div id="passenger-app" class="hidden h-screen flex flex-col">
        <header class="px-4 py-3 flex items-center justify-between border-b bg-white z-10">
            <button onclick="toggleMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600 text-lg">MX</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-100 overflow-hidden border"></div>
        </header>

        <main class="flex-1 relative map-sim">
            <div class="absolute top-4 left-4 right-4 z-20 space-y-2">
                <div class="bg-white/90 backdrop-blur p-2 rounded-xl shadow border flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_5px_#22c55e]"></div>
                    <p class="text-[9px] font-black text-gray-800 uppercase italic truncate">Origen: <span class="text-gray-400 font-bold">Mi ubicación</span></p>
                </div>
                <div onclick="openCostSheet()" class="bg-white p-1 rounded-xl shadow-xl flex items-center gap-2 cursor-pointer border border-black/5 hover:border-red-600/30">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="bg-red-600 p-3 rounded-2xl shadow-2xl border-4 border-white animate-bounce"><i data-lucide="navigation" class="text-white w-5 h-5"></i></div>
            </div>

            <div class="absolute bottom-4 left-4 right-4">
                <div class="bg-black rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-600/10 rounded-lg flex items-center justify-center border border-red-600/30 text-red-600"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div><p class="text-[7px] text-gray-500 font-black uppercase">Saldo</p><h3 id="p-balance" class="text-sm font-black italic">$0.00</h3></div>
                    </div>
                    <div class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_#22c55e]"></div>
                </div>
            </div>
        </main>

        <div id="cost-sheet" class="absolute bottom-0 left-0 right-0 bg-white z-[120] rounded-t-[2.5rem] shadow-2xl p-6 space-y-4">
            <div class="w-8 h-1 bg-gray-200 rounded-full mx-auto -mt-2 mb-2"></div>
            <h3 class="text-lg font-black italic uppercase tracking-tighter">COTIZACIÓN <span class="text-red-600 text-base">RÁPIDA</span></h3>
            <div class="space-y-2">
                <div onclick="selectVehicle(this)" class="vehicle-card selected p-3 rounded-2xl flex items-center justify-between">
                    <div class="flex items-center gap-3"><i data-lucide="car" class="w-6 h-6"></i><span class="font-black italic uppercase text-[11px]">Drive Basic</span></div>
                    <span class="font-black italic text-base">$45.00</span>
                </div>
            </div>
            <button class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[11px] shadow-lg uppercase tracking-widest italic">Solicitar Ahora</button>
        </div>
    </div>

    <div id="admin-app" class="hidden h-screen flex flex-col bg-gray-50">
        <header class="px-4 py-3 flex items-center justify-between bg-gray-900 text-white z-10 shadow-lg">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="p-1.5 bg-white/10 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-red-600"></i></button>
                <h2 class="text-base font-black italic tracking-tighter uppercase">CONTROL <span class="text-red-600">CENTER</span></h2>
            </div>
            <div class="px-2 py-0.5 bg-green-500/10 border border-green-500/20 rounded-md"><span class="text-[7px] font-black text-green-500 uppercase tracking-widest">Live System</span></div>
        </header>

        <main id="admin-host" class="flex-1 p-6 overflow-y-auto">
            <div class="h-full flex flex-col items-center justify-center text-center space-y-4 view-content">
                <div class="w-20 h-20 bg-gray-100 rounded-[1.5rem] flex items-center justify-center text-gray-300"><i data-lucide="terminal" class="w-8 h-8"></i></div>
                <p class="text-[10px] font-black text-gray-400 uppercase italic tracking-widest">Inactivo</p>
            </div>
        </main>
    </div>

</div>

<script>
    lucide.createIcons();

    // 1. Splash Control (3 segundos)
    setTimeout(() => {
        const s = document.getElementById('splash');
        s.style.opacity = '0';
        setTimeout(() => {
            s.style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }, 500);
    }, 3000);

    // 2. Modals y Menús
    function toggleMenu() {
        const side = document.getElementById('sidebar');
        const over = document.getElementById('overlay');
        side.classList.toggle('open');
        over.classList.toggle('opacity-100');
        over.classList.toggle('pointer-events-auto');
    }

    function closeAllModals() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('cost-sheet').classList.remove('active');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }

    function openCostSheet() {
        document.getElementById('cost-sheet').classList.add('active');
        document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto');
    }

    // 3. Login
    function handleLogin() {
        const e = document.getElementById('email-input').value;
        const p = document.getElementById('pass-input').value;

        if (e === 'admin@app.com' && p === '123') {
            setupUI("ADMIN", "shield-check");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-app').classList.remove('hidden');
        } else if (e === 'juan@app.com' && p === '123') {
            setupUI("JUAN P.", "user");
            initPassenger(50);
        } else {
            alert("Acceso inválido");
        }
    }

    function setupUI(role, icon) {
        document.getElementById('sidebar-user-role').innerText = role;
        document.getElementById('sidebar-icon').setAttribute('data-lucide', icon);
        const nav = document.getElementById('sidebar-nav');
        
        if(role === "ADMIN") {
            nav.innerHTML = `<button onclick="loadTool('users')" class="w-full flex items-center gap-3 p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic"><i data-lucide="users" class="w-4 h-4 text-red-600"></i> Pasajeros</button>`;
        } else {
            nav.innerHTML = `<button class="w-full flex items-center gap-3 p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic"><i data-lucide="history" class="w-4 h-4 text-gray-400"></i> Viajes</button>`;
        }
        lucide.createIcons();
    }

    function loadTool(tool) {
        const host = document.getElementById('admin-host');
        closeAllModals();
        if(tool === 'users') {
            host.innerHTML = `<div class="view-content space-y-4 text-left">
                <h3 class="text-base font-black italic uppercase">Gestión <span class="text-red-600 text-sm">Flota</span></h3>
                <div class="bg-white p-4 rounded-2xl shadow-sm border flex items-center justify-between">
                    <div class="flex items-center gap-3"><div class="w-8 h-8 bg-black rounded-lg"></div><span class="font-black text-[11px] uppercase tracking-tighter text-gray-800">Juan Pasajero</span></div>
                    <button class="bg-red-600 text-white p-1.5 rounded-lg"><i data-lucide="edit" class="w-3.5 h-3.5"></i></button>
                </div>
            </div>`;
        }
        lucide.createIcons();
    }

    function initPassenger(bal) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('passenger-app').classList.remove('hidden');
        document.getElementById('p-balance').innerText = `$${bal.toFixed(2)}`;
    }

    function selectVehicle(el) {
        document.querySelectorAll('.vehicle-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
    }
</script>
</body>
</html>
