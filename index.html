<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Sistema Integral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        
        /* Mapa con diseño limpio */
        .map-bg { 
            background-color: #f3f4f6; 
            background-image: radial-gradient(#d1d5db 0.8px, transparent 0.8px); 
            background-size: 20px 20px; 
        }

        /* Estilo Tarjeta Cartera Premium */
        .wallet-card {
            background: linear-gradient(135deg, #111827 0%, #000000 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Panel de Control Flotante */
        .admin-modal {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            z-index: 100;
        }

        /* Animación de bloqueo */
        .is-blocked { filter: grayscale(1); opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body class="bg-gray-900">

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="splash" class="absolute inset-0 z-[110] bg-white flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-24 h-24 bg-red-600 rounded-[2.5rem] flex items-center justify-center shadow-2xl animate-bounce">
            <i data-lucide="navigation" class="text-white w-12 h-12"></i>
        </div>
        <h1 class="text-4xl font-black mt-6 tracking-tighter italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <h2 class="text-4xl font-black text-gray-900 leading-none mb-10 italic uppercase">INICIAR<br><span class="text-red-600">SESIÓN</span></h2>
        <div class="space-y-4">
            <input type="email" id="email-input" placeholder="Correo electrónico" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-red-600 font-medium">
            <input type="password" id="pass-input" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-red-600 font-medium">
            <button onclick="attemptLogin()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-red-700 transition-all uppercase tracking-widest">Entrar</button>
            <p class="text-center text-[9px] text-gray-400 font-bold uppercase tracking-[0.3em]">Acceso a Pasajeros y Administradores</p>
        </div>
    </div>

    <div id="main-app" class="hidden h-screen flex flex-col">
        <header class="p-4 flex items-center justify-between border-b bg-white z-10">
            <div class="flex items-center gap-4">
                <div class="p-2 bg-gray-50 rounded-xl"><i data-lucide="menu" class="w-6 h-6 text-gray-900"></i></div>
                <h2 class="text-2xl font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            </div>
            <div id="admin-tag" class="hidden bg-red-600 text-white text-[8px] px-3 py-1.5 rounded-full font-black uppercase tracking-tighter">Modo Maestro</div>
        </header>

        <main class="flex-1 flex flex-col relative overflow-hidden">
            <div id="map-area" class="flex-1 map-bg relative">
                <div class="absolute top-6 left-6 right-6 z-20 flex flex-col gap-2">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <p class="text-[10px] font-black text-gray-800 uppercase tracking-widest">Ubicación de origen</p>
                    </div>
                    <div id="search-bar" class="flex items-center gap-3">
                        <div class="w-2 h-2 bg-red-600 rounded-full"></div>
                        <input type="text" id="dest-field" placeholder="¿A dónde vamos?" class="bg-transparent w-full outline-none font-black text-gray-900 text-sm">
                    </div>
                </div>

                <div id="block-alert" class="hidden absolute top-24 left-6 right-6 z-30 bg-red-600 text-white p-3 rounded-xl flex items-center gap-3 shadow-lg">
                    <i data-lucide="alert-octagon" class="w-5 h-5"></i>
                    <p class="text-[10px] font-black uppercase">Viajes bloqueados: Liquidar saldo pendiente</p>
                </div>

                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div id="map-cursor" class="bg-red-600 p-3 rounded-2xl shadow-2xl border-2 border-white"><i data-lucide="navigation" class="text-white w-5 h-5"></i></div>
                </div>
            </div>

            <div class="px-6 py-4 bg-white">
                <div class="wallet-card rounded-[2rem] p-5 flex items-center justify-between shadow-xl">
                    <div class="flex items-center gap-4">
                        <div class="bg-red-600/10 p-2.5 rounded-xl border border-red-600/20"><i data-lucide="wallet" class="text-red-600 w-5 h-5"></i></div>
                        <div>
                            <p class="text-[8px] text-gray-500 font-bold uppercase tracking-widest">Saldo de cuenta</p>
                            <h3 class="text-xl font-black text-white italic tracking-tighter" id="balance-value">$0.00</h3>
                        </div>
                    </div>
                    <button onclick="togglePanel()" id="gear-admin" class="hidden bg-white/10 p-2 rounded-xl text-white hover:bg-red-600 transition-colors">
                        <i data-lucide="settings-2" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </main>

        <div id="admin-modal" class="hidden absolute inset-0 admin-modal p-8 flex flex-col">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-black italic tracking-tighter">CENTRAL <span class="text-red-600">ADMIN</span></h2>
                <button onclick="togglePanel()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x" class="w-7 h-7 text-gray-900"></i></button>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3 block">Modificar Saldo del Usuario</label>
                    <div class="flex gap-2">
                        <input type="number" id="new-balance-input" placeholder="Ej: 500 o -100" class="flex-1 bg-gray-100 p-4 rounded-2xl font-black text-2xl outline-none focus:ring-2 focus:ring-red-600">
                        <button onclick="saveBalance()" class="bg-red-600 text-white px-6 rounded-2xl font-black shadow-lg shadow-red-600/20"><i data-lucide="save" class="w-6 h-6"></i></button>
                    </div>
                </div>
                <div class="p-4 bg-gray-900 rounded-2xl text-white">
                    <p class="text-[10px] font-bold text-red-500 uppercase italic">Control de Flota</p>
                    <p class="text-xs text-gray-400 mt-1">Los cambios se reflejan en tiempo real en la aplicación del pasajero.</p>
                </div>
            </div>
        </div>

        <nav class="px-6 py-4 border-t flex justify-around bg-white">
            <i data-lucide="home" class="text-red-600 w-5 h-5"></i>
            <i data-lucide="send" class="text-gray-300 w-5 h-5"></i>
            <i data-lucide="user" class="text-gray-300 w-5 h-5"></i>
        </nav>
    </div>
</div>

<script>
    lucide.createIcons();

    // Splash Timer
    setTimeout(() => {
        document.getElementById('splash').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }, 700);
    }, 2000);

    let currentRole = "";

    function attemptLogin() {
        const email = document.getElementById('email-input').value;
        const pass = document.getElementById('pass-input').value;

        if (email === 'admin@app.com' && pass === '123') {
            currentRole = "admin";
            setupUI(0, true);
        } else if (email === 'juan@app.com' && pass === '123') {
            currentRole = "passenger";
            setupUI(50, false);
        } else if (email === 'maria@app.com' && pass === '123') {
            currentRole = "passenger";
            setupUI(-150, false);
        } else {
            alert("Acceso inválido");
            return;
        }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        lucide.createIcons();
    }

    function setupUI(balance, isAdmin) {
        if(isAdmin) {
            document.getElementById('admin-tag').classList.remove('hidden');
            document.getElementById('gear-admin').classList.remove('hidden');
        }
        applyBalanceLogic(balance);
    }

    function applyBalanceLogic(amount) {
        const display = document.getElementById('balance-value');
        const dest = document.getElementById('dest-field');
        const alertBox = document.getElementById('block-alert');
        const marker = document.getElementById('map-cursor');
        const searchBar = document.getElementById('search-bar');

        display.innerText = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);

        if (amount < 0) {
            display.classList.add('text-red-600');
            dest.disabled = true;
            dest.placeholder = "CUENTA BLOQUEADA";
            alertBox.classList.remove('hidden');
            marker.classList.add('is-blocked');
            searchBar.style.opacity = "0.4";
        } else {
            display.classList.remove('text-red-600');
            display.classList.add('text-white');
            dest.disabled = false;
            dest.placeholder = "¿A dónde vamos?";
            alertBox.classList.add('hidden');
            marker.classList.remove('is-blocked');
            searchBar.style.opacity = "1";
        }
    }

    function togglePanel() {
        document.getElementById('admin-modal').classList.toggle('hidden');
        lucide.createIcons();
    }

    function saveBalance() {
        const newVal = document.getElementById('new-balance-input').value;
        if(newVal !== "") {
            applyBalanceLogic(parseFloat(newVal));
            togglePanel();
        }
    }
</script>
</body>
</html>
