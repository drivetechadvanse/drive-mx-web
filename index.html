<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Sistema Unificado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        
        .map-bg { 
            background-color: #f3f4f6; 
            background-image: radial-gradient(#d1d5db 0.8px, transparent 0.8px); 
            background-size: 20px 20px; 
        }

        .wallet-card {
            background: linear-gradient(135deg, #111827 0%, #000000 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Sidebar Animación Única */
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
        }
        #sidebar.open { transform: translateX(0); }
        
        #overlay {
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        #overlay.show { opacity: 1; pointer-events: auto; }

        .blocked-element { filter: grayscale(1); opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body class="bg-gray-900">

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="overlay" onclick="toggleMenu()" class="absolute inset-0 bg-black/40 z-[100]"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-8 bg-gray-900 text-white">
            <div class="w-12 h-12 bg-red-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-red-600/30">
                <i data-lucide="shield-check" id="sidebar-icon" class="text-white w-6 h-6"></i>
            </div>
            <p class="font-black text-xl italic uppercase tracking-tighter">Drive <span class="text-red-600">MX</span></p>
            <p id="sidebar-user-role" class="text-[10px] text-gray-400 font-bold mt-1 uppercase tracking-[0.2em]">Cargando...</p>
        </div>
        <nav class="flex-1 p-6 space-y-2" id="sidebar-options">
            </nav>
        <div class="p-6 border-t border-gray-100">
            <button onclick="location.reload()" class="w-full flex items-center gap-4 p-4 text-red-600 font-black hover:bg-red-50 rounded-2xl transition-colors uppercase text-xs italic">
                <i data-lucide="power" class="w-5 h-5"></i> Cerrar Sesión
            </button>
        </div>
    </div>

    <div id="splash" class="absolute inset-0 z-[120] bg-white flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-24 h-24 bg-red-600 rounded-[2.5rem] flex items-center justify-center shadow-2xl animate-bounce">
            <i data-lucide="navigation" class="text-white w-12 h-12"></i>
        </div>
        <h1 class="text-4xl font-black mt-6 tracking-tighter italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <h2 class="text-4xl font-black text-gray-900 leading-none mb-10 italic uppercase tracking-tighter italic">ACCESO<br><span class="text-red-600">BIENVENIDO</span></h2>
        <div class="space-y-4">
            <input type="email" id="email-input" placeholder="Usuario / Correo" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-red-600 font-medium">
            <input type="password" id="pass-input" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-red-600 font-medium">
            <button onclick="attemptLogin()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-red-700 transition-all uppercase tracking-widest">Entrar</button>
        </div>
    </div>

    <div id="passenger-app" class="hidden h-screen flex flex-col">
        <header class="p-4 flex items-center justify-between border-b bg-white z-10">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="p-2 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors">
                    <i data-lucide="menu" class="w-6 h-6 text-gray-900"></i>
                </button>
                <h2 class="text-2xl font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            </div>
            <div class="w-10 h-10 bg-gray-100 rounded-full border-2 border-white shadow-sm overflow-hidden">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="avatar">
            </div>
        </header>

        <main class="flex-1 flex flex-col relative overflow-hidden">
            <div class="flex-1 map-bg relative">
                <div class="absolute top-6 left-6 right-6 z-20 flex flex-col gap-2">
                    <div class="flex items-center gap-3 bg-white/90 backdrop-blur p-2 rounded-2xl shadow-sm border border-gray-100">
                        <div class="w-2 h-2 bg-green-500 rounded-full mx-2 animate-pulse"></div>
                        <p class="text-[10px] font-black text-gray-800 uppercase tracking-tight">Ubicación: <span class="text-gray-400">Punto Actual</span></p>
                    </div>
                    <div class="flex items-center gap-3 bg-white p-1 rounded-2xl shadow-md">
                        <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white"><i data-lucide="search" class="w-5 h-5"></i></div>
                        <input type="text" id="dest-field" placeholder="¿A dónde vamos hoy?" class="bg-transparent flex-1 outline-none font-black text-gray-900 text-sm">
                    </div>
                </div>

                <div id="debt-msg" class="hidden absolute top-32 left-6 right-6 z-30 bg-red-600 text-white p-3 rounded-xl flex items-center gap-3 shadow-xl">
                    <i data-lucide="alert-circle" class="w-5 h-5"></i>
                    <p class="text-[10px] font-black uppercase">Servicio bloqueado por adeudo</p>
                </div>

                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div id="main-pin" class="bg-red-600 p-3 rounded-2xl shadow-2xl border-2 border-white"><i data-lucide="navigation" class="text-white w-5 h-5"></i></div>
                </div>
            </div>

            <div class="px-6 py-4 bg-white">
                <div class="wallet-card rounded-[2rem] p-5 flex items-center justify-between shadow-xl">
                    <div class="flex items-center gap-4">
                        <div class="bg-red-600/10 p-2.5 rounded-xl border border-red-600/20"><i data-lucide="wallet" class="text-red-600 w-5 h-5"></i></div>
                        <div>
                            <p class="text-[8px] text-gray-500 font-bold uppercase tracking-widest">Saldo Disponible</p>
                            <h3 class="text-xl font-black text-white italic tracking-tighter" id="p-balance">$0.00</h3>
                        </div>
                    </div>
                    <div class="w-2 h-2 rounded-full bg-green-500" id="status-dot"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="admin-app" class="hidden h-screen flex flex-col bg-gray-50">
        <header class="p-4 flex items-center justify-between border-b bg-gray-900 text-white z-10">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="p-2 bg-white/10 rounded-xl hover:bg-white/20 transition-colors">
                    <i data-lucide="menu" class="w-6 h-6 text-white"></i>
                </button>
                <h2 class="text-xl font-black italic tracking-tighter uppercase text-red-600">PANEL <span class="text-white">MAESTRO</span></h2>
            </div>
            <div class="w-2 h-2 bg-red-600 rounded-full animate-pulse shadow-[0_0_8px_red]"></div>
        </header>

        <main class="flex-1 p-6 space-y-6 overflow-y-auto">
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4">Gestión de Usuarios</p>
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border border-gray-100">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-900 rounded-xl flex items-center justify-center text-white font-black">JP</div>
                        <p class="font-black text-sm text-gray-900">Juan Pasajero</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" id="val-juan" placeholder="$" class="w-16 p-2 bg-white border rounded-xl text-xs font-black text-center outline-none focus:ring-1 focus:ring-red-600">
                        <button onclick="alert('Saldo actualizado')" class="bg-red-600 text-white p-2 rounded-xl"><i data-lucide="check" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

</div>

<script>
    lucide.createIcons();

    // Splash
    setTimeout(() => {
        document.getElementById('splash').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }, 700);
    }, 2000);

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }

    function attemptLogin() {
        const email = document.getElementById('email-input').value;
        const pass = document.getElementById('pass-input').value;

        if (email === 'admin@app.com' && pass === '123') {
            setupSidebar("ADMINISTRADOR", "shield-check");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-app').classList.remove('hidden');
        } else if (email === 'juan@app.com' && pass === '123') {
            setupSidebar("JUAN PASAJERO", "user");
            showPassenger(50);
        } else if (email === 'maria@app.com' && pass === '123') {
            setupSidebar("MARIA MOROSA", "user-x");
            showPassenger(-150);
        } else {
            alert("Credenciales inválidas");
        }
        lucide.createIcons();
    }

    function setupSidebar(roleName, iconName) {
        document.getElementById('sidebar-user-role').innerText = roleName;
        document.getElementById('sidebar-icon').setAttribute('data-lucide', iconName);
        
        const options = document.getElementById('sidebar-options');
        options.innerHTML = roleName === "ADMINISTRADOR" 
            ? `<button class="w-full flex items-center gap-4 p-4 text-gray-700 font-bold hover:bg-gray-50 rounded-2xl"><i data-lucide="bar-chart-3" class="w-5 h-5"></i> Métricas</button>
               <button class="w-full flex items-center gap-4 p-4 text-gray-700 font-bold hover:bg-gray-50 rounded-2xl"><i data-lucide="users" class="w-5 h-5"></i> Pasajeros</button>`
            : `<button class="w-full flex items-center gap-4 p-4 text-gray-700 font-bold hover:bg-gray-50 rounded-2xl"><i data-lucide="history" class="w-5 h-5"></i> Mis Viajes</button>
               <button class="w-full flex items-center gap-4 p-4 text-gray-700 font-bold hover:bg-gray-50 rounded-2xl"><i data-lucide="wallet" class="w-5 h-5"></i> Mi Cartera</button>`;
        lucide.createIcons();
    }

    function showPassenger(balance) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('passenger-app').classList.remove('hidden');
        updatePassengerUI(balance);
    }

    function updatePassengerUI(amount) {
        const display = document.getElementById('p-balance');
        const dest = document.getElementById('dest-field');
        const alertBox = document.getElementById('debt-msg');
        const pin = document.getElementById('main-pin');
        const dot = document.getElementById('status-dot');

        display.innerText = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);

        if (amount < 0) {
            display.classList.add('text-red-500');
            dest.disabled = true;
            dest.placeholder = "PAGO REQUERIDO";
            alertBox.classList.remove('hidden');
            pin.classList.add('blocked-element');
            dot.classList.replace('bg-green-500', 'bg-red-600');
        } else {
            display.classList.remove('text-red-500');
            dest.disabled = false;
            alertBox.classList.add('hidden');
            pin.classList.remove('blocked-element');
            dot.classList.replace('bg-red-600', 'bg-green-500');
        }
    }
</script>
</body>
</html>
