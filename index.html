<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        .map-bg { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 0.8px, transparent 0.8px); background-size: 20px 20px; }
        /* Animación para el menú lateral */
        #sidebar { transition: transform 0.3s ease-in-out; transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #overlay { display: none; }
        #overlay.open { display: block; }
    </style>
</head>
<body class="bg-gray-900">

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="splash" class="absolute inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-24 h-24 bg-red-600 rounded-[2rem] flex items-center justify-center shadow-2xl animate-bounce">
            <i data-lucide="navigation" class="text-white w-12 h-12"></i>
        </div>
        <h1 class="text-4xl font-black mt-6 tracking-tighter">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-8 flex flex-col justify-center">
        <h2 class="text-3xl font-black mb-8 text-center">Bienvenido</h2>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Usuario (admin@app.com)" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
            <input type="password" id="password" placeholder="Contraseña (123)" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
            <button onclick="validateLogin()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg">INGRESAR</button>
        </div>
    </div>

    <div id="overlay" class="absolute inset-0 z-[60] bg-black/50 transition-opacity" onclick="toggleSidebar()"></div>
    <div id="sidebar" class="absolute inset-y-0 left-0 z-[70] w-64 bg-white shadow-2xl p-6">
        <div class="flex justify-between items-center mb-10">
            <h2 class="font-black text-xl">DRIVE <span class="text-red-600">MX</span></h2>
            <button onclick="toggleSidebar()" class="text-gray-400"><i data-lucide="x"></i></button>
        </div>
        <nav class="space-y-6">
            <div class="flex items-center gap-4 font-bold text-gray-700 cursor-pointer hover:text-red-600">
                <i data-lucide="user" class="w-5 h-5"></i> Mi Perfil
            </div>
            <div class="flex items-center gap-4 font-bold text-gray-700 cursor-pointer hover:text-red-600">
                <i data-lucide="shield" class="w-5 h-5"></i> Seguridad
            </div>
            <div class="flex items-center gap-4 font-bold text-gray-700 cursor-pointer hover:text-red-600">
                <i data-lucide="settings" class="w-5 h-5"></i> Configuración
            </div>
            <hr>
            <div onclick="logout()" class="flex items-center gap-4 font-bold text-red-600 cursor-pointer">
                <i data-lucide="log-out" class="w-5 h-5"></i> Cerrar Sesión
            </div>
        </nav>
    </div>

    <div id="main-app" class="hidden h-screen flex flex-col">
        <header class="p-4 flex items-center gap-4 border-b bg-white">
            <button onclick="toggleSidebar()" class="p-1 hover:bg-gray-100 rounded-lg transition-colors">
                <i data-lucide="menu" class="w-6 h-6 text-gray-900"></i>
            </button>
            <h2 class="text-xl font-black flex-1">DRIVE <span class="text-red-600">MX</span></h2>
            <button class="p-2 bg-gray-100 rounded-full"><i data-lucide="bell" class="w-5 h-5"></i></button>
        </header>

        <main class="flex-1 overflow-y-auto">
            <div class="h-48 map-bg relative border-b">
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="bg-red-600 p-2 rounded-full shadow-xl animate-pulse">
                        <i data-lucide="navigation" class="text-white w-4 h-4"></i>
                    </div>
                </div>
            </div>

            <div class="p-6">
                <div class="bg-gray-900 rounded-[2.5rem] p-6 text-white mb-6">
                    <p class="text-xs opacity-60 uppercase font-bold">Saldo Disponible</p>
                    <h3 class="text-3xl font-black mt-1 tracking-tighter">$1,250.00 MXN</h3>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="border-2 border-red-600 bg-red-50 p-4 rounded-3xl">
                        <i data-lucide="car" class="text-red-600 mb-2"></i>
                        <p class="font-bold text-sm">Viaje Express</p>
                    </div>
                    <div class="border border-gray-100 p-4 rounded-3xl">
                        <i data-lucide="bike" class="text-gray-400 mb-2"></i>
                        <p class="font-bold text-sm">Moto Envío</p>
                    </div>
                </div>
            </div>
        </main>

        <nav class="p-4 border-t flex justify-around bg-white">
            <i data-lucide="home" class="text-red-600 cursor-pointer"></i>
            <i data-lucide="send" class="text-gray-300 cursor-pointer"></i>
            <i data-lucide="activity" class="text-gray-300 cursor-pointer"></i>
        </nav>
    </div>
</div>

<script>
    lucide.createIcons();

    // Manejo de Splash
    setTimeout(() => {
        const splash = document.getElementById('splash');
        splash.classList.add('opacity-0');
        setTimeout(() => {
            splash.style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }, 500);
    }, 2500);

    // Validación Login
    function validateLogin() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        if (email === 'admin@app.com' && pass === '123') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            lucide.createIcons();
        } else {
            alert("Credenciales incorrectas");
        }
    }

    // Lógica del Menú Lateral (Sidebar)
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
    }

    function logout() {
        location.reload();
    }
</script>

</body>
</html>
