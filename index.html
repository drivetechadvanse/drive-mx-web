<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive México | Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; height: 100dvh; }
        #app-container { height: 100dvh; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); padding-bottom: env(safe-area-inset-bottom, 2rem); }
        #cost-sheet.active { transform: translateY(0); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .accordion-content.expanded { max-height: 500px; }
        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 25px 25px; flex-grow: 1; }
        .radar-pulse { position: absolute; width: 100px; height: 100px; background: rgba(239, 68, 68, 0.15); border-radius: 100%; animation: radar 2s infinite; }
        @keyframes radar { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .hidden-view { opacity: 0; transform: translateY(-20px); pointer-events: none; transition: all 0.4s ease; }
        @keyframes bounce-custom { 0%, 100% { transform: translateY(0) scaleY(1); } 40% { transform: translateY(-30px) scaleY(1.1); } 90% { transform: translateY(0) scaleY(0.9); } }
        .animate-bounce-custom { animation: bounce-custom 0.8s infinite; }
        .reg-input { width: 100%; padding: 1rem; background-color: #f9fafb; border-radius: 0.75rem; border: 2px solid transparent; outline: none; font-size: 0.75rem; font-weight: 700; }
        .reg-input:focus { border-color: #ef4444; background-color: #fff; }
        .reg-label { font-size: 9px; font-weight: 900; color: #9ca3af; text-transform: uppercase; margin-bottom: 0.4rem; display: block; margin-left: 0.5rem; }
        .payment-opt.selected { border-color: #ef4444; background-color: #fef2f2; color: #ef4444; }
        .card-selected { border-color: #ef4444 !important; background-color: #fef2f2 !important; ring: 2px; ring-color: #ef4444; }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative flex flex-col">
    <!-- Splash Loader -->
    <div id="splash" class="absolute inset-0 z-[250] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center animate-pulse"><i data-lucide="navigation" class="text-white w-8 h-8"></i></div>
        <h1 class="text-2xl font-black mt-6 italic uppercase">DRIVE <span class="text-red-600">MÉXICO</span></h1>
    </div>

    <div id="overlay" onclick="closeAll()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity"></div>

    <!-- Sidebar Menu -->
    <div id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3"><i data-lucide="cpu" class="w-6 h-6"></i></div>
            <h2 class="text-lg font-black italic uppercase">DRIVE <span class="text-red-600 text-lg">MÉXICO</span></h2>
            <p id="side-role" class="text-[8px] text-gray-400 font-bold uppercase tracking-widest italic">Sesión activa</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <div id="nav-admin" class="hidden">
                <button onclick="toggleAccordion('admin-acc')" class="w-full flex items-center justify-between p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic">
                    <div class="flex items-center gap-3"><i data-lucide="users" class="text-red-600 w-4 h-4"></i><span>Gestión de Usuarios</span></div>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div id="admin-acc" class="accordion-content bg-gray-50/50 rounded-xl">
                    <button onclick="renderAdminRequests()" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase border-b border-white">Conductores</button>
                    <button onclick="renderAdminPassengers()" class="w-full text-left p-3 pl-10 text-[9px] font-bold text-gray-500 uppercase border-b border-white">Pasajeros</button>
                </div>
                <button onclick="openAdminWallet()" class="w-full flex items-center gap-3 p-3 text-gray-700 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic mt-1">
                    <i data-lucide="wallet" class="text-red-600 w-4 h-4"></i><span>Cartera</span>
                </button>
            </div>
            <div id="nav-passenger" class="hidden">
                <button onclick="applyToBeDriver()" class="w-full flex items-center gap-3 p-3 text-red-600 font-black hover:bg-red-50 rounded-xl uppercase text-[10px] italic">
                    <i data-lucide="car" class="w-4 h-4"></i><span>Quiero ser Conductor</span>
                </button>
            </div>
        </nav>
        <div class="p-4 border-t mb-4">
            <button onclick="location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-black text-[9px] uppercase italic">Cerrar Sesión</button>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="hidden absolute inset-0 z-[150] bg-white p-8 flex flex-col items-center justify-center text-center">
        <div class="w-12 h-12 bg-red-600 rounded-xl mb-6 animate-bounce-custom shadow-lg shadow-red-600/20 flex items-center justify-center">
            <i data-lucide="navigation" class="text-white w-6 h-6"></i>
        </div>
        <h2 class="text-3xl font-black italic uppercase mb-12 leading-none tracking-tighter">BIENVENIDO</h2>
        <div class="space-y-4 w-full">
            <input type="text" id="login-email" placeholder="Usuario o Correo" class="reg-input text-left">
            <input type="password" id="login-pass" placeholder="Contraseña" class="reg-input text-left">
            <button onclick="handleAuth()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[11px] uppercase italic shadow-lg active:scale-95 transition-all">Ingresar</button>
            <button onclick="startPassengerRegistration()" class="mt-4 text-[10px] font-black text-gray-400 uppercase italic hover:text-red-600 transition-colors">Quiero crear una cuenta</button>
        </div>
    </div>

    <!-- Main Views (Admin/Passenger) -->
    <div id="admin-view" class="hidden h-full flex flex-col bg-gray-100">
        <header id="admin-header" class="px-4 py-3 flex items-center justify-between bg-gray-900 text-white z-10 shrink-0">
            <button id="admin-menu-btn" onclick="openMenu()" class="p-1.5 bg-white/10 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-red-600"></i></button>
            <button id="admin-back-btn" onclick="closeAdminWallet()" class="hidden p-1.5 bg-white/10 rounded-lg"><i data-lucide="arrow-left" class="w-5 h-5 text-red-600"></i></button>
            <h2 id="admin-title" class="text-base font-black italic uppercase">PANEL <span class="text-red-600 text-lg">ADMIN</span></h2>
            <button onclick="location.reload()" class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center"><i data-lucide="log-out" class="w-4 h-4 text-white"></i></button>
        </header>
        <main id="admin-content" class="flex-1 p-5 space-y-4 overflow-y-auto">
            <div id="admin-dashboard">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-4">
                    <p class="text-[8px] font-black text-gray-400 uppercase italic mb-1">Estado</p>
                    <h4 class="text-xl font-black italic text-gray-800 uppercase">Sistema Operativo</h4>
                </div>
                <div id="admin-requests-container" class="space-y-3 pb-10"></div>
            </div>
        </main>
    </div>

    <div id="passenger-view" class="hidden h-full flex flex-col relative">
        <header id="p-header" class="px-4 py-3 flex items-center justify-between border-b bg-white z-10 transition-all shrink-0">
            <button onclick="openMenu()" class="p-1.5 bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic uppercase">DRIVE <span class="text-red-600">MÉXICO</span></h2>
            <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center"><i data-lucide="user" class="text-white w-4 h-4"></i></div>
        </header>
        <main class="flex-1 map-sim relative overflow-hidden flex flex-col">
            <!-- Simulated Map Elements -->
            <div id="p-banners" class="absolute top-4 left-4 right-4 z-20 space-y-3">
                <div onclick="openCosts()" class="bg-white p-1 rounded-xl shadow-2xl flex items-center gap-2 cursor-pointer border border-black/5 active:scale-95 transition-transform">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-red-600/30"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-[11px] font-black text-gray-400 italic uppercase">¿A dónde vamos hoy?</span>
                </div>
            </div>
            <!-- Wallet Display -->
            <div id="p-wallet" class="absolute bottom-6 left-4 right-4 z-30">
                <div class="bg-gray-900 rounded-2xl p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-600/20 rounded-xl flex items-center justify-center text-red-600 border border-red-600/30"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <div>
                            <p class="text-[8px] text-gray-500 font-black uppercase italic">Tu Cartera</p>
                            <h3 id="display-saldo" class="text-sm font-black italic">$0.00 MXN</h3>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Registration Master View -->
    <div id="driver-registration-view" class="hidden absolute inset-0 z-[200] bg-white flex flex-col">
        <header class="px-4 py-4 flex items-center border-b bg-white sticky top-0 z-10 shrink-0">
            <button onclick="handleDriverBack()" class="p-2 hover:bg-gray-100 rounded-full transition-all"><i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i></button>
            <h2 id="reg-main-title" class="ml-3 text-lg font-black italic uppercase tracking-tighter">REGISTRO <span class="text-red-600 uppercase">DRIVER</span></h2>
        </header>
        <div class="flex-1 overflow-y-auto p-6 pb-12">
            <!-- Step 1: Photo (Only Driver) -->
            <div id="step-photo" class="w-full flex flex-col items-center">
                <div class="relative mb-8 mt-6">
                    <div id="photo-preview-container" class="w-40 h-40 rounded-full border-4 border-gray-100 bg-gray-50 flex items-center justify-center overflow-hidden"><i id="placeholder-icon" data-lucide="user" class="w-12 h-12 text-gray-300"></i><img id="driver-photo-preview" class="hidden w-full h-full object-cover"></div>
                    <button onclick="document.getElementById('photo-input').click()" class="absolute bottom-1 right-1 bg-red-600 p-3 rounded-full text-white border-4 border-white shadow-lg"><i data-lucide="camera" class="w-5 h-5"></i></button>
                    <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="processImage(this)">
                </div>
                <button id="btn-photo-next" disabled onclick="goToStep(2)" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic transition-all">Siguiente</button>
            </div>
            <!-- Step 2: Account Info -->
            <div id="step-name" class="hidden w-full flex flex-col space-y-4">
                <div><label class="reg-label">Nombre Completo</label><input type="text" id="dr-name" class="reg-input" placeholder="Ej: Juan Pérez" oninput="checkName(this)"></div>
                <div id="fields-account" class="hidden space-y-4">
                    <div><label class="reg-label">Usuario</label><input type="text" id="reg-user" class="reg-input" placeholder="Crea tu usuario"></div>
                    <div><label class="reg-label">Contraseña</label><input type="password" id="reg-pass" class="reg-input" placeholder="••••••••"></div>
                    <div><label class="reg-label">Correo Electrónico</label><input type="email" id="reg-email" class="reg-input" placeholder="ejemplo@correo.com"></div>
                </div>
                <button id="btn-name-next" disabled onclick="handleStepNameNext()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[10px] uppercase italic transition-all">Siguiente</button>
            </div>
            <!-- Additional steps (INE, Vehicle, etc. omitted for brevity but remain in original logic) -->
            <!-- Step 8: Phone -->
            <div id="step-phone" class="hidden w-full flex flex-col">
                <h3 class="text-center font-black text-[10px] text-gray-400 uppercase mb-4 italic">Número Telefónico</h3>
                <div class="relative mb-8 mt-4">
                    <div class="absolute left-4 top-1/2 -translate-y-1/2 flex items-center gap-2 border-r pr-3 border-gray-200"><span class="text-[10px] font-black text-gray-400">+52</span></div>
                    <input type="tel" id="dr-phone" class="reg-input pl-20" placeholder="55 0000 0000" oninput="checkPhone(this)">
                </div>
                <button id="btn-phone-next" disabled onclick="handleStepPhoneNext()" class="w-full bg-gray-300 text-white py-4 rounded-xl font-black text-[11px] uppercase italic transition-all">Siguiente</button>
            </div>
            <!-- Step 9: Final Message (DYNAMIZED) -->
            <div id="step-finish" class="hidden w-full flex flex-col items-center justify-center text-center py-10">
                <div class="w-24 h-24 bg-gray-900 rounded-3xl flex items-center justify-center mb-8 shadow-2xl shadow-gray-200">
                    <i id="finish-icon" data-lucide="hourglass" class="w-12 h-12 text-red-600 animate-[spin_3s_linear_infinite]"></i>
                </div>
                <h2 id="finish-title" class="text-xl font-black italic uppercase leading-none mb-4">REVISIÓN EN<br><span class="text-red-600">PROGRESO</span></h2>
                <p id="finish-desc" class="text-[11px] font-bold text-gray-500 uppercase tracking-tight italic mb-10 px-4">Si todo sale bien, te activaremos en<br><span class="text-gray-900">menos de 24 hrs.</span></p>
                <button id="btn-final-save" onclick="saveDriverRequest()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-[12px] uppercase italic transition-all shadow-xl shadow-red-600/30 active:scale-95">CONFIRMAR</button>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    let currentStep = 1;
    let registrationMode = 'driver'; 
    let currentUser = null;

    // Splash Loader
    setTimeout(() => { 
        document.getElementById('splash').style.opacity = '0'; 
        setTimeout(() => { document.getElementById('splash').style.display = 'none'; document.getElementById('login-screen').classList.remove('hidden'); }, 500); 
    }, 1500);

    function startPassengerRegistration() {
        registrationMode = 'passenger';
        ['step-photo', 'step-ine-front', 'step-ine-back', 'step-vehicle', 'step-circ', 'step-v-photo'].forEach(s => {
            const el = document.getElementById(s); if(el) el.classList.add('hidden');
        });
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('driver-registration-view').classList.remove('hidden');
        document.getElementById('reg-main-title').innerHTML = 'REGISTRO <span class="text-red-600 uppercase">USER</span>';
        document.getElementById('fields-account').classList.remove('hidden');
        goToStep(2);
    }

    function handleStepPhoneNext() {
        const title = document.getElementById('finish-title');
        const desc = document.getElementById('finish-desc');
        const icon = document.getElementById('finish-icon');
        const btn = document.getElementById('btn-final-save');

        if (registrationMode === 'passenger') {
            title.innerHTML = 'GRACIAS POR<br><span class="text-red-600">TU REGISTRO</span>';
            desc.innerHTML = '¡Bienvenido a la familia! Ya puedes<br><span class="text-gray-900">comenzar a viajar.</span>';
            icon.setAttribute('data-lucide', 'check-circle');
            icon.classList.remove('animate-[spin_3s_linear_infinite]');
            btn.setAttribute('onclick', 'savePassengerRequest()');
            btn.innerText = 'FINALIZAR REGISTRO';
        } else {
            title.innerHTML = 'REVISIÓN EN<br><span class="text-red-600">PROGRESO</span>';
            desc.innerHTML = 'Si todo sale bien, te activaremos en<br><span class="text-gray-900">menos de 24 hrs.</span>';
            icon.setAttribute('data-lucide', 'hourglass');
            icon.classList.add('animate-[spin_3s_linear_infinite]');
            btn.setAttribute('onclick', 'saveDriverRequest()');
        }
        lucide.createIcons();
        goToStep(9);
    }

    // Auth & Navigation
    function handleAuth() {
        const userIn = document.getElementById('login-email').value.trim();
        const passIn = document.getElementById('login-pass').value.trim();
        if (userIn === 'admincentral' && passIn === '9271@') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-view').classList.remove('hidden');
        } else {
            const db = JSON.parse(localStorage.getItem('db_usuarios_permanente') || '[]');
            const user = db.find(u => u.usuario === userIn.toLowerCase() && u.pass === passIn);
            if(user) { currentUser = user; document.getElementById('login-screen').classList.add('hidden'); document.getElementById('passenger-view').classList.remove('hidden'); }
            else { alert('Credenciales incorrectas'); }
        }
    }

    function savePassengerRequest() {
        const newRequest = {
            id: String(Date.now()), name: document.getElementById('dr-name').value, 
            usuario: document.getElementById('reg-user').value.toLowerCase().trim(),
            pass: document.getElementById('reg-pass').value, correo: document.getElementById('reg-email').value.toLowerCase().trim(),
            phone: document.getElementById('dr-phone').value, date: new Date().toLocaleDateString()
        };
        let db = JSON.parse(localStorage.getItem('db_usuarios_permanente') || '[]');
        db.push(newRequest); localStorage.setItem('db_usuarios_permanente', JSON.stringify(db));
        alert('¡Cuenta creada con éxito!'); location.reload();
    }

    function saveDriverRequest() { 
        alert('Solicitud de conductor enviada. En revisión.'); location.reload(); 
    }

    // UI Helpers
    function goToStep(n) { 
        const steps = ['step-photo', 'step-name', 'step-ine-front', 'step-ine-back', 'step-vehicle', 'step-circ', 'step-v-photo', 'step-phone', 'step-finish']; 
        steps.forEach(s => { const el = document.getElementById(s); if(el) el.classList.add('hidden'); });
        document.getElementById(steps[n-1]).classList.remove('hidden'); 
    }
    function checkName(i) { const b = document.getElementById('btn-name-next'); b.disabled = i.value.length < 3; b.classList.toggle('bg-red-600', i.value.length >= 3); b.classList.toggle('bg-gray-300', i.value.length < 3); }
    function checkPhone(i) { const b = document.getElementById('btn-phone-next'); b.disabled = i.value.length < 10; b.classList.toggle('bg-red-600', i.value.length >= 10); b.classList.toggle('bg-gray-300', i.value.length < 10); }
    function handleStepNameNext() { if (registrationMode === 'passenger') goToStep(8); else goToStep(3); }
    function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('opacity-100', 'pointer-events-auto'); }
    function closeAll() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto'); }
    function handleDriverBack() { location.reload(); }
</script>
</body>
</html>
