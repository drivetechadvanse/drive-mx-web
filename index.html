<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX | Global System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; background-color: #000; }
        
        #splash { transition: opacity 0.5s ease; }
        .view-content { animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .map-sim { background-color: #f3f4f6; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 30px 30px; }
        
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }

        #cost-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); transform: translateY(100%); }
        #cost-sheet.active { transform: translateY(0); }
    </style>
</head>
<body>

<div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative">
    
    <div id="overlay" onclick="closeAllModals()" class="absolute inset-0 bg-black/60 z-[100] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 bg-gray-900 text-white">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center mb-3">
                <i data-lucide="cpu" id="sidebar-icon" class="text-white w-5 h-5"></i>
            </div>
            <h2 class="text-lg font-black italic tracking-tighter uppercase">DRIVE <span class="text-red-600">MX</span></h2>
            <p id="sidebar-user-role" class="text-[8px] text-gray-500 font-bold mt-1 uppercase tracking-widest italic">Sistema Activo</p>
        </div>
        
        <nav class="flex-1 p-4 space-y-1" id="sidebar-nav">
            </nav>

        <div class="p-4 border-t">
            <button onclick="location.reload()" class="w-full flex items-center justify-center gap-2 py-3 bg-red-50 text-red-600 rounded-xl font-black text-[10px] uppercase italic">
                <i data-lucide="power" class="w-3.5 h-3.5"></i> Cerrar Sesión
            </button>
        </div>
    </div>

    <div id="splash" class="absolute inset-0 z-[150] bg-white flex flex-col items-center justify-center">
        <div class="w-20 h-20 bg-red-600 rounded-[2rem] flex items-center justify-center animate-pulse shadow-2xl">
            <i data-lucide="navigation" class="text-white w-10 h-10"></i>
        </div>
        <h1 class="text-3xl font-black mt-6 tracking-tighter italic uppercase">DRIVE <span class="text-red-600">MX</span></h1>
    </div>

    <div id="login-screen" class="hidden absolute inset-0 z-40 bg-white p-10 flex flex-col justify-center">
        <h2 class="text-4xl font-black text-gray-900 italic leading-none tracking-tighter uppercase mb-10">LOGIN<br><span class="text-red-600">SISTEMA</span></h2>
        <div class="space-y-3">
            <input type="email" id="email-input" placeholder="Usuario (admin@app.com)" class="w-full p-4 bg-gray-50 border-b-2 border-gray-100 rounded-xl outline-none focus:border-red-600 font-bold text-sm">
            <input type="password" id="pass-input" placeholder="Contraseña" class="w-full p-4 bg-gray-50 border-b-2 border-gray-100 rounded-xl outline-none focus:border-red-600 font-bold text-sm">
            <button onclick="handleLogin()" class="w-full bg-red-600 text-white py-4 rounded-[2rem] font-black uppercase tracking-widest text-xs active:scale-95 transition-all mt-4 shadow-lg shadow-red-600/20">Ingresar</button>
        </div>
    </div>

    <div id="passenger-app" class="hidden h-screen flex flex-col">
        <header class="p-3 flex items-center justify-between border-b bg-white z-10">
            <button onclick="toggleMenu()" class="p-2 bg-gray-50 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <h2 class="text-xl font-black italic tracking-tighter uppercase flex-1 text-center">DRIVE <span class="text-red-600">MX</span></h2>
            <div class="w-8 h-8 rounded-full border bg-gray-50 overflow-hidden"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"></div>
        </header>

        <main class="flex-1 relative map-sim">
            <div class="absolute top-4 left-4 right-4 z-20 space-y-2">
                <div class="bg-white/90 backdrop-blur-md p-2.5 rounded-xl shadow-sm border border-black/5 flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                    <p class="text-[9px] font-black text-gray-800 uppercase italic">Ubicación: <span class="text-gray-400 font-bold">Punto Actual Detectado</span></p>
                </div>
                <div onclick="openCostSheet()" class="bg-white p-1 rounded-xl shadow-xl flex items-center gap-3 border border-black/5">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white shadow-lg"><i data-lucide="search" class="w-5 h-5"></i></div>
                    <span class="text-xs font-black text-gray-400 italic uppercase tracking-tighter">¿A dónde vamos hoy?</span>
                </div>
            </div>

            <div class="absolute bottom-4 left-4 right-4">
                <div class="bg-black rounded-[2rem] p-4 flex items-center justify-between text-white shadow-2xl">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-red-600/10 rounded-xl flex items-center justify-center border border-red-600/20 text-red-600"><i data-lucide="wallet" class="w-4 h-4"></i></div>
                        <div><p class="text-[8px] text-gray-500 font-black uppercase">Cartera</p><h3 id="p-balance" class="text-base font-black italic">$0.00</h3></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="admin-app" class="hidden h-screen flex flex-col bg-gray-50">
        <header class="p-4 bg-gray-900 text-white flex justify-between items-center z-10 shadow-lg">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="p-2 bg-white/10 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-red-600"></i></button>
                <h2 class="text-base font-black italic tracking-tighter uppercase tracking-widest">CONTROL <span class="text-red-600">PANEL</span></h2>
            </div>
        </header>
        <main id="admin-host" class="p-6 overflow-y-auto flex-1"></main>
    </div>

</div>

<script>
    lucide.createIcons();

    setTimeout(() => {
        document.getElementById('splash').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }, 500);
    }, 2500);

    function handleLogin() {
        const e = document.getElementById('email-input').value;
        const p = document.getElementById('pass-input').value;

        if (e === 'admin@app.com' && p === '123') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-app').classList.remove('hidden');
            setupUI("ADMINISTRADOR", "shield-check");
            loadTool('users');
        } else if (e === 'juan@app.com' && p === '123') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('passenger-app').classList.remove('hidden');
            setupUI("JUAN PASAJERO", "user");
            document.getElementById('p-balance').innerText = "$50.00";
        } else {
            alert("Acceso incorrecto");
        }
    }

    function setupUI(role, icon) {
        document.getElementById('sidebar-user-role').innerText = role;
        document.getElementById('sidebar-icon').setAttribute('data-lucide', icon);
        const nav = document.getElementById('sidebar-nav');
        
        // OPCIÓN INICIO UNIFICADA (Para cerrar el menú)
        const homeBtn = `<button onclick="closeAllModals()" class="w-full flex items-center gap-3 p-3 text-gray-900 font-black bg-gray-50 rounded-xl uppercase text-[10px] italic mb-4 border border-gray-100 shadow-sm"><i data-lucide="home" class="text-red-600 w-4 h-4"></i> INICIO</button>`;

        if(role === "ADMINISTRADOR") {
            nav.innerHTML = homeBtn + `<button onclick="loadTool('users')" class="w-full flex items-center gap-3 p-3 text-gray-800 font-black hover:bg-red-50 rounded-xl uppercase text-[10px] italic"><i data-lucide="users" class="text-red-600 w-4 h-4"></i> Usuarios</button>`;
        } else {
            nav.innerHTML = homeBtn + `<button class="w-full flex items-center gap-3 p-3 text-gray-800 font-black hover:bg-gray-50 rounded-xl uppercase text-[10px] italic"><i data-lucide="history" class="w-4 h-4"></i> Mis Viajes</button>`;
        }
        lucide.createIcons();
    }

    function loadTool(tool) {
        const host = document.getElementById('admin-host');
        closeAllModals(); // Cierra el menú al elegir una opción
        if(tool === 'users') {
            host.innerHTML = `<div class="view-content space-y-4"><h3 class="text-lg font-black italic uppercase tracking-tighter">Gestión de <span class="text-red-600">Usuarios</span></h3><div class="bg-white p-4 rounded-2xl border flex items-center justify-between"><span class="font-bold text-xs uppercase italic">Juan Pasajero</span><button class="bg-red-600 text-white p-2 rounded-lg shadow-md"><i data-lucide="edit-3" class="w-4 h-4"></i></button></div></div>`;
        }
        lucide.createIcons();
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('opacity-100');
        document.getElementById('overlay').classList.toggle('pointer-events-auto');
    }

    function closeAllModals() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('opacity-100', 'pointer-events-auto');
    }

    function openCostSheet() {
        // En una app real aquí abriría el selector de destinos
        alert("Buscador de destinos activado");
    }
</script>
</body>
</html>
