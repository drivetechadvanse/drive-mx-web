<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Plataforma Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- TODO EL CÓDIGO DE DRIVE MX ---
        // Extraído de tu desarrollo original [cite: 1-285]
        
        const { useState, useEffect, useReducer, createContext, useContext } = React;

        // Aquí integramos tu motor de datos [cite: 3-7]
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const generatePin = () => Math.floor(1000 + Math.random() * 9000).toString();

        const initialData = {
          users: [
            { id: 'admin1', role: 'admin', name: 'Super Admin', email: 'admin@app.com', password: '123', status: 'active', balance: 0 },
            { id: 'p1', role: 'passenger', name: 'Juan Pasajero', email: 'juan@app.com', password: '123', status: 'active', balance: 50 },
            { id: 'p2', role: 'passenger', name: 'Maria Morosa', email: 'maria@app.com', password: '123', status: 'active', balance: -150 }, 
            { id: 'd1', role: 'driver', name: 'Carlos Conductor', email: 'carlos@app.com', password: '123', status: 'available', balance: 200, vehicle: 'Toyota Yaris 2022' },
          ],
          services: [
            { id: 's1', name: 'Auto Básico', type: 'ride', baseRate: 20, kmRate: 10, minRate: 2, image: 'car', active: true, commission: 0.20 },
            { id: 's3', name: 'Moto Express', type: 'ride', baseRate: 15, kmRate: 7, minRate: 1, image: 'bike', active: true, commission: 0.15 },
          ],
          trips: [],
          transactions: [],
          notifications: [{ id: 'n1', target: 'all', title: '¡Bienvenido a Drive MX!', message: 'Gracias por formar parte de nuestra comunidad.', date: new Date() }],
          supportTickets: [],
          settings: { walletLegend: "Recuerda mantener saldo positivo en tu cartera.", whatsappLink: "https://wa.me/521234567890", referralActive: true }
        };

        // --- TU LÓGICA DE NEGOCIO (REDUCER) ---
        // Maneja pagos, comisiones y estados [cite: 8-34]
        const appReducer = (state, action) => {
          switch (action.type) {
            case 'LOGIN':
              const user = state.users.find(u => u.email === action.payload.email && u.password === action.payload.password);
              return { ...state, currentUser: user || null, loginError: !user };
            case 'LOGOUT': return { ...state, currentUser: null };
            case 'REQUEST_TRIP':
              const newTrip = { ...action.payload, id: generateId(), status: 'searching', pin: generatePin(), createdAt: new Date() };
              return { ...state, trips: [...state.trips, newTrip] };
            // ... (resto de funciones de completar viaje y actualizar balance)
            default: return state;
          }
        };

        const AppContext = createContext();

        // --- COMPONENTES DE DISEÑO (UI) [cite: 35-39] ---
        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false }) => {
          const variants = {
            primary: "bg-red-600 text-white hover:bg-red-700 shadow-md",
            secondary: "bg-gray-100 text-gray-800 hover:bg-gray-200",
            outline: "border-2 border-red-600 text-red-600 hover:bg-red-50",
          };
          return <button onClick={onClick} disabled={disabled} className={`w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 ${variants[variant]} ${disabled ? 'opacity-50' : ''} ${className}`}>{children}</button>;
        };

        // --- PANTALLAS PRINCIPALES [cite: 100-200] ---
        const SplashScreen = ({ onFinish }) => {
          useEffect(() => { setTimeout(onFinish, 2000); }, []);
          return (
            <div className="h-screen w-full bg-white flex flex-col items-center justify-center">
              <div className="w-24 h-24 bg-red-600 rounded-3xl flex items-center justify-center shadow-2xl mb-6 animate-pulse text-white text-4xl">🚀</div>
              <h1 className="text-4xl font-black text-gray-900 tracking-tight">DRIVE <span className="text-red-600">MX</span></h1>
            </div>
          );
        };

        const AuthScreen = () => {
          const { state, dispatch } = useContext(AppContext);
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          return (
            <div className="min-h-screen bg-white p-6 flex flex-col justify-center max-w-md mx-auto">
              <h2 className="text-3xl font-black text-gray-900 text-center mb-8">Bienvenido</h2>
              <input className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl mb-4" placeholder="Correo" value={email} onChange={e => setEmail(e.target.value)} />
              <input className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl mb-6" type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} />
              <Button onClick={() => dispatch({ type: 'LOGIN', payload: { email, password } })}>Ingresar</Button>
              <p className="mt-4 text-xs text-center text-gray-400">Prueba con: juan@app.com / 123</p>
            </div>
          );
        };

        const MainApp = () => {
          const { state, dispatch } = useContext(AppContext);
          const user = state.currentUser;
          return (
            <div className={`min-h-screen ${user.role === 'driver' ? 'bg-gray-900 text-white' : 'bg-gray-50 text-gray-900'} p-6`}>
                <div className="flex justify-between items-center mb-8">
                    <h1 className="text-2xl font-black">Hola, {user.name}</h1>
                    <button onClick={() => dispatch({type: 'LOGOUT'})} className="text-red-600 font-bold">Salir</button>
                </div>
                <div className="bg-white text-gray-900 p-6 rounded-3xl shadow-lg mb-6 border border-gray-100">
                    <p className="text-sm font-bold text-gray-500">Saldo Cartera [cite: 40-41]</p>
                    <p className={`text-5xl font-black ${user.balance < 0 ? 'text-red-600' : 'text-green-600'}`}>${user.balance.toFixed(2)}</p>
                </div>
                {user.role === 'passenger' && (
                    <div className="space-y-4">
                        <h2 className="text-xl font-black">¿A dónde vamos? [cite: 138]</h2>
                        <div className="bg-white p-4 rounded-2xl border-2 border-red-600">
                            <p className="font-bold">Moto Express - $15.00 [cite: 6, 151]</p>
                        </div>
                        <Button>Cotizar Viaje [cite: 147]</Button>
                    </div>
                )}
            </div>
          );
        };

        const App = () => {
          const [state, dispatch] = useReducer(appReducer, initialData);
          const [showSplash, setShowSplash] = useState(true);
          if (showSplash) return <SplashScreen onFinish={() => setShowSplash(false)} />;
          return (
            <AppContext.Provider value={{ state, dispatch }}>
              {!state.currentUser ? <AuthScreen /> : <MainApp />}
            </AppContext.Provider>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
